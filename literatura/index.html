<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resumo de Literatura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#fff;--ink:#18212b;--muted:#5b6876;--line:#d8dee5;--acc:#a3401c;--acc-soft:#fbeae3;--warn:#a34a00;--warn-soft:#fff1e3;--ok:#23784a;--ok-soft:#e3f2e9;
 --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.top a{color:var(--acc);font-weight:700;text-decoration:none}
.bar{height:6px;background:var(--acc-soft);border-radius:4px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(25px,6vw,36px);line-height:1.12;margin:6px 0 16px;text-wrap:balance}
.box{border-radius:12px;padding:12px 14px;margin:14px 0}
.box b.lb{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ideia{background:var(--acc-soft)}.ideia b.lb{color:var(--acc)}
.trap{background:var(--warn-soft)}.trap b.lb{color:var(--warn)}
.mac{background:var(--ok-soft)}.mac b.lb{color:var(--ok)}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f4f6f9;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
ul.l{margin:12px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:700;white-space:nowrap;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.4;cursor:default}
#cnt{font-size:13px;color:var(--muted);white-space:nowrap}
#idx{display:none}
#idx.on{display:block}
#idx h2{font-family:var(--display);font-size:18px;margin:18px 0 6px}
#idx ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
#idx li button{width:100%;text-align:left;font-weight:400;padding:8px 10px;display:flex;gap:10px}
#idx li button span{color:var(--muted);min-width:2ch;font-weight:700}
#idx li button.cur{border-color:var(--acc);background:var(--acc-soft)}
.fim{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.aviso{font-size:14px;color:var(--muted);background:#f6f7f9;border-radius:10px;padding:10px 12px;margin:14px 0 0}
.fim a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
 <div class="top"><a href="../">← Início</a><span><a href="../quiz/">Quiz</a></span></div>
 <p class="aviso">Os temas da prova (Concretismo e Neoconcretismo, poesia marginal e contemporânea, José Saramago) não vieram nas páginas do livro enviadas. Este resumo usa o conteúdo que costuma ser cobrado; confira os termos com o caderno ou o professor.</p>
 <div class="bar"><i id="pb"></i></div>
 <section id="tela" aria-live="polite"></section>
 <section id="idx"></section>
</main>
<nav class="nav" aria-label="Telas"><div>
 <button id="prev" aria-label="Tela anterior">←</button>
 <button id="menu">Índice</button>
 <span id="cnt"></span>
 <button id="next" class="pri">Próxima →</button>
</div></nav>
<script>
const TELAS=[
{g:"Concretismo e Neoconcretismo",k:"Tendências contemporâneas",t:"Concretismo",
 ideia:"Vanguarda dos <b>anos 1950</b>, em São Paulo, que declarou o <b>fim do verso</b>. O poema vira <b>objeto visual</b>: vale o sentido, o som e a forma na página (<b>verbivocovisual</b>).",
 tab:{head:["Ponto","Resumo"],rows:[
  ["Quem","Grupo Noigandres: Augusto de Campos, Haroldo de Campos, Décio Pignatari"],
  ["Marcos","Revista Noigandres (1952), exposição no MAM-SP (1956), “Plano-piloto” (1958)"],
  ["Recursos","Sintaxe espacial, isomorfismo (forma = sentido), paronomásia (<i>luxo/lixo</i>), palavras cortadas, concisão de cartaz"],
  ["Exemplos","“beba coca cola” (Décio), “luxo/lixo” (Augusto)"],
  ["1961","“Salto participante”: temas sociais sem largar a forma nova"]]},
 trap:"Não é o Modernismo de 1922: é vanguarda <b>posterior</b>. E não basta dizer “é visual”: explique <b>como</b> a forma reforça o sentido.",
 mac:"Concreto = <b>palavra-coisa</b>: se vê, se ouve e se lê ao mesmo tempo."},
{g:"Concretismo e Neoconcretismo",k:"Tendências contemporâneas",t:"Neoconcretismo e comparação",
 ideia:"Grupo do <b>Rio</b>, <b>1959</b> (Manifesto de <b>Ferreira Gullar</b>). Rompe com o racionalismo concreto e valoriza a <b>expressão</b> e a <b>participação do público</b>: a obra é um “<b>não-objeto</b>” que se completa quando alguém a toca.",
 tab:{head:["","Concretismo","Neoconcretismo"],rows:[
  ["Onde","São Paulo","Rio de Janeiro"],
  ["Base","Razão, geometria","Sensibilidade, corpo"],
  ["Público","Observa","Participa"],
  ["Exemplos","Poemas visuais","Livros-poema, Bichos (Lygia Clark), Parangolés (Oiticica)"]]},
 trap:"Concretismo × Parnasianismo: os dois cultuam a forma, mas o parnasiano usa <b>forma fixa</b> (soneto, métrica) e o concreto cria forma <b>nova</b>, sem verso.",
 mac:"Concreto = <b>ver e ler</b>. Neo = <b>tocar e participar</b>."},
{g:"Poesia marginal e contemporânea",k:"Poesia marginal e contemporânea",t:"Poesia marginal",
 ideia:"Anos <b>1970</b>, na <b>ditadura</b>. “Marginal” porque circulava <b>fora das editoras</b>: livrinhos em <b>mimeógrafo</b>, vendidos de mão em mão. Marco: <i>26 poetas hoje</i> (1976).",
 tab:{head:["Marca","Autor-exemplo"],rows:[
  ["Coloquial, humor, poema-piada","Chacal; Cacaso (ironia política)"],
  ["Cotidiano, falas da rua","Francisco Alvim"],
  ["Diário e carta, intimidade","Ana Cristina Cesar (<i>A teus pés</i>)"],
  ["Haicai, trocadilho, une concreto e marginal","Paulo Leminski"]]},
 trap:"É o <b>oposto</b> do Concretismo: lá, rigor e cálculo; aqui, espontaneidade e fala do dia a dia. A crítica à ditadura vem <b>disfarçada</b> de humor.",
 mac:"Marginal = <b>mimeógrafo + ditadura + mão em mão + cotidiano</b>."},
{g:"Poesia marginal e contemporânea",k:"Poesia marginal e contemporânea",t:"Poesia contemporânea",
 ideia:"Dos anos 1980 até hoje <b>não há escola única</b>: a marca é a <b>pluralidade</b>.",
 list:["<b>Visual e sonora:</b> Arnaldo Antunes (herdeiro dos concretos).",
  "<b>Cotidiano e voz feminina:</b> Adélia Prado.",
  "<b>Invenção e natureza:</b> Manoel de Barros.",
  "<b>Haicai:</b> Alice Ruiz, Leminski.",
  "<b>Poesia falada:</b> saraus de periferia e <b>slam</b>."],
 trap:"Em “contemporânea”, responda com <b>diversidade</b> e dê um exemplo. Uma característica só não basta.",
 mac:"Contemporânea = <b>plural</b>."},
{g:"José Saramago",k:"Literatura portuguesa contemporânea",t:"Saramago e seu estilo",
 ideia:"Português (<b>1922–2010</b>), <b>único Nobel da língua portuguesa (1998)</b>. Escreve no Portugal depois da <b>Revolução dos Cravos (1974)</b>.",
 tab:{head:["Marca","Como é"],rows:[
  ["Pontuação","Frases longas, quase só vírgula e ponto"],
  ["Diálogos","Sem travessão; falas separadas por vírgula, com <b>maiúscula</b>"],
  ["Narrador","Intruso: comenta, ironiza, conversa com o leitor"],
  ["Ponto de partida","Hipótese absurda: “e se…?”"],
  ["Sentido","Alegoria e crítica social; história contada pelos anônimos"]]},
 trap:"A falta de travessão <b>não é erro</b>: é estilo, que aproxima o texto da fala.",
 mac:"Vírgula no lugar de travessão + maiúscula no meio da frase + narrador opinando = <b>Saramago</b>."},
{g:"José Saramago",k:"Literatura portuguesa contemporânea",t:"Memorial do convento (1982)",
 ideia:"Construção do convento de <b>Mafra</b> (século XVIII), prometida pelo rei <b>D. João V</b>, contada pelo lado do <b>povo</b> que a construiu.",
 list:["<b>Baltasar Sete-Sóis:</b> ex-soldado sem a mão esquerda.",
  "<b>Blimunda Sete-Luas:</b> em jejum, vê o interior das pessoas e recolhe “vontades”.",
  "<b>Padre Bartolomeu de Gusmão:</b> a <b>passarola</b>, máquina voadora movida a vontades.",
  "<b>Crítica:</b> poder absoluto, Igreja, <b>Inquisição</b>, exploração dos trabalhadores.",
  "<b>Final:</b> Baltasar é queimado num auto de fé; Blimunda recolhe a vontade dele."],
 trap:"Romance <b>histórico</b> que mistura fato e fantasia para criticar o poder; não é livro de história.",
 mac:"<b>Mafra + passarola + Baltasar e Blimunda + Inquisição</b>."},
{g:"José Saramago",k:"Literatura portuguesa contemporânea",t:"Ensaio sobre a cegueira (1995)",
 ideia:"Uma epidemia de <b>“cegueira branca”</b> atinge uma cidade; na quarentena surgem <b>violência e barbárie</b>. A <b>mulher do médico</b> é a única que continua vendo.",
 list:["<b>Alegoria:</b> a cegueira representa a <b>cegueira moral</b>, a perda de ética e de solidariedade.",
  "<b>Personagens sem nome</b> (“o médico”, “a rapariga dos óculos escuros”): a história vale para qualquer lugar.",
  "Epígrafe: “Se podes olhar, vê. Se podes ver, repara.”",
  "<b>Outras obras:</b> <i>O Evangelho segundo Jesus Cristo</i> (1991, polêmica e mudança para Lanzarote), <i>O ano da morte de Ricardo Reis</i> (1984), <i>Ensaio sobre a lucidez</i> (2004), <i>As intermitências da morte</i> (2005)."],
 trap:"“O que a cegueira representa?” A resposta não é “uma doença”: é a <b>perda de humanidade</b>.",
 mac:"Saramago usa o absurdo para <b>criticar a sociedade</b>."},
{g:"Revisão e prova",k:"Caps. 1 a 6",t:"As escolas em uma tela",
 ideia:"Para comparar com os movimentos contemporâneos.",
 tab:{head:["Escola","Marca"],rows:[
  ["Romantismo","Sentimento, nacionalismo, indianismo"],
  ["Realismo","Objetividade, crítica à burguesia, adultério"],
  ["Naturalismo","Determinismo: raça, meio, hereditariedade"],
  ["Parnasianismo","Arte pela arte, culto da forma, soneto"],
  ["Simbolismo","Sugestão, musicalidade, sinestesia"]]},
 trap:"Na lista de Realismo, a 4b é a estrofe do <b>verme</b> (3ª e última), não a 1ª.",
 mac:"Romântico <b>sente</b>; realista <b>observa</b>; naturalista <b>explica</b>; parnasiano <b>lapida</b>; simbolista <b>sugere</b>."},
{g:"Revisão e prova",k:"Prova discursiva",t:"Como responder",
 ideia:"Fórmula da resposta: <b>“É X, porque Y, como se vê em ‘Z’.”</b> Afirme, prove com o texto e nomeie a característica.",
 list:["<b>Concreto × Neoconcreto:</b> “O Neoconcretismo rompe com o racionalismo concreto e valoriza a expressão e a participação do espectador.”",
  "<b>Por que marginal:</b> “Circulava fora do mercado editorial, em livros de mimeógrafo vendidos de mão em mão, durante a ditadura.”",
  "<b>Pontuação de Saramago:</b> “Frases longas e diálogos sem travessão, marcados por maiúscula, aproximam o texto da oralidade.”",
  "<b>A cegueira:</b> “É alegoria da cegueira moral: a sociedade perde a solidariedade e cai na barbárie.”"],
 trap:"Só repetir o texto não pontua: <b>nomeie a característica</b> e <b>cite o trecho</b>.",
 mac:"Antes de entregar: respondi a pergunta? citei o texto? nomeei a característica?"}
];
const N=TELAS.length,$=id=>document.getElementById(id);
let i=0;try{i=Math.min(N-1,Math.max(0,+localStorage.getItem("lit2")||0))}catch(e){}
function show(n){i=n;try{localStorage.setItem("lit2",i)}catch(e){}
 const t=TELAS[i];let h=`<div class="eyebrow">${t.g} · ${t.k}</div><h1>${t.t}</h1><div class="box ideia"><b class="lb">Ideia central</b>${t.ideia}</div>`;
 if(t.tab)h+=`<div class="tw"><table><thead><tr>${t.tab.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.tab.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 if(t.list)h+=`<ul class="l">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(t.trap)h+=`<div class="box trap"><b class="lb">Pegadinha</b>${t.trap}</div>`;
 if(t.mac)h+=`<div class="box mac"><b class="lb">Macete</b>${t.mac}</div>`;
 if(i==N-1)h+=`<p class="fim">Fim do resumo. Agora faça o <a href="../quiz/">quiz de Literatura</a>.</p>`;
 $("tela").innerHTML=h;$("idx").classList.remove("on");$("tela").style.display="";
 $("cnt").textContent=`Tela ${i+1} de ${N}`;$("pb").style.width=((i+1)/N*100)+"%";
 $("prev").disabled=i==0;$("next").disabled=i==N-1;$("menu").textContent="Índice";scrollTo(0,0)}
function index(){if($("idx").classList.contains("on"))return show(i);
 let h="",g="";TELAS.forEach((t,n)=>{if(t.g!=g){h+=(g?"</ol>":"")+`<h2>${t.g}</h2><ol>`;g=t.g}
  h+=`<li><button data-n="${n}" class="${n==i?"cur":""}"><span>${n+1}</span>${t.t}</button></li>`});
 $("idx").innerHTML=h+"</ol>";$("idx").classList.add("on");$("tela").style.display="none";$("menu").textContent="Fechar";scrollTo(0,0)}
$("idx").onclick=e=>{const b=e.target.closest("button[data-n]");if(b)show(+b.dataset.n)};
$("prev").onclick=()=>i>0&&show(i-1);$("next").onclick=()=>i<N-1&&show(i+1);$("menu").onclick=index;
document.addEventListener("keydown",e=>{if(e.key=="ArrowRight")$("next").click();if(e.key=="ArrowLeft")$("prev").click()});
show(i);
</script>
</body>
</html>
