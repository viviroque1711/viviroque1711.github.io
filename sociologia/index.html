{g:"Prova discursiva",k:"Critérios do professor",t:"Como escrever a resposta",

{g:"Prova discursiva",k:"Respostas modelo",t:"Respostas modelo",

 list:["<b>Fanon e a identidade:</b> Para Frantz Fanon, a colonização não se limita ao controle de territórios, pois também atinge a cultura e a identidade dos povos colonizados. O colonizador impõe sua língua e seus valores como superiores, e o colonizado passa a ver a própria cultura como inferior, num processo de alienação. Um exemplo atual são os padrões de beleza que desvalorizam traços negros. Assim, a dominação colonial também é psicológica.",
  "<b>Bauman e o consumo:</b> Na modernidade líquida descrita por Zygmunt Bauman, o consumo orienta estilos de vida, relacionamentos e a construção da identidade. As pessoas passam a se definir pelo que compram e tratam vínculos como produtos que podem ser descartados quando deixam de satisfazer. As amizades desfeitas com um clique nas redes sociais mostram essa lógica. Dessa forma, as relações se tornam frágeis e passageiras.",
  "<b>Foucault e a vigilância:</b> Segundo Michel Foucault, a vigilância é uma técnica de poder que leva as pessoas a controlarem o próprio comportamento. No modelo do Panóptico, o vigiado não sabe quando está sendo observado e, por isso, age como se estivesse sempre sob vigilância. Câmeras em escolas e empresas produzem esse efeito. Portanto, o poder disciplinar funciona por meio do autocontrole.",
  "<b>Foucault e o poder:</b> Michel Foucault afirma que o poder não está concentrado apenas no Estado, mas circula nas relações sociais e nas instituições, como escola, hospital e fábrica. Essas instituições organizam o tempo, o espaço e os comportamentos, produzindo indivíduos disciplinados. Os horários e as avaliações escolares são exemplos dessa disciplina. Assim, o poder está presente no cotidiano."],
 trap:"Não copie os modelos: use a <b>estrutura</b> e troque o exemplo por um <b>seu</b> (produção autoral).",
 mac:"Releia antes de entregar: <b>começa sem conectivo? tem autor? tem exemplo? responde a todos os comandos?</b>"}
];
const N=TELAS.length,$=id=>document.getElementById(id);
let i=0;try{i=Math.min(N-1,Math.max(0,+localStorage.getItem("soc1")||0))}catch(e){}
function show(n){i=n;try{localStorage.setItem("soc1",i)}catch(e){}
 const t=TELAS[i];let h=`<div class="eyebrow">${t.g} · ${t.k}</div><h1>${t.t}</h1><div class="box ideia"><b class="lb">Ideia central</b>${t.ideia}</div>`;
 if(t.tab)h+=`<div class="tw"><table><thead><tr>${t.tab.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.tab.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 if(t.ex)h+=t.ex.map(e=>`<div class="ex"><p class="q">${e.q}</p><ol>${e.p.map(s=>`<li>${s}</li>`).join("")}</ol><div class="r">Resposta: ${e.r}</div></div>`).join("");
 if(t.list)h+=`<ul class="l">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(t.trap)h+=`<div class="box trap"><b class="lb">Pegadinha</b>${t.trap}</div>`;
 if(t.mac)h+=`<div class="box mac"><b class="lb">Macete</b>${t.mac}</div>`;
 if(i==N-1)h+=`<p class="fim">Fim do resumo. Agora faça o <a href="../quiz/">quiz de Sociologia</a>.</p>`;
 $("tela").innerHTML=h;$("idx").classList.remove("on");$("tela").style.display="";
 $("cnt").textContent=`Tela ${i+1} de ${N}`;$("pb").style.width=((i+1)/N*100)+"%";
 $("prev").disabled=i==0;$("next").disabled=i==N-1;$("menu").textContent="Índice";scrollTo(0,0)}
function index(){if($("idx").classList.contains("on"))return show(i);
 let h="",g="";TELAS.forEach((t,n)=>{if(t.g!=g){h+=(g?"</ol>":"")+`<h2>${t.g}</h2><ol>`;g=t.g}
  h+=`<li><button data-n="${n}" class="${n==i?"cur":""}"><span>${n+1}</span>${t.t}</button></li>`});
 $("idx").innerHTML=h+"</ol>";$("idx").classList.add("on");$("tela").style.display="none";$("menu").textContent="Fechar";scrollTo(0,0)}
$("idx").onclick=e=>{const b=e.target.closest("button[data-n]");if(b)show(+b.dataset.n)};
$("prev").onclick=()=>i>0&&show(i-1);$("next").onclick=()=>i<N-1&&show(i+1);$("menu").onclick=index;
document.addEventListener("keydown",e=>{if(e.key=="ArrowRight")$("next").click();if(e.key=="ArrowLeft")$("prev").click()});
show(i);
</script>
