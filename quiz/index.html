<script>
/* Banco de questões. MC: o = [[texto, explicação se escolhida], ...], c = índice da certa. VF: v = verdadeiro/falso, e = explicação. */
const CAPS = [
 {k:"q4",m:"q",n:4,tag:"4",lb:"Cap. 4",t:"Identificação das funções orgânicas"},
 {k:"qn",m:"q",n:5,tag:"5 Nom.",lb:"Cap. 5 (nomenclatura)",t:"Regras básicas de nomenclatura orgânica"},

 {k:"q5",m:"q",n:5,tag:"Reaç. 5",lb:"Reações · Cap. 5",t:"Reações de adição"},
 {k:"b5",m:"b",n:5,t:"Morfologia e anatomia da raiz"},
 {k:"b6",m:"b",n:6,t:"Morfologia e anatomia do caule"},
 {k:"b7",m:"b",n:7,t:"Morfologia e anatomia da folha"},
 {k:"b8",m:"b",n:8,t:"Morfologia e anatomia da flor"},
 {k:"b9",m:"b",n:9,t:"Morfologia e anatomia do fruto e da semente"},
 {k:"b10",m:"b",n:10,t:"Fisiologia da absorção: condução de seiva"},
 {k:"b11",m:"b",n:11,t:"Fisiologia da absorção: transpiração vegetal"},
 {k:"b12",m:"b",n:12,t:"Hormônios vegetais"},
 {k:"bi",m:"b",n:"Sist.",t:"Integração dos sistemas (caps. 5 a 12)"},
 {k:"l1",m:"l",n:1,tag:"Concr.",lb:"Concretismo e Neoconcretismo",t:"Tendências contemporâneas: Concretismo e Neoconcretismo"},
 {k:"l2",m:"l",n:2,tag:"Marg.",lb:"Poesia marginal e contemporânea",t:"Poesia marginal e contemporânea"},
 {k:"l3",m:"l",n:3,tag:"Saram.",lb:"José Saramago",t:"Literatura portuguesa contemporânea: José Saramago"},
 {k:"lr",m:"l",n:4,tag:"Revisão",lb:"Revisão do livro",t:"Revisão das escolas literárias (caps. 1 a 6 do livro)"}
];

const Q = [
{"k":"l1","lv":2,"s":"Num poema concreto, a palavra “chuva” se repete descendo pela página, letra por letra, como se escorresse. Esse recurso, em que a forma visual reproduz o sentido, chama-se","c":4,"o":[["paronomásia.","Paronomásia é aproximar palavras de som parecido e sentido diferente (lixo/luxo). Aqui o recurso é a forma imitar o sentido."],["enjambement.","Enjambement é o verso que continua no seguinte. Poema concreto nem tem verso."],["sinestesia.","Sinestesia mistura sensações (cor, som, cheiro). Não é o caso."],["anáfora.","Anáfora é repetir a mesma palavra no início de versos. Aqui o que importa é o desenho."],["isomorfismo.","Isso. Forma e conteúdo têm a mesma “forma”: o poema sobre chuva cai na página."]]},
{"k":"l1","lv":2,"s":"No poema “luxo/lixo”, de Augusto de Campos, a palavra LUXO aparece em letras grandes formadas por muitas palavras “lixo”. Que leitura crítica o poema permite?","c":2,"o":[["Elogio à riqueza e ao consumo de produtos caros.","O poema faz o oposto: mostra que o luxo é feito de lixo."],["Saudade da infância pobre do poeta.","Não há eu lírico autobiográfico; a poesia concreta é objetiva."],["O luxo é feito de lixo: crítica ao consumismo e ao valor de fachada.","Isso. A paronomásia (luxo/lixo) e a forma visual juntas criticam o consumo e a ostentação."],["A natureza deve ser preservada do lixo urbano.","Leitura ecológica possível de modo amplo, mas o poema joga com <b>luxo</b> × <b>lixo</b>, isto é, com a ostentação."],["Uma homenagem à poesia parnasiana.","O poema não tem verso, rima ou métrica; está longe do Parnasianismo."]]},
{"k":"l1","lv":2,"s":"O poema “beba coca cola”, de Décio Pignatari (1957), transforma um slogan publicitário em palavras como “babe”, “caco” e “cloaca”. O efeito é","c":0,"o":[["criticar a propaganda e a sociedade de consumo usando a própria linguagem dela.","Isso. O poema desmonta o slogan e revela o que ele esconde: é a fase em que a poesia concreta também critica."],["fazer propaganda gratuita do refrigerante.","Pelo contrário: as palavras derivadas (cloaca = esgoto) ridicularizam o anúncio."],["imitar uma cantiga medieval.","Não há relação com o trovadorismo."],["expressar a tristeza amorosa do poeta.","Não há eu lírico sentimental no poema concreto."],["defender a pureza da língua contra palavras estrangeiras.","O poema não trata de purismo linguístico."]]},
{"k":"l1","lv":2,"s":"Sobre o Concretismo, assinale a alternativa <b>incorreta</b>.","c":3,"o":[["Abandona o verso e usa o espaço da página como elemento de sentido.","Correta: é a base do movimento."],["Recebe influência de Mallarmé, Pound, Joyce e Oswald de Andrade.","Correta: são as influências declaradas pelos concretos."],["Aproveita recursos da publicidade, como concisão e tipografia.","Correta: o poema concreto conversa com o cartaz e o anúncio."],["Valoriza o eu lírico confessional e o desabafo sentimental.","Isso, esta é a incorreta. O Concretismo é objetivo e recusa o sentimentalismo; o “eu” praticamente desaparece."],["A partir de 1961 assume temas sociais, no chamado “salto participante”.","Correta: “sem forma revolucionária não há arte revolucionária”."]]},
{"k":"l1","lv":2,"s":"O que distingue o Neoconcretismo do Concretismo?","c":4,"o":[["O Neoconcretismo volta ao verso, à rima e ao soneto.","Não: ele continua experimental e visual."],["O Neoconcretismo nasce em São Paulo e o Concretismo, no Rio.","É o contrário: concretos em São Paulo, neoconcretos no Rio."],["O Neoconcretismo é mais matemático e geométrico.","É justamente o que ele critica nos concretos."],["O Neoconcretismo foi feito em mimeógrafo nos anos 70.","Isso é a poesia marginal."],["O Neoconcretismo rejeita o excesso de racionalismo e valoriza a expressão e a participação do espectador.","Isso. É a teoria do não-objeto: a obra se completa quando o público age sobre ela."]]},
{"k":"l1","lv":2,"s":"Os <i>Bichos</i>, de Lygia Clark, são esculturas de metal com dobradiças que o público pode mexer e mudar de forma. Isso exemplifica a ideia neoconcreta de","c":2,"o":[["arte pela arte, sem contato com o público.","Arte pela arte é o lema parnasiano; aqui o público é essencial."],["imitação fiel da natureza.","Os Bichos não imitam animais reais; o nome é poético."],["obra como “não-objeto”, completada pela participação do espectador.","Isso. O espectador deixa de só olhar e passa a participar."],["poema-piada, com humor e coloquialidade.","Poema-piada é recurso de Oswald e dos poetas marginais."],["denúncia da miséria por meio do determinismo.","Determinismo é do Naturalismo, século XIX."]]},
{"k":"l1","lv":2,"s":"O Concretismo e o Parnasianismo valorizam a forma, mas o parnasiano usa forma fixa (soneto, métrica, rima) e o concreto cria uma forma nova, visual e sem verso.","v":true,"e":"Correto. É uma comparação que cai: os dois cultuam a forma, mas de maneiras opostas."},
{"k":"l1","lv":2,"s":"Paulo Leminski é considerado um poeta exclusivamente concretista, sem ligação com a poesia marginal.","v":false,"e":"Falso. Leminski une o rigor concreto ao humor e à coloquialidade da poesia marginal; é o elo entre as duas tendências."},
{"k":"l1","lv":2,"s":"Considere as afirmações sobre o Concretismo.<br>I. O “Plano-piloto para poesia concreta” (1958) declara encerrado o ciclo histórico do verso.<br>II. O movimento nasce como continuação direta da Geração de 45, de quem herda o rigor métrico.<br>III. A sintaxe espacial substitui a sintaxe linear do discurso.<br>Está correto o que se afirma em","c":1,"o":[["I, apenas.","A III também está correta: o espaço da página organiza a leitura no lugar da frase linear."],["I e III, apenas.","Isso. A II é falsa: o Concretismo <b>reage</b> à Geração de 45 e abandona a métrica."],["II e III, apenas.","A II é falsa: o Concretismo rompe com a Geração de 45 e com o verso metrificado."],["I, II e III.","A II é falsa; o movimento é uma ruptura, não uma continuação."],["III, apenas.","A I também é correta: é a tese central do Plano-piloto."]]},
{"k":"l1","lv":2,"s":"Um poema concreto dispõe a palavra “terra” repetida em linhas que se deslocam, formando sulcos como os de um campo arado. Qual análise é mais adequada?","c":3,"o":[["O poema é parnasiano, pois descreve a natureza com objetividade.","Não há verso, métrica nem rima; a objetividade aqui é visual, não descritiva."],["O poema é romântico, pois exalta a terra natal.","Não há eu lírico nem exaltação sentimental da pátria."],["O poema dispensa o sentido da palavra e vale só como desenho.","O sentido de “terra” é essencial; ele se soma à forma."],["A disposição gráfica reproduz o significado (o campo arado), num caso de isomorfismo.","Isso. A forma “planta” o sentido na página: verbal + visual."],["O poema é marginal, pois usa linguagem coloquial.","Não há coloquialidade nem tom de conversa; é construção calculada."]]},
{"k":"l1","lv":2,"s":"Os concretos citam Mallarmé, Ezra Pound e James Joyce como precursores. O que cada um forneceu ao movimento, respectivamente?","c":0,"o":[["O uso do espaço em branco da página; o método ideogrâmico; a palavra-montagem (“verbivocovisual”).","Isso. Mallarmé (<i>Um lance de dados</i>), Pound (ideograma) e Joyce (fusão de palavras)."],["A rima rica; o soneto; o verso alexandrino.","Esses são recursos parnasianos, rejeitados pelos concretos."],["O indianismo; o nacionalismo; a natureza idealizada.","Temas românticos, sem relação com os concretos."],["O determinismo; a hereditariedade; o meio.","Conceitos naturalistas do século XIX."],["A sinestesia; a musicalidade; o misticismo.","Recursos simbolistas; os concretos querem precisão, não sugestão mística."]]},
{"k":"l1","lv":2,"s":"Leia: “A obra não é um objeto para ser contemplado de longe; ela só se completa quando o público a toca, dobra e transforma.” Essa ideia se aproxima","c":2,"o":[["do Plano-piloto de 1958, de Augusto de Campos e colegas.","O Plano-piloto fala do poema-objeto visual; a participação física do público é proposta neoconcreta."],["do lema parnasiano da “arte pela arte”.","A arte pela arte afasta a obra do público; aqui ocorre o oposto."],["da teoria do não-objeto, de Ferreira Gullar, base do Neoconcretismo.","Isso. Bichos (Lygia Clark), Parangolés (Oiticica), livros-poema e o “Poema enterrado”."],["da poesia marginal, que vendia livros de mão em mão.","Vender de mão em mão é circulação; não é teoria da obra."],["do narrador intruso de Saramago.","Saramago dialoga com o leitor, mas a ideia descrita é das artes visuais neoconcretas."]]},
{"k":"l1","lv":2,"s":"Sobre o “salto participante” do Concretismo (1961), é correto afirmar que","c":4,"o":[["marcou o abandono da experimentação formal e a volta ao verso tradicional.","Os concretos mantiveram a forma nova; o que mudou foi a abertura a temas sociais."],["foi uma reação neoconcreta liderada por Lygia Clark.","Foi uma mudança interna do grupo concreto."],["levou os concretos a aderir à poesia marginal dos anos 1970.","São momentos e propostas diferentes."],["eliminou qualquer relação com a publicidade.","Pelo contrário: os concretos usam a linguagem publicitária para criticá-la (“beba coca cola”)."],["incorporou temas sociais e políticos sem abandonar a forma inovadora, com base na ideia de que não há arte revolucionária sem forma revolucionária.","Isso. A frase é de Maiakóvski e virou lema da fase participante."]]},
{"k":"l1","lv":2,"s":"O Concretismo e o Parnasianismo podem ser aproximados e distinguidos. Assinale a comparação correta.","c":1,"o":[["Ambos usam o soneto como forma preferida.","O Concretismo abandona o soneto e o verso."],["Ambos cultuam a forma, mas o parnasiano a busca na métrica e na rima fixas, e o concreto, na organização visual da página, sem verso.","Isso. Forma fixa × forma nova."],["Ambos valorizam o sentimentalismo do eu lírico.","Os dois rejeitam o sentimentalismo (impassibilidade parnasiana, objetividade concreta)."],["O Parnasianismo é visual e o Concretismo é musical.","Inverte as marcas: o Concretismo é que é visual."],["Ambos surgiram na Semana de Arte Moderna.","O Parnasianismo é do século XIX; o Concretismo, dos anos 1950."]]},
{"k":"l1","lv":2,"s":"Ferreira Gullar participou do Concretismo, redigiu o Manifesto Neoconcreto (1959) e depois escreveu poesia engajada, como o <i>Poema sujo</i> (1976). Essa trajetória mostra","c":3,"o":[["que o Neoconcretismo foi a fase final do Romantismo.","Não há relação com o Romantismo."],["que Gullar sempre seguiu o racionalismo matemático paulista.","Ele rompeu justamente com esse racionalismo."],["que a poesia de vanguarda impedia qualquer engajamento.","Os concretos também tiveram fase participante; Gullar engajou-se."],["um percurso da experimentação formal à poesia de participação política, passando pela crítica ao racionalismo concreto.","Isso. Concreto → neoconcreto → engajado (exílio, ditadura)."],["que Gullar foi o fundador da poesia marginal.","A poesia marginal é dos anos 70, com Chacal, Cacaso e outros."]]},
{"k":"l2","lv":2,"s":"Qual conjunto de características descreve a poesia marginal?","c":2,"o":[["Rigor formal, sintaxe espacial e abolição do verso.","Isso descreve o Concretismo."],["Soneto, rima rica, impassibilidade e temas clássicos.","Isso é Parnasianismo."],["Linguagem coloquial, humor, cotidiano, poema curto e crítica política velada.","Isso. É a poesia de conversa, do dia a dia, com ironia contra a ditadura."],["Sugestão, musicalidade, sinestesia e misticismo.","Isso é Simbolismo."],["Nacionalismo, indianismo e natureza idealizada.","Isso é a 1ª geração romântica."]]},
{"k":"l2","lv":2,"s":"Por que a poesia marginal é vista como oposta ao Concretismo?","c":4,"o":[["Porque os marginais escreviam em prosa.","Eles escreviam poemas; a diferença é o modo."],["Porque os concretos eram contra a ditadura e os marginais a favor.","Não; a oposição é estética, não de apoio político."],["Porque os marginais usavam soneto e métrica.","Os marginais também recusavam a forma fixa."],["Porque o Concretismo é da Europa e a poesia marginal é do Brasil.","Os dois são brasileiros."],["Porque troca o cálculo e o rigor visual pela espontaneidade e pela fala do dia a dia.","Isso. Concreto = planejado e geométrico; marginal = improvisado e coloquial."]]},
{"k":"l2","lv":2,"s":"Um poema de Ana Cristina Cesar tem tom de diário, com datas, fragmentos e um “você” a quem o eu lírico se dirige. Essas marcas mostram","c":1,"o":[["a impessoalidade parnasiana.","O texto é íntimo e pessoal, o contrário da impassibilidade."],["a escrita íntima e fragmentada típica da autora, que imita cartas e diários.","Isso. Ana C. (<i>A teus pés</i>, 1982) brinca com o gênero diário e carta."],["o isomorfismo concreto.","Não há uso visual da página; é escrita confessional."],["o narrador intruso de Saramago.","Saramago é romancista; aqui é poesia lírica."],["o determinismo naturalista.","Não há explicação científica do comportamento."]]},
{"k":"l2","lv":2,"s":"Paulo Leminski é lembrado por","c":3,"o":[["romances históricos sobre Portugal.","Isso é Saramago."],["sonetos parnasianos sobre a Grécia antiga.","Isso lembra Bilac e Francisca Júlia."],["poemas em mimeógrafo sobre a vida em Brasília.","Esse é Nicolas Behr."],["haicais e trocadilhos que unem o rigor concreto ao humor marginal.","Isso. <i>Caprichos &amp; relaxos</i> (1983)."],["ter redigido o Manifesto Neoconcreto.","Foi Ferreira Gullar."]]},
{"k":"l2","lv":2,"s":"A poesia brasileira contemporânea (dos anos 1980 até hoje) se caracteriza principalmente por","c":4,"o":[["seguir uma única escola, com manifesto e regras.","Não há escola única hoje."],["voltar ao soneto e à métrica parnasiana.","Alguns poetas usam formas fixas, mas isso não define o período."],["proibir a poesia visual.","A poesia visual continua (Arnaldo Antunes)."],["tratar só de indígenas e da natureza nacional.","Isso é o indianismo romântico."],["pluralidade: convivem poesia visual, lírica do cotidiano, haicai e poesia falada (slam).","Isso. A marca é a diversidade de vozes e formas."]]},
{"k":"l2","lv":2,"s":"O humor e o duplo sentido da poesia marginal também serviam para driblar a censura da ditadura.","v":true,"e":"Correto. A crítica política aparece velada, disfarçada de piada, ironia e desbunde."},
{"k":"l2","lv":2,"s":"Leia o poema criado para este exercício, no estilo da poesia dos anos 1970:<br><i>“saí cedo / o ônibus não veio / o censor leu meu bilhete / e riu / eu também”</i><br>Quais marcas da poesia marginal aparecem?","c":2,"o":[["Métrica regular, rima rica e tema clássico.","Não há métrica nem rima; o tema é o cotidiano."],["Isomorfismo visual e sintaxe espacial.","O texto é linear, em tom de anotação, sem jogo visual."],["Coloquialidade, cotidiano, poema curto e crítica velada à censura pelo humor.","Isso. O “censor” lembra a ditadura; o riso desarma a censura."],["Sinestesia, musicalidade e misticismo.","Marcas simbolistas, ausentes aqui."],["Narrador intruso e pontuação sem travessão.","Marcas de Saramago, em prosa."]]},
{"k":"l2","lv":2,"s":"A expressão “geração mimeógrafo” relaciona-se ao modo de produção da poesia marginal porque","c":0,"o":[["os poetas produziam livros artesanais e baratos, fora das editoras, e os distribuíam pessoalmente, criando um circuito alternativo durante a ditadura.","Isso. A forma de circular faz parte da proposta: independência e contato direto com o leitor."],["o mimeógrafo era usado para copiar poemas parnasianos para as escolas.","Não; o mimeógrafo servia à produção independente dos próprios poetas."],["os poemas eram enviados por telegrama às editoras.","Os poetas recusavam o circuito das editoras."],["o governo distribuía os livros como propaganda oficial.","A poesia marginal era independente e muitas vezes crítica ao regime."],["os poemas só podiam ser lidos em museus.","Circulavam em bares, praias, shows e portas de cinema."]]},
{"k":"l2","lv":2,"s":"Assinale a alternativa que associa corretamente o poeta à sua marca.","c":4,"o":[["Ana Cristina Cesar: haicai e trocadilho; Paulo Leminski: diário e carta.","Está invertido."],["Chacal: poema concreto geométrico; Cacaso: sonetos parnasianos.","Chacal é poeta da fala; Cacaso usa ironia política e paródia."],["Francisco Alvim: romances históricos; Nicolas Behr: Manifesto Neoconcreto.","Alvim faz poemas curtos com falas ouvidas; Behr publicava em Brasília; o manifesto é de Gullar."],["Leminski: poesia falada de Nuvem Cigana; Chacal: haicai curitibano.","Está trocado: haicai é de Leminski; Nuvem Cigana e poesia falada são de Chacal."],["Ana C.: escrita íntima em forma de diário e carta; Leminski: haicai e trocadilho, unindo rigor concreto e humor marginal.","Isso."]]},
{"k":"l2","lv":2,"s":"A influência de Oswald de Andrade sobre a poesia marginal aparece sobretudo","c":1,"o":[["no uso do soneto e da rima rica.","Oswald combatia justamente essa poesia “bem-comportada”."],["no poema-piada e no poema-minuto, curtos, irônicos e coloquiais.","Isso. Os marginais retomam a irreverência do Modernismo de 1922."],["no indianismo idealizado de Alencar.","O indianismo é romântico; Oswald o parodiava."],["na pontuação sem travessão.","Essa é marca de Saramago."],["no determinismo de raça e meio.","Isso é Naturalismo."]]},
{"k":"l2","lv":2,"s":"Sobre a poesia contemporânea brasileira (a partir dos anos 1980), avalie:<br>I. Não há uma escola única; convivem vertentes diversas.<br>II. A poesia visual desapareceu depois do Concretismo.<br>III. Saraus de periferia e o slam valorizam a poesia oral e a performance.<br>Está correto o que se afirma em","c":3,"o":[["I, apenas.","A III também está correta."],["II, apenas.","A II é falsa: Arnaldo Antunes e a poesia digital continuam o trabalho visual."],["I e II, apenas.","A II é falsa."],["I e III, apenas.","Isso. Pluralidade e força da poesia falada."],["I, II e III.","A II é falsa."]]},
{"k":"l2","lv":2,"s":"Uma questão de prova pede para contrastar a poesia marginal com o Concretismo. A resposta mais completa é:","c":2,"o":[["Os dois são iguais, pois ambos são modernistas de 1922.","Nenhum dos dois é de 1922."],["O Concretismo é coloquial e a poesia marginal é geométrica.","Está invertido."],["O Concretismo é racional, planejado e visual; a poesia marginal é espontânea, coloquial e ligada ao cotidiano, além de circular fora das editoras.","Isso. Cita forma, linguagem e circulação."],["A poesia marginal é portuguesa e o Concretismo é brasileiro.","Ambos são brasileiros."],["Ambos rejeitam qualquer crítica política.","O Concretismo teve fase participante e a poesia marginal faz crítica velada."]]},
{"k":"l3","lv":2,"s":"Num trecho de Saramago, as falas de duas personagens aparecem no mesmo parágrafo, separadas só por vírgulas, cada uma começando com letra maiúscula. Essa escolha","c":3,"o":[["é um erro de revisão que as editoras nunca corrigiram.","Não é erro: é escolha consciente de estilo."],["segue a norma tradicional dos diálogos em romance.","A norma tradicional usa travessão ou aspas; Saramago rompe com ela."],["mostra que o narrador é um personagem que não sabe escrever.","O narrador é culto e irônico; a escolha é estética."],["aproxima a narrativa da oralidade e obriga o leitor a participar ativamente.","Isso. O ritmo é de alguém contando a história em voz alta."],["imita a linguagem de manuais científicos.","Não há nada de científico nesse recurso."]]},
{"k":"l3","lv":2,"s":"O narrador de Saramago costuma ser","c":1,"o":[["um personagem em 1ª pessoa que só sabe o que viu.","Ele é onisciente e sabe mais que os personagens."],["onisciente e intruso: comenta, opina, ironiza e conversa com o leitor.","Isso. Faz digressões e usa ditados populares."],["neutro e impassível, como na poesia parnasiana.","Impassibilidade é ideal parnasiano; o narrador de Saramago opina o tempo todo."],["um defunto autor, como Brás Cubas.","É Machado de Assis."],["ausente, porque o romance só tem diálogos.","O narrador é muito presente."]]},
{"k":"l3","lv":2,"s":"Em <i>Memorial do convento</i>, a passarola do padre Bartolomeu de Gusmão voa graças às “vontades” recolhidas por Blimunda. O que essa mistura de fato histórico e fantasia permite ao autor?","c":2,"o":[["Escrever um livro de história com datas exatas.","O romance não é livro didático: mistura fatos e invenção."],["Elogiar o poder do rei e da Inquisição.","O romance critica o rei e a Inquisição."],["Contar a história pelo lado dos anônimos e criticar o poder absoluto e a Igreja.","Isso. A fantasia (o sonho de voar) se opõe à opressão (Mafra, autos de fé)."],["Provar cientificamente que o ser humano pode voar.","Não há intenção científica; é alegoria."],["Imitar a forma das cantigas medievais.","Não há relação com o trovadorismo."]]},
{"k":"l3","lv":2,"s":"A “cegueira branca” de <i>Ensaio sobre a cegueira</i> é uma alegoria. Ela representa principalmente","c":3,"o":[["uma doença real que existiu em Portugal.","É ficção; vale pelo que simboliza."],["a vitória da ciência sobre a religião.","Não é esse o conflito do romance."],["a saudade da pátria distante.","Saudade da pátria é tema romântico (“Canção do exílio”)."],["a cegueira moral: perda da ética e da solidariedade, que leva a sociedade à barbárie.","Isso. As pessoas “veem, mas não reparam” umas nas outras."],["a beleza da cor branca, como em Cruz e Sousa.","O branco de Cruz e Sousa é simbolista; aqui é alegoria social."]]},
{"k":"l3","lv":2,"s":"Por que as personagens de <i>Ensaio sobre a cegueira</i> não têm nome (“o médico”, “a rapariga dos óculos escuros”)?","c":0,"o":[["Para universalizar a história: pode acontecer com qualquer pessoa, em qualquer cidade.","Isso. A falta de nomes reforça a alegoria."],["Porque o autor esqueceu de nomeá-las.","É escolha consciente."],["Porque a censura proibia nomes próprios.","Não há relação com censura."],["Para imitar o estilo parnasiano.","O Parnasianismo não tem relação com isso."],["Porque são personagens históricas reais.","São fictícias."]]},
{"k":"l3","lv":2,"s":"Saramago costuma partir de uma hipótese absurda (“e se…?”). Qual obra corresponde a “e se a morte parasse de matar num país?”","c":4,"o":[["<i>A jangada de pedra</i>.","Nela, a Península Ibérica se solta da Europa."],["<i>Ensaio sobre a lucidez</i>.","Nela, a maioria vota em branco."],["<i>Memorial do convento</i>.","É romance histórico sobre Mafra."],["<i>Levantado do chão</i>.","Trata dos camponeses do Alentejo."],["<i>As intermitências da morte</i>.","Isso (2005)."]]},
{"k":"l3","lv":2,"s":"<i>O Evangelho segundo Jesus Cristo</i> causou polêmica, e o veto do governo português a esse livro levou Saramago a morar em Lanzarote, na Espanha.","v":true,"e":"Correto. O veto foi em 1992; ele se mudou para Lanzarote (Canárias) e lá morreu em 2010."},
{"k":"l3","lv":2,"s":"Leia o trecho criado para este exercício, imitando o estilo de Saramago:<br><i>“Perguntou o homem, Onde estamos, e a mulher respondeu, Não sei, mas sei que não estamos sós, o que, convenhamos, já é alguma coisa.”</i><br>Identifique as marcas presentes.","c":0,"o":[["Falas sem travessão, iniciadas por maiúscula e separadas por vírgula, e intervenção do narrador (“convenhamos”).","Isso. Diálogo embutido no parágrafo e narrador que comenta."],["Versos decassílabos com rima rica.","É prosa, sem métrica."],["Isomorfismo e sintaxe espacial.","Não há jogo visual com a página."],["Linguagem científica e determinista.","Não há explicação científica."],["Erro de pontuação que precisa ser corrigido.","Não é erro: é escolha de estilo."]]},
{"k":"l3","lv":2,"s":"Sobre José Saramago, avalie:<br>I. É o único escritor de língua portuguesa premiado com o Nobel de Literatura (1998).<br>II. Seus romances mais conhecidos são anteriores à Revolução dos Cravos (1974).<br>III. Mudou-se para Lanzarote após o governo português vetar <i>O Evangelho segundo Jesus Cristo</i> num prêmio europeu.<br>Está correto o que se afirma em","c":2,"o":[["I, apenas.","A III também está correta."],["II e III, apenas.","A II é falsa: os grandes romances são dos anos 1980 e 1990."],["I e III, apenas.","Isso."],["I, II e III.","A II é falsa."],["III, apenas.","A I também está correta."]]},
{"k":"l3","lv":2,"s":"Em <i>Memorial do convento</i>, a construção de Mafra é narrada pela ótica dos trabalhadores, e não do rei. Essa escolha caracteriza","c":3,"o":[["um romance histórico tradicional, que exalta os heróis da nação.","O romance desmonta a exaltação: critica o rei e mostra o custo humano da obra."],["um poema épico em oitava-rima, como <i>Os lusíadas</i>.","É prosa, não epopeia em versos."],["uma narrativa naturalista, que explica as personagens pelo determinismo.","Não há tese científica; há fantasia (vontades, passarola)."],["uma releitura crítica da história oficial, que dá voz aos anônimos e excluídos.","Isso. Mistura fato e ficção para criticar o poder absoluto e a Inquisição."],["uma autobiografia do autor.","Saramago não é personagem; a ação é no século XVIII."]]},
{"k":"l3","lv":2,"s":"Em <i>Ensaio sobre a cegueira</i>, a mulher do médico finge estar cega para acompanhar o marido na quarentena. Considerando a alegoria do romance, o papel dela é","c":1,"o":[["provar que a cegueira era apenas imaginação coletiva.","A cegueira é real na trama; a questão é o que ela simboliza."],["representar a responsabilidade ética de quem “vê” numa sociedade que perdeu a solidariedade.","Isso. Ela guia, cuida e também sofre por enxergar a barbárie."],["mostrar o determinismo biológico da doença.","Não há tese naturalista."],["simbolizar a pureza da cor branca, como em Cruz e Sousa.","O branco aqui é a “cegueira branca”, alegoria social."],["defender o governo que organizou a quarentena.","O romance critica a forma desumana da quarentena."]]},
{"k":"l3","lv":2,"s":"A literatura portuguesa contemporânea, em que se insere Saramago, se desenvolve sobretudo","c":4,"o":[["no século XVI, junto com Camões.","Camões é do Classicismo."],["na Questão Coimbrã de 1865.","Questão Coimbrã é o início do Realismo português."],["durante a Belle Époque.","Belle Époque é o contexto do Parnasianismo e do Simbolismo."],["no Modernismo de Fernando Pessoa e da revista <i>Orpheu</i> (1915).","Pessoa é modernista; Saramago chega a usar Ricardo Reis como personagem, décadas depois."],["depois da Revolução dos Cravos (1974), com o fim da ditadura salazarista.","Isso. Saramago, Lobo Antunes, Lídia Jorge, Cardoso Pires, entre outros."]]},
{"k":"l3","lv":2,"s":"“Se podes olhar, vê. Se podes ver, repara.” A epígrafe de <i>Ensaio sobre a cegueira</i> sugere que","c":0,"o":[["há uma diferença entre enxergar fisicamente e perceber de verdade o outro e a realidade.","Isso. Olhar → ver → reparar: graus crescentes de atenção ética."],["o romance trata de técnicas de pintura impressionista.","Não há relação com pintura."],["a cegueira é castigo divino.","O romance não apresenta a cegueira como castigo religioso."],["só os médicos podem curar a sociedade.","O médico também fica cego; quem vê é a mulher dele."],["o autor defende a censura.","Não há relação com censura."]]},
{"k":"lr","lv":2,"s":"Na lista de questões sobre Realismo e Naturalismo, qual estrofe de Augusto dos Anjos melhor traduz o determinismo de Claude Bernard, segundo o gabarito?","c":1,"o":[["A 1ª (“Eu, filho do carbono e do amoníaco”).","Também é determinista, mas o gabarito da lista escolheu as estrofes do verme."],["A 3ª e a última (o verme, “operário das ruínas”, que devolve o corpo à matéria inorgânica).","Isso. Mostram que vivos e “corpos brutos” seguem a mesma lei: o corpo vira matéria inerte."],["A 2ª (“Profundissimamente hipocondríaco”).","Ela fala do mal-estar do eu lírico; não é a escolhida."],["Nenhuma: o poema é romântico.","O poema é do início do século XX e tem marcas cientificistas, nada românticas."],["Todas igualmente; não há escolha.","A questão pede a estrofe que melhor traduz a ideia."]]},
{"k":"lr","lv":2,"s":"Qual alternativa relaciona corretamente a escola, a obra e o traço?","c":2,"o":[["Romantismo – <i>O cortiço</i> – idealização da mulher.","<i>O cortiço</i> é naturalista e mostra o ser humano pelo determinismo."],["Naturalismo – <i>Iracema</i> – determinismo.","<i>Iracema</i> é romântica (indianismo)."],["Realismo – <i>O primo Basílio</i> – crítica à educação romântica e à falsa moral burguesa.","Isso. Luísa vive a “aventura” dos romances que lia; o adultério expõe a burguesia."],["Simbolismo – “Profissão de fé” – sugestão e misticismo.","“Profissão de fé” é parnasiano (Bilac, o poeta ourives)."],["Parnasianismo – “Ismália” – culto da forma impassível.","“Ismália” é simbolista (Alphonsus de Guimaraens)."]]},
{"k":"lr","lv":2,"s":"Na lista de questões sobre Realismo e Naturalismo, a frase de Eça sobre analisar as paixões “a posteriori, por processos tão exatos como os da própria fisiologia” significa que","c":4,"o":[["o escritor deve inventar as paixões antes de observá-las.","Isso é o “a priori” romântico, que Eça critica."],["a literatura deve abandonar o romance e se dedicar ao drama.","Eça não propõe abandonar o romance."],["o sentimento deve prevalecer sobre a razão.","É o oposto: “a anatomia do caráter”, não a “apoteose do sentimento”."],["a arte deve imitar os clássicos greco-latinos.","Isso lembra o Arcadismo e o Parnasianismo."],["a narrativa deve substituir a especulação idealista pela observação empírica, tratando o ser humano como fenômeno sujeito a leis.","Isso. É a resposta do gabarito da lista (4a)."]]},
{"k":"q2","lv":2,"s":"Considere o 3-metilpent-2-eno, CH₃–CH=C(CH₃)–CH₂–CH₃. No isômero em que o grupo etila (do C3) e o hidrogênio (do C2) estão do mesmo lado da dupla, a configuração é","c":0,"o":[["(E), porque os ligantes de maior prioridade (CH₃ no C2 e etila no C3) ficam em lados opostos.","Isso. C2: CH₃ > H. C3: empate no C, mas a etila tem (C, H, H) e a metila (H, H, H), então etila > metila. Se a etila está do lado do H, ela está do lado oposto ao CH₃ do C2: (E)."],["(Z), porque a etila e o H estão do mesmo lado.","O sistema (E)-(Z) compara os ligantes de MAIOR prioridade. O H é o de menor prioridade no C2."],["(Z), porque os ligantes de maior prioridade ficam do mesmo lado.","Faça o ranking: no C2 vence o CH₃, no C3 vence a etila. Estão em lados opostos."],["(E), porque a metila do C3 tem prioridade maior que a etila.","A conclusão (E) está certa, mas o motivo está errado: no desempate a etila vence a metila (Regra 2)."],["Não há isomeria geométrica, porque o C3 não tem hidrogênio.","Não precisa ter H. Basta que cada carbono da dupla tenha dois ligantes diferentes: C2 (CH₃, H) e C3 (CH₃, C₂H₅)."]]},
{"k":"q2","lv":2,"s":"No 2-bromo-3-metilpent-2-eno, CH₃–CBr=C(CH₃)–CH₂CH₃, o isômero em que o Br e a metila do C3 estão do mesmo lado é nomeado como","c":1,"o":[["(Z), porque o Br e a metila estão juntos.","A metila não é o ligante de maior prioridade do C3: a etila vence no desempate."],["(E), porque o Br (maior no C2) fica do lado oposto à etila (maior no C3).","Isso. C2: Br (Z = 35) > CH₃. C3: etila > metila. Br do lado da metila = Br do lado oposto à etila = (E)."],["cis, porque há grupos iguais do mesmo lado.","Em alceno trissubstituído ou tetrassubstituído, cis/trans fica ambíguo. O livro recomenda o sistema (E)-(Z)."],["trans, porque o Br e a etila estão em lados opostos.","Mesmo problema: cis/trans é ambíguo aqui. A resposta esperada usa (E)-(Z)."],["Não tem isomeria geométrica.","Tem: C2 (Br, CH₃) e C3 (CH₃, C₂H₅) têm ligantes diferentes."]]},
{"k":"q2","lv":2,"s":"Pelas regras de Cahn-Ingold-Prelog, qual destes grupos tem a MAIOR prioridade?","c":1,"o":[["–CCl₃","Pegadinha clássica: três Cl parecem mais que um Br, mas a comparação é átomo a átomo, começando pelo maior. Br (35) vence Cl (17) logo no primeiro confronto."],["–CH₂Br","Isso. Todos começam com C. Depois compara-se o átomo de maior número atômico de cada conjunto: Br (35) contra Cl (17) ou O (8). Br vence, e o resto não importa."],["–COOH","O –COOH tem (O, O, O), mas o maior átomo dele é O (8), que perde para o Br (35) do –CH₂Br."],["–CH₂CH₂Br","O primeiro carbono tem (C, H, H). O Br está longe demais: o desempate para no primeiro ponto de diferença."],["–CH(CH₃)₂","Tem (C, C, H). Perde para qualquer grupo com halogênio ou oxigênio ligado ao primeiro carbono."]]},
{"k":"q2","lv":2,"s":"Qual é a ordem DECRESCENTE de prioridade (Cahn-Ingold-Prelog) dos grupos –CHO, –COOH, –CH₂OH e –CH₂CH₃?","c":3,"o":[["–CHO > –COOH > –CH₂OH > –CH₂CH₃","O –COOH tem (O, O, O) pela replicação da dupla; o –CHO tem (O, O, H). O –COOH vence."],["–CH₂OH > –CHO > –COOH > –CH₂CH₃","Esqueceu a Regra 3: a dupla C=O conta o O duas vezes."],["–COOH > –CH₂OH > –CHO > –CH₂CH₃","–CHO (O, O, H) vence –CH₂OH (O, H, H): empata no primeiro O e ganha no segundo."],["–COOH > –CHO > –CH₂OH > –CH₂CH₃","Isso. Modelos: COOH (O, O, O) > CHO (O, O, H) > CH₂OH (O, H, H) > CH₂CH₃ (C, H, H). É o mesmo raciocínio do exercício resolvido do livro."],["–CH₂CH₃ > –CH₂OH > –CHO > –COOH","É a ordem invertida (crescente)."]]},
{"k":"q2","lv":2,"s":"Analise as afirmações. I. O pent-2-eno apresenta isomeria geométrica. II. O 2-metilbut-2-eno apresenta isomeria geométrica. III. O 1,2-dimetilciclobutano apresenta isômeros cis e trans. IV. O cis-1,2-dicloroeteno tem ponto de ebulição menor que o trans. Estão corretas","c":1,"o":[["I e II.","II está errada: no 2-metilbut-2-eno o C2 tem dois CH₃ iguais."],["I e III.","Isso. I: C2 (H, CH₃) e C3 (H, C₂H₅). III: metilas em carbonos diferentes do anel. IV está errada: o cis é polar e ferve a uma temperatura MAIOR."],["II e IV.","II: C2 com dois CH₃ não permite isomeria. IV: o cis ferve a uma temperatura maior que o trans."],["III e IV.","IV está errada: o cis (polar) tem ponto de ebulição maior."],["I, III e IV.","IV está errada: o cis-1,2-dicloroeteno é polar e ferve a ≈ 60 °C; o trans, apolar, a ≈ 48 °C."]]},
{"k":"q2","lv":2,"s":"Quantos isômeros geométricos existem para o hexa-2,4-dieno, CH₃–CH=CH–CH=CH–CH₃?","c":2,"o":[["2","Cada dupla pode ser E ou Z. Com duas duplas há mais de duas combinações."],["4","Pegadinha: (2E,4Z) e (2Z,4E) são a mesma molécula, porque a cadeia é simétrica (é só ler do outro lado)."],["3","Isso. (2E,4E), (2Z,4Z) e (2E,4Z), que é o mesmo que (2Z,4E) por simetria."],["1","As duas duplas têm, em cada carbono, H e um grupo diferente: há isomeria."],["6","Não há tantas combinações: são só duas duplas, cada uma E ou Z."]]},
{"k":"q2","lv":2,"s":"Os ácidos maleico (cis) e fumárico (trans) são isômeros do ácido butenodioico. A conversão do maleico em fumárico libera energia. É correto afirmar que","c":0,"o":[["o fumárico é o mais estável, o maleico é o mais polar e os dois são diastereoisômeros geométricos.","Isso. Liberar energia na conversão quer dizer que o produto (fumárico) tem menos energia. No cis os dipolos não se anulam. E o livro os cita como diastereoisômeros geométricos."],["o maleico é o mais estável, porque a conversão libera energia.","Se a conversão maleico → fumárico libera energia, quem fica com menos energia (mais estável) é o fumárico."],["o fumárico é o mais polar, porque é trans.","No trans os dipolos tendem a se anular. O mais polar é o cis (maleico)."],["são enantiômeros, porque um é a imagem do outro.","Cis e trans não são par objeto-imagem: são diastereoisômeros."],["não são isômeros, porque têm propriedades diferentes.","Têm a mesma fórmula molecular (C₄H₄O₄): são isômeros. Propriedades diferentes são justamente o esperado."]]},
{"k":"q2","lv":2,"s":"Qual composto NÃO apresenta isomeria geométrica?","c":3,"o":[["1,2-dimetilciclopropano.","Tem: metilas em carbonos diferentes do anel."],["1,3-dimetilciclobutano.","Tem: C1 (CH₃, H) e C3 (CH₃, H) podem ter os metilas do mesmo lado ou em lados opostos."],["1-bromo-2-cloro-1-metilciclobutano.","Tem, é exemplo resolvido do livro: C1 (Br, CH₃) e C2 (Cl, H) → (Z) e (E)."],["1,1,2-trimetilciclopropano.","Isso. O C1 tem dois CH₃ iguais e o C3 tem dois H. Só o C2 tem ligantes diferentes; é preciso pelo menos dois carbonos do anel com ligantes diferentes."],["1,2-diclorociclo-hexano.","Tem: Cl em carbonos diferentes do anel."]]},
{"k":"q2","lv":2,"s":"Considerando isômeros planos e geométricos, quantos compostos diferentes têm a fórmula C₃H₅Cl?","c":2,"o":[["3","Faltaram estruturas: há quatro isômeros planos, e um deles tem cis e trans."],["4","São quatro isômeros planos, mas o 1-cloroprop-1-eno tem duas formas, (E) e (Z)."],["5","Isso. 1-cloroprop-1-eno (E e Z), 2-cloroprop-1-eno, 3-cloroprop-1-eno e clorociclopropano."],["6","O 2-cloroprop-1-eno e o 3-cloroprop-1-eno não têm isomeria geométrica: o C1 deles tem dois H."],["7","Contou formas que não existem. Só o 1-cloroprop-1-eno tem (E) e (Z)."]]},
{"k":"q2","lv":2,"s":"No ácido 2-metilpent-2-enoico, CH₃CH₂–CH=C(CH₃)–COOH, os ligantes de maior prioridade no C2 e no C3 são, respectivamente,","c":0,"o":[["–COOH e –CH₂CH₃.","Isso. C2: COOH (O, O, O) > CH₃. C3: etila > H. Se ficarem em lados opostos, é o ácido (E)-2-metilpent-2-enoico, como no livro."],["–CH₃ e –H.","São os de MENOR prioridade em cada carbono."],["–COOH e –H.","No C3, a etila (Z do C = 6) vence o H (1)."],["–CH₃ e –CH₂CH₃.","No C2, o –COOH vence o –CH₃: (O, O, O) contra (H, H, H)."],["–CH₂CH₃ e –COOH.","A ordem está trocada: o –COOH está no C2 e a etila no C3."]]},
{"k":"q2","lv":2,"s":"Na retina, a luz converte o 11-cis-retinal em 11-trans-retinal, e uma enzima refaz o cis. Essa conversão","c":4,"o":[["é isomeria óptica, porque envolve luz.","Envolver luz não é critério. É uma mudança cis → trans: isomeria geométrica."],["acontece espontaneamente, porque a dupla gira livremente.","A dupla NÃO gira livremente: a ligação π impede."],["muda a fórmula molecular do retinal.","Isômeros têm a mesma fórmula molecular."],["é uma tautomeria.","Tautomeria é um equilíbrio de isomeria plana (como enol ⇌ aldeído)."],["é uma interconversão de isômeros geométricos, que só ocorre com energia (luz ou enzima) capaz de romper momentaneamente a ligação π.","Isso. É o exemplo de abertura do capítulo 2."]]},
{"k":"q3","lv":2,"s":"Para o 2,3-dibromopentano, CH₃–CHBr–CHBr–CH₂–CH₃, o número de isômeros opticamente ativos e de misturas racêmicas é, respectivamente,","c":1,"o":[["3 e 1","Esse seria o caso de dois C* IGUAIS (com meso). Aqui os C* são diferentes: um tem CH₃ e o outro tem C₂H₅."],["4 e 2","Isso. Dois C* diferentes: 2² = 4 ativos e 4 ÷ 2 = 2 pares racêmicos."],["2 e 1","Isso seria para um único C*."],["4 e 1","Os pares racêmicos são a metade dos ativos: 4 ÷ 2 = 2."],["8 e 4","Seria 2³, para três C* diferentes. Aqui são dois."]]},
{"k":"q3","lv":2,"s":"O ácido tartárico, HOOC–CH(OH)–CH(OH)–COOH, tem dois carbonos assimétricos IGUAIS. É correto afirmar que ele apresenta","c":2,"o":[["4 isômeros ativos e 2 misturas racêmicas.","Pegadinha: van't Hoff não se aplica quando há composto meso."],["2 isômeros ativos e nenhum inativo.","Falta o meso, que é inativo por compensação interna."],["2 isômeros ativos (dextro e levo), 1 meso inativo e 1 mistura racêmica.","Isso. Com dois C* iguais, uma das combinações tem plano de simetria (meso). Sobram dois ativos, que formam um racemato."],["3 isômeros ativos.","O meso não é ativo."],["apenas o composto meso.","Também existem os dois enantiômeros ativos."]]},
{"k":"q3","lv":2,"s":"A glicose de cadeia aberta é HOCH₂–CH(OH)–CH(OH)–CH(OH)–CH(OH)–CHO. O número de isômeros opticamente ativos e de pares racêmicos é","c":3,"o":[["4 e 2","Contou só dois C*. Os carbonos 2, 3, 4 e 5 têm quatro ligantes diferentes."],["5 e 2","Não é n nem n + 1: a fórmula é 2ⁿ."],["8 e 4","Seria para 3 C*. São 4: os carbonos 2, 3, 4 e 5."],["16 e 8","Isso. 4 C* diferentes: 2⁴ = 16 ativos e 16 ÷ 2 = 8 pares racêmicos."],["32 e 16","Seria para 5 C*. O C1 (CHO) e o C6 (CH₂OH) não são assimétricos."]]},
{"k":"q3","lv":2,"s":"Qual dos compostos apresenta isomeria óptica?","c":2,"o":[["3-metilpentano.","O C3 tem H, CH₃ e duas etilas IGUAIS: não é C*."],["2-metilbutano.","O C2 tem dois CH₃ iguais: não é C*."],["3-metil-hexano.","Isso. O C3 tem H, CH₃, etila e propila: quatro ligantes diferentes."],["Pentan-3-ol.","O C3 tem H, OH e duas etilas iguais: não é C*."],["2,2-dimetilpropano.","Não tem nenhum carbono com quatro ligantes diferentes."]]},
{"k":"q3","lv":2,"s":"Qual destes compostos cíclicos tem carbono assimétrico?","c":3,"o":[["Metilciclo-hexano.","O C1 tem H, CH₃ e dois \"caminhos\" do anel iguais nos dois sentidos. Não é C*."],["1-metilciclo-hexanol.","O C1 tem OH e CH₃, mas os dois caminhos do anel são iguais."],["4-metilciclo-hexanol.","Do C1, os dois caminhos chegam ao C4 da mesma forma: são iguais. Nenhum C*."],["2-metilciclo-hexanol.","Isso. No C1, um caminho começa no C2 (que tem CH₃) e o outro no C6 (CH₂): caminhos diferentes. O C2 também é C*."],["Ciclo-hexanol.","Os dois caminhos do anel a partir do C1 são iguais."]]},
{"k":"q3","lv":2,"s":"Numa projeção de Fischer, o ligante de prioridade 4 está numa linha HORIZONTAL, e a sequência 1 → 2 → 3 aparece no sentido horário. A configuração do C* é","c":1,"o":[["(R), porque o sentido é horário.","Só vale ler direto quando o 4 está na vertical (afastado do leitor). Na horizontal ele aponta para você."],["(S), porque, com o 4 na horizontal, o sentido observado se inverte.","Isso. Pelo método do livro: duas permutas levam o 4 para baixo sem mudar o C*, e aí o sentido aparece anti-horário."],["(R), porque a horizontal se afasta do leitor.","Na projeção de Fischer, a horizontal se APROXIMA do leitor."],["Dextrogiro.","R/S não diz nada sobre o desvio da luz. E a pergunta é sobre configuração."],["Não é possível determinar sem polarímetro.","A configuração (R)/(S) sai da estrutura. O polarímetro é que mede (+)/(–)."]]},
{"k":"q3","lv":2,"s":"No gliceraldeído, OHC–CH(OH)–CH₂OH, a ordem de prioridade dos ligantes do carbono assimétrico é","c":0,"o":[["–OH > –CHO > –CH₂OH > –H","Isso. O OH tem o átomo O (Z = 8) ligado direto. Entre os grupos com C: CHO (O, O, H) > CH₂OH (O, H, H)."],["–CHO > –OH > –CH₂OH > –H","Compare o átomo ligado direto: O do OH (8) vence o C do CHO (6)."],["–OH > –CH₂OH > –CHO > –H","Pela Regra 3, o CHO tem (O, O, H) e vence o CH₂OH (O, H, H)."],["–CH₂OH > –CHO > –OH > –H","Os grupos com carbono perdem para o OH."],["–H > –CH₂OH > –CHO > –OH","É a ordem invertida."]]},
{"k":"q3","lv":2,"s":"Analise. I. Enantiômeros têm o mesmo ponto de fusão. II. Diastereoisômeros têm propriedades físicas diferentes. III. Uma mistura racêmica desvia a luz polarizada para a direita. IV. O composto meso tem carbonos assimétricos, mas é opticamente inativo. Estão corretas","c":4,"o":[["I e III.","III está errada: o racemato é inativo (compensação externa). II também está certa."],["II e III.","III está errada. E I está certa: enantiômeros só diferem no sentido do desvio da luz."],["I e IV.","Falta a II: diastereoisômeros têm propriedades físicas e químicas diferentes."],["II, III e IV.","III está errada: mistura racêmica não desvia a luz."],["I, II e IV.","Isso. Só a III está errada: a mistura racêmica é opticamente inativa."]]},
{"k":"q3","lv":2,"s":"O ácido (S)-láctico desvia a luz polarizada em +3,3°. Sobre o ácido (R)-láctico, é correto afirmar que ele","c":2,"o":[["é dextrogiro, porque R vem de rectus (direita).","R/S não indica o sentido do desvio. Rectus fala do sentido da sequência de prioridades."],["é opticamente inativo.","Ele tem C* e não é meso: é ativo."],["desvia a luz em –3,3°, porque é o enantiômero do (S).","Isso. Enantiômeros desviam a luz com o mesmo ângulo e sentidos opostos."],["desvia a luz em +6,6°.","O ângulo é o mesmo em módulo; só o sentido muda."],["só pode ter o desvio descoberto com polarímetro, sem relação com o (S).","Para um composto qualquer, sim. Mas aqui sabemos o desvio do enantiômero, e enantiômeros têm desvios opostos."]]},
{"k":"q3","lv":2,"s":"A (R)-talidomida é sedativa e a (S)-talidomida é teratogênica. O livro afirma que o (R) se converte em (S) no organismo. Por isso,","c":3,"o":[["bastaria vender só o (R) para eliminar o risco.","Não: dentro do corpo, parte do (R) vira (S)."],["os dois enantiômeros têm o mesmo efeito no corpo.","O exemplo mostra o contrário: os efeitos são muito diferentes."],["o problema seria resolvido vendendo a mistura racêmica.","A mistura racêmica já contém 50% de (S)."],["mesmo o (R) puro pode gerar o (S) no organismo, e o risco permanece.","Isso. Por isso não foi possível conter as consequências do isômero (S)."],["a diferença entre eles é só o sentido do desvio da luz, sem efeito biológico.","Fora do corpo, quase só isso. Mas dentro dele, as moléculas que reconhecem os remédios também são quirais e distinguem os dois."]]},
{"k":"q3","lv":2,"s":"Sobre os estereoisômeros do 2,3-dibromobutano, CH₃–CHBr–CHBr–CH₃, é correto afirmar:","c":0,"o":[["São três: (R,R), (S,S) e o meso; o meso e o (R,R) são diastereoisômeros.","Isso. Os C* são iguais, então uma combinação é meso. (R,R) e (S,S) são enantiômeros; o meso não é imagem de nenhum deles."],["São quatro, pela fórmula de van't Hoff.","A fórmula não vale quando há meso."],["O meso e o (S,S) são enantiômeros.","O meso é idêntico à própria imagem. Com o (S,S) ele é diastereoisômero."],["A mistura equimolecular de (R,R) e (S,S) é opticamente ativa.","É uma mistura racêmica: inativa por compensação externa."],["O meso é opticamente ativo.","O meso é inativo por compensação interna."]]},
{"k":"q3","lv":2,"s":"Duas projeções de Fischer de um composto com dois C*. Para passar de uma para a outra, foi feita uma permuta só no primeiro C*. As duas estruturas são","c":1,"o":[["enantiômeros.","Para serem enantiômeros, os DOIS C* teriam de inverter."],["diastereoisômeros, e uma mistura equimolecular delas é opticamente ativa.","Isso, é o caso 5 do livro: só um C* mudou. Diastereoisômeros não se compensam totalmente, então a mistura não é racêmica."],["o mesmo composto.","Uma permuta (número ímpar) altera aquele C*."],["um composto meso.","Meso exige C* iguais com plano de simetria; não é consequência de uma permuta."],["diastereoisômeros, e a mistura deles é racêmica.","Racêmica é só a mistura equimolecular de ENANTIÔMEROS."]]},
{"k":"q3","lv":2,"s":"A dopa, HOOC–CH(NH₂)–CH₂–C₆H₃(OH)₂, apresenta isomeria óptica, e a dopamina, H₂N–CH₂–CH₂–C₆H₃(OH)₂, não. Isso acontece porque","c":4,"o":[["a dopamina não tem anel aromático.","As duas têm o mesmo anel com duas OH."],["a dopa tem mais oxigênios.","Ter mais átomos não cria C*. O que importa é ter quatro ligantes diferentes num carbono."],["a dopamina tem ligação dupla.","As duas têm o mesmo anel; isso não explica a diferença."],["a dopa é um ácido e todo ácido é quiral.","O ácido acético é ácido e não tem C*."],["na dopa, o carbono ligado ao NH₂ tem H, NH₂, COOH e CH₂–anel (quatro diferentes); na dopamina, os carbonos da cadeia têm dois H.","Isso. É a questão da UNESP no livro."]]},
{"k":"q5","lv":2,"s":"O propino reage com HBr em excesso (2 mol), sem peróxido. O produto final é","c":2,"o":[["1,2-dibromopropano.","Os dois Br não se dividem entre C1 e C2. Pela regra de Markovnikov, os dois vão para o C2."],["1,1-dibromopropano.","Isso seria anti-Markovnikov duas vezes, o que só aconteceria com peróxido."],["2,2-dibromopropano.","Isso. 1ª adição: 2-bromopropeno. 2ª adição: o H vai de novo para o C1 (mais hidrogenado) e o Br para o C2. É o exemplo do livro."],["1,2-dibromopropeno.","Esse é o produto do Br₂ (1:1), não do HBr."],["2-bromopropeno.","Esse é só o produto intermediário, com 1 mol de HBr."]]},
{"k":"q5","lv":2,"s":"O 2-metilpropeno reage com HCl EM PRESENÇA DE PERÓXIDO. O produto principal é","c":0,"o":[["2-cloro-2-metilpropano, porque o efeito do peróxido só acontece com HBr.","Isso. Com HCl, vale Markovnikov mesmo com peróxido: H no C1 (mais hidrogenado) e Cl no C2."],["1-cloro-2-metilpropano, pela regra de Kharasch.","A regra de Kharasch só vale para HBr. O livro diz que o efeito do peróxido não ocorre com os demais haletos."],["1,2-dicloro-2-metilpropano.","Com HCl entra só um Cl."],["2-metilpropan-2-ol.","Não há água nessa reação."],["Não há reação, porque o peróxido impede.","O peróxido não impede a adição; ele só mudaria o produto no caso do HBr."]]},
{"k":"q5","lv":2,"s":"Um alceno X reagiu com HBr, sem peróxido, e formou como produto principal o 2-bromo-2-metilbutano. X pode ser","c":3,"o":[["pent-1-eno.","Daria 2-bromopentano: cadeia sem ramificação."],["pent-2-eno.","Daria mistura de 2-bromopentano e 3-bromopentano, sem ramificação."],["2-metilbutano.","É um alcano: não tem dupla para fazer adição."],["2-metilbut-1-eno.","Isso. CH₂=C(CH₃)–CH₂CH₃: o H entra no C1 (mais hidrogenado) e o Br no C2, que tem a metila."],["but-1-eno.","Tem só 4 carbonos; o produto tem 5."]]},
{"k":"q5","lv":2,"s":"Qual alceno forma, com HBr (sem peróxido), um único produto de posição, sem mistura?","c":2,"o":[["Pent-2-eno.","C2 e C3 têm um H cada: Markovnikov não desempata, e forma-se mistura de 2- e 3-bromopentano (questão da PUC-RJ no livro)."],["Hex-2-eno.","C2 e C3 têm um H cada: mistura de 2- e 3-bromo-hexano."],["Hex-3-eno.","Isso. A molécula é simétrica: o Br no C3 ou no C4 dá o mesmo composto, 3-bromo-hexano."],["Hept-3-eno.","C3 e C4 têm um H cada, e a molécula não é simétrica: mistura de 3- e 4-bromo-heptano."],["Oct-3-eno.","Não é simétrico: forma mistura de 3- e 4-bromo-octano."]]},
{"k":"q5","lv":2,"s":"1 mol de um hidrocarboneto X consome 2 mol de H₂ na hidrogenação total e forma 2-metilbutano. X pode ser","c":1,"o":[["2-metilbut-2-eno.","Tem só uma dupla: consome 1 mol de H₂."],["2-metilbuta-1,3-dieno (isopreno).","Isso. Duas duplas → 2 mol de H₂, e o esqueleto ramificado vira 2-metilbutano."],["Penta-1,3-dieno.","Consome 2 mol de H₂, mas forma pentano, sem ramificação."],["3-metilbut-1-eno.","Uma dupla só: 1 mol de H₂."],["Ciclopentano.","É saturado; não faz adição de H₂ como os insaturados."]]},
{"k":"q5","lv":2,"s":"Relacione as reações com o produto: ciclo-hexeno + Br₂, e 1,2-dimetilciclo-hexeno + H₂ (Pt). Os produtos são, respectivamente,","c":4,"o":[["cis-1,2-dibromociclo-hexano e trans-1,2-dimetilciclo-hexano.","Está invertido: o Br₂ entra em trans e o H₂ entra em cis."],["trans-1,2-dibromociclo-hexano e trans-1,2-dimetilciclo-hexano.","A hidrogenação catalítica é adição cis: os H entram do mesmo lado, e os metilas ficam do mesmo lado."],["cis-1,2-dibromociclo-hexano e cis-1,2-dimetilciclo-hexano.","A adição de Br₂ é trans, pelo íon bromônio."],["1,1-dibromociclo-hexano e metilciclo-hexano.","Os Br entram um em cada carbono da dupla. E o H₂ não arranca metila."],["trans-1,2-dibromociclo-hexano e cis-1,2-dimetilciclo-hexano.","Isso. Br₂: adição trans (íon bromônio). H₂/Pt: adição cis (superfície do catalisador). Junta os caps. 2 e 5."]]},
{"k":"q5","lv":2,"s":"A hidratação catalítica do but-1-ino (Hg²⁺/H₂SO₄) forma como produto final","c":0,"o":[["butanona.","Isso. A água entra seguindo Markovnikov (OH no C2), forma um enol, e o enol vira cetona por tautomerização. Só o etino dá aldeído."],["butanal.","Aldeído só sai da hidratação do etino."],["but-1-en-2-ol.","Esse é o enol, um intermediário instável. Ele se converte em butanona."],["butan-2-ol.","Álcool sai da hidratação de ALCENO. Do alcino sai enol → carbonila."],["ácido butanoico.","Hidratação não forma ácido carboxílico."]]},
{"k":"q5","lv":2,"s":"Analise. I. Propeno + HBr com peróxido forma 1-bromopropano. II. Propeno + HCl com peróxido forma 1-cloropropano. III. Propeno + HBr sem peróxido forma 2-bromopropano. IV. Sem peróxido, o H do haleto vai para o carbono mais hidrogenado da dupla. Estão corretas","c":3,"o":[["I e II.","II está errada: com HCl o peróxido não muda nada; forma 2-cloropropano."],["II e III.","II está errada pelo mesmo motivo."],["I e III.","Faltou a IV, que é exatamente a regra de Markovnikov."],["I, III e IV.","Isso. Só a II está errada."],["Todas.","A II está errada: Kharasch só vale para HBr."]]},
{"k":"q5","lv":2,"s":"O buta-1,3-dieno reage com 1 mol de HBr. O produto principal é","c":1,"o":[["3-bromobut-1-eno.","Esse é o produto da adição 1,2, que é minoritária."],["1-bromobut-2-eno.","Isso. Adição 1,4: H no C1, Br no C4, e a dupla migra para o meio (C2=C3). É a questão da UFBA no livro."],["2-bromobutano.","Para isso seria preciso adicionar também H₂."],["1,4-dibromobut-2-eno.","Esse sai com Br₂, não com HBr."],["1-bromobutano.","Sobra uma dupla: com 1 mol de HBr, só uma insaturação é consumida."]]},
{"k":"q5","lv":2,"s":"Pelo livro, as adições de HCN e de água (Hg²⁺) ao etino e a adição de Br₂ ao eteno são classificadas, respectivamente, como","c":2,"o":[["eletrofílica, eletrofílica e nucleofílica.","Está invertido: no etino, o primeiro ataque do reagente é nucleofílico."],["radicalar, radicalar e eletrofílica.","Radicalar é o caso do HBr com peróxido."],["nucleofílica, nucleofílica e eletrofílica.","Isso. O livro classifica HCN e hidratação de alcinos como adição nucleofílica, e halogênios em alcenos como eletrofílica."],["nucleofílica, eletrofílica e radicalar.","A hidratação do alcino é nucleofílica; o Br₂ no eteno é eletrofílico (íon bromônio)."],["todas eletrofílicas.","O livro diferencia: HCN e hidratação do alcino são nucleofílicas."]]},
{"k":"q5","lv":2,"s":"O 2-metilbut-2-eno reage com água em meio ácido (H₂SO₄). O produto principal é","c":3,"o":[["3-metilbutan-2-ol.","O OH foi para o carbono com mais H. Pela regra de Markovnikov, o H vai para ele, e o OH para o carbono com menos H (C2)."],["2-metilbutan-1-ol.","O C1 não fazia parte da dupla."],["3-metilbutan-1-ol.","O OH tem de entrar num carbono da dupla (C2 ou C3)."],["2-metilbutan-2-ol.","Isso. H no C3 (que tem 1 H), OH no C2 (que tem 0 H). É a questão do MACKENZIE no livro."],["2-metilbutanal.","Hidratação de alceno forma álcool, não aldeído."]]},
{"k":"q5","lv":2,"s":"Na reação propanona + H₂ (Pt), o Nox do carbono da carbonila","c":0,"o":[["passa de +2 para 0, e a reação é uma redução.","Isso. A propanona vira propan-2-ol. O Nox do carbono diminui: redução, e o H₂ é o agente redutor."],["passa de 0 para +2, e a reação é uma oxidação.","É o contrário: o carbono ganha H e o Nox diminui."],["passa de +1 para –1.","Esses são os valores do etanal → etanol."],["não muda, porque é só uma adição.","Adição de H₂ em carbonila é redução: o Nox muda."],["passa de +2 para +4.","O Nox diminui, não aumenta."]]},
{"k":"q5","lv":2,"s":"Dois isômeros de fórmula C₄H₈ consomem 1 mol de H₂ cada e formam o MESMO produto, o butano. Esses isômeros são","c":1,"o":[["but-2-eno e 2-metilpropeno.","O 2-metilpropeno forma metilpropano (ramificado), não butano."],["but-1-eno e but-2-eno.","Isso. Os dois têm cadeia normal de 4 carbonos; com H₂ formam butano."],["ciclobutano e but-1-eno.","O ciclobutano é saturado e não faz essa adição."],["but-1-ino e but-2-eno.","O but-1-ino é C₄H₆ e consumiria 2 mol de H₂."],["2-metilpropeno e metilciclopropano.","Nenhum dos dois forma butano (cadeia normal)."]]},
{"k":"q5","lv":2,"s":"Calores de hidrogenação: cis-but-2-eno, –119,7 kJ/mol; trans-but-2-eno, –115,6 kJ/mol. A diferença de energia entre os isômeros e o mais estável são","c":4,"o":[["4,1 kJ/mol; cis.","A diferença está certa, mas o mais estável é o de menor |ΔH|: o trans."],["235,3 kJ/mol; trans.","Somou os valores. A diferença é 119,7 – 115,6."],["4,1 kJ/mol; os dois são igualmente estáveis.","Se houvesse a mesma energia, os calores seriam iguais."],["115,6 kJ/mol; trans.","Esse é só o calor do trans, não a diferença."],["4,1 kJ/mol; trans.","Isso. 119,7 – 115,6 = 4,1. O trans libera menos calor porque já tinha menos energia: é mais estável."]]},
{"k":"bi","lv":2,"s":"Qual sequência mostra corretamente o caminho da água, do solo até a atmosfera?","c":2,"o":[["Pelo absorvente → córtex → endoderme → floema (raiz, caule, nervuras) → mesofilo → estômato.","Quase tudo certo, mas a água sobe pelo xilema. O floema leva a seiva elaborada."],["Pelo absorvente → endoderme → córtex → xilema (raiz, caule, nervuras) → mesofilo → estômato.","A ordem de córtex e endoderme está trocada: a endoderme é a última camada antes dos vasos."],["Pelo absorvente → córtex → endoderme → xilema (raiz, caule, nervuras) → mesofilo → estômato.","Isso. Ela atravessa o sistema de revestimento, o fundamental e o vascular, e sai como vapor pelo estômato."],["Coifa → córtex → endoderme → xilema (raiz, caule, nervuras) → mesofilo → hidatódio, como vapor.","A água entra pelos pelos absorventes, não pela coifa. E o vapor sai pelo estômato; o hidatódio é a saída da água líquida (gutação)."],["Pelo absorvente → córtex → endoderme → xilema (raiz, caule, nervuras) → mesofilo → cutícula.","A cutícula é cera: ela reduz a saída de água. A principal saída do vapor é o estômato."]]},
{"k":"bi","lv":2,"s":"Raiz, caule e folha têm os mesmos três sistemas de tecidos. Na chegada da água até a folha, qual é o papel de cada um?","c":0,"o":[["Revestimento absorve (epiderme com pelos), fundamental deixa passar (córtex) e vascular conduz (xilema).","Isso. Os três sistemas trabalham em sequência, como uma linha de montagem."],["Revestimento conduz (epiderme), fundamental absorve (pelos do córtex) e vascular armazena (xilema).","Papéis trocados: quem absorve é a epiderme com pelos, e quem conduz é o xilema."],["Só o sistema vascular participa: o xilema absorve a água direto do solo e a leva até a folha.","Antes de chegar ao xilema, a água entra pela epiderme (pelos) e atravessa o córtex."],["Revestimento absorve (epiderme com pelos), fundamental conduz (floema) e vascular filtra (endoderme).","Floema é vascular, não fundamental, e leva açúcar. E a endoderme não é tecido vascular."],["Revestimento impermeabiliza (cutícula), fundamental absorve (córtex) e vascular conduz (floema).","Na raiz não há cutícula barrando a água, e quem conduz a água é o xilema, não o floema."]]},
{"k":"bi","lv":2,"s":"Um ramo de salsão é colocado em água com corante. Horas depois, as nervuras das folhas ficam coloridas. Esse experimento mostra que","c":3,"o":[["o floema é contínuo do caule às nervuras, e a fotossíntese das folhas puxa a água para cima.","Quem forma o caminho da água é o xilema, e quem puxa é a transpiração."],["o xilema é contínuo do caule às nervuras, e a pressão de raiz empurra a água para cima.","O ramo foi cortado: não tem raiz. Quem puxou foi a transpiração das folhas."],["as folhas absorvem o corante pelos estômatos, e ele se acumula nas nervuras por difusão.","O corante estava na água da base do ramo, não em contato com as folhas."],["o xilema é contínuo do caule às nervuras, e a transpiração das folhas puxa a água para cima.","Isso. Caule e folha formam um único sistema de tubulação, e a transpiração é o motor."],["o corante se espalha igualmente por todas as células, e as nervuras só parecem mais escuras.","Ficaram coloridas as nervuras, que são os vasos: o corante seguiu o xilema."]]},
{"k":"bi","lv":2,"s":"As folhas de uma planta são cobertas com vaselina, que tapa os estômatos. O que acontece com a subida de água no xilema?","c":1,"o":[["Aumenta, porque sem perder vapor a folha guarda água e puxa mais seiva bruta.","A água presa não puxa nada. Sem perder água, a folha deixa de criar a tensão que puxa a coluna."],["Diminui muito, porque a transpiração, que é o motor da subida, quase para.","Isso. Coesão-tensão: sem transpiração, quase não há puxão. Ligação direta entre folha (cap. 11) e condução (cap. 10)."],["Não muda, porque a subida depende só da pressão de raiz, que continua igual.","A pressão de raiz é um empurrão fraco. O principal é o puxão da transpiração."],["Diminui pouco, porque o floema passa a levar a água que o xilema deixou de subir.","O floema não substitui o xilema. E a queda é grande, porque o motor (transpiração) quase parou."],["Não muda, porque a água continua saindo pela cutícula no mesmo ritmo de antes.","A perda pela cutícula é pequena; a via estomática é a maior. Tapando os estômatos, a transpiração cai muito."]]},
{"k":"bi","lv":2,"s":"Num dia quente e seco, a planta fecha os estômatos. Qual cadeia de consequências está correta?","c":4,"o":[["Menos perda de água e mais CO₂ retido na folha → mais fotossíntese → mais açúcar no floema.","O CO₂ entra pelos estômatos. Fechados, entra menos CO₂."],["Menos perda de água → mais subida de seiva bruta → folhas mais túrgidas → mais fotossíntese.","Com menos transpiração, a subida de água diminui, não aumenta."],["Mais perda de água pela cutícula → mais CO₂ → mais fotossíntese → mais açúcar no floema.","Fechar o estômato diminui a perda de água e a entrada de CO₂."],["Menos perda de água, e a fotossíntese não muda, porque o CO₂ entra pela raiz.","O CO₂ entra pelas folhas, pelos estômatos."],["Menos perda de água, mas menos CO₂ → menos fotossíntese → menos açúcar no floema.","Isso. Um ajuste na folha afeta a planta inteira: transpiração, condução e distribuição de açúcar."]]},
{"k":"bi","lv":2,"s":"Na seca, o ácido abscísico fecha os estômatos. Do ponto de vista da planta inteira, esse hormônio","c":2,"o":[["aumenta a absorção de água pela raiz, compensando a água que a folha perde pelos estômatos.","Ele age nas células-guarda das folhas, fechando os estômatos."],["acelera o crescimento, porque o estômato fechado retém CO₂ na folha e aumenta a fotossíntese.","Estômato fechado reduz a entrada de CO₂, e a fotossíntese cai."],["troca crescimento por sobrevivência: economiza água, mas reduz a entrada de CO₂ e a produção de açúcar.","Isso. O hormônio (cap. 12) conecta o estado da água (cap. 11) com a produção de alimento (fotossíntese)."],["amadurece frutos e sementes rapidamente, para a planta se reproduzir antes de secar.","Quem amadurece frutos é o etileno."],["abre os estômatos para resfriar a folha pela transpiração, protegendo os tecidos do calor.","O ácido abscísico fecha os estômatos, não abre."]]},
{"k":"bi","lv":2,"s":"Depois do anel de Malpighi, as folhas continuam verdes por semanas e a árvore só morre meses depois. Por quê?","c":0,"o":[["O xilema continua levando água às folhas, que seguem fazendo fotossíntese; mas o açúcar não chega à raiz, que morre aos poucos.","Isso. Os dois sistemas de transporte são independentes: um corte que tira só o floema demora a matar."],["O floema, mais interno, continua levando açúcar à raiz; só o xilema, retirado com a casca, deixou de levar água.","É o contrário: o floema fica na casca e sai com o anel; o xilema fica por dentro."],["As folhas continuam verdes porque guardam água; a árvore morre quando essa reserva acaba, sem relação com a raiz.","A água continua chegando pelo xilema. Quem morre primeiro é a raiz, sem açúcar."],["A raiz passa a fazer fotossíntese e se sustenta por meses, até que o tronco acima do corte apodrece.","A raiz fica no escuro e depende do açúcar que vem das folhas."],["O açúcar desce pelo xilema enquanto o floema se regenera; a árvore só morre se o floema não voltar a crescer.","O xilema leva água e sais, não açúcar."]]},
{"k":"bi","lv":2,"s":"Um produtor arranca muitas folhas de um pé de tomate carregado de frutos. Os frutos tendem a ficar menores porque","c":3,"o":[["as folhas protegiam os frutos do sol, e sem sombra eles perdem água e param de crescer.","O efeito principal não é a sombra: é a falta de alimento."],["sem folhas, a raiz deixa de absorver água, e os frutos murcham por falta de seiva bruta.","A raiz continua absorvendo; o problema principal é o açúcar."],["o etileno produzido pelas folhas deixa de chegar aos frutos, que param de amadurecer.","Não é o etileno que faz o fruto crescer de tamanho."],["a fonte de açúcar (folhas) diminuiu, e o floema leva menos açúcar ao dreno (frutos).","Isso. Fonte (folha) e dreno (fruto) estão ligados pelo floema: menos fonte, menos crescimento do dreno."],["o xilema passa a levar o açúcar dos frutos para as folhas novas que começam a brotar.","O xilema leva água e sais, não açúcar."]]},
{"k":"bi","lv":2,"s":"A planta tem um sistema radicular e um sistema caulinar. O que cada um entrega ao outro?","c":1,"o":[["A raiz manda açúcar pelo floema; as folhas mandam água e sais pelo xilema. O caule liga os dois.","Está invertido: água e sais vêm da raiz; açúcar vem das folhas."],["A raiz manda água e sais pelo xilema; as folhas mandam açúcar pelo floema. O caule liga os dois.","Isso. Um depende do outro: sem raiz a folha seca; sem folha a raiz passa fome."],["A raiz manda água e sais pelo floema; as folhas mandam açúcar pelo xilema. O caule liga os dois.","Os vasos estão trocados: água pelo xilema, açúcar pelo floema."],["Os dois são independentes: a raiz faz seu próprio açúcar e a folha absorve água da chuva.","A raiz não faz fotossíntese, e a folha não é o órgão de absorção."],["A raiz manda água pelo xilema; o caule produz o açúcar e o envia à raiz e às folhas.","O açúcar vem principalmente das folhas. O caule conduz."]]},
{"k":"bi","lv":2,"s":"No cacto, as folhas viraram espinhos. Como a planta continua fazendo fotossíntese e sobrevivendo à seca?","c":4,"o":[["Os espinhos fazem a fotossíntese, e o caule só guarda água para os períodos de seca.","Espinhos são folhas reduzidas, sem mesofilo suficiente para isso."],["A raiz faz a fotossíntese no subsolo úmido, e o caule só conduz a seiva para cima.","Raiz não recebe luz."],["O cacto não faz fotossíntese: vive da água e do açúcar guardados no caule.","Toda planta verde precisa fazer fotossíntese para produzir açúcar."],["Os espinhos abrem os estômatos o dia todo para captar mais CO₂ e água do ar.","Isso faria perder muita água na seca."],["O caule verde faz a fotossíntese e guarda água, e os espinhos reduzem a perda de água.","Isso. A adaptação é do conjunto: caule, folha e tecidos de reserva mudaram juntos."]]},
{"k":"bi","lv":2,"s":"Uma planta perto da janela se curva para a luz. Pensando na planta inteira, essa curvatura","c":2,"o":[["acontece porque a auxina se acumula no lado iluminado, que cresce mais e empurra a ponta.","A auxina vai para o lado da sombra, que cresce mais."],["acontece porque o etileno liberado pela luz amolece o lado escuro do caule.","Fototropismo é comandado pela auxina."],["coloca as folhas na luz, aumentando a fotossíntese e o açúcar que o floema distribui para a planta.","Isso. Um hormônio (cap. 12) muda o crescimento do caule (cap. 6) para beneficiar a folha (cap. 7)."],["serve para a raiz receber mais luz, porque raiz e caule crescem para o mesmo lado.","Quem se curva para a luz é o caule. A raiz tem gravitropismo positivo."],["aumenta a absorção de água pela raiz, porque o caule curvado puxa mais seiva bruta.","A curvatura é do caule e está ligada à luz, não à absorção."]]},
{"k":"bi","lv":2,"s":"Qual sequência descreve o ciclo da reprodução de uma angiosperma, da flor até a nova planta?","c":1,"o":[["Fecundação → polinização → ovário vira fruto e óvulo vira semente → dispersão → germinação.","A polinização (chegada do pólen) vem antes da fecundação."],["Polinização → fecundação → ovário vira fruto e óvulo vira semente → dispersão → germinação.","Isso. Liga a flor (cap. 8) ao fruto e à semente (cap. 9)."],["Polinização → fecundação → óvulo vira fruto e ovário vira semente → dispersão → germinação.","Trocado: o ovário vira fruto e o óvulo vira semente."],["Polinização → fecundação → ovário vira fruto e óvulo vira semente → germinação → dispersão.","A dispersão vem antes da germinação: a semente é levada e depois germina."],["Polinização → dispersão → fecundação → ovário vira fruto e óvulo vira semente → germinação.","A dispersão é do fruto e da semente já formados, depois da fecundação."]]},
{"k":"bi","lv":2,"s":"A banana comercial não tem semente. Como a bananeira é multiplicada?","c":0,"o":[["Por propagação vegetativa: o rizoma, um caule subterrâneo, tem gemas que originam novas plantas.","Isso. Junta partenocarpia (cap. 9) com gemas e tipos de caule (cap. 6)."],["Por sementes muito pequenas escondidas na polpa, que germinam quando o fruto cai no solo.","A banana comercial é partenocárpica: não forma sementes."],["Pela raiz: a raiz da bananeira tem gemas que brotam e originam novas plantas.","Gemas são marca do caule. O rizoma da bananeira é caule subterrâneo."],["Por polinização pelo vento, que forma novos frutos mesmo sem formar sementes.","Polinização não gera uma planta nova."],["Por folhas que caem, enraízam no solo úmido e formam novas plantas a partir das nervuras.","A bananeira é multiplicada pelo rizoma, não pelas folhas."]]},
{"k":"bi","lv":2,"s":"Uma semente de feijão foi enterrada fundo demais e a plântula morreu antes de sair do solo. A explicação mais provável é que","c":3,"o":[["faltou luz para a semente germinar, porque toda semente de feijão precisa de luz.","Ela germinou: a plântula chegou a crescer."],["a semente estava dormente, e por isso a plântula não conseguiu crescer até a superfície.","Se houve plântula, a dormência já tinha sido quebrada."],["a radícula não saiu, então a plântula não conseguiu absorver água para crescer.","Se a plântula cresceu, a radícula saiu."],["ela gastou as reservas dos cotilédones antes de chegar à luz e começar a fotossíntese.","Isso. A plântula vive da reserva da semente até ter folhas fazendo fotossíntese."],["o endosperma triploide é tóxico para o embrião quando a semente fica no escuro.","Ser triploide não torna o endosperma tóxico."]]},
{"k":"bi","lv":2,"s":"Qual associação entre estrutura e função está ERRADA?","c":4,"o":[["Pelos absorventes → aumentam a superfície de absorção.","Essa está certa."],["Mesofilo lacunoso → facilita a troca de gases.","Essa está certa."],["Colênquima → sustentação flexível.","Essa está certa."],["Súber → impermeabiliza e isola.","Essa está certa."],["Elementos de vaso → conduzem seiva elaborada.","Isso, essa é a errada. Elementos de vaso são do xilema e conduzem seiva bruta; a elaborada vai pelo floema (tubo crivado)."]]},
{"k":"bi","lv":2,"s":"De madrugada, com solo úmido e ar saturado, aparecem gotas na borda das folhas. Comparando com o meio-dia ensolarado, é correto dizer que","c":2,"o":[["nos dois horários a transpiração puxa a água; de madrugada ela só fica mais visível.","De madrugada, com ar saturado, a transpiração quase para."],["de madrugada a planta transpira mais que ao meio-dia, e o vapor sai como gotas pela borda.","Com ar saturado e sem sol, transpira menos. E as gotas são água líquida."],["de madrugada a pressão de raiz empurra a água (gutação); ao meio-dia, a transpiração puxa a água.","Isso. São dois mecanismos que se alternam conforme o ambiente."],["as gotas são vapor da transpiração que condensou na folha fria, como o orvalho.","Gutação é água líquida saindo pelos hidatódios, empurrada pela raiz."],["ao meio-dia a pressão de raiz empurra a água; de madrugada a transpiração puxa a água.","Está invertido."]]},
{"k":"bi","lv":2,"s":"Se o xilema for bloqueado no caule, as folhas murcham mesmo que a raiz esteja absorvendo água normalmente.","v":true,"e":"A água absorvida não tem como chegar às folhas. Raiz, caule e folha só funcionam ligados pelo xilema."},
{"k":"bi","lv":2,"s":"A fotossíntese da folha não depende da raiz.","v":false,"e":"Depende: a água usada na fotossíntese e que mantém as células-guarda túrgidas (estômato aberto) vem da raiz, pelo xilema."},
{"k":"bi","lv":2,"s":"Raiz, caule e folha têm os mesmos três sistemas de tecidos: revestimento, fundamental e vascular.","v":true,"e":"O que muda de um órgão para outro é como cada sistema é organizado e o que ele faz ali."},
{"k":"bi","lv":2,"s":"O floema só transporta açúcar de cima para baixo.","v":false,"e":"O floema vai da fonte ao dreno. Se o dreno for um fruto ou um broto no alto, o açúcar sobe."},
{"k":"qn","lv":2,"s":"O nome correto de CH₃–CH(CH₃)–CH₂–CH(CH₃)–CH₂–CH₃ é","c":3,"o":[["3,5-dimetilexano.","Numerou pela ponta errada. A soma dos localizadores precisa ser a menor: 2 e 4, não 3 e 5."],["4-etil-2-metilpentano.","A cadeia principal não é a mais longa. Seguindo pelo etil, ela tem 6 carbonos, não 5."],["2-metil-4-metilexano.","Grupos iguais são agrupados com di: 2,4-dimetil."],["2,4-dimetilexano.","Isso. Cadeia mais longa: 6 carbonos. Numerando pela ponta mais perto das ramificações: metis no 2 e no 4."],["1,3-dimetilpentano.","Metil no carbono 1 aumenta a cadeia. Ramificação nunca fica na ponta."]]},
{"k":"qn","lv":2,"s":"O nome correto de CH₃–CH(CH₃)–CH(CH₂CH₃)–CH₂–CH₃ é","c":0,"o":[["3-etil-2-metilpentano.","Isso. Cadeia de 5 carbonos, numerada pela ponta mais perto das ramificações (2 e 3), e os grupos em ordem alfabética: etil antes de metil."],["2-metil-3-etilpentano.","Os números estão certos, mas os grupos têm de vir em ordem alfabética: etil (e) antes de metil (m)."],["3-etil-4-metilpentano.","Numerou pela ponta errada: 2 e 3 é menor que 3 e 4."],["2-isopropilbutano.","A cadeia principal não é a mais longa."],["3-metil-2-etilpentano.","Ordem alfabética e numeração erradas."]]},
{"k":"qn","lv":2,"s":"O nome correto de CH₃–CH(CH₃)–CH=CH–CH₃ é","c":2,"o":[["2-metilpent-3-eno.","Numerou para favorecer a ramificação. A dupla tem prioridade sobre a ramificação na numeração."],["2-metilpent-2-eno.","A dupla está entre os carbonos 2 e 3 contando pela direita, e o metil fica no 4."],["4-metilpent-2-eno.","Isso. A dupla recebe o menor número (2); o metil fica, então, no 4."],["4-metilpent-3-eno.","A dupla começa no carbono 2, não no 3."],["isopropilpropeno.","A cadeia principal tem de ser a maior que contém a dupla: 5 carbonos."]]},
{"k":"qn","lv":2,"s":"O nome correto de CH₃–CH(OH)–CH₂–CH(CH₃)–CH₃ é","c":1,"o":[["2-metilpentan-4-ol.","O grupo funcional (OH) tem prioridade na numeração e recebe o menor número."],["4-metilpentan-2-ol.","Isso. Numerando pela ponta mais perto do OH: OH no 2, metil no 4."],["4-metilpentan-1-ol.","O OH está no carbono 2, não na ponta."],["2-metilpentan-2-ol.","O OH e o metil estão em carbonos diferentes."],["isobutiletanol.","A cadeia principal é a maior que contém o carbono do OH: 5 carbonos."]]},
{"k":"qn","lv":2,"s":"O nome de CH₃–CCl=CH–CO–CH₃ (um exemplo do livro) é","c":4,"o":[["2-cloropent-2-en-4-ona.","A função (cetona) tem prioridade na numeração: a C=O deve ter o menor número possível."],["4-cloropent-2-en-3-ona.","O C=O está no carbono 2 quando se numera pela ponta mais perto dele."],["2-cloropent-3-en-4-ona.","Numerou pela ponta errada."],["4-cloropent-3-enal.","Não é aldeído: o C=O está no meio da cadeia, então é cetona."],["4-cloropent-3-en-2-ona.","Isso. Cetona no 2 (menor número para a função), dupla no 3 e cloro no 4. Com prioridades, ele pode ser (Z) ou (E)."]]},
{"k":"qn","lv":2,"s":"O nome de CH₃CH₂–CH=C(CH₃)–COOH (exemplo do livro) é","c":0,"o":[["ácido 2-metilpent-2-enoico.","Isso. O carbono do COOH é sempre o 1. Dupla no 2, metil no 2."],["ácido 4-metilpent-3-enoico.","Numerou pela ponta errada. No ácido, o C1 é o do COOH."],["2-metilpent-2-enal.","\"-al\" é aldeído. Aqui é ácido carboxílico."],["ácido 2-metilpentanoico.","Faltou a dupla: tem de aparecer o infixo \"en\"."],["ácido 2-metil-hex-2-enoico.","A cadeia tem 5 carbonos contando o do COOH, não 6."]]},
{"k":"qn","lv":2,"s":"O nome de CH≡C–CH(CH₃)–CH₃ é","c":3,"o":[["2-metilbut-3-ino.","A tripla tem prioridade na numeração sobre a ramificação."],["3-metilbut-2-ino.","A tripla está entre C1 e C2."],["isopropiletino.","A cadeia principal é a maior que contém a tripla: 4 carbonos."],["3-metilbut-1-ino.","Isso. Tripla no 1, metil no 3."],["2-metilbutino.","Falta indicar a posição da tripla, e o metil está no 3."]]},
{"k":"qn","lv":2,"s":"O nome oficial do isopreno, CH₂=C(CH₃)–CH=CH₂, é","c":1,"o":[["3-metilbuta-1,3-dieno.","Numerando pela outra ponta, o metil fica no 2. Em empate das duplas (1 e 3), desempata a ramificação."],["2-metilbuta-1,3-dieno.","Isso. Duas duplas (dieno) nos carbonos 1 e 3, metil no 2. O \"a\" em \"buta\" é colocado antes de consoante para facilitar a pronúncia."],["2-metilbut-1,3-dieno.","Quase: com \"dieno\", acrescenta-se o \"a\": buta-1,3-dieno."],["2-metilbutadieno-1,3.","Pela regra atual, os números vêm antes do infixo."],["isopentadieno.","Não é um nome oficial."]]},
{"k":"qn","lv":2,"s":"O composto CH₃–CH(CH₃)–CHO chama-se","c":2,"o":[["butanal.","Butanal é a cadeia reta CH₃CH₂CH₂CHO."],["2-metilpropan-1-al.","No aldeído o –CHO é sempre o carbono 1, por isso o número da função não é escrito."],["2-metilpropanal.","Isso. 3 carbonos na cadeia principal (contando o CHO), metil no 2."],["2-metilpropanona.","\"-ona\" é cetona. O C=O aqui está na ponta: aldeído."],["isobutanol.","\"-ol\" é álcool."]]},
{"k":"qn","lv":2,"s":"O grupo sec-butil é","c":1,"o":[["–CH₂–CH₂–CH₂–CH₃","Esse é o butil."],["–CH(CH₃)–CH₂–CH₃","Isso. Ligado pelo carbono secundário (ligado a dois outros carbonos)."],["–CH₂–CH(CH₃)₂","Esse é o isobutil."],["–C(CH₃)₃","Esse é o terc-butil."],["–CH(CH₃)₂","Esse é o isopropil (3 carbonos)."]]},
{"k":"qn","lv":2,"s":"No 1,3-diclorobenzeno, a posição relativa dos dois cloros é chamada de","c":3,"o":[["orto.","Orto é 1,2 (carbonos vizinhos)."],["para.","Para é 1,4 (carbonos opostos)."],["alfa.","Alfa não é usado para posições no benzeno."],["meta.","Isso. 1,2 = orto; 1,3 = meta; 1,4 = para."],["cis.","Cis/trans é para dupla ou anel saturado, não para posições no benzeno."]]},
{"k":"qn","lv":2,"s":"O composto CH₃–COO–CH₂–CH₃ (éster) chama-se","c":0,"o":[["etanoato de etila.","Isso. A parte que vem do ácido (CH₃–COO, 2 carbonos) vira \"etanoato\"; a parte ligada ao O (CH₂CH₃) vira \"de etila\"."],["etanoato de metila.","A parte ligada ao O é etila (2 carbonos), não metila."],["propanoato de metila.","Seria CH₃CH₂–COO–CH₃."],["butanoato.","Falta separar as duas partes do éster."],["ácido etanoico.","Ácido etanoico é CH₃–COOH, sem a etila."]]},
{"k":"qn","lv":2,"s":"O composto CH₃–CO–CH₂–CH₂–OH tem as funções cetona e álcool. Pela IUPAC, seu nome é","c":4,"o":[["butan-1-ol-3-ona.","Só uma função entra como sufixo, a de maior prioridade. A outra vira prefixo."],["4-oxobutan-1-ol.","A cetona tem prioridade sobre o álcool, então ela é o sufixo."],["1-hidroxibutan-3-ona.","Numerou pela ponta errada: a função principal (cetona) deve ter o menor número."],["butanodiona.","Só há um C=O. O outro oxigênio é de um OH."],["4-hidroxibutan-2-ona.","Isso. Cetona > álcool: \"-ona\" no sufixo (menor número, 2) e OH como prefixo \"hidroxi\" (4)."]]},
{"k":"qn","lv":2,"s":"No 1-metilciclo-hexeno (exemplo do livro), a numeração do anel","c":2,"o":[["começa no carbono com metil e evita a dupla.","No ciclo com dupla, a dupla tem de ficar entre os carbonos 1 e 2."],["começa em qualquer carbono, porque é um anel.","Há regra: a dupla fica entre C1 e C2, e as ramificações recebem os menores números."],["põe a dupla entre C1 e C2 e dá o número 1 ao carbono da dupla que tem o metil.","Isso. Assim o metil fica com o menor número possível (1)."],["põe a dupla entre C2 e C3.","A dupla do ciclo sempre recebe os números 1 e 2."],["não precisa numerar, porque só tem um metil.","Precisa, porque o metil poderia estar num carbono da dupla ou fora dela."]]},
