{k:"p2",lv:2,s:"Em Gonçalves Dias, “Minha terra tem palmeiras, / <i>Onde canta o Sabiá</i>”, a palavra “onde”:",c:0,o:[["é pronome relativo com função de adjunto adverbial de lugar.","Isso. “Onde” retoma um antecedente que indica lugar (equivale a “em que, nas quais”) e, na sua oração, indica o lugar em que o Sabiá canta: adjunto adverbial de lugar. A oração que introduz é adjetiva."],["é advérbio interrogativo e introduz uma oração subordinada substantiva objetiva direta.","Não há pergunta (direta ou indireta) nem verbo que peça complemento; “onde” tem antecedente, logo é relativo."],["é conjunção subordinativa e introduz oração adverbial de lugar.","A gramática normativa não reconhece “onde” como conjunção nem a “adverbial locativa” entre as adverbiais; com antecedente, “onde” é pronome relativo."],["é pronome relativo com função de sujeito de “canta”.","O sujeito de “canta” é “o Sabiá” (posposto). “Onde” indica o lugar da ação."],["é pronome relativo com função de objeto indireto de “canta”.","“Cantar”, aqui, é intransitivo; “onde” não é complemento verbal, mas circunstância de lugar."]]},
{k:"p2",lv:2,s:"Na dedicatória de <i>Memórias póstumas de Brás Cubas</i>, “Ao verme <i>que primeiro roeu as frias carnes do meu cadáver</i> dedico como saudosa lembrança estas memórias póstumas”, o “que” é pronome relativo com função de sujeito, e a oração destacada é adjetiva restritiva.",v:true,e:"Verdadeiro. O “que” retoma “verme” (“o verme primeiro roeu as frias carnes”), sendo sujeito de “roeu”. Sem vírgulas, a oração delimita qual verme recebe a dedicatória (o primeiro a roer): adjetiva restritiva."},
{k:"p2",lv:2,s:"Em “Tenho certeza <i>de que ele virá</i>”, a oração destacada é substantiva objetiva indireta, porque é introduzida por preposição.",v:false,e:"Falso. A preposição “de” é exigida pelo substantivo “certeza” (certeza de algo), e não por um verbo. A oração completa um nome: subordinada substantiva completiva nominal. Preposição, sozinha, não define objetiva indireta."},
/* ===== p3 ===== */
{k:"p3",lv:2,s:"Em qual alternativa o “como” introduz oração subordinada adverbial <b>conformativa</b>?",c:1,o:[["“<i>Como</i> chovia, ficamos em casa.”","“Como” anteposto à principal, equivalente a “porque/já que”: causal."],["“Fiz o bolo <i>como</i> a receita mandava.”","Isso. “Como” = “conforme, segundo”: fiz o bolo conforme a receita mandava. Oração adverbial conformativa."],["“Ele é forte <i>como</i> um touro.”","Compara “ele” a “um touro” (com verbo elíptico: “como um touro é”): comparativa."],["“A Via Láctea, <i>como</i> um pálio aberto, / Cintila” (Olavo Bilac).","Aproxima a Via Láctea de um pálio aberto: comparativa (com verbo elíptico), não conformativa."],["“Não sei <i>como</i> ele chegou.”","“Como” é advérbio interrogativo (interrogação indireta) e a oração é objeto direto de “sei”: substantiva objetiva direta."]]},
{k:"p3",lv:2,s:"Considere o período: “<i>Por mais que se esforçasse</i>, não conseguia esquecê-la.” A oração destacada é subordinada adverbial:",c:2,o:[["causal.","O esforço não é a causa de não esquecer; ao contrário, é um obstáculo que não impediu o fato principal."],["condicional.","Não há hipótese de que dependa a realização do fato principal; o esforço é dado como real."],["concessiva.","Isso. “Por mais que” (= embora se esforçasse muito) apresenta um fato contrário à principal que, no entanto, não impede que ela se realize: concessiva."],["proporcional.","Proporcional exige variação paralela (“à medida que”, “quanto mais… mais”); “por mais que” não estabelece proporção."],["consecutiva.","A consecutiva vem depois do fato que a gera e exprime efeito (“tão… que”); aqui não há consequência."]]},
{k:"p3",lv:2,s:"Em Olavo Bilac, “Amai <i>para entendê-las</i>!”, a oração destacada é:",c:3,o:[["adverbial causal reduzida de gerúndio.","A forma verbal é infinitivo (“entender”), não gerúndio; e a oração indica objetivo, não causa."],["adverbial consecutiva reduzida de infinitivo.","Entender as estrelas é o objetivo pretendido ao amar, não um efeito decorrente de intensidade."],["substantiva objetiva indireta reduzida de infinitivo.","“Amar” não exige complemento preposicionado aqui; “para” indica finalidade."],["adverbial final reduzida de infinitivo.","Isso. Desenvolva a reduzida: “Amai para que as entendais” → a conjunção “para que” exprime finalidade. Oração subordinada adverbial final, reduzida de infinitivo."],["adverbial condicional reduzida de infinitivo.","Não há hipótese (“se as entenderdes”); “para” marca propósito."]]},
{k:"p3",lv:2,s:"Em Machado de Assis, <i>Dom Casmurro</i>: “Uma noite destas, <i>vindo da cidade para o Engenho Novo</i>, encontrei no trem da Central um rapaz aqui do bairro”. Desenvolvida, a oração reduzida destacada classifica-se como adverbial:",c:4,o:[["causal (“porque vinha da cidade”).","Vir da cidade não é motivo do encontro; a oração situa no tempo quando o fato ocorreu."],["concessiva (“embora viesse da cidade”).","Não há oposição entre vir da cidade e encontrar o rapaz."],["condicional (“se viesse da cidade”).","O fato é narrado como real e já ocorrido, não como hipótese."],["final (“para vir da cidade”).","Vir da cidade não é finalidade do encontro; gerúndio não exprime finalidade."],["temporal (“quando vinha da cidade”).","Isso. Reduzida de gerúndio que, desenvolvida, fica “quando (enquanto) vinha da cidade para o Engenho Novo”: marca o momento do encontro → adverbial temporal."]]},
{k:"p3",lv:2,s:"Compare:<br>I. <i>Desde que se mudou</i>, não telefona mais.<br>II. Sairemos, <i>desde que pare de chover</i>.<br>As orações destacadas são, respectivamente:",c:0,o:[["temporal e condicional.","Isso. Em I, “desde que” + indicativo marca o ponto de partida no tempo (= a partir do momento em que). Em II, “desde que” + subjuntivo equivale a “contanto que”, “se”: condicional."],["condicional e temporal.","Inverteu: em I o fato é real e marca início no tempo; em II é exigência/hipótese."],["causal e condicional.","Em I não se apresenta motivo, mas marco temporal; “desde que” com valor causal não é o caso aqui."],["temporal e concessiva.","Em II não há fato contrário que não impede o principal; há condição para sair."],["ambas condicionais.","Em I, o verbo no indicativo e o fato consumado indicam valor temporal, não hipótese."]]},
{k:"p3",lv:2,s:"Considere o período: “Falou <i>tão</i> alto <i>que todos se assustaram</i>.” A oração introduzida por “que” é subordinada adverbial:",c:1,o:[["comparativa.","Não há comparação de termos (“mais… do que”, “tão… quanto”). O “que” após “tão” indica efeito."],["consecutiva.","Isso. O intensificador “tão” na principal + “que” introduz o efeito da intensidade: o susto é consequência de ter falado alto. Correlação típica da consecutiva."],["causal.","A causa está na principal (falar alto); a oração com “que” traz o resultado."],["final.","Ninguém falou alto com o objetivo de assustar; a oração indica resultado, não intenção."],["conformativa.","Não há ideia de conformidade (“conforme, segundo”)."]]},
{k:"p3",lv:2,s:"Em qual alternativa a oração destacada é subordinada adverbial <b>proporcional</b>?",c:2,o:[["“Conversamos toda a noite, <i>enquanto a Via Láctea cintilava</i>.”","“Enquanto” marca simultaneidade no tempo: temporal."],["“<i>Mal chegou</i>, começou a chover.”","“Mal” = “logo que, assim que”: temporal."],["“<i>Quanto mais lia</i>, mais entendia o poema.”","Isso. A correlação “quanto mais… mais” estabelece variação simultânea e paralela entre os fatos: oração adverbial proporcional."],["“<i>Conforme combinamos</i>, saímos cedo.”","“Conforme” = “de acordo com o que”: conformativa."],["“<i>Ainda que chova</i>, iremos.”","Fato contrário que não impede o principal: concessiva."]]},
{k:"p3",lv:2,s:"Em “<i>Terminada a aula</i>, os alunos saíram”, a oração reduzida de particípio, desenvolvida, classifica-se como subordinada adverbial:",c:3,o:[["causal (“porque terminou a aula”).","O término da aula situa o momento da saída; o desenvolvimento mais natural é temporal, não causal."],["concessiva (“embora a aula tivesse terminado”).","Não há oposição entre terminar a aula e sair; ao contrário, um fato sucede o outro naturalmente."],["condicional (“se a aula terminasse”).","O fato é real e anterior, não hipotético."],["temporal (“depois que a aula terminou”).","Isso. Particípio indica ação concluída: desenvolvido, “depois que (quando) a aula terminou” → anterioridade em relação a “saíram”: adverbial temporal reduzida de particípio."],["adjetiva restritiva (“a aula que terminou”).","O particípio aqui não caracteriza um nome dentro de um sintagma; forma oração absoluta com sujeito próprio (“a aula”), de valor adverbial."]]},
{k:"p3",lv:2,s:"Em Álvares de Azevedo, “Se eu morresse amanhã, viria ao menos / Fechar meus olhos minha triste irmã”, o “se” é conjunção integrante e introduz oração substantiva objetiva direta.",v:false,e:"Falso. O “se” introduz uma hipótese da qual depende o fato principal (a vinda da irmã): é conjunção subordinativa condicional. Note a correlação: imperfeito do subjuntivo (“morresse”) → futuro do pretérito (“viria”). Integrante seria o “se” que completa verbo, como em “Não sei se ele virá”."},
{k:"p3",lv:2,s:"Em Castro Alves, “Dizei-me vós, Senhor Deus! / Se é loucura... se é verdade / Tanto horror perante os céus?!”, o “se” é conjunção integrante, pois as orações que introduz completam o sentido do verbo “dizei”.",v:true,e:"Verdadeiro. “Dizei-me <b>isso</b>”: as orações com “se” funcionam como objeto direto de “dizei” (interrogação indireta). O “se” não exprime condição; é conjunção integrante, e as orações são substantivas objetivas diretas."},
/* ===== p4 ===== */
{k:"p4",lv:2,s:"Considere o período misto: “<i>Quando a noite caiu</i>, os pescadores voltaram <i>e acenderam a fogueira</i> <i>que os aqueceria</i>.” A classificação correta das orações, na ordem em que aparecem, é:",c:4,o:[["coordenada assindética; principal; coordenada aditiva; subordinada substantiva objetiva direta.","“Quando a noite caiu” depende da principal e indica tempo: é subordinada adverbial, não coordenada. E “que os aqueceria” tem “que” relativo (retoma “fogueira”): adjetiva."],["subordinada adverbial causal; principal; coordenada adversativa; adjetiva explicativa.","“Quando” marca tempo, não causa; o “e” é aditivo (soma ações); e a adjetiva, sem vírgula, é restritiva."],["principal; subordinada adverbial temporal; coordenada aditiva; adjetiva restritiva.","A principal é “os pescadores voltaram”; “Quando a noite caiu” é a subordinada temporal anteposta."],["subordinada adverbial temporal; principal; subordinada adverbial consecutiva; adjetiva restritiva.","“E acenderam a fogueira” é ligada por conjunção coordenativa e não depende sintaticamente: coordenada sindética aditiva, não consecutiva."],["subordinada adverbial temporal; principal; coordenada sindética aditiva; subordinada adjetiva restritiva.","Isso. “Quando” → temporal anteposta; “os pescadores voltaram” → principal; “e acenderam a fogueira” → coordenada sindética aditiva (e principal em relação à adjetiva); “que os aqueceria” → “que” = a qual, sem vírgula → adjetiva restritiva. Período misto."]]},
{k:"p4",lv:2,s:"No período “<i>Embora fosse tarde</i>, ainda trabalhava”, a substituição de “embora” que mantém o sentido e a correção gramatical é:",c:0,o:[["“Conquanto fosse tarde, ainda trabalhava.”","Isso. “Conquanto” é conjunção concessiva, sinônima de “embora”, e também exige subjuntivo (“fosse”). Relação concessiva e correção preservadas."],["“Porquanto fosse tarde, ainda trabalhava.”","“Porquanto” é causal (= porque, visto que) e pede indicativo; altera a relação lógica."],["“Contanto que fosse tarde, ainda trabalhava.”","“Contanto que” é condicional; a frase passaria a exprimir condição, não concessão."],["“Ainda que era tarde, ainda trabalhava.”","“Ainda que” é concessiva, mas exige subjuntivo: “ainda que fosse tarde”. O indicativo “era” fere a norma."],["“Visto que fosse tarde, ainda trabalhava.”","“Visto que” é causal: o atraso viraria a razão do trabalho, mudando o sentido."]]},
{k:"p4",lv:2,s:"Em “O jogo foi adiado <i>porque o campo estava alagado</i>”, qual reescrita mantém a relação lógica original?",c:1,o:[["“O jogo foi adiado, conquanto o campo estivesse alagado.”","“Conquanto” é concessivo: o alagamento passaria a ser obstáculo que não impediu o adiamento — sentido absurdo e diferente."],["“O jogo foi adiado, visto que o campo estava alagado.”","Isso. “Visto que” é conjunção causal equivalente a “porque”; o alagamento continua sendo a causa do adiamento."],["“O jogo foi adiado, de modo que o campo estava alagado.”","“De modo que” é consecutivo: inverte a relação, fazendo do alagamento consequência do adiamento."],["“O jogo foi adiado, contanto que o campo estivesse alagado.”","“Contanto que” é condicional; transformaria um fato em exigência."],["“O jogo foi adiado, à proporção que o campo estava alagado.”","“À proporção que” é proporcional; não expressa causa."]]},
{k:"p4",lv:2,s:"Assinale a alternativa que completa corretamente, segundo a correlação de tempos e modos da norma-padrão: “Se ele ______ mais cedo, ______ o início do filme.”",c:2,o:[["chegar / teria visto","Futuro do subjuntivo (“chegar”) se correlaciona com futuro do presente (“verá”), não com futuro do pretérito composto."],["chegasse / verá","Imperfeito do subjuntivo pede futuro do pretérito (“veria”), não futuro do presente."],["chegasse / veria","Isso. Na condicional hipotética, a norma correlaciona “se + pretérito imperfeito do subjuntivo” (“chegasse”) com futuro do pretérito do indicativo (“veria”) na principal."],["chegou / veria","“Se chegou” (indicativo) apresenta fato possível/real e não combina com o hipotético “veria”."],["tivesse chegado / verá","Mais-que-perfeito do subjuntivo correlaciona-se com futuro do pretérito composto (“teria visto”), não com “verá”."]]},
{k:"p4",lv:2,s:"Compare:<br>I. A chuva caiu, o rio subiu, a ponte ruiu.<br>II. Como a chuva caiu, o rio subiu tanto que a ponte ruiu.<br>Sobre o efeito de sentido das duas construções, é correto afirmar:",c:3,o:[["Em I, as orações são subordinadas, o que explicita a relação de causa entre os fatos.","Em I não há conectivos: as orações são coordenadas assindéticas; a causalidade fica apenas sugerida."],["Em II, a coordenação cria ritmo acelerado e deixa ao leitor a tarefa de inferir as relações.","II é construída com subordinação (“como” causal, “tanto… que” consecutivo); quem explicita as relações é o conectivo, não o leitor."],["As duas construções são equivalentes, pois ambas são períodos compostos por coordenação.","II é período composto por subordinação; e a diferença sintática produz efeitos de sentido distintos."],["Em I, a coordenação acelera o ritmo e deixa as relações implícitas; em II, a subordinação as hierarquiza.","Isso. A coordenação assindética apenas justapõe fatos (acúmulo, ritmo narrativo acelerado, relações inferidas). A subordinação hierarquiza: “como” marca causa e “tanto… que” marca consequência, tornando o encadeamento argumentativo explícito."],["Em II, “que a ponte ruiu” é oração comparativa, pois vem após “tanto”.","“Tanto… que” forma correlação consecutiva (efeito da intensidade); comparativa seria “tanto… quanto/como”."]]},
{k:"p4",lv:2,s:"Assinale o período pontuado de acordo com a norma-padrão.",c:4,o:[["“Os candidatos que chegaram atrasados, não puderam entrar.”","A adjetiva restritiva integra o sujeito (“os candidatos que chegaram atrasados”); a vírgula separa sujeito e verbo, o que é vedado."],["“Embora o dia estivesse nublado a praia, que costuma ficar deserta nessa época recebeu, muitos visitantes.”","Falta a vírgula após a adverbial anteposta (“nublado,”), a adjetiva explicativa não está fechada por vírgula antes de “recebeu”, e há vírgula indevida entre o verbo “recebeu” e seu objeto direto."],["“Ele disse, que não voltaria.”","Não se separa o verbo de sua oração objetiva direta; a oração é complemento de “disse”."],["“É preciso, que todos colaborem.”","A oração “que todos colaborem” é sujeito (subjetiva) de “é preciso”; não se separa por vírgula o predicado do sujeito oracional."],["“Embora o dia estivesse nublado, a praia, que costuma ficar deserta nessa época, recebeu muitos visitantes.”","Isso. A vírgula marca a adverbial concessiva anteposta à principal, e o par de vírgulas isola a adjetiva explicativa intercalada; sujeito e verbo não são separados."]]},
{k:"p4",lv:2,s:"Em <i>Dom Casmurro</i>, Machado de Assis escreve: “O meu fim evidente era <i>atar as duas pontas da vida</i>, <i>e restaurar na velhice a adolescência</i>.” A análise correta do período é:",c:0,o:[["Principal e duas substantivas predicativas reduzidas de infinitivo, coordenadas entre si.","Isso. Após o verbo de ligação “era”, as orações de infinitivo atribuem conteúdo ao sujeito “o meu fim” (“O meu fim era <b>isso</b>”) → predicativas reduzidas. Ligadas por “e”, são coordenadas entre si: período misto."],["Oração principal e duas subordinadas adverbiais finais reduzidas de infinitivo.","Não há “para” nem ideia de finalidade em relação à principal; as orações completam o verbo de ligação como predicativo."],["Três orações coordenadas entre si, sem nenhuma subordinação, já que todas se ligam por vírgula ou pelo “e”.","“Atar…” não é independente: funciona como predicativo do sujeito de “era”, logo é subordinada."],["Oração principal e duas subordinadas substantivas objetivas diretas.","“Ser” é verbo de ligação, não transitivo direto; não admite objeto."],["Oração principal e duas subordinadas adjetivas restritivas reduzidas de infinitivo.","As orações não qualificam um substantivo; são predicativo do sujeito."]]},
{k:"p4",lv:2,s:"Considere: “Estudou bastante, <i>mas</i> não foi aprovado.” Qual reescrita mantém a relação lógica do período original?",c:1,o:[["“Estudou bastante durante todo o ano; portanto, não foi aprovado.”","“Portanto” faz da reprovação uma conclusão do estudo, invertendo o contraste original."],["“Embora tenha estudado bastante, não foi aprovado.”","Isso. A oposição expressa pela coordenada adversativa (“mas”) é mantida pela subordinada concessiva (“embora” + subjuntivo); muda-se a estrutura (coordenação → subordinação), não a relação de contraste."],["“Como estudou bastante, não foi aprovado.”","“Como” anteposto é causal: o estudo viraria causa da reprovação."],["“Estudou bastante, pois não foi aprovado.”","“Pois” anteposto é explicativo: a reprovação passaria a justificar o estudo."],["“Se estudou bastante, não foi aprovado.”","“Se” introduz condição, não contraste."]]},
{k:"p4",lv:2,s:"Em Gonçalves Dias, no período “As aves, que aqui gorjeiam, / Não gorjeiam como lá”, há uma oração subordinada adjetiva explicativa intercalada e uma oração subordinada adverbial comparativa com verbo elíptico (“como [gorjeiam] lá”).",v:true,e:"Verdadeiro. “Que aqui gorjeiam” tem “que” relativo (= as quais), entre vírgulas → adjetiva explicativa intercalada na principal (“As aves não gorjeiam”). “Como lá” compara os dois lugares com o verbo subentendido (“como gorjeiam lá”) → adverbial comparativa, cujo verbo costuma ficar elíptico."},
{k:"p4",lv:2,s:"Reescrever “Se estudasse, passaria” como “Caso estude, passaria” mantém a correlação verbal exigida pela norma-padrão, pois “caso” e “se” são conjunções condicionais equivalentes.",v:false,e:"Falso. Trocar a conjunção não autoriza misturar tempos: “caso + presente do subjuntivo” (“estude”) correlaciona-se com futuro do presente (“passará”). Para manter “passaria”, seria preciso “Caso estudasse, passaria”."},
/* ===== HISTÓRIA · CRISE DE 1929 E NEW DEAL ===== */
{k:"h1",lv:2,s:"Sobre as causas da crise de 1929, considere:<br>I. O crescimento da produção industrial e agrícola norte-americana não foi acompanhado por aumento proporcional do poder de compra da população.<br>II. A recuperação das economias europeias reduziu as importações de produtos dos EUA.<br>III. A forte regulação estatal sobre a Bolsa de Valores impediu a especulação e provocou a quebra.<br>Está correto o que se afirma em",c:1,o:[
 ["I, apenas.","A II também está correta: a Europa voltou a produzir e comprou menos dos EUA."],
 ["I e II, apenas.","Isso. A III é falsa: o problema foi a <b>falta</b> de regulação (laissez-faire), que permitiu a especulação."],
 ["II e III, apenas.","A III inverte a realidade: não havia regulação; havia especulação desenfreada."],
 ["III, apenas.","A III é falsa; I e II descrevem a superprodução e o subconsumo."],
 ["I, II e III.","A III é falsa."]]},
{k:"h1",lv:2,s:"A crise iniciada em 1929 nos EUA atingiu rapidamente a Alemanha porque",c:3,o:[
 ["a Alemanha era a principal compradora do café brasileiro.","Não é o mecanismo central; o elo foi financeiro."],
 ["os EUA invadiram a Renânia para cobrar indenizações.","Os EUA não invadiram a Alemanha; quem ocupou o Ruhr em 1923 foi a França."],
 ["o Tratado de Versalhes proibia a Alemanha de ter bancos.","Versalhes não proibiu bancos."],
 ["a economia alemã dependia de empréstimos norte-americanos, que foram retirados após a quebra.","Isso. Os bancos dos EUA cobraram os empréstimos; desemprego e miséria cresceram e favoreceram o nazismo."],
 ["a Alemanha havia adotado o New Deal antes dos EUA.","O New Deal é norte-americano, de 1933."]]},
{k:"h1",lv:2,s:"O New Deal (1933) rompeu com a orientação econômica anterior dos EUA principalmente porque",c:0,o:[
 ["ampliou a intervenção do Estado na economia, com obras públicas, regulação financeira e proteção social.","Isso. É o oposto do laissez-faire de Hoover."],
 ["estatizou todas as indústrias e aboliu a propriedade privada.","Isso seria socialismo; o New Deal manteve o capitalismo."],
 ["eliminou os sindicatos para baratear a mão de obra.","Ao contrário: reconheceu os sindicatos e a negociação coletiva."],
 ["reduziu os gastos públicos para equilibrar o orçamento.","O New Deal aumentou o gasto público para gerar empregos."],
 ["proibiu o comércio exterior para proteger o mercado interno.","Não houve proibição do comércio exterior."]]},
{k:"h1",lv:2,s:"Na política agrícola do New Deal, o governo pagou para que agricultores reduzissem a produção. O objetivo era",c:2,o:[
 ["acabar com a fome, distribuindo alimentos gratuitamente.","A medida reduzia a oferta; não era distribuição de alimentos."],
 ["aumentar as exportações para a Europa.","Reduzir a produção não aumenta as exportações."],
 ["elevar os preços agrícolas, que haviam despencado pela superprodução, e recuperar a renda do campo.","Isso. Menos oferta → preços maiores → renda do agricultor sobe."],
 ["substituir a agricultura pela indústria.","Não havia esse objetivo."],
 ["coletivizar as terras, como na URSS.","Não houve coletivização nos EUA."]]},
{k:"h1",lv:2,s:"A relação entre o New Deal e o pensamento de John Maynard Keynes é corretamente descrita em:",c:4,o:[
 ["Keynes defendia que o Estado não deveria intervir em crises, ideia aplicada por Roosevelt.","Keynes defendia o contrário: gasto público para estimular a demanda."],
 ["O New Deal aplicou fielmente um livro que Keynes publicou antes de 1929.","A <i>Teoria geral</i> é de 1936, depois do início do New Deal."],
 ["Keynes foi o presidente que substituiu Roosevelt.","Keynes foi um economista britânico."],
 ["Keynes criticou o New Deal por ser liberal demais.","Não é a relação consagrada entre eles."],
 ["As ideias de Keynes sobre o papel do gasto público para estimular a demanda sistematizaram práticas semelhantes às do New Deal.","Isso. Por isso o New Deal é associado ao keynesianismo e ao Estado de bem-estar."]]},
{k:"h1",lv:2,s:"A crise de 1929 contribuiu para o fim da Primeira República no Brasil, entre outros fatores, porque derrubou o preço do café e enfraqueceu as oligarquias exportadoras.",v:true,e:"Correto. É o fator externo da Revolução de 1930, somado aos fatores internos (ruptura do café com leite, tenentismo)."},
{k:"h1",lv:2,s:"A União Soviética foi o país mais atingido pela Grande Depressão, por depender das exportações para os EUA.",v:false,e:"Falso. A URSS, com economia planificada e pouco integrada ao mercado capitalista, ficou relativamente à margem da crise."},
/* ===== HISTÓRIA · NAZIFASCISMO E HOLOCAUSTO ===== */
{k:"h2",lv:2,s:"Considere as condições da Itália após a Primeira Guerra Mundial:<br>I. A sensação de “vitória mutilada”, por receber menos territórios do que esperava.<br>II. Greves e ocupações de fábricas que assustaram industriais e proprietários.<br>III. A estabilidade dos governos liberais, que dificultou a ação dos fascistas.<br>Contribuíram para a ascensão do fascismo:",c:2,o:[
 ["I, apenas.","A II também contribuiu: o medo de revolução socialista levou as elites a apoiar Mussolini."],
 ["II, apenas.","A I também contribuiu, alimentando o nacionalismo ressentido."],
 ["I e II, apenas.","Isso. A III é falsa: os governos liberais eram instáveis, e isso favoreceu os fascistas."],
 ["II e III, apenas.","A III é falsa."],
 ["I, II e III.","A III é falsa."]]},
{k:"h2",lv:2,s:"Hitler tornou-se chanceler da Alemanha em janeiro de 1933",c:1,o:[
 ["após vencer uma guerra civil contra os comunistas.","Não houve guerra civil; ele foi nomeado."],
 ["ao ser nomeado pelo presidente Hindenburg, após o partido nazista se tornar o maior do Parlamento, com apoio de setores conservadores.","Isso. Chegou pelas vias legais e depois destruiu as instituições (Lei de Plenos Poderes)."],
 ["por meio do Putsch de Munique, que derrubou a República de Weimar.","O Putsch de 1923 fracassou e levou Hitler à prisão."],
 ["depois de ser eleito diretamente com mais de 90% dos votos.","O chanceler não era eleito diretamente; os nazistas nunca tiveram maioria absoluta em eleições livres."],
 ["por imposição dos Aliados, que queriam um governo forte.","Os Aliados não impuseram Hitler."]]},
{k:"h2",lv:2,s:"Uma característica do nazismo que o distingue do fascismo italiano em sua origem é",c:3,o:[
 ["o anticomunismo.","Os dois eram anticomunistas."],
 ["o culto ao líder.","Os dois cultuavam o líder (Duce e Führer)."],
 ["o partido único.","Os dois tinham partido único."],
 ["a centralidade do racismo biológico e do antissemitismo na ideologia.","Isso. No fascismo italiano o centro era o Estado; as leis raciais só vieram em 1938."],
 ["o militarismo.","Os dois eram militaristas e expansionistas."]]},
{k:"h2",lv:2,s:"O Acordo de Munique (1938), em que Reino Unido e França aceitaram a anexação dos Sudetos pela Alemanha, é exemplo da",c:0,o:[
 ["política de apaziguamento, que buscava evitar a guerra cedendo às exigências de Hitler.","Isso. E acabou encorajando novas agressões."],
 ["Guerra Fria entre EUA e URSS.","A Guerra Fria começa depois de 1945."],
 ["aliança entre Alemanha e URSS contra a Polônia.","Isso é o Pacto Germano-Soviético (1939)."],
 ["política de não intervenção na Guerra Civil Espanhola.","Relacionada, mas Munique trata da Tchecoslováquia."],
 ["imposição do Tratado de Versalhes.","Versalhes é de 1919 e foi imposto à Alemanha."]]},
{k:"h2",lv:2,s:"Sobre o Holocausto, assinale a alternativa correta.",c:4,o:[
 ["Foi uma reação espontânea da população durante a guerra, sem planejamento do Estado.","Foi política de Estado, planejada (Conferência de Wannsee, 1942) e executada por uma burocracia."],
 ["Atingiu somente prisioneiros de guerra.","Atingiu sobretudo civis: cerca de 6 milhões de judeus, além de ciganos, pessoas com deficiência e outros grupos."],
 ["Terminou com as Leis de Nuremberg de 1935.","As leis de 1935 foram uma etapa inicial da perseguição, não o fim."],
 ["Não deixou documentos nem testemunhos, por isso sua dimensão é desconhecida.","Há farta documentação, testemunhos e julgamentos. Negar isso é negacionismo."],
 ["Foi um processo gradual de perseguição, que foi da exclusão legal ao extermínio industrial em campos como Auschwitz-Birkenau.","Isso. Boicote (1933) → Nuremberg (1935) → Noite dos Cristais (1938) → guetos → extermínio."]]},
{k:"h2",lv:2,s:"Após 1945, o conceito de genocídio passou a ser crime no direito internacional (Convenção da ONU de 1948), em grande parte como resposta ao Holocausto.",v:true,e:"Correto. O Tribunal de Nuremberg e a Convenção de 1948 marcam essa resposta."},
{k:"h2",lv:2,s:"Mussolini chegou ao poder após vencer eleições livres com maioria absoluta, em 1925.",v:false,e:"Falso. Ele foi nomeado primeiro-ministro pelo rei após a Marcha sobre Roma (1922) e instalou a ditadura em 1925–1926."},
{k:"h2",lv:2,s:"O Pacto Germano-Soviético (1939) surpreendeu porque",c:2,o:[
 ["uniu dois países democráticos.","Nenhum dos dois era democrático."],
 ["levou a URSS a declarar guerra aos EUA.","Não houve isso."],
 ["aproximou dois regimes inimigos ideológicos (nazismo e comunismo), garantindo a Hitler que não lutaria em duas frentes ao invadir a Polônia.","Isso. Foi assinado dias antes da invasão da Polônia."],
 ["devolveu à Alemanha os territórios perdidos em Versalhes.","O pacto não tratava disso."],
 ["encerrou a Guerra Civil Espanhola.","A Guerra Civil Espanhola terminou com a vitória de Franco."]]},
/* ===== HISTÓRIA · GUERRA CIVIL ESPANHOLA ===== */
{k:"h3",lv:2,s:"Na Guerra Civil Espanhola (1936–1939), lutaram ao lado da República:",c:1,o:[
 ["a Falange, os monarquistas e a Legião Condor.","Esses estavam do lado de Franco."],
 ["socialistas, comunistas, anarquistas e nacionalistas bascos e catalães, com apoio da URSS e das Brigadas Internacionais.","Isso. Uma frente heterogênea, com divisões internas."],
 ["tropas da Itália fascista.","A Itália enviou tropas para Franco."],
 ["o exército inteiro, unido contra Franco.","Grande parte do exército aderiu ao golpe."],
 ["os grandes proprietários rurais e a hierarquia da Igreja.","Em geral apoiaram os nacionalistas."]]},
{k:"h3",lv:2,s:"O bombardeio de Guernica (1937), denunciado no quadro de Picasso, foi realizado",c:3,o:[
 ["pela aviação republicana contra os franquistas.","Foi o contrário: atingiu uma cidade basca leal à República."],
 ["pela Força Aérea britânica, que apoiava a República.","O Reino Unido adotou a “não intervenção”."],
 ["pela URSS, para testar armas.","A URSS apoiava a República."],
 ["pela Legião Condor alemã, a serviço de Franco, contra uma cidade basca, atingindo civis.","Isso. A Alemanha usou a Espanha para testar táticas de bombardeio."],
 ["pelos anarquistas, contra a Igreja.","Não tem relação com Guernica."]]},
{k:"h3",lv:2,s:"A Guerra Civil Espanhola é frequentemente chamada de “ensaio geral” da Segunda Guerra Mundial porque",c:0,o:[
 ["opôs forças fascistas e antifascistas com apoio estrangeiro, e a Alemanha e a Itália testaram armas e táticas.","Isso. Hitler e Mussolini de um lado; URSS e brigadistas do outro."],
 ["os EUA e o Japão lutaram em território espanhol.","Não houve participação direta dos EUA nem do Japão."],
 ["terminou com a vitória dos republicanos sobre o fascismo.","Franco venceu em 1939."],
 ["foi o primeiro uso de armas atômicas.","As bombas atômicas são de 1945."],
 ["provocou a invasão da Polônia.","A invasão da Polônia tem outra origem."]]},
{k:"h3",lv:2,s:"A política de “não intervenção” de Reino Unido e França na Guerra Civil Espanhola, na prática, favoreceu os republicanos.",v:false,e:"Falso. Enquanto as democracias se omitiam, Alemanha e Itália continuavam apoiando Franco. A não intervenção prejudicou a República."},
{k:"h3",lv:2,s:"A Guerra Civil Espanhola resultou numa ditadura liderada por Francisco Franco, que durou até a morte dele, em 1975.",v:true,e:"Correto. O franquismo foi autoritário, católico conservador e anticomunista."},
/* ===== HISTÓRIA · ERA VARGAS 1930–1934 ===== */
{k:"h4",lv:2,s:"Sobre a Revolução de 1930, considere:<br>I. A crise de 1929 atingiu o café e enfraqueceu a oligarquia paulista.<br>II. A indicação do paulista Júlio Prestes por Washington Luís rompeu o acordo com Minas Gerais.<br>III. O movimento foi liderado pelo Partido Comunista, que tomou o poder.<br>Está correto o que se afirma em",c:2,o:[
 ["I, apenas.","A II também está correta: a ruptura do café com leite levou Minas à Aliança Liberal."],
 ["II, apenas.","A I também está correta: é o fator externo."],
 ["I e II, apenas.","Isso. A III é falsa: o movimento uniu oligarquias dissidentes (MG, RS, PB) e tenentes, não comunistas."],
 ["II e III, apenas.","A III é falsa."],
 ["I, II e III.","A III é falsa."]]},
{k:"h4",lv:2,s:"A Aliança Liberal (1929–1930) reunia",c:4,o:[
 ["São Paulo e Minas Gerais, para manter a política do café com leite.","São Paulo apoiava Júlio Prestes, o candidato oficial."],
 ["integralistas e comunistas contra Washington Luís.","AIB e ANL surgem depois (1932 e 1935)."],
 ["apenas os tenentes, sem participação de oligarquias.","Havia oligarquias dissidentes de MG, RS e PB."],
 ["os paulistas que fariam a Revolução de 1932.","Os paulistas estavam do lado oposto em 1930."],
 ["Minas Gerais, Rio Grande do Sul e Paraíba, com Vargas para presidente e João Pessoa para vice.","Isso. Propunham voto secreto e leis trabalhistas."]]},
{k:"h4",lv:2,s:"A Revolução Constitucionalista de 1932 teve entre suas motivações",c:1,o:[
 ["a defesa do voto feminino, ainda não previsto em lei.","O voto feminino já estava no Código Eleitoral de fevereiro de 1932."],
 ["a perda de autonomia de São Paulo, a nomeação de interventores e a exigência de uma Constituição.","Isso. SP queria a Constituinte e o fim do Governo Provisório."],
 ["a luta contra o Estado Novo.","O Estado Novo é de 1937."],
 ["a independência de São Paulo como objetivo oficial do movimento.","O objetivo declarado era a Constituição, não a separação."],
 ["o apoio integral de Minas Gerais e do Rio Grande do Sul.","Esses estados acabaram ficando com Vargas."]]},
{k:"h4",lv:2,s:"Embora derrotado militarmente, o movimento de 1932 teve um desdobramento político relevante:",c:3,o:[
 ["Vargas renunciou e convocou eleições diretas para presidente.","Vargas não renunciou; foi eleito indiretamente em 1934."],
 ["São Paulo tornou-se independente.","Não houve separação."],
 ["O Congresso de 1930 foi reaberto com os mesmos deputados.","Houve uma nova Constituinte, eleita em 1933."],
 ["a convocação da Assembleia Constituinte, que resultou na Constituição de 1934.","Isso. SP perdeu na guerra, mas ganhou a Constituinte."],
 ["a imediata instauração do Estado Novo.","O Estado Novo veio só em 1937."]]},
{k:"h4",lv:2,s:"A Constituição de 1934 trouxe, entre outras novidades,",c:0,o:[
 ["direitos trabalhistas (salário mínimo, jornada de 8 horas, férias), voto secreto e feminino e representação classista na Câmara.","Isso. Inspirada na Constituição de Weimar."],
 ["a extinção do Poder Legislativo e o fim das eleições.","Isso lembra a Constituição de 1937 (Estado Novo)."],
 ["a volta da monarquia parlamentarista.","Não há nada parecido."],
 ["a abolição da escravidão.","A abolição é de 1888."],
 ["o voto obrigatório apenas para analfabetos.","Os analfabetos continuaram sem voto."]]},
{k:"h4",lv:2,s:"A “representação classista” prevista na Constituição de 1934 consistia em",c:2,o:[
 ["reservar cadeiras para os partidos comunistas.","Não tem relação com partidos comunistas."],
 ["dar direito de voto apenas aos proprietários.","O voto não era censitário em 1934."],
 ["eleger parte dos deputados por meio de sindicatos de patrões e de empregados, numa influência corporativista.","Isso. Era uma forma de o Estado organizar os grupos profissionais."],
 ["dividir o Senado entre militares e civis.","Não era isso."],
 ["eleger o presidente pelo voto dos sindicatos.","O presidente foi eleito pela Assembleia."]]},
{k:"h4",lv:2,s:"O assassinato de João Pessoa, em 1930, teve motivações pessoais e políticas locais, mas foi usado pela Aliança Liberal para mobilizar o movimento armado.",v:true,e:"Correto. O crime virou bandeira para a revolta contra Washington Luís."},
/* ===== HISTÓRIA · AIB, ANL, TRABALHADORES E MULHERES ===== */
{k:"h5",lv:2,s:"A Ação Integralista Brasileira (AIB), fundada por Plínio Salgado em 1932,",c:1,o:[
 ["defendia a revolução comunista e a reforma agrária radical.","Isso é a ANL; a AIB era anticomunista."],
 ["inspirava-se no fascismo italiano, com lema “Deus, Pátria e Família”, uniformes verdes e forte anticomunismo.","Isso. Era nacionalista, antiliberal e corporativista."],
 ["era liderada por Luís Carlos Prestes.","Prestes era o presidente de honra da ANL."],
 ["lutava pela autonomia de São Paulo em 1932.","A AIB não tem relação com a Revolução Constitucionalista."],
 ["defendia o liberalismo econômico e a democracia parlamentar.","A AIB era antiliberal."]]},
{k:"h5",lv:2,s:"A Aliança Nacional Libertadora (ANL), de 1935, propunha",c:3,o:[
 ["a implantação imediata de uma monarquia católica.","Não tinha esse programa."],
 ["a aliança com Hitler contra o imperialismo britânico.","Era antifascista."],
 ["o fechamento dos sindicatos e a proibição de greves.","Defendia as liberdades e os trabalhadores."],
 ["reforma agrária, suspensão da dívida externa, nacionalização de empresas estrangeiras e combate ao fascismo.","Isso. Lema: “Pão, Terra e Liberdade”."],
 ["o voto censitário para conter o comunismo.","Não fazia parte do programa."]]},
{k:"h5",lv:2,s:"O Plano Cohen (1937) foi",c:0,o:[
 ["um falso plano de revolução comunista, divulgado pelo governo e usado como pretexto para o golpe do Estado Novo.","Isso. O documento foi forjado."],
 ["um plano econômico de combate à crise de 1929.","Não tem relação com economia."],
 ["o programa da Aliança Liberal em 1930.","A Aliança Liberal é de 1929–1930."],
 ["a lei que criou a carteira de trabalho.","A carteira de trabalho é de 1932."],
 ["o acordo de paz que encerrou a Revolução de 1932.","Não."]]},
{k:"h5",lv:2,s:"A política trabalhista de Vargas pode ser avaliada como",c:4,o:[
 ["exclusivamente repressiva, sem nenhuma conquista para os trabalhadores.","Houve conquistas reais: carteira de trabalho, férias, salário mínimo, CLT."],
 ["resultado apenas da bondade pessoal de Vargas, sem lutas operárias anteriores.","Essa é a visão da propaganda; houve lutas antes (greve de 1917)."],
 ["inspirada no liberalismo, que defende a ausência do Estado nas relações de trabalho.","Era intervencionista, o oposto do liberalismo."],
 ["contrária à existência de sindicatos.","Os sindicatos existiam, mas atrelados ao Estado."],
 ["ambígua: ampliou direitos, mas atrelou os sindicatos ao Estado (sindicato único, controle do Ministério) e reprimiu a organização autônoma.","Isso. Conquista e controle ao mesmo tempo."]]},
{k:"h5",lv:2,s:"Sobre as mulheres na Era Vargas, considere:<br>I. O voto feminino foi instituído pelo Código Eleitoral de 1932, resultado também da luta sufragista de Bertha Lutz.<br>II. Carlota Pereira de Queirós foi a primeira deputada federal do Brasil, eleita para a Constituinte de 1933.<br>III. A Constituição de 1934 proibiu as mulheres de trabalhar fora de casa.<br>Está correto o que se afirma em",c:2,o:[
 ["I, apenas.","A II também está correta."],
 ["II, apenas.","A I também está correta."],
 ["I e II, apenas.","Isso. A III é falsa: a Constituição de 1934 proibiu salário diferente por sexo e protegeu a maternidade."],
 ["II e III, apenas.","A III é falsa."],
 ["I, II e III.","A III é falsa."]]},
{k:"h5",lv:2,s:"A polarização entre AIB e ANL no Brasil reproduzia, em parte, o confronto mundial entre fascismo e antifascismo da década de 1930.",v:true,e:"Correto. A AIB se inspirava no fascismo; a ANL seguia a linha das frentes populares antifascistas."},
{k:"h5",lv:2,s:"A Intentona Comunista (1935) levou os comunistas ao poder no Rio de Janeiro por dois anos.",v:false,e:"Falso. Os levantes de Natal, Recife e Rio foram derrotados em poucos dias e geraram forte repressão, preparando o Estado Novo."},
/* ===== FÍSICA · CAP. 6 ===== */
{k:"f6",lv:2,s:"Considere:<br>I. O som se propaga no vácuo, mas com velocidade menor.<br>II. Em geral, o som é mais rápido nos sólidos do que nos gases.<br>III. Infrassons e ultrassons são ondas sonoras, embora não audíveis pelo ser humano.<br>Está correto o que se afirma em",c:3,o:[
 ["I, apenas.","A I é falsa: o som é onda mecânica e não se propaga no vácuo."],
 ["II, apenas.","A III também está correta: são ondas sonoras fora da faixa de 20 Hz a 20 000 Hz."],
 ["I e II, apenas.","A I é falsa: sem meio material não há som."],
 ["II e III, apenas.","Isso. v<sub>sólidos</sub> &gt; v<sub>líquidos</sub> &gt; v<sub>gases</sub>, e infra/ultrassons são sons não audíveis."],
 ["I, II e III.","A I é falsa."]]},
{k:"f6",lv:2,s:"Uma fonte sonora tem potência de 12 W e emite igualmente em todas as direções. Usando π = 3, a intensidade a 10 m da fonte é",c:1,o:[
 ["1,2 W/m².","Isso seria dividir só por 10. A potência se espalha pela área da esfera, 4πR²."],
 ["0,01 W/m².","Isso. I = Pot/(4πR²) = 12/(4·3·100) = 12/1 200 = 0,01 W/m²."],
 ["0,1 W/m².","Você dividiu por 120 (esqueceu de elevar R ao quadrado: 4·3·10)."],
 ["0,12 W/m².","Dividiu só por 100 (R²) e esqueceu o 4π."],
 ["0,001 W/m².","Errou uma potência de 10: 12/1 200 = 0,01."]]},
{k:"f6",lv:2,s:"A 2 m de uma fonte puntiforme a intensidade sonora é I. A 6 m da mesma fonte, a intensidade será",c:4,o:[
 ["I/3.","A intensidade cai com o quadrado da distância, não proporcionalmente."],
 ["3I.","Ao se afastar, a intensidade diminui."],
 ["I/6.","A distância triplicou (2 → 6), não sextuplicou."],
 ["9I.","Ao se afastar, a intensidade diminui."],
 ["I/9.","Isso. Distância ×3 → área ×9 → intensidade ÷9 (I ∝ 1/d²)."]]},
{k:"f6",lv:2,s:"O nível sonoro de uma sala passa de 50 dB para 80 dB. A intensidade sonora ficou",c:2,o:[
 ["30 vezes maior.","Decibel é logarítmico: cada +10 dB multiplica a intensidade por 10."],
 ["1,6 vez maior.","80/50 não vale para decibéis."],
 ["1 000 vezes maior.","Isso. +30 dB = 10 · log(I<sub>2</sub>/I<sub>1</sub>) → log = 3 → I<sub>2</sub>/I<sub>1</sub> = 10³."],
 ["300 vezes maior.","Cada +10 dB é ×10: três vezes ×10 = ×1 000."],
 ["100 vezes maior.","+20 dB daria ×100; aqui são +30 dB."]]},
{k:"f6",lv:2,s:"Duas máquinas iguais produzem, cada uma, 70 dB num ponto. Ligadas juntas (log 2 = 0,30), o nível no ponto é",c:0,o:[
 ["73 dB.","Isso. Intensidade dobra → ΔN = 10 · log 2 = 3 dB → 73 dB."],
 ["140 dB.","Decibéis não se somam diretamente; somam-se as intensidades."],
 ["70 dB.","A intensidade dobrou, então o nível aumenta um pouco."],
 ["77 dB.","10 · log 2 = 3, não 7."],
 ["80 dB.","+10 dB exigiria intensidade 10 vezes maior."]]},
{k:"f6",lv:2,s:"Num osciloscópio, dois sons aparecem com o mesmo número de oscilações no mesmo intervalo, a mesma altura máxima, mas desenhos diferentes. Eles diferem em",c:3,o:[
 ["altura.","Mesmo número de oscilações → mesma frequência → mesma altura."],
 ["intensidade.","Mesma altura do desenho → mesma amplitude → mesma intensidade."],
 ["velocidade.","No mesmo meio, sons têm a mesma velocidade."],
 ["timbre.","Isso. Forma da onda diferente = harmônicos diferentes = timbre diferente."],
 ["frequência.","O número de oscilações por tempo é igual."]]},
{k:"f6",lv:2,s:"A velocidade do som num gás, pela fórmula de Laplace (v = √(γRT/M)), aumenta quando",c:1,o:[
 ["a massa molar do gás aumenta.","M está no denominador: gás mais pesado → som mais lento."],
 ["a temperatura absoluta aumenta.","Isso. T está no numerador da raiz: ar mais quente → som mais rápido."],
 ["a frequência da fonte aumenta.","A velocidade depende do meio, não da frequência."],
 ["a amplitude da onda aumenta.","Amplitude muda a intensidade, não a velocidade."],
 ["o gás é trocado por vácuo.","No vácuo o som não se propaga."]]},
{k:"f6",lv:2,s:"Em Física, dizer que “a voz feminina é mais alta que a masculina” significa que ela é",v:true,e:"Correto se entendido assim: mais alta = mais aguda = maior frequência (cerca de 200–400 Hz contra 100–200 Hz). Não quer dizer mais forte."},
{k:"f6",lv:2,s:"Se a intensidade de um som dobra, a sensação sonora (nível em dB) também dobra.",v:false,e:"Falso. O nível aumenta só 3 dB (10·log 2). Ex.: 30 dB → 33 dB."},
/* ===== FÍSICA · CAP. 7 ===== */
{k:"f7",lv:2,s:"Uma pessoa grita a 50 m de um paredão (v = 340 m/s). Em quanto tempo ouve o eco e o que ela percebe?",c:2,o:[
 ["0,15 s; reverberação.","O tempo de ida e volta é 100/340 ≈ 0,29 s, acima de 0,1 s."],
 ["0,29 s; reforço.","Reforço exige intervalo muito menor que 0,1 s."],
 ["≈ 0,29 s; eco, pois o intervalo supera 0,1 s.","Isso. ΔS = 2 · 50 = 100 m; Δt = 100/340 ≈ 0,29 s &gt; 0,1 s → eco."],
 ["0,15 s; eco.","Você esqueceu a volta: o som percorre 100 m, não 50 m."],
 ["6,8 s; eco.","Você multiplicou em vez de dividir: Δt = ΔS/v."]]},
{k:"f7",lv:2,s:"Num ambiente onde o som se propaga a 1 500 m/s, qual a distância mínima de um obstáculo para ouvir eco (persistência de 0,1 s)?",c:4,o:[
 ["150 m.","Esse é o caminho de ida e volta; a distância é a metade."],
 ["17 m.","17 m vale para o ar (340 m/s)."],
 ["1 500 m.","Use ΔS = v·Δt com Δt = 0,1 s."],
 ["15 m.","Errou uma casa: 1 500 · 0,1 = 150."],
 ["75 m.","Isso. 2x = 1 500 · 0,1 = 150 → x = 75 m."]]},
{k:"f7",lv:2,s:"Um som de 680 Hz passa do ar (340 m/s) para a água (1 360 m/s). Na água,",c:0,o:[
 ["a frequência continua 680 Hz e o comprimento de onda passa de 0,5 m para 2,0 m.","Isso. f não muda; λ<sub>ar</sub> = 340/680 = 0,5 m; λ<sub>água</sub> = 1 360/680 = 2,0 m."],
 ["a frequência passa a 2 720 Hz e o λ continua 0,5 m.","Na refração a frequência não muda; quem muda é λ."],
 ["a frequência cai para 170 Hz.","A frequência é imposta pela fonte."],
 ["o comprimento de onda diminui para 0,125 m.","Velocidade maior com f igual → λ maior, não menor."],
 ["o som fica mais agudo.","Agudo depende da frequência, que não muda."]]},
{k:"f7",lv:2,s:"Duas fontes em fase emitem som de comprimento de onda 0,4 m. Num ponto P, a diferença entre as distâncias às fontes é 1,0 m. Em P a interferência é",c:3,o:[
 ["construtiva, pois 1,0 m é múltiplo de 0,4 m.","1,0 não é múltiplo inteiro de 0,4. Use ΔS = n·λ/2."],
 ["construtiva, com n = 4.","1,0 = n · 0,2 → n = 5, não 4."],
 ["nula, pois as fontes estão em fase.","Fontes em fase ainda podem interferir destrutivamente, dependendo de ΔS."],
 ["destrutiva, pois n = 5 é ímpar.","Isso. ΔS = n·λ/2 → 1,0 = n · 0,2 → n = 5 (ímpar) → destrutiva."],
 ["destrutiva, pois n = 2,5.","n tem de ser inteiro: 1,0/0,2 = 5."]]},
{k:"f7",lv:2,s:"Um diapasão de 440 Hz e uma corda soam juntos e se ouvem 4 batimentos por segundo. A frequência da corda pode ser",c:1,o:[
 ["444 Hz, apenas.","Também pode ser 436 Hz: o batimento é a diferença em módulo."],
 ["436 Hz ou 444 Hz.","Isso. |f − 440| = 4 → f = 436 Hz ou 444 Hz."],
 ["880 Hz.","Isso seria o dobro, sem relação com batimento."],
 ["442 Hz.","Daria 2 batimentos por segundo."],
 ["110 Hz.","Seria 440/4, mas batimento é diferença, não divisão."]]},
{k:"f7",lv:2,s:"Por que ouvimos alguém atrás de um muro, mas não o vemos?",c:2,o:[
 ["Porque o som é mais rápido que a luz.","A luz é muito mais rápida; não é a velocidade que explica."],
 ["Porque o som é longitudinal e a luz é transversal.","Isso explica a polarização, não a difração."],
 ["Porque o comprimento de onda do som é comparável ao muro e o da luz é muito menor; o som difrata.","Isso. λ do som ≈ 1 m; λ da luz ≈ 10<sup>−7</sup> m."],
 ["Porque o som é refletido pelo muro.","A reflexão devolveria o som para o lado de quem fala."],
 ["Porque a frequência do som é maior que a da luz.","É o contrário: a luz tem frequência muito maior."]]},
{k:"f7",lv:2,s:"No ultrassom, quanto maior a diferença de impedância acústica (Z = ρ·v) entre dois tecidos, maior a reflexão. Tecido X: ρ = 1 000 kg/m³, v = 1 500 m/s. Tecido Y: ρ = 2 000 kg/m³, v = 4 000 m/s. A razão Z<sub>Y</sub>/Z<sub>X</sub> é",c:4,o:[
 ["2.","Você comparou só as densidades; Z = ρ·v."],
 ["2,7.","Você comparou só as velocidades."],
 ["4,7.","Somou as razões; o certo é multiplicá-las."],
 ["0,19.","Inverteu a razão."],
 ["≈ 5,3.","Isso. Z<sub>X</sub> = 1,5·10<sup>6</sup>; Z<sub>Y</sub> = 8·10<sup>6</sup>; razão ≈ 5,3."]]},
{k:"f7",lv:2,s:"O fone com cancelamento ativo de ruído funciona por interferência destrutiva e é mais eficiente com ruídos constantes, como o de um avião.",v:true,e:"Correto. Microfones captam o ruído e o fone gera uma onda oposta. Vozes variam muito e são mais difíceis de cancelar."},
{k:"f7",lv:2,s:"Na reflexão do som em uma parede rígida, a onda volta com frequência maior, por isso o eco é mais agudo.",v:false,e:"Falso. Na reflexão a frequência, a velocidade e o comprimento de onda se mantêm; ocorre inversão de fase."},
{k:"f7",lv:2,s:"O som não sofre polarização porque é uma onda longitudinal.",v:true,e:"Correto. Polarização só ocorre em ondas transversais."},
/* ===== FÍSICA · CAP. 8 ===== */
{k:"f8",lv:2,s:"Uma corda de 80 cm vibra formando 4 ventres. O comprimento de onda é",c:3,o:[
 ["80 cm.","Seria o 2º harmônico (2 ventres)."],
 ["20 cm.","Essa é a largura de cada gomo (λ/2)."],
 ["160 cm.","Seria o fundamental (1 ventre)."],
 ["40 cm.","Isso. λ = 2ℓ/n = 2 · 80/4 = 40 cm."],
 ["320 cm.","λ = 2ℓ/n, não 4ℓ."]]},
{k:"f8",lv:2,s:"Numa corda, ondas viajam a 120 m/s e o comprimento é 0,6 m. A frequência do 3º harmônico é",c:0,o:[
 ["300 Hz.","Isso. f<sub>1</sub> = v/(2ℓ) = 120/1,2 = 100 Hz; f<sub>3</sub> = 3·100 = 300 Hz."],
 ["100 Hz.","Esse é o fundamental (1º harmônico)."],
 ["600 Hz.","Você usou λ = ℓ/3 em vez de 2ℓ/3."],
 ["200 Hz.","Esse é o 2º harmônico."],
 ["66,7 Hz.","Dividiu em vez de multiplicar por n."]]},
{k:"f8",lv:2,s:"Uma corda tem frequência fundamental de 150 Hz. Assinale a sequência de frequências que ela também pode emitir em ondas estacionárias.",c:2,o:[
 ["225, 300, 375 Hz.","Os harmônicos são múltiplos inteiros: 300, 450, 600…"],
 ["300, 600, 900 Hz, apenas.","Faltam 450, 750…: entram todos os múltiplos, não só os pares."],
 ["300, 450, 600 Hz.","Isso. f<sub>n</sub> = n·f<sub>1</sub>: 2·150, 3·150, 4·150."],
 ["450, 750, 1 050 Hz, apenas.","Corda presa nas duas pontas tem também os harmônicos pares."],
 ["75, 50, 37,5 Hz.","Harmônicos são múltiplos, não divisores."]]},
{k:"f8",lv:2,s:"Uma corda de 2,0 m e 50 g é tracionada por 100 N. A velocidade de propagação de ondas nela é",c:1,o:[
 ["200 m/s.","Você usou μ = 2,5 g/m sem converter para kg."],
 ["≈ 63 m/s.","Isso. μ = 0,05/2 = 0,025 kg/m; v = √(100/0,025) = √4 000 ≈ 63 m/s."],
 ["4 000 m/s.","Faltou tirar a raiz: v = √(F/μ)."],
 ["2,5 m/s.","Inverteu a fração dentro da raiz."],
 ["20 m/s.","Usou a massa total em vez da massa por metro."]]},
{k:"f8",lv:2,s:"Para tornar mais agudo o som de uma corda de violão, sem trocá-la, o músico pode",c:4,o:[
 ["afrouxar a tarraxa.","Menos tração → v menor → som mais grave."],
 ["tocar mais forte.","Isso aumenta a intensidade, não a frequência."],
 ["trocar por corda mais grossa.","Corda mais grossa (μ maior) soa mais grave; e a questão diz sem trocar."],
 ["afastar o dedo da boca do violão, aumentando o trecho que vibra.","Trecho maior → frequência menor → mais grave."],
 ["apertar a corda num traste, encurtando o trecho que vibra, ou esticá-la mais.","Isso. f = (n/2ℓ)·√(F/μ): ℓ menor ou F maior → f maior."]]},
{k:"f8",lv:2,s:"Se a força de tração numa corda é multiplicada por 9 (comprimento e corda iguais), a frequência fundamental",c:3,o:[
 ["fica 9 vezes maior.","f depende da raiz de F."],
 ["fica 9 vezes menor.","Aumentar a tração aumenta a frequência."],
 ["não muda.","A velocidade muda com a tração."],
 ["fica 3 vezes maior.","Isso. v = √(F/μ) → F ×9 → v ×3 → f ×3."],
 ["fica 81 vezes maior.","Seria elevar ao quadrado; o certo é tirar a raiz."]]},
{k:"f8",lv:2,s:"A distância entre dois nós consecutivos de uma onda estacionária é igual a um comprimento de onda.",v:false,e:"Falso. Entre dois nós vizinhos há meio comprimento de onda (λ/2), um gomo."},
{k:"f8",lv:2,s:"Em uma corda presa nas duas pontas, o maior comprimento de onda possível é o dobro do comprimento da corda.",v:true,e:"Correto. No fundamental (n = 1) há um gomo só: λ = 2ℓ."},
{"k":"l1","lv":2,"s":"Num poema concreto, a palavra “chuva” se repete descendo pela página, letra por letra, como se escorresse. Esse recurso, em que a forma visual reproduz o sentido, chama-se","c":4,"o":[["paronomásia.","Paronomásia é aproximar palavras de som parecido e sentido diferente (lixo/luxo). Aqui o recurso é a forma imitar o sentido."],["enjambement.","Enjambement é o verso que continua no seguinte. Poema concreto nem tem verso."],["sinestesia.","Sinestesia mistura sensações (cor, som, cheiro). Não é o caso."],["anáfora.","Anáfora é repetir a mesma palavra no início de versos. Aqui o que importa é o desenho."],["isomorfismo.","Isso. Forma e conteúdo têm a mesma “forma”: o poema sobre chuva cai na página."]]},
{"k":"l1","lv":2,"s":"No poema “luxo/lixo”, de Augusto de Campos, a palavra LUXO aparece em letras grandes formadas por muitas palavras “lixo”. Que leitura crítica o poema permite?","c":2,"o":[["Elogio à riqueza e ao consumo de produtos caros.","O poema faz o oposto: mostra que o luxo é feito de lixo."],["Saudade da infância pobre do poeta.","Não há eu lírico autobiográfico; a poesia concreta é objetiva."],["O luxo é feito de lixo: crítica ao consumismo e ao valor de fachada.","Isso. A paronomásia (luxo/lixo) e a forma visual juntas criticam o consumo e a ostentação."],["A natureza deve ser preservada do lixo urbano.","Leitura ecológica possível de modo amplo, mas o poema joga com <b>luxo</b> × <b>lixo</b>, isto é, com a ostentação."],["Uma homenagem à poesia parnasiana.","O poema não tem verso, rima ou métrica; está longe do Parnasianismo."]]},
{"k":"l1","lv":2,"s":"O poema “beba coca cola”, de Décio Pignatari (1957), transforma um slogan publicitário em palavras como “babe”, “caco” e “cloaca”. O efeito é","c":0,"o":[["criticar a propaganda e a sociedade de consumo usando a própria linguagem dela.","Isso. O poema desmonta o slogan e revela o que ele esconde: é a fase em que a poesia concreta também critica."],["fazer propaganda gratuita do refrigerante.","Pelo contrário: as palavras derivadas (cloaca = esgoto) ridicularizam o anúncio."],["imitar uma cantiga medieval.","Não há relação com o trovadorismo."],["expressar a tristeza amorosa do poeta.","Não há eu lírico sentimental no poema concreto."],["defender a pureza da língua contra palavras estrangeiras.","O poema não trata de purismo linguístico."]]},
{"k":"l1","lv":2,"s":"Sobre o Concretismo, assinale a alternativa <b>incorreta</b>.","c":3,"o":[["Abandona o verso e usa o espaço da página como elemento de sentido.","Correta: é a base do movimento."],["Recebe influência de Mallarmé, Pound, Joyce e Oswald de Andrade.","Correta: são as influências declaradas pelos concretos."],["Aproveita recursos da publicidade, como concisão e tipografia.","Correta: o poema concreto conversa com o cartaz e o anúncio."],["Valoriza o eu lírico confessional e o desabafo sentimental.","Isso, esta é a incorreta. O Concretismo é objetivo e recusa o sentimentalismo; o “eu” praticamente desaparece."],["A partir de 1961 assume temas sociais, no chamado “salto participante”.","Correta: “sem forma revolucionária não há arte revolucionária”."]]},
{"k":"l1","lv":2,"s":"O que distingue o Neoconcretismo do Concretismo?","c":4,"o":[["O Neoconcretismo volta ao verso, à rima e ao soneto.","Não: ele continua experimental e visual."],["O Neoconcretismo nasce em São Paulo e o Concretismo, no Rio.","É o contrário: concretos em São Paulo, neoconcretos no Rio."],["O Neoconcretismo é mais matemático e geométrico.","É justamente o que ele critica nos concretos."],["O Neoconcretismo foi feito em mimeógrafo nos anos 70.","Isso é a poesia marginal."],["O Neoconcretismo rejeita o excesso de racionalismo e valoriza a expressão e a participação do espectador.","Isso. É a teoria do não-objeto: a obra se completa quando o público age sobre ela."]]},
{"k":"l1","lv":2,"s":"Os <i>Bichos</i>, de Lygia Clark, são esculturas de metal com dobradiças que o público pode mexer e mudar de forma. Isso exemplifica a ideia neoconcreta de","c":2,"o":[["arte pela arte, sem contato com o público.","Arte pela arte é o lema parnasiano; aqui o público é essencial."],["imitação fiel da natureza.","Os Bichos não imitam animais reais; o nome é poético."],["obra como “não-objeto”, completada pela participação do espectador.","Isso. O espectador deixa de só olhar e passa a participar."],["poema-piada, com humor e coloquialidade.","Poema-piada é recurso de Oswald e dos poetas marginais."],["denúncia da miséria por meio do determinismo.","Determinismo é do Naturalismo, século XIX."]]},
{"k":"l1","lv":2,"s":"O Concretismo e o Parnasianismo valorizam a forma, mas o parnasiano usa forma fixa (soneto, métrica, rima) e o concreto cria uma forma nova, visual e sem verso.","v":true,"e":"Correto. É uma comparação que cai: os dois cultuam a forma, mas de maneiras opostas."},
{"k":"l1","lv":2,"s":"Paulo Leminski é considerado um poeta exclusivamente concretista, sem ligação com a poesia marginal.","v":false,"e":"Falso. Leminski une o rigor concreto ao humor e à coloquialidade da poesia marginal; é o elo entre as duas tendências."},
{"k":"l1","lv":2,"s":"Considere as afirmações sobre o Concretismo.<br>I. O “Plano-piloto para poesia concreta” (1958) declara encerrado o ciclo histórico do verso.<br>II. O movimento nasce como continuação direta da Geração de 45, de quem herda o rigor métrico.<br>III. A sintaxe espacial substitui a sintaxe linear do discurso.<br>Está correto o que se afirma em","c":1,"o":[["I, apenas.","A III também está correta: o espaço da página organiza a leitura no lugar da frase linear."],["I e III, apenas.","Isso. A II é falsa: o Concretismo <b>reage</b> à Geração de 45 e abandona a métrica."],["II e III, apenas.","A II é falsa: o Concretismo rompe com a Geração de 45 e com o verso metrificado."],["I, II e III.","A II é falsa; o movimento é uma ruptura, não uma continuação."],["III, apenas.","A I também é correta: é a tese central do Plano-piloto."]]},
{"k":"l1","lv":2,"s":"Um poema concreto dispõe a palavra “terra” repetida em linhas que se deslocam, formando sulcos como os de um campo arado. Qual análise é mais adequada?","c":3,"o":[["O poema é parnasiano, pois descreve a natureza com objetividade.","Não há verso, métrica nem rima; a objetividade aqui é visual, não descritiva."],["O poema é romântico, pois exalta a terra natal.","Não há eu lírico nem exaltação sentimental da pátria."],["O poema dispensa o sentido da palavra e vale só como desenho.","O sentido de “terra” é essencial; ele se soma à forma."],["A disposição gráfica reproduz o significado (o campo arado), num caso de isomorfismo.","Isso. A forma “planta” o sentido na página: verbal + visual."],["O poema é marginal, pois usa linguagem coloquial.","Não há coloquialidade nem tom de conversa; é construção calculada."]]},
{"k":"l1","lv":2,"s":"Os concretos citam Mallarmé, Ezra Pound e James Joyce como precursores. O que cada um forneceu ao movimento, respectivamente?","c":0,"o":[["O uso do espaço em branco da página; o método ideogrâmico; a palavra-montagem (“verbivocovisual”).","Isso. Mallarmé (<i>Um lance de dados</i>), Pound (ideograma) e Joyce (fusão de palavras)."],["A rima rica; o soneto; o verso alexandrino.","Esses são recursos parnasianos, rejeitados pelos concretos."],["O indianismo; o nacionalismo; a natureza idealizada.","Temas românticos, sem relação com os concretos."],["O determinismo; a hereditariedade; o meio.","Conceitos naturalistas do século XIX."],["A sinestesia; a musicalidade; o misticismo.","Recursos simbolistas; os concretos querem precisão, não sugestão mística."]]},
{"k":"l1","lv":2,"s":"Leia: “A obra não é um objeto para ser contemplado de longe; ela só se completa quando o público a toca, dobra e transforma.” Essa ideia se aproxima","c":2,"o":[["do Plano-piloto de 1958, de Augusto de Campos e colegas.","O Plano-piloto fala do poema-objeto visual; a participação física do público é proposta neoconcreta."],["do lema parnasiano da “arte pela arte”.","A arte pela arte afasta a obra do público; aqui ocorre o oposto."],["da teoria do não-objeto, de Ferreira Gullar, base do Neoconcretismo.","Isso. Bichos (Lygia Clark), Parangolés (Oiticica), livros-poema e o “Poema enterrado”."],["da poesia marginal, que vendia livros de mão em mão.","Vender de mão em mão é circulação; não é teoria da obra."],["do narrador intruso de Saramago.","Saramago dialoga com o leitor, mas a ideia descrita é das artes visuais neoconcretas."]]},
{"k":"l1","lv":2,"s":"Sobre o “salto participante” do Concretismo (1961), é correto afirmar que","c":4,"o":[["marcou o abandono da experimentação formal e a volta ao verso tradicional.","Os concretos mantiveram a forma nova; o que mudou foi a abertura a temas sociais."],["foi uma reação neoconcreta liderada por Lygia Clark.","Foi uma mudança interna do grupo concreto."],["levou os concretos a aderir à poesia marginal dos anos 1970.","São momentos e propostas diferentes."],["eliminou qualquer relação com a publicidade.","Pelo contrário: os concretos usam a linguagem publicitária para criticá-la (“beba coca cola”)."],["incorporou temas sociais e políticos sem abandonar a forma inovadora, com base na ideia de que não há arte revolucionária sem forma revolucionária.","Isso. A frase é de Maiakóvski e virou lema da fase participante."]]},
{"k":"l1","lv":2,"s":"O Concretismo e o Parnasianismo podem ser aproximados e distinguidos. Assinale a comparação correta.","c":1,"o":[["Ambos usam o soneto como forma preferida.","O Concretismo abandona o soneto e o verso."],["Ambos cultuam a forma, mas o parnasiano a busca na métrica e na rima fixas, e o concreto, na organização visual da página, sem verso.","Isso. Forma fixa × forma nova."],["Ambos valorizam o sentimentalismo do eu lírico.","Os dois rejeitam o sentimentalismo (impassibilidade parnasiana, objetividade concreta)."],["O Parnasianismo é visual e o Concretismo é musical.","Inverte as marcas: o Concretismo é que é visual."],["Ambos surgiram na Semana de Arte Moderna.","O Parnasianismo é do século XIX; o Concretismo, dos anos 1950."]]},
{"k":"l1","lv":2,"s":"Ferreira Gullar participou do Concretismo, redigiu o Manifesto Neoconcreto (1959) e depois escreveu poesia engajada, como o <i>Poema sujo</i> (1976). Essa trajetória mostra","c":3,"o":[["que o Neoconcretismo foi a fase final do Romantismo.","Não há relação com o Romantismo."],["que Gullar sempre seguiu o racionalismo matemático paulista.","Ele rompeu justamente com esse racionalismo."],["que a poesia de vanguarda impedia qualquer engajamento.","Os concretos também tiveram fase participante; Gullar engajou-se."],["um percurso da experimentação formal à poesia de participação política, passando pela crítica ao racionalismo concreto.","Isso. Concreto → neoconcreto → engajado (exílio, ditadura)."],["que Gullar foi o fundador da poesia marginal.","A poesia marginal é dos anos 70, com Chacal, Cacaso e outros."]]},
{"k":"l2","lv":2,"s":"Qual conjunto de características descreve a poesia marginal?","c":2,"o":[["Rigor formal, sintaxe espacial e abolição do verso.","Isso descreve o Concretismo."],["Soneto, rima rica, impassibilidade e temas clássicos.","Isso é Parnasianismo."],["Linguagem coloquial, humor, cotidiano, poema curto e crítica política velada.","Isso. É a poesia de conversa, do dia a dia, com ironia contra a ditadura."],["Sugestão, musicalidade, sinestesia e misticismo.","Isso é Simbolismo."],["Nacionalismo, indianismo e natureza idealizada.","Isso é a 1ª geração romântica."]]},
{"k":"l2","lv":2,"s":"Por que a poesia marginal é vista como oposta ao Concretismo?","c":4,"o":[["Porque os marginais escreviam em prosa.","Eles escreviam poemas; a diferença é o modo."],["Porque os concretos eram contra a ditadura e os marginais a favor.","Não; a oposição é estética, não de apoio político."],["Porque os marginais usavam soneto e métrica.","Os marginais também recusavam a forma fixa."],["Porque o Concretismo é da Europa e a poesia marginal é do Brasil.","Os dois são brasileiros."],["Porque troca o cálculo e o rigor visual pela espontaneidade e pela fala do dia a dia.","Isso. Concreto = planejado e geométrico; marginal = improvisado e coloquial."]]},
{"k":"l2","lv":2,"s":"Um poema de Ana Cristina Cesar tem tom de diário, com datas, fragmentos e um “você” a quem o eu lírico se dirige. Essas marcas mostram","c":1,"o":[["a impessoalidade parnasiana.","O texto é íntimo e pessoal, o contrário da impassibilidade."],["a escrita íntima e fragmentada típica da autora, que imita cartas e diários.","Isso. Ana C. (<i>A teus pés</i>, 1982) brinca com o gênero diário e carta."],["o isomorfismo concreto.","Não há uso visual da página; é escrita confessional."],["o narrador intruso de Saramago.","Saramago é romancista; aqui é poesia lírica."],["o determinismo naturalista.","Não há explicação científica do comportamento."]]},
{"k":"l2","lv":2,"s":"Paulo Leminski é lembrado por","c":3,"o":[["romances históricos sobre Portugal.","Isso é Saramago."],["sonetos parnasianos sobre a Grécia antiga.","Isso lembra Bilac e Francisca Júlia."],["poemas em mimeógrafo sobre a vida em Brasília.","Esse é Nicolas Behr."],["haicais e trocadilhos que unem o rigor concreto ao humor marginal.","Isso. <i>Caprichos &amp; relaxos</i> (1983)."],["ter redigido o Manifesto Neoconcreto.","Foi Ferreira Gullar."]]},
{"k":"l2","lv":2,"s":"A poesia brasileira contemporânea (dos anos 1980 até hoje) se caracteriza principalmente por","c":4,"o":[["seguir uma única escola, com manifesto e regras.","Não há escola única hoje."],["voltar ao soneto e à métrica parnasiana.","Alguns poetas usam formas fixas, mas isso não define o período."],["proibir a poesia visual.","A poesia visual continua (Arnaldo Antunes)."],["tratar só de indígenas e da natureza nacional.","Isso é o indianismo romântico."],["pluralidade: convivem poesia visual, lírica do cotidiano, haicai e poesia falada (slam).","Isso. A marca é a diversidade de vozes e formas."]]},
{"k":"l2","lv":2,"s":"O humor e o duplo sentido da poesia marginal também serviam para driblar a censura da ditadura.","v":true,"e":"Correto. A crítica política aparece velada, disfarçada de piada, ironia e desbunde."},
{"k":"l2","lv":2,"s":"Leia o poema criado para este exercício, no estilo da poesia dos anos 1970:<br><i>“saí cedo / o ônibus não veio / o censor leu meu bilhete / e riu / eu também”</i><br>Quais marcas da poesia marginal aparecem?","c":2,"o":[["Métrica regular, rima rica e tema clássico.","Não há métrica nem rima; o tema é o cotidiano."],["Isomorfismo visual e sintaxe espacial.","O texto é linear, em tom de anotação, sem jogo visual."],["Coloquialidade, cotidiano, poema curto e crítica velada à censura pelo humor.","Isso. O “censor” lembra a ditadura; o riso desarma a censura."],["Sinestesia, musicalidade e misticismo.","Marcas simbolistas, ausentes aqui."],["Narrador intruso e pontuação sem travessão.","Marcas de Saramago, em prosa."]]},
{"k":"l2","lv":2,"s":"A expressão “geração mimeógrafo” relaciona-se ao modo de produção da poesia marginal porque","c":0,"o":[["os poetas produziam livros artesanais e baratos, fora das editoras, e os distribuíam pessoalmente, criando um circuito alternativo durante a ditadura.","Isso. A forma de circular faz parte da proposta: independência e contato direto com o leitor."],["o mimeógrafo era usado para copiar poemas parnasianos para as escolas.","Não; o mimeógrafo servia à produção independente dos próprios poetas."],["os poemas eram enviados por telegrama às editoras.","Os poetas recusavam o circuito das editoras."],["o governo distribuía os livros como propaganda oficial.","A poesia marginal era independente e muitas vezes crítica ao regime."],["os poemas só podiam ser lidos em museus.","Circulavam em bares, praias, shows e portas de cinema."]]},
{"k":"l2","lv":2,"s":"Assinale a alternativa que associa corretamente o poeta à sua marca.","c":4,"o":[["Ana Cristina Cesar: haicai e trocadilho; Paulo Leminski: diário e carta.","Está invertido."],["Chacal: poema concreto geométrico; Cacaso: sonetos parnasianos.","Chacal é poeta da fala; Cacaso usa ironia política e paródia."],["Francisco Alvim: romances históricos; Nicolas Behr: Manifesto Neoconcreto.","Alvim faz poemas curtos com falas ouvidas; Behr publicava em Brasília; o manifesto é de Gullar."],["Leminski: poesia falada de Nuvem Cigana; Chacal: haicai curitibano.","Está trocado: haicai é de Leminski; Nuvem Cigana e poesia falada são de Chacal."],["Ana C.: escrita íntima em forma de diário e carta; Leminski: haicai e trocadilho, unindo rigor concreto e humor marginal.","Isso."]]},
{"k":"l2","lv":2,"s":"A influência de Oswald de Andrade sobre a poesia marginal aparece sobretudo","c":1,"o":[["no uso do soneto e da rima rica.","Oswald combatia justamente essa poesia “bem-comportada”."],["no poema-piada e no poema-minuto, curtos, irônicos e coloquiais.","Isso. Os marginais retomam a irreverência do Modernismo de 1922."],["no indianismo idealizado de Alencar.","O indianismo é romântico; Oswald o parodiava."],["na pontuação sem travessão.","Essa é marca de Saramago."],["no determinismo de raça e meio.","Isso é Naturalismo."]]},
{"k":"l2","lv":2,"s":"Sobre a poesia contemporânea brasileira (a partir dos anos 1980), avalie:<br>I. Não há uma escola única; convivem vertentes diversas.<br>II. A poesia visual desapareceu depois do Concretismo.<br>III. Saraus de periferia e o slam valorizam a poesia oral e a performance.<br>Está correto o que se afirma em","c":3,"o":[["I, apenas.","A III também está correta."],["II, apenas.","A II é falsa: Arnaldo Antunes e a poesia digital continuam o trabalho visual."],["I e II, apenas.","A II é falsa."],["I e III, apenas.","Isso. Pluralidade e força da poesia falada."],["I, II e III.","A II é falsa."]]},
{"k":"l2","lv":2,"s":"Uma questão de prova pede para contrastar a poesia marginal com o Concretismo. A resposta mais completa é:","c":2,"o":[["Os dois são iguais, pois ambos são modernistas de 1922.","Nenhum dos dois é de 1922."],["O Concretismo é coloquial e a poesia marginal é geométrica.","Está invertido."],["O Concretismo é racional, planejado e visual; a poesia marginal é espontânea, coloquial e ligada ao cotidiano, além de circular fora das editoras.","Isso. Cita forma, linguagem e circulação."],["A poesia marginal é portuguesa e o Concretismo é brasileiro.","Ambos são brasileiros."],["Ambos rejeitam qualquer crítica política.","O Concretismo teve fase participante e a poesia marginal faz crítica velada."]]},
{"k":"l3","lv":2,"s":"Num trecho de Saramago, as falas de duas personagens aparecem no mesmo parágrafo, separadas só por vírgulas, cada uma começando com letra maiúscula. Essa escolha","c":3,"o":[["é um erro de revisão que as editoras nunca corrigiram.","Não é erro: é escolha consciente de estilo."],["segue a norma tradicional dos diálogos em romance.","A norma tradicional usa travessão ou aspas; Saramago rompe com ela."],["mostra que o narrador é um personagem que não sabe escrever.","O narrador é culto e irônico; a escolha é estética."],["aproxima a narrativa da oralidade e obriga o leitor a participar ativamente.","Isso. O ritmo é de alguém contando a história em voz alta."],["imita a linguagem de manuais científicos.","Não há nada de científico nesse recurso."]]},
{"k":"l3","lv":2,"s":"O narrador de Saramago costuma ser","c":1,"o":[["um personagem em 1ª pessoa que só sabe o que viu.","Ele é onisciente e sabe mais que os personagens."],["onisciente e intruso: comenta, opina, ironiza e conversa com o leitor.","Isso. Faz digressões e usa ditados populares."],["neutro e impassível, como na poesia parnasiana.","Impassibilidade é ideal parnasiano; o narrador de Saramago opina o tempo todo."],["um defunto autor, como Brás Cubas.","É Machado de Assis."],["ausente, porque o romance só tem diálogos.","O narrador é muito presente."]]},
{"k":"l3","lv":2,"s":"Em <i>Memorial do convento</i>, a passarola do padre Bartolomeu de Gusmão voa graças às “vontades” recolhidas por Blimunda. O que essa mistura de fato histórico e fantasia permite ao autor?","c":2,"o":[["Escrever um livro de história com datas exatas.","O romance não é livro didático: mistura fatos e invenção."],["Elogiar o poder do rei e da Inquisição.","O romance critica o rei e a Inquisição."],["Contar a história pelo lado dos anônimos e criticar o poder absoluto e a Igreja.","Isso. A fantasia (o sonho de voar) se opõe à opressão (Mafra, autos de fé)."],["Provar cientificamente que o ser humano pode voar.","Não há intenção científica; é alegoria."],["Imitar a forma das cantigas medievais.","Não há relação com o trovadorismo."]]},
{"k":"l3","lv":2,"s":"A “cegueira branca” de <i>Ensaio sobre a cegueira</i> é uma alegoria. Ela representa principalmente","c":3,"o":[["uma doença real que existiu em Portugal.","É ficção; vale pelo que simboliza."],["a vitória da ciência sobre a religião.","Não é esse o conflito do romance."],["a saudade da pátria distante.","Saudade da pátria é tema romântico (“Canção do exílio”)."],["a cegueira moral: perda da ética e da solidariedade, que leva a sociedade à barbárie.","Isso. As pessoas “veem, mas não reparam” umas nas outras."],["a beleza da cor branca, como em Cruz e Sousa.","O branco de Cruz e Sousa é simbolista; aqui é alegoria social."]]},
{"k":"l3","lv":2,"s":"Por que as personagens de <i>Ensaio sobre a cegueira</i> não têm nome (“o médico”, “a rapariga dos óculos escuros”)?","c":0,"o":[["Para universalizar a história: pode acontecer com qualquer pessoa, em qualquer cidade.","Isso. A falta de nomes reforça a alegoria."],["Porque o autor esqueceu de nomeá-las.","É escolha consciente."],["Porque a censura proibia nomes próprios.","Não há relação com censura."],["Para imitar o estilo parnasiano.","O Parnasianismo não tem relação com isso."],["Porque são personagens históricas reais.","São fictícias."]]},
{"k":"l3","lv":2,"s":"Saramago costuma partir de uma hipótese absurda (“e se…?”). Qual obra corresponde a “e se a morte parasse de matar num país?”","c":4,"o":[["<i>A jangada de pedra</i>.","Nela, a Península Ibérica se solta da Europa."],["<i>Ensaio sobre a lucidez</i>.","Nela, a maioria vota em branco."],["<i>Memorial do convento</i>.","É romance histórico sobre Mafra."],["<i>Levantado do chão</i>.","Trata dos camponeses do Alentejo."],["<i>As intermitências da morte</i>.","Isso (2005)."]]},
{"k":"l3","lv":2,"s":"<i>O Evangelho segundo Jesus Cristo</i> causou polêmica, e o veto do governo português a esse livro levou Saramago a morar em Lanzarote, na Espanha.","v":true,"e":"Correto. O veto foi em 1992; ele se mudou para Lanzarote (Canárias) e lá morreu em 2010."},
{"k":"l3","lv":2,"s":"Leia o trecho criado para este exercício, imitando o estilo de Saramago:<br><i>“Perguntou o homem, Onde estamos, e a mulher respondeu, Não sei, mas sei que não estamos sós, o que, convenhamos, já é alguma coisa.”</i><br>Identifique as marcas presentes.","c":0,"o":[["Falas sem travessão, iniciadas por maiúscula e separadas por vírgula, e intervenção do narrador (“convenhamos”).","Isso. Diálogo embutido no parágrafo e narrador que comenta."],["Versos decassílabos com rima rica.","É prosa, sem métrica."],["Isomorfismo e sintaxe espacial.","Não há jogo visual com a página."],["Linguagem científica e determinista.","Não há explicação científica."],["Erro de pontuação que precisa ser corrigido.","Não é erro: é escolha de estilo."]]},
{"k":"l3","lv":2,"s":"Sobre José Saramago, avalie:<br>I. É o único escritor de língua portuguesa premiado com o Nobel de Literatura (1998).<br>II. Seus romances mais conhecidos são anteriores à Revolução dos Cravos (1974).<br>III. Mudou-se para Lanzarote após o governo português vetar <i>O Evangelho segundo Jesus Cristo</i> num prêmio europeu.<br>Está correto o que se afirma em","c":2,"o":[["I, apenas.","A III também está correta."],["II e III, apenas.","A II é falsa: os grandes romances são dos anos 1980 e 1990."],["I e III, apenas.","Isso."],["I, II e III.","A II é falsa."],["III, apenas.","A I também está correta."]]},
{"k":"l3","lv":2,"s":"Em <i>Memorial do convento</i>, a construção de Mafra é narrada pela ótica dos trabalhadores, e não do rei. Essa escolha caracteriza","c":3,"o":[["um romance histórico tradicional, que exalta os heróis da nação.","O romance desmonta a exaltação: critica o rei e mostra o custo humano da obra."],["um poema épico em oitava-rima, como <i>Os lusíadas</i>.","É prosa, não epopeia em versos."],["uma narrativa naturalista, que explica as personagens pelo determinismo.","Não há tese científica; há fantasia (vontades, passarola)."],["uma releitura crítica da história oficial, que dá voz aos anônimos e excluídos.","Isso. Mistura fato e ficção para criticar o poder absoluto e a Inquisição."],["uma autobiografia do autor.","Saramago não é personagem; a ação é no século XVIII."]]},
{"k":"l3","lv":2,"s":"Em <i>Ensaio sobre a cegueira</i>, a mulher do médico finge estar cega para acompanhar o marido na quarentena. Considerando a alegoria do romance, o papel dela é","c":1,"o":[["provar que a cegueira era apenas imaginação coletiva.","A cegueira é real na trama; a questão é o que ela simboliza."],["representar a responsabilidade ética de quem “vê” numa sociedade que perdeu a solidariedade.","Isso. Ela guia, cuida e também sofre por enxergar a barbárie."],["mostrar o determinismo biológico da doença.","Não há tese naturalista."],["simbolizar a pureza da cor branca, como em Cruz e Sousa.","O branco aqui é a “cegueira branca”, alegoria social."],["defender o governo que organizou a quarentena.","O romance critica a forma desumana da quarentena."]]},
{"k":"l3","lv":2,"s":"A literatura portuguesa contemporânea, em que se insere Saramago, se desenvolve sobretudo","c":4,"o":[["no século XVI, junto com Camões.","Camões é do Classicismo."],["na Questão Coimbrã de 1865.","Questão Coimbrã é o início do Realismo português."],["durante a Belle Époque.","Belle Époque é o contexto do Parnasianismo e do Simbolismo."],["no Modernismo de Fernando Pessoa e da revista <i>Orpheu</i> (1915).","Pessoa é modernista; Saramago chega a usar Ricardo Reis como personagem, décadas depois."],["depois da Revolução dos Cravos (1974), com o fim da ditadura salazarista.","Isso. Saramago, Lobo Antunes, Lídia Jorge, Cardoso Pires, entre outros."]]},
{"k":"l3","lv":2,"s":"“Se podes olhar, vê. Se podes ver, repara.” A epígrafe de <i>Ensaio sobre a cegueira</i> sugere que","c":0,"o":[["há uma diferença entre enxergar fisicamente e perceber de verdade o outro e a realidade.","Isso. Olhar → ver → reparar: graus crescentes de atenção ética."],["o romance trata de técnicas de pintura impressionista.","Não há relação com pintura."],["a cegueira é castigo divino.","O romance não apresenta a cegueira como castigo religioso."],["só os médicos podem curar a sociedade.","O médico também fica cego; quem vê é a mulher dele."],["o autor defende a censura.","Não há relação com censura."]]},
{"k":"lr","lv":2,"s":"Na lista de questões sobre Realismo e Naturalismo, qual estrofe de Augusto dos Anjos melhor traduz o determinismo de Claude Bernard, segundo o gabarito?","c":1,"o":[["A 1ª (“Eu, filho do carbono e do amoníaco”).","Também é determinista, mas o gabarito da lista escolheu as estrofes do verme."],["A 3ª e a última (o verme, “operário das ruínas”, que devolve o corpo à matéria inorgânica).","Isso. Mostram que vivos e “corpos brutos” seguem a mesma lei: o corpo vira matéria inerte."],["A 2ª (“Profundissimamente hipocondríaco”).","Ela fala do mal-estar do eu lírico; não é a escolhida."],["Nenhuma: o poema é romântico.","O poema é do início do século XX e tem marcas cientificistas, nada românticas."],["Todas igualmente; não há escolha.","A questão pede a estrofe que melhor traduz a ideia."]]},
