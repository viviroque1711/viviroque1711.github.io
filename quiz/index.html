<script>

const Q = [
/* ===== s1 ===== */
{k:"s1",lv:2,s:"Frantz Fanon, psiquiatra nascido na Martinica que atuou na Argélia, descreve o mundo colonial como um espaço dividido em dois: a cidade do colonizador, iluminada, asfaltada e abastecida, e a cidade do colonizado, precária e superpovoada. Essa descrição tem como objetivo principal mostrar que:",c:0,o:[["o colonialismo compartimenta o espaço e a vida social, produzindo e reforçando desigualdades entre colonos e colonizados.","Isso. Para Fanon, o mundo colonial é compartimentado: a separação espacial expressa e reproduz a hierarquia entre colonizador e colonizado, sustentada pela força e pelo racismo."],["as diferenças entre as duas cidades resultam de diferenças naturais de capacidade produtiva entre os povos envolvidos.","Errado. Fanon rejeita qualquer naturalização: a desigualdade é produzida historicamente pela dominação colonial, não por capacidades “naturais”."],["a divisão espacial é um efeito passageiro da urbanização, sem relação com a dominação política.","Errado. A compartimentação não é acidente urbano: ela é a forma concreta da dominação colonial e é mantida pela violência."],["o colonizado escolhe livremente viver separado para preservar sua cultura tradicional.","Errado. A separação é imposta pelo colonizador; não há escolha livre num regime sustentado pela força."],["a colonização se limita à ocupação física e militar do território, sem atingir a cultura, a língua ou a identidade do colonizado, que permanecem intactas.","Errado. Para Fanon a colonização vai muito além do território: atinge língua, cultura, identidade e a própria autopercepção do colonizado."]]},
{k:"s1",lv:2,s:"Leia as afirmações sobre “Pele negra, máscaras brancas” (1952), de Frantz Fanon:<br>I. A obra analisa como o racismo colonial pode ser interiorizado pelo sujeito negro, que passa a ver a si mesmo a partir do olhar do branco.<br>II. Fanon sustenta que a inferioridade sentida pelo colonizado tem origem biológica e, por isso, só pode ser tratada individualmente pela psiquiatria.<br>III. A língua do colonizador aparece como um dos meios pelos quais o colonizado busca reconhecimento, o que revela a dimensão cultural da dominação.<br>Está correto o que se afirma em:",c:1,o:[["I, apenas.","Errado. A afirmação III também está correta: Fanon discute a língua do colonizador como via de busca por reconhecimento e expressão da dominação cultural."],["I e III, apenas.","Isso. I descreve a interiorização (epidermização) da inferioridade e III a dimensão linguística e cultural da alienação. II é falsa: a inferioridade é produzida social e historicamente, não biologicamente."],["II e III, apenas.","Errado. A II é falsa: Fanon, embora psiquiatra, insiste que a origem do sofrimento é social e histórica (colonial), não biológica."],["I e II, apenas.","Errado. A II naturaliza a inferioridade, o oposto do que Fanon defende; e a III, que está correta, ficou de fora."],["I, II e III.","Errado. A II é falsa: Fanon desnaturaliza a inferioridade, mostrando que ela é efeito do racismo e da situação colonial."]]},
{k:"s1",lv:2,s:"Considere a situação: um estudante negro relata que, desde criança, alisava o cabelo e evitava falar de suas origens porque aprendeu que tudo o que era associado à negritude seria “feio” ou “inferior”. Com base em Fanon, esse relato pode ser interpretado como exemplo de:",c:2,o:[["escolha estética individual, sem relação com estruturas históricas de dominação.","Errado. Fanon mostra que tais “escolhas” são moldadas por padrões impostos historicamente pelo racismo colonial; não são neutras."],["descolonização plena, pois o sujeito adota os padrões que garantem mobilidade social.","Errado. Adotar os padrões do dominador é justamente expressão da alienação, não da descolonização."],["alienação e interiorização da inferioridade, em que o sujeito passa a julgar a si mesmo pelos valores impostos pelo colonizador.","Isso. É o que Fanon chama de epidermização da inferioridade: o racismo se instala na autopercepção, e o sujeito busca as “máscaras brancas” para ser aceito."],["violência física colonial, pois o racismo em Fanon se resumiria a agressões corporais diretas, sem efeitos sobre a forma como o sujeito se vê.","Errado. O racismo em Fanon inclui violência física, mas também simbólica e psicológica; o relato descreve sobretudo esta última."],["dominação racional-legal, conforme a tipologia de Max Weber.","Errado. A tipologia weberiana trata da legitimidade da dominação política; não descreve a interiorização da inferioridade racial analisada por Fanon."]]},
{k:"s1",lv:2,s:"Em “Os condenados da terra” (1961), escrito no contexto da guerra de independência da Argélia, Fanon analisa a descolonização. Assinale a alternativa que interpreta corretamente a relação entre colonialismo, violência e identidade nessa obra.",c:3,o:[["A descolonização seria um processo burocrático e pacífico de transferência de poder entre elites, sem efeitos relevantes sobre a subjetividade e a identidade dos colonizados.","Errado. Para Fanon, a descolonização transforma também os sujeitos: é processo de recriação de identidade, não mera troca administrativa."],["O colonialismo teria sido mantido sobretudo pelo consenso dos colonizados, sem uso de força.","Errado. Fanon enfatiza que o regime colonial se impõe e se mantém pela violência; o consenso não é seu fundamento."],["A obra defende que a identidade nacional pós-colonial deve copiar fielmente as instituições e a cultura da antiga metrópole.","Errado. Fanon critica justamente as elites que reproduzem os modelos da metrópole após a independência."],["Como o colonialismo nasce e se sustenta pela violência, a descolonização envolve uma ruptura que é também a reconstrução do colonizado como sujeito histórico.","Isso. Fanon relaciona violência colonial e luta de libertação: a descolonização é ruptura com a ordem colonial e processo de criação de novos sujeitos, ainda que o autor também aponte os traumas e riscos desse processo."],["Fanon considera o racismo um tema secundário, pois a colonização seria um problema exclusivamente econômico.","Errado. Para Fanon, racismo e colonialismo são inseparáveis: a exploração econômica se apoia na inferiorização racial."]]},
{k:"s1",lv:2,s:"Fanon descreve o mundo colonial como maniqueísta. Nesse contexto, o termo “maniqueísmo colonial” refere-se:",c:4,o:[["à tolerância religiosa que o colonizador mantinha em relação às crenças locais.","Errado. O termo não fala de tolerância religiosa; ao contrário, descreve uma visão que demoniza o colonizado."],["ao equilíbrio de poder entre colonos e colonizados, que, apesar das diferenças culturais, dividiam de maneira igualitária a terra, o trabalho e os recursos.","Errado. Não há equilíbrio algum no mundo colonial descrito por Fanon; há hierarquia e dominação."],["a uma estratégia dos colonizados de valorizar o colonizador como modelo moral.","Errado. O maniqueísmo é a lógica do colonizador, que se apresenta como o bem; a idealização do colonizador é efeito dessa lógica, não sua definição."],["à divisão do território em zonas econômicas especializadas e complementares.","Errado. A compartimentação espacial existe, mas não como complementaridade; e o maniqueísmo é sobretudo uma divisão moral e simbólica."],["à representação do mundo em polos opostos: o colonizador encarna o bem e a civilização; o colonizado, o mal e a ausência de valores.","Isso. O maniqueísmo colonial desumaniza o colonizado, retratando-o como encarnação do mal, o que justifica a dominação e a violência."]]},
{k:"s1",lv:2,s:"Um professor afirma: segundo Fanon, mesmo após a independência formal de um país, as marcas do colonialismo podem persistir. Qual alternativa justifica corretamente essa afirmação?",c:2,o:[["A colonização, para Fanon, é apenas a presença de tropas e administradores estrangeiros; quando eles deixam o país, terminam todos os efeitos coloniais.","Errado. Essa é a pegadinha clássica: Fanon mostra que a colonização vai além do território e das tropas."],["As marcas persistem porque os povos colonizados seriam naturalmente incapazes de autogoverno.","Errado. Afirmação racista que Fanon combate; ele nunca atribui as dificuldades a incapacidades naturais."],["Porque a colonização também se instala na cultura, na língua e na autopercepção dos sujeitos, o que não desaparece com a mudança política.","Isso. A dominação colonial atua na subjetividade e na cultura; por isso a descolonização exige mais que independência formal."],["Porque a única herança colonial relevante é a dívida externa, de natureza puramente econômica.","Errado. Fanon dá centralidade às dimensões psicológicas, culturais e raciais, não apenas econômicas."],["Porque, para Fanon, a cultura do colonizado é superior e por isso resiste a qualquer mudança.","Errado. Fanon não hierarquiza culturas desse modo; ele analisa como a cultura colonizada é inferiorizada e precisa ser reconstruída."]]},
{k:"s1",lv:2,s:"Para Frantz Fanon, o racismo não é apenas um preconceito individual isolado, mas um elemento estrutural do sistema colonial, ligado à inferiorização, à exclusão e à violência contra os colonizados.",v:true,e:"Verdadeiro. Fanon entende o racismo como parte da própria estrutura colonial: ele justifica a exploração, organiza a desigualdade e se manifesta em violência física, simbólica e psicológica."},
{k:"s1",lv:2,s:"Em “Pele negra, máscaras brancas”, Fanon conclui que a alienação do colonizado é um problema exclusivamente psicológico individual, sem relação com as condições sociais e históricas do colonialismo.",v:false,e:"Falso. Embora psiquiatra, Fanon insiste na origem social da alienação: ela é produzida pela situação colonial e pelo racismo, e só pode ser superada com a transformação dessas condições."},
/* ===== s2 ===== */
{k:"s2",lv:2,s:"Zygmunt Bauman, em “Modernidade líquida” (2000), contrapõe uma fase “sólida” a uma fase “líquida” da modernidade. Assinale a alternativa que caracteriza corretamente essa distinção.",c:3,o:[["A modernidade sólida é marcada pelas redes sociais digitais e pelo trabalho flexível; a líquida, pelas grandes fábricas, sindicatos fortes e empregos para a vida toda.","Errado. A relação está invertida: fábricas e empregos estáveis caracterizam a fase sólida; a fluidez digital está associada à líquida."],["A modernidade líquida representa o fim de toda forma de organização social e de vínculo entre as pessoas.","Errado. Bauman não fala em fim das relações ou da sociedade, mas em vínculos mais frágeis, provisórios e instáveis."],["A diferença entre as fases é apenas tecnológica, sem impacto sobre identidade, trabalho e relações afetivas.","Errado. Para Bauman a mudança atinge identidade, trabalho, amor, consumo e segurança; não é apenas técnica."],["Na fase sólida predominavam instituições e projetos duradouros; na líquida, as estruturas se desfazem rapidamente, gerando instabilidade e individualização.","Isso. A metáfora dos líquidos indica formas sociais que não mantêm a forma por muito tempo, transferindo ao indivíduo a responsabilidade de lidar com a incerteza."],["A modernidade líquida é um período pré-moderno, anterior à industrialização.","Errado. A modernidade líquida é uma fase recente da própria modernidade, não algo anterior a ela."]]},
{k:"s2",lv:2,s:"Considere a situação: Lucas tem mais de 2 mil “amigos” em uma rede social e costuma desfazer amizades com um clique quando algo o incomoda. Ainda assim, diz sentir-se sozinho. À luz de “Amor líquido” (2003), de Bauman, essa situação ilustra:",c:4,o:[["o fortalecimento dos laços comunitários tradicionais graças à tecnologia.","Errado. Bauman aponta o oposto: a tecnologia facilita contatos, mas não necessariamente fortalece laços duradouros."],["a prova de que, na modernidade líquida, as pessoas deixaram completamente de se relacionar.","Errado. Pegadinha: Bauman não diz que as relações acabaram; Lucas se relaciona muito, mas de forma frágil."],["o predomínio do compromisso de longo prazo sobre a liberdade individual.","Errado. Na leitura de Bauman, o que predomina é o temor do compromisso; busca-se liberdade para sair a qualquer momento."],["a superação da insegurança, já que muitos contatos garantem apoio permanente.","Errado. A quantidade de contatos não elimina a insegurança; Bauman associa as conexões frágeis justamente à ansiedade e à solidão."],["a substituição de relações por conexões: vínculos fáceis de criar e desfazer, que oferecem quantidade, mas pouca profundidade e segurança.","Isso. Bauman distingue relacionamentos de conexões; estas podem ser desfeitas com facilidade, o que dá sensação de liberdade, mas gera fragilidade e solidão."]]},
{k:"s2",lv:2,s:"Em “Vida para consumo” (2007), Bauman analisa a passagem de uma sociedade de produtores para uma sociedade de consumidores. Assinale a alternativa que expressa corretamente uma tese dessa obra.",c:0,o:[["Na sociedade de consumidores, as próprias pessoas são pressionadas a se tornar mercadorias atraentes para não serem descartadas.","Isso. Bauman mostra que o indivíduo precisa se “vender” (no mercado de trabalho, nas redes, nos afetos), e quem não consegue corre o risco de ser descartado."],["O consumo passou a ser irrelevante para a construção das identidades, que hoje dependem apenas de vínculos herdados, como a família, a religião e a comunidade local.","Errado. Bauman afirma o contrário: o consumo tornou-se central para construir e exibir identidades."],["A sociedade de consumidores elimina o descarte, pois os bens passam a ser feitos para durar gerações.","Errado. A lógica é a da rápida obsolescência e do descarte de bens, e até de pessoas."],["Consumir, para Bauman, é apenas satisfazer necessidades biológicas, sem dimensão simbólica.","Errado. O consumo descrito por Bauman é sobretudo simbólico: define pertencimento, status e identidade."],["A sociedade de consumidores garante inclusão de todos, já que qualquer pessoa pode comprar.","Errado. Bauman destaca a exclusão dos “consumidores falhos”, aqueles sem recursos para participar do mercado."]]},
{k:"s2",lv:2,s:"Leia as afirmações sobre Bauman:<br>I. Em “Medo líquido” (2006), o autor associa a modernidade líquida a uma sensação difusa de insegurança e incerteza.<br>II. A precarização do trabalho dificulta a elaboração de projetos de vida de longo prazo.<br>III. Para Bauman, a individualização liberta completamente o sujeito, que deixa de sofrer qualquer pressão social.<br>Está correto o que se afirma em:",c:1,o:[["I, apenas.","Errado. A II também está correta: Bauman relaciona trabalho precário à dificuldade de planejar a vida."],["I e II, apenas.","Isso. I e II resumem teses de Bauman sobre medo e precariedade. A III é falsa: a individualização transfere responsabilidades ao indivíduo, que passa a enfrentar sozinho riscos produzidos socialmente."],["II e III, apenas.","Errado. A III é falsa: a individualização não elimina pressões; ela as torna responsabilidade do indivíduo."],["I e III, apenas.","Errado. A III é falsa e a II, correta, ficou de fora."],["I, II e III.","Errado. A III contradiz Bauman, para quem a liberdade individual vem acompanhada de insegurança e novas pressões."]]},
{k:"s2",lv:2,s:"Um jovem troca de celular todo ano, mesmo com o anterior funcionando, porque sente que, com o modelo antigo, os colegas o veem como “ultrapassado”. Segundo Bauman, esse comportamento revela principalmente:",c:2,o:[["uma necessidade técnica, pois aparelhos com um ano de uso deixam de funcionar.","Errado. O enunciado diz que o aparelho funciona; a motivação é social e simbólica."],["a permanência de uma lógica sólida de durabilidade e poupança.","Errado. A lógica sólida valorizava a durabilidade; o comportamento descrito é típico da fase líquida."],["a construção da identidade e do reconhecimento social por meio do consumo, numa lógica de rápida obsolescência e descarte.","Isso. Na sociedade de consumidores, o que se consome comunica quem se é; manter-se atualizado vira condição de pertencimento."],["a disciplina dos corpos nas instituições de confinamento, como descreve Foucault.","Errado. Trata-se de outro autor e outro conceito; a situação é de consumo e identidade, tema de Bauman."],["a dominação carismática, já que o jovem obedece a um líder excepcional.","Errado. A tipologia de Weber sobre dominação não explica esse comportamento de consumo."]]},
{k:"s2",lv:2,s:"Um estudante resumiu Bauman assim: na modernidade líquida, não existem mais relações humanas, apenas indivíduos isolados. Qual é a correção mais adequada a esse resumo?",c:4,o:[["O resumo está correto, pois Bauman anuncia o fim da sociedade.","Errado. Bauman não anuncia o fim da sociedade nem das relações; essa é uma leitura exagerada."],["O resumo erra porque Bauman afirma que as relações atuais são mais sólidas que as do passado.","Errado. Bauman sustenta que os vínculos ficaram mais frágeis, não mais sólidos."],["O resumo erra porque Bauman só estuda a economia, e não as relações pessoais.","Errado. Bauman analisa amor, amizade, comunidade e identidade, além do trabalho e do consumo."],["O resumo erra porque, para Bauman, o isolamento é causado apenas pela falta de acesso à internet e desapareceria com a inclusão digital de toda a população.","Errado. Bauman não reduz a questão ao acesso à tecnologia; trata de mudanças estruturais da modernidade."],["As relações continuam existindo, mas tornam-se mais frágeis, provisórias e marcadas pela ambivalência entre o desejo de segurança e o desejo de liberdade.","Isso. Bauman descreve a liquefação dos vínculos, não seu desaparecimento: as pessoas querem laços, mas temem que eles as prendam."]]},
{k:"s2",lv:2,s:"Para Bauman, na modernidade líquida o indivíduo enfrenta riscos de origem social (como desemprego e instabilidade) como se fossem problemas pessoais, a serem resolvidos por esforço próprio.",v:true,e:"Verdadeiro. Essa é uma das faces da individualização: problemas produzidos socialmente passam a ser vividos e cobrados como responsabilidade individual, o que aumenta a insegurança."},
{k:"s2",lv:2,s:"Segundo Bauman, a modernidade sólida e a modernidade líquida são duas sociedades totalmente distintas, pois a modernidade líquida representa o fim da modernidade e o retorno a formas tradicionais de vida.",v:false,e:"Falso. A modernidade líquida é uma fase da própria modernidade, marcada pela dissolução das estruturas estáveis, e não um retorno à tradição nem o fim da modernidade."},
/* ===== s3 ===== */
{k:"s3",lv:2,s:"Michel Foucault propõe analisar o poder como uma microfísica. Isso significa que o poder:",c:1,o:[["se concentra exclusivamente no Estado e é exercido de cima para baixo pelos governantes, por meio de leis, tribunais, polícia, exército e demais aparelhos repressivos.","Errado. Essa é justamente a visão que Foucault critica; para ele o poder não está localizado apenas no Estado."],["circula em rede nas relações cotidianas e nas instituições, como escola, família, hospital e fábrica, sendo exercido e não simplesmente possuído.","Isso. Para Foucault, o poder é relacional e capilar: atravessa práticas e instituições, não sendo uma coisa que alguém detém."],["é sempre e somente repressivo, limitando-se a proibir e censurar.","Errado. Pegadinha: Foucault destaca o caráter produtivo do poder, que produz comportamentos, saberes e sujeitos."],["depende da legitimidade carismática de um líder, como na tipologia weberiana.","Errado. Isso confunde Foucault com Weber; a microfísica não se baseia em tipos de legitimidade."],["desaparece nas sociedades democráticas, onde todos são iguais perante a lei.","Errado. Para Foucault, as relações de poder atravessam também as sociedades democráticas, nas instituições e no cotidiano."]]},
{k:"s3",lv:2,s:"Considere a rotina de uma escola: horários fixos marcados por sinal, carteiras enfileiradas, chamada diária, uniforme, provas classificatórias e registros de comportamento. Segundo “Vigiar e punir” (1975), de Foucault, esses elementos exemplificam:",c:2,o:[["práticas sem qualquer relação com o poder, pois a escola tem função apenas pedagógica.","Errado. Para Foucault, a escola é uma das instituições disciplinares por excelência."],["a dominação tradicional, fundada no respeito aos costumes antigos.","Errado. Essa categoria é de Weber; Foucault analisa técnicas disciplinares, não tipos de legitimidade."],["técnicas disciplinares que organizam o tempo, o espaço e os gestos para produzir “corpos dóceis”, úteis e obedientes.","Isso. A disciplina distribui os corpos no espaço, controla o tempo e as atividades e usa o exame para classificar e normalizar."],["a sociedade de controle, típica do capitalismo digital, segundo Deleuze.","Errado. A escola descrita é um espaço fechado de confinamento, típico das sociedades disciplinares, e não do controle aberto e contínuo de Deleuze."],["o monopólio do uso legítimo da violência física pelo Estado.","Errado. A disciplina age sobre comportamentos de modo minucioso, sem depender da violência física; o conceito citado é de Weber."]]},
{k:"s3",lv:2,s:"O Panóptico, projeto arquitetônico de Jeremy Bentham analisado por Foucault, é composto por uma torre central e celas dispostas em anel. Sobre seu funcionamento como modelo de poder, é correto afirmar que:",c:3,o:[["o poder depende da presença contínua de um vigia na torre central; se a torre estiver vazia, os presos percebem e o mecanismo deixa imediatamente de funcionar.","Errado. O efeito do Panóptico independe de haver alguém de fato na torre; basta a possibilidade de estar sendo visto."],["os presos podem ver o vigia, o que garante transparência e igualdade entre vigiados e vigilantes.","Errado. É o contrário: o vigia vê sem ser visto, e essa assimetria é central no dispositivo."],["o modelo se aplica apenas às prisões e não serve para pensar outras instituições.","Errado. Foucault usa o Panóptico como modelo geral de sociedade disciplinar, aplicável a escolas, fábricas, hospitais e quartéis."],["a possibilidade permanente de estar sendo observado leva o indivíduo a vigiar a si mesmo, interiorizando o controle e reduzindo a necessidade de força física.","Isso. O Panóptico automatiza o poder: o vigiado se torna o próprio fiscal de sua conduta, o que torna o poder mais eficiente e econômico."],["o objetivo principal é punir fisicamente os presos de forma espetacular, diante do público.","Errado. O suplício público é a forma de punição que, segundo Foucault, é substituída pela disciplina e pela vigilância."]]},
{k:"s3",lv:2,s:"Leia as afirmações sobre a relação poder-saber em Foucault:<br>I. Saberes como a medicina, a psiquiatria e a pedagogia participam da definição do que é considerado normal e anormal.<br>II. Para Foucault, a verdade científica é totalmente independente das relações de poder.<br>III. O exame (médico, escolar) é uma técnica que combina vigilância e produção de conhecimento sobre os indivíduos.<br>Está correto o que se afirma em:",c:4,o:[["I, apenas.","Errado. A III também está correta: o exame é um ponto de encontro entre poder e saber."],["II, apenas.","Errado. A II é justamente a afirmação falsa: para Foucault saber e poder se implicam mutuamente."],["I e II, apenas.","Errado. A II é falsa e a III, verdadeira, foi excluída."],["II e III, apenas.","Errado. A II é falsa: Foucault mostra que regimes de verdade se constituem em relações de poder."],["I e III, apenas.","Isso. I e III expressam a articulação poder-saber: saberes produzem normas, e o exame vigia e registra os indivíduos. A II contradiz Foucault."]]},
{k:"s3",lv:2,s:"Um aluno afirmou que, para Foucault, o poder é algo negativo que apenas impede as pessoas de agir. Qual alternativa corrige adequadamente essa ideia?",c:0,o:[["Para Foucault, o poder também é produtivo: produz comportamentos, saberes, identidades e até a noção de indivíduo normal.","Isso. Foucault critica a hipótese repressiva: o poder não só proíbe, mas fabrica sujeitos, hábitos e verdades."],["Para Foucault, o poder é sempre positivo e deve ser apoiado sem críticas.","Errado. “Produtivo” não significa “bom”; Foucault descreve o funcionamento do poder, sem elogiá-lo."],["Para Foucault, o poder só existe quando há violência física explícita.","Errado. A disciplina funciona justamente sem precisar de violência explícita, pela vigilância e pela norma."],["Para Foucault, o poder pertence apenas aos que governam o Estado.","Errado. Essa visão centralizada é a que Foucault questiona com a microfísica do poder."],["Para Foucault, o poder foi abolido com o fim do absolutismo.","Errado. O poder muda de forma (do suplício à disciplina), mas não desaparece."]]},
{k:"s3",lv:2,s:"Comparando Michel Foucault e Max Weber no estudo do poder, assinale a alternativa correta.",c:0,o:[["Weber enfatiza a legitimidade da dominação e o Estado como monopólio da violência legítima; Foucault analisa técnicas disciplinares difusas em várias instituições.","Isso. Weber pergunta por que se obedece (legitimidade) e define o Estado pela violência legítima; Foucault investiga como o poder funciona capilarmente nas relações e instituições."],["Ambos definem o poder como algo que se localiza exclusivamente no aparelho de Estado.","Errado. Foucault rejeita a ideia de que o poder se localize só no Estado."],["Foucault criou a tipologia da dominação tradicional, carismática e racional-legal.","Errado. Confusão de autores: essa tipologia é de Max Weber."],["Weber formulou o conceito de “corpos dóceis” para explicar a burocracia.","Errado. “Corpos dóceis” é conceito de Foucault, em “Vigiar e punir”."],["Ambos afirmam que o poder é exclusivamente repressivo, exercido apenas pela força física do Estado, e que por isso desaparece quando não há coerção explícita ou ameaça de punição.","Errado. Weber trata de legitimidade e obediência, e Foucault ressalta o caráter produtivo do poder."]]},
{k:"s3",lv:2,s:"Segundo Foucault, a disciplina é um poder que atua de forma minuciosa sobre os corpos, organizando tempo, espaço e comportamento, e está presente em instituições como escola, prisão, hospital, quartel e fábrica.",v:true,e:"Verdadeiro. Em “Vigiar e punir”, Foucault mostra que essas instituições compartilham técnicas disciplinares (distribuição no espaço, controle do tempo, vigilância, exame, sanção normalizadora) que produzem “corpos dóceis”."},
{k:"s3",lv:2,s:"No modelo do Panóptico analisado por Foucault, o controle só é eficaz se o vigilante estiver o tempo todo observando cada preso, pois o poder depende da presença física constante de quem vigia.",v:false,e:"Falso. O essencial é a possibilidade de ser visto sem saber quando: o vigiado passa a se autocontrolar, e o poder funciona mesmo com a torre vazia."},
/* ===== s4 ===== */
{k:"s4",lv:2,s:"Gilles Deleuze, no “Post-scriptum sobre as sociedades de controle” (1990), afirma que as sociedades disciplinares descritas por Foucault estariam dando lugar a outra forma de poder. Assinale a alternativa que caracteriza corretamente a sociedade de controle.",c:4,o:[["Ela intensifica o confinamento: as pessoas passam a viver o tempo todo dentro de prisões e fábricas fechadas.","Errado. A marca da sociedade de controle é justamente o controle aberto, que dispensa os muros dos espaços de confinamento."],["Ela representa o fim de toda forma de poder, pois a tecnologia digital teria dado aos indivíduos liberdade plena para circular, consumir e se informar sem restrições.","Errado. Deleuze não fala em fim do poder, mas em mudança de suas formas; o controle pode ser até mais contínuo."],["Ela é idêntica à dominação tradicional descrita por Weber, baseada nos costumes.","Errado. Confusão de autores e conceitos; o controle de Deleuze se apoia em fluxos de informação, não na tradição."],["Ela substitui a vigilância por uma confiança plena entre cidadãos e Estado.","Errado. A vigilância não desaparece: ela se torna contínua, modulada e baseada em dados."],["O controle torna-se contínuo e aberto, exercido por senhas, dados, crédito e formação permanente, sem depender de instituições fechadas.","Isso. Deleuze descreve a passagem dos moldes (instituições fechadas) às modulações contínuas; hoje algoritmos e vigilância digital tornam essa análise muito atual."]]},
{k:"s4",lv:2,s:"Considere a situação: um aplicativo de transporte avalia constantemente motoristas por notas de clientes, registra localização em tempo real e bloqueia automaticamente quem fica abaixo de certa média. Qual conceito melhor descreve essa forma de poder?",c:0,o:[["Sociedade de controle, de Deleuze: monitoramento contínuo por dados e algoritmos, fora de um espaço fechado.","Isso. O controle se dá em fluxo, por senhas, notas e dados, sem confinamento; é a modulação contínua descrita por Deleuze."],["Dominação carismática, de Weber, pois os motoristas obedecem a um líder excepcional.","Errado. Não há líder carismático; o controle é impessoal e automatizado."],["Maniqueísmo colonial, de Fanon, pois divide o mundo em colonos e colonizados.","Errado. O conceito de Fanon trata da situação colonial e do racismo, não do controle algorítmico do trabalho."],["Suplício público, pois o motorista é punido fisicamente diante de todos.","Errado. Não há punição corporal espetacular; a sanção é automática e informacional."],["Modernidade sólida, de Bauman, marcada por empregos estáveis e de longo prazo.","Errado. A situação mostra trabalho precário e instável, o oposto da modernidade sólida."]]},
{k:"s4",lv:2,s:"Max Weber distingue três tipos puros de dominação legítima. Associe corretamente os exemplos:<br>I. Um rei cuja autoridade é aceita porque sempre foi assim, segundo os costumes herdados.<br>II. Um líder religioso seguido por suas qualidades consideradas extraordinárias.<br>III. Um servidor público que exerce autoridade com base em leis e regulamentos impessoais.<br>A sequência correta é:",c:1,o:[["I – carismática; II – tradicional; III – racional-legal.","Errado. Inverteu I e II: a autoridade fundada nos costumes é tradicional, e a fundada em qualidades extraordinárias é carismática."],["I – tradicional; II – carismática; III – racional-legal.","Isso. A dominação tradicional se apoia nos costumes; a carismática, nas qualidades excepcionais do líder; a racional-legal, em regras impessoais e na burocracia."],["I – racional-legal; II – carismática; III – tradicional.","Errado. O servidor que segue leis impessoais é exemplo de dominação racional-legal, não tradicional."],["I – tradicional; II – racional-legal; III – carismática.","Errado. O líder seguido por qualidades extraordinárias é carismático; o servidor que aplica leis é racional-legal."],["I – carismática; II – racional-legal; III – tradicional.","Errado. Todas as associações estão trocadas em relação à tipologia weberiana."]]},
{k:"s4",lv:2,s:"Hannah Arendt diferencia poder e violência. Com base nessa distinção, assinale a alternativa correta.",c:2,o:[["Para Arendt, poder e violência são sinônimos, pois todo poder se baseia na força física.","Errado. Arendt critica exatamente essa identificação entre poder e violência."],["Para Arendt, quanto mais violência um governo usa contra seus opositores, mais poder ele demonstra possuir, pois o poder se mede pela capacidade de coerção física.","Errado. Para Arendt, o recurso crescente à violência costuma indicar perda de poder, não seu aumento."],["Para Arendt, o poder nasce da ação conjunta e depende do apoio coletivo; a violência é instrumental e pode destruir o poder, mas não criá-lo.","Isso. O poder é coletivo e baseado no consentimento e na ação conjunta; a violência é um meio, que pode substituir o poder quando ele se perde, mas não gerá-lo."],["Para Arendt, o poder pertence sempre a um único indivíduo, enquanto a violência é sempre coletiva.","Errado. Para Arendt o poder é sempre de um grupo; nenhum indivíduo isolado o possui."],["Para Arendt, a violência é a fonte legítima de toda autoridade política.","Errado. Arendt nega que a violência possa fundar legitimidade; ela pode ser justificada em certos casos, mas nunca é legítima por si."]]},
{k:"s4",lv:2,s:"A Declaração Universal dos Direitos Humanos foi adotada pela ONU em 1948. Sobre seu contexto e seus princípios, é correto afirmar que:",c:3,o:[["foi elaborada antes da Segunda Guerra Mundial, para impedir que ela começasse.","Errado. A Declaração é de 1948, portanto posterior à guerra, e responde às atrocidades dela, como o Holocausto."],["estabelece que os direitos valem apenas para cidadãos dos países que venceram a guerra.","Errado. Um princípio central é a universalidade: os direitos valem para todos os seres humanos, sem distinção."],["afirma que direitos civis e políticos podem ser garantidos isoladamente, dispensando direitos sociais e econômicos.","Errado. Os direitos humanos são considerados indivisíveis e interdependentes: não se pode escolher apenas alguns."],["surgiu no pós-guerra, em reação às atrocidades do conflito, e afirma direitos universais e indivisíveis, inerentes a toda pessoa humana.","Isso. A Declaração responde à barbárie da Segunda Guerra e afirma universalidade (todos) e indivisibilidade (direitos civis, políticos, sociais, econômicos e culturais articulados)."],["tem força de lei automática em todos os países do mundo e substitui as constituições nacionais, que deixam de ter validade quando a contrariam.","Errado. A Declaração não substitui constituições; ela orienta tratados e legislações, como a Constituição brasileira de 1988, que incorporou muitos de seus princípios."]]},
{k:"s4",lv:2,s:"Leia as situações:<br>I. Um estudante é ridicularizado por seu sotaque regional, e os colegas tratam como natural que apenas a fala da capital seja “correta”.<br>II. Uma comunidade sem saneamento, escola de qualidade e posto de saúde tem expectativa de vida muito menor que a de bairros ricos da mesma cidade.<br>III. Um manifestante é agredido fisicamente durante um protesto.<br>Os tipos de violência predominantes em I, II e III são, respectivamente:",c:1,o:[["física, simbólica e estrutural.","Errado. Em I não há agressão corporal; a imposição de uma forma de falar como “correta” é violência simbólica."],["simbólica, estrutural e física.","Isso. I é violência simbólica (Bourdieu): imposição de padrões culturais como naturais e legítimos; II é estrutural: desigualdade produzida pela organização social; III é física, a agressão direta ao corpo."],["estrutural, física e simbólica.","Errado. Em II não há agressão física direta; a privação produzida pela organização social caracteriza violência estrutural."],["simbólica, física e estrutural.","Errado. A I está correta, mas II e III foram trocadas: a falta de serviços é estrutural, e a agressão é física."],["estrutural, simbólica e física.","Errado. A I não é estrutural no sentido usado aqui: trata-se da imposição de uma cultura dominante como legítima, isto é, violência simbólica."]]},
{k:"s4",lv:2,s:"Para Max Weber, o Estado moderno pode ser definido como a comunidade humana que reivindica, com sucesso, o monopólio do uso legítimo da violência física dentro de um determinado território.",v:true,e:"Verdadeiro. Essa é a definição weberiana clássica de Estado (aqui parafraseada). O ponto central é a legitimidade: o Estado não é o único a usar força, mas é o único cuja força é reconhecida como legítima."},
{k:"s4",lv:2,s:"Na análise de Deleuze, a sociedade de controle representa o retorno às instituições de confinamento, como prisões e fábricas fechadas, que voltam a ser o principal mecanismo de poder.",v:false,e:"Falso. Deleuze aponta o movimento inverso: a crise das instituições de confinamento e a passagem para um controle contínuo e aberto, exercido por dados, senhas, crédito e formação permanente."},
/* ===== r1 ===== */
{k:"r1",lv:2,s:"Uma reportagem quer mostrar ao leitor como a taxa de desemprego de um estado (dados fictícios, um valor por mês) se comportou de janeiro de 2015 a dezembro de 2024, destacando períodos de alta e de queda. Qual recurso visual é o mais adequado?",c:3,o:[["Gráfico de setores (pizza), com uma fatia para cada ano.","Setores representam partes de um todo que somam 100%. Taxas de desemprego de anos diferentes não são partes de um mesmo todo, e a pizza não mostra a sequência temporal."],["Gráfico de barras horizontais com um ano por barra, ordenadas da maior para a menor taxa.","Ordenar do maior para o menor destrói a ordem cronológica; o leitor deixa de ver quando a taxa subiu ou caiu, que é justamente o objetivo."],["Pictograma com bonecos representando desempregados em cada ano.","Pictogramas servem a comparações simples e pouco precisas; com 120 valores mensais, ficaria ilegível e não evidenciaria a evolução."],["Gráfico de linhas, com o tempo no eixo horizontal e a taxa no eixo vertical.","Isso. O gráfico de linhas é o indicado para evolução de uma variável ao longo do tempo: a inclinação da linha evidencia tendências, picos e quedas."],["Cartograma (mapa) colorindo o estado conforme a taxa média do período.","Mapas mostram distribuição espacial. Uma única média do período apagaria justamente as variações mês a mês que se quer mostrar."]]},
{k:"r1",lv:2,s:"Numa enquete com 400 alunos (dados fictícios), a pergunta foi “Quais redes sociais você usa? (pode marcar mais de uma)”. Resultado: Rede A: 70%; Rede B: 55%; Rede C: 30%. Um aluno quer apresentar os dados num gráfico de setores. Qual avaliação é correta?",c:0,o:[["Inadequado: as porcentagens somam 155% (múltipla escolha) e não formam um todo; barras ou colunas funcionam melhor.","Isso. 70 + 55 + 30 = 155%. Setores exigem categorias mutuamente exclusivas que somam 100%. Com múltipla escolha, cada porcentagem se refere ao total de respondentes, e barras/colunas comparam as categorias corretamente."],["A pizza é adequada, pois todos os dados estão em porcentagem, e porcentagens são sempre partes de um todo.","Estar em porcentagem não basta. Aqui cada valor é a parcela dos 400 alunos que usa cada rede, e uma mesma pessoa aparece em mais de uma categoria; as fatias não formam um todo de 100%."],["O mais adequado seria um gráfico de linhas, já que há três categorias que podem ser ligadas em sequência.","Linhas indicam evolução (em geral temporal). Ligar redes sociais diferentes por uma linha sugeriria uma continuidade que não existe entre as categorias."],["Basta dividir cada valor por 1,55 para que somem 100%; a pizza resultante representaria fielmente a proporção de alunos que usa cada rede social.","Dividir por 1,55 muda o significado: passaria a mostrar a parcela de cada rede no total de marcações, não a porcentagem de alunos que usa cada rede (70% viraria cerca de 45%, um dado diferente)."],["Os dados estão errados, porque porcentagens de uma mesma pergunta nunca podem somar mais de 100%.","Em perguntas de múltipla escolha, a soma pode passar de 100%, pois cada respondente pode ser contado em várias alternativas. O dado é possível; o gráfico escolhido é que está errado."]]},
{k:"r1",lv:2,s:"Tabela (dados fictícios) – Matrículas na Educação de Jovens e Adultos em um estado: 2019: 250 mil; 2024: 200 mil. Qual foi a variação percentual entre 2019 e 2024?",c:4,o:[["−25%","A diferença (50 mil) foi dividida pelo valor final (200 mil). A variação percentual usa o valor inicial como base: 50/250, não 50/200."],["−50%","Confundiu a diferença absoluta (50 mil matrículas) com uma porcentagem. 50 mil a menos não é 50% a menos."],["+20%","O módulo está certo, mas o sinal não: o número caiu de 250 mil para 200 mil, então a variação é negativa (queda)."],["−80%","200/250 = 0,8 indica que 2024 corresponde a 80% de 2019, não a uma queda de 80%. A queda é de 100% − 80% = 20%."],["−20%","Isso. Variação = (200 − 250)/250 × 100 = −50/250 × 100 = −20%. Houve queda de 20% nas matrículas."]]},
{k:"r1",lv:2,s:"Tabela (dados fictícios) – Casos de dengue em 2024: Cidade A: 200 mil habitantes, 400 casos; Cidade B: 50 mil habitantes, 150 casos. Analise:<br>I. A situação da cidade A é mais grave, pois ela registrou mais casos.<br>II. A taxa de B (300 casos por 100 mil habitantes) é 50% maior que a de A.<br>III. Se a cobertura vacinal de A passou de 60% para 75%, ela aumentou 15%.<br>Está correto o que se afirma em:",c:1,o:[["Apenas I.","I é falsa: números absolutos não comparam cidades de tamanhos diferentes. A taxa de A é 400/200.000 × 100.000 = 200 por 100 mil, menor que a de B (300)."],["Apenas II.","Isso. A: 400/200.000 × 100.000 = 200; B: 150/50.000 × 100.000 = 300. (300 − 200)/200 = 50%: II é correta. I ignora a população, e III confunde pontos percentuais com porcentagem (75 − 60 = 15 p.p.; 15/60 = 25%)."],["Apenas III.","III é falsa: de 60% para 75% o aumento é de 15 pontos percentuais, o que equivale a (75 − 60)/60 = 25% de aumento relativo."],["I e II.","II está correta, mas I não: comparar total de casos sem considerar a população leva à conclusão inversa. Pela taxa, B está em situação pior."],["II e III.","II está correta, mas III não: 15 é a diferença em pontos percentuais; em termos relativos, o aumento foi de 25%."]]},
{k:"r1",lv:2,s:"Um folheto (dados fictícios) traz um gráfico de colunas com a taxa de aprovação de duas escolas: X = 92% e Y = 96%. O eixo vertical começa em 90% e vai até 97%. Visualmente, a coluna de Y parece três vezes mais alta que a de X. Qual é o problema dessa representação?",c:2,o:[["Nenhum: a escola Y realmente teve aprovação três vezes maior, como mostra o gráfico.","A aprovação de Y (96%) não é o triplo da de X (92%). A impressão de “três vezes” vem só da altura das colunas acima de 90%: 6 contra 2."],["O gráfico deveria ser de setores, pois os dados são porcentagens.","As duas taxas não são partes de um mesmo todo (somariam 188%). Colunas são adequadas para comparar as escolas; o defeito está na escala."],["O eixo truncado em 90% faz Y parecer o triplo de X, embora a diferença real seja de apenas 4 pontos percentuais.","Isso. Acima de 90%, X ocupa 2 unidades e Y, 6, por isso parece o triplo. A diferença real é 96 − 92 = 4 p.p. Em colunas, a altura deve ser proporcional ao valor, o que exige o eixo começando em zero."],["Não há problema, pois em gráficos de colunas o eixo vertical pode começar em qualquer valor, desde que os números estejam indicados no topo de cada coluna.","Em colunas e barras, o leitor compara alturas; se o eixo não começa em zero, as proporções visuais ficam distorcidas, mesmo que os números estejam indicados."],["Falta legenda; com ela, a escala ficaria fiel aos dados.","A legenda identifica as séries, mas não corrige a distorção causada pela escala truncada. O problema é o início do eixo em 90%."]]},
{k:"r1",lv:2,s:"Uma pequena empresa (dados fictícios) tem cinco funcionários, com salários mensais, em mil reais, de 2; 2; 3; 3 e 40. Num anúncio de vagas, ela afirma pagar “salário médio de R$ 10 mil”. Qual análise é correta?",c:3,o:[["A mediana é R$ 10 mil e a média é R$ 3 mil, por isso o anúncio é enganoso.","Os valores estão invertidos: a média é 50/5 = 10 mil, e a mediana (valor central do rol 2; 2; 3; 3; 40) é 3 mil."],["Média e mediana coincidem em R$ 3 mil, logo o anúncio contém um erro de cálculo.","A média não é 3 mil: (2 + 2 + 3 + 3 + 40)/5 = 50/5 = 10 mil. O cálculo do anúncio está certo; o que engana é a escolha da medida."],["A mediana é R$ 2 mil, porque mediana é o valor que mais se repete na lista.","O valor que mais se repete é a moda (aqui, 2 e 3 aparecem duas vezes cada). A mediana é o valor central do rol ordenado: 3 mil."],["A média, R$ 10 mil, é inflada pelo salário de R$ 40 mil; a mediana, R$ 3 mil, representa melhor o salário típico.","Isso. Média = 50/5 = 10 mil; mediana = 3 mil (terceiro valor do rol). Quatro dos cinco funcionários ganham no máximo 3 mil; um valor extremo distorce a média, mas não a mediana."],["A média é sempre a medida mais adequada, pois leva em conta todos os valores da lista; portanto, o anúncio descreve fielmente o salário típico da empresa.","Justamente por considerar todos os valores, a média é sensível a valores extremos. Em distribuições muito assimétricas, como salários, a mediana descreve melhor o caso típico."]]},
{k:"r1",lv:2,s:"Um levantamento (dados fictícios) mostrou que, nos meses em que mais se vendeu sorvete numa cidade litorânea, também houve mais afogamentos. Logo, é correto concluir que o consumo de sorvete aumenta o risco de afogamento.",v:false,e:"Correlação não é causalidade. As duas variáveis provavelmente crescem juntas por causa de um terceiro fator (o calor do verão, que leva mais gente às praias e aumenta o consumo de sorvete). Os dados mostram associação, não que uma coisa cause a outra."},
{k:"r1",lv:2,s:"O índice de Gini varia de 0 a 1, e quanto mais próximo de 1, maior a desigualdade de renda. Assim, se o Gini de um país passou de 0,60 para 0,50 (dados fictícios), a desigualdade de renda diminuiu.",v:true,e:"Correto. No Gini, 0 representa igualdade total e 1, desigualdade máxima. A queda de 0,60 para 0,50 indica distribuição de renda menos desigual. Atenção à diferença em relação ao IDH, que também vai de 0 a 1, mas em que valores maiores indicam situação melhor."},
/* ===== r2 ===== */
{k:"r2",lv:2,s:"O grêmio estudantil vai fazer uma enquete sobre a cantina da escola. Qual das perguntas abaixo é a mais adequada, por ser objetiva e não induzir a resposta?",c:1,o:[["“Você não acha que a cantina deveria vender alimentos mais saudáveis?”","Pergunta indutora: a forma negativa “Você não acha que...” sugere que a resposta esperada é “sim”."],["“Como você avalia a variedade de alimentos da cantina? ( ) ótima ( ) boa ( ) regular ( ) ruim ( ) péssima”","Isso. A pergunta é neutra, trata de um só aspecto e oferece uma escala equilibrada, com tantas opções positivas quanto negativas, o que facilita a tabulação."],["“Você concorda que os preços abusivos da cantina precisam baixar?”","Pergunta tendenciosa: pressupõe que os preços são “abusivos”, e quem responde já parte de um julgamento embutido."],["“Considerando que os nutricionistas condenam frituras, você apoia a retirada delas do cardápio da cantina?”","A introdução usa a autoridade dos nutricionistas para empurrar o respondente a concordar; é uma pergunta indutora."],["“O que você acha da cantina?”","Pergunta vaga e aberta: não indica qual aspecto avaliar (preço, variedade, atendimento) e gera respostas difíceis de tabular numa enquete."]]},
{k:"r2",lv:2,s:"Um portal de notícias publicou uma enquete on-line: “Você é a favor do novo horário do comércio?”. Votaram 12.000 internautas, e 78% responderam “não”. Qual conclusão é adequada?",c:4,o:[["Como 12.000 pessoas é uma amostra grande, o resultado representa a opinião da população da cidade.","Tamanho não garante representatividade. Uma amostra grande, mas formada só por quem quis votar, continua enviesada."],["Pode-se afirmar que a rejeição na população fica entre 76% e 80%, considerando uma margem de erro de 2 pontos percentuais para mais ou para menos.","Margem de erro só se calcula em pesquisa com amostragem probabilística. Numa enquete autosselecionada, não há margem de erro válida."],["A pesquisa comprova que 78% dos moradores da cidade são contra o novo horário.","É uma generalização indevida: os votantes não foram sorteados e podem nem morar na cidade. Não se pode estender o resultado à população."],["O resultado não tem valor algum e deve ser descartado, pois enquetes on-line nunca informam nada.","É um exagero: a enquete mostra a opinião de quem participou e pode servir de termômetro. Ela apenas não permite generalizar."],["O resultado mostra a opinião de quem decidiu votar no portal; como a amostra é autosselecionada, não permite generalizar.","Isso. Na enquete de opinião, participa quem quer (amostra não aleatória). Por isso, ao contrário de uma pesquisa científica com amostragem planejada, ela não autoriza conclusões sobre toda a população."]]},
{k:"r2",lv:2,s:"Leia um trecho de um relatório escolar: “Foram entrevistados 120 estudantes do 1º ao 3º ano, entre 3 e 7 de março, por meio de um formulário com cinco perguntas fechadas, aplicado em sala de aula.” Em qual seção esse trecho deve aparecer?",c:0,o:[["Metodologia.","Isso. O trecho descreve como os dados foram obtidos: quem respondeu (público e amostra), quando, com que instrumento e de que forma. É o conteúdo típico da metodologia."],["Resultados.","Resultados apresentam o que foi obtido (números, tabelas, gráficos). O trecho não traz nenhum dado de resposta, só o procedimento."],["Introdução.","A introdução apresenta o tema e o objetivo do trabalho. O detalhamento de amostra, datas e instrumento pertence à metodologia."],["Conclusão.","A conclusão retoma os achados e faz recomendações. Descrever o procedimento de coleta no fim do texto inverteria a lógica do relatório."],["Análise/discussão.","Na análise, os resultados são interpretados. O trecho não interpreta nada, apenas informa como a coleta foi feita."]]},
{k:"r2",lv:2,s:"Qual das frases abaixo está adequada à linguagem de um relatório sobre a avaliação da feira de ciências da escola?",c:2,o:[["“Eu achei super legal que a galera curtiu bastante a feira.”","Usa 1ª pessoa, opinião pessoal e registro informal (“super legal”, “galera”, “curtiu”), inadequados ao relatório, que pede objetividade e norma-padrão."],["“Incrível! Quase todo mundo amou o evento!!!”","Exclamações, intensificadores e o vago “quase todo mundo” tornam a frase emotiva e imprecisa; o relatório deve trazer dados."],["“Constatou-se que 64% dos participantes avaliaram o evento como bom ou ótimo.”","Isso. A frase é impessoal (índice de indeterminação/voz passiva sintética “constatou-se”), objetiva, em norma-padrão, e apresenta um dado preciso."],["“A gente percebeu que muita gente gostou bastante do que viu por lá.”","“A gente” e “muita gente” são marcas de informalidade e imprecisão; faltam o dado numérico e a impessoalidade."],["“Acredito sinceramente que o evento foi o melhor da história da escola, conforme minha experiência pessoal.”","É uma opinião em 1ª pessoa, sem dado que a sustente. O relatório expõe resultados; não se apoia em impressões pessoais."]]},
{k:"r2",lv:2,s:"Considere dois trechos da seção de resultados de um relatório sobre mobilidade urbana:<br>Trecho 1: “Dos 200 respondentes, 46% afirmaram usar transporte público diariamente (Tabela 1).”<br>Trecho 2: “Esse número vergonhoso prova que a prefeitura é incompetente.”<br>Analise:<br>I. O trecho 1 relata um dado e remete à tabela, sendo adequado à seção de resultados.<br>II. O trecho 2 é adequado, pois a análise de um relatório admite juízos de valor enfáticos.<br>III. Uma recomendação baseada nos dados, como “recomenda-se ampliar a frota nos horários em que se concentram 70% das viagens declaradas”, cabe na conclusão do relatório.<br>Está correto o que se afirma em:",c:3,o:[["Apenas I.","I está correta, mas III também: recomendações fundamentadas nos dados fazem parte da conclusão de um relatório."],["Apenas II.","II é falsa: “vergonhoso” e “incompetente” são opiniões sem sustentação; o relatório interpreta dados com objetividade, sem juízos enfáticos."],["II e III.","III está correta, mas II não: o trecho 2 opina e acusa em vez de relatar ou analisar com base nos dados."],["I e III.","Isso. I relata com objetividade e remete à fonte (a tabela). III traz uma recomendação apoiada em dado, o que é próprio da conclusão. II confunde relatar/analisar com opinar."],["I, II e III.","II não pode estar incluída: juízos como “vergonhoso” e “incompetente” ferem a objetividade e a impessoalidade do gênero."]]},
{k:"r2",lv:2,s:"Numa enquete, a pergunta sobre idade trouxe estas alternativas: “( ) 10 a 15 anos ( ) 15 a 20 anos ( ) 20 a 25 anos ( ) mais de 25 anos”. Qual é o problema dessas alternativas?",c:0,o:[["As faixas se sobrepõem (15 e 20 anos cabem em duas opções) e quem tem menos de 10 anos fica sem opção.","Isso. As alternativas de uma pergunta fechada devem ser mutuamente exclusivas (cada pessoa cabe em uma só) e exaustivas (todos encontram uma opção). Corrigindo: “até 14”, “15 a 19”, “20 a 24”, “25 ou mais”."],["A pergunta é tendenciosa, porque induz o respondente a declarar uma idade maior do que a real.","Nada na pergunta sugere uma resposta preferida; o defeito é técnico (sobreposição e lacuna nas faixas), não de indução."],["Idade não pode ser perguntada em enquetes escolares, pois é um dado sensível protegido por lei.","Idade é um dado comum de perfil do público, frequentemente usado para cruzar resultados. O problema está na forma das faixas."],["Há apenas quatro alternativas, e uma enquete precisa ter exatamente cinco opções para gerar uma escala válida.","Não há regra de número fixo de alternativas. Quatro faixas bem construídas seriam perfeitamente adequadas."],["Deveria ser uma pergunta aberta, já que perguntas fechadas sempre distorcem os resultados de uma enquete.","Perguntas fechadas são típicas de enquetes justamente por facilitarem a tabulação. Elas só distorcem quando mal construídas, como aqui."]]},
{k:"r2",lv:2,s:"Em um relatório, tabelas e gráficos dispensam a indicação de fonte quando os dados foram coletados pelo próprio autor numa enquete.",v:false,e:"Falso. Todo dado apresentado deve ter a origem indicada. Quando a coleta é própria, informa-se isso, por exemplo: “Fonte: elaborado pelos autores, com base em enquete realizada em março de 2026”. Assim o leitor sabe de onde vieram os números e pode avaliar sua confiabilidade."},
{k:"r2",lv:2,s:"Construções como “Observou-se que...”, “Foram analisadas 80 respostas” e “Recomenda-se...” contribuem para a impessoalidade esperada em um relatório.",v:true,e:"Verdadeiro. A voz passiva sintética com índice de indeterminação ou partícula apassivadora (“observou-se”, “recomenda-se”) e a voz passiva analítica (“foram analisadas”) apagam o “eu” do autor e põem o foco nos dados e procedimentos, como pede o gênero."},
/* ===== r3 ===== */
{k:"r3",lv:2,s:"Tema (fictício): “Desafios para reduzir o desperdício de alimentos no Brasil”. Leia a proposta de intervenção de um aluno: “Portanto, é necessário que o Ministério do Desenvolvimento Social crie campanhas publicitárias, veiculadas na televisão e nas redes sociais, a fim de conscientizar a população sobre o desperdício.” Considerando os cinco elementos avaliados na Competência 5, qual deles falta?",c:2,o:[["Agente.","O agente está presente: “o Ministério do Desenvolvimento Social”."],["Ação.","A ação está presente: “crie campanhas publicitárias”."],["Detalhamento.","Isso. Há agente (Ministério), ação (criar campanhas), meio/modo (veiculadas na TV e nas redes sociais) e finalidade (a fim de conscientizar). Falta detalhar algum elemento, por exemplo o conteúdo das campanhas (dicas de armazenamento, aproveitamento integral dos alimentos)."],["Finalidade/efeito.","A finalidade está presente: “a fim de conscientizar a população sobre o desperdício”."],["Meio/modo.","O meio está presente: as campanhas serão “veiculadas na televisão e nas redes sociais”."]]},
{k:"r3",lv:2,s:"Tema (fictício): “Caminhos para combater a evasão escolar de jovens que trabalham no Brasil”. Um candidato escreve um texto dissertativo-argumentativo, bem estruturado, sobre a importância da educação para o desenvolvimento do país, sem mencionar a evasão nem o trabalho juvenil. Como esse texto tende a ser avaliado?",c:1,o:[["Fuga total ao tema, com nota zero na redação inteira, já que o candidato não tratou da evasão escolar nem do trabalho de jovens.","Não é fuga total: o texto trata do assunto amplo (educação). Fuga ocorre quando o texto não aborda nem o assunto, por exemplo, se falasse de desmatamento."],["Tangenciamento: trata do assunto geral sem o recorte; não zera, mas é muito penalizado, sobretudo na C2.","Isso. Tangenciar é abordar o assunto (educação) sem o recorte temático (evasão de jovens trabalhadores). A redação não é anulada, mas recebe nota baixa na C2, o que também limita a avaliação de C3 e C5."],["Atende plenamente ao tema, já que educação é o assunto central da proposta.","O tema não é “educação”, e sim um recorte específico. Ignorar evasão e trabalho juvenil significa não desenvolver o tema proposto."],["Nota zero por não atender ao tipo dissertativo-argumentativo.","O enunciado diz que o texto é dissertativo-argumentativo. O problema está na abordagem do tema, não no tipo textual."],["Perde pontos apenas na Competência 1, por inadequação vocabular.","A C1 avalia o domínio da norma-padrão. O desvio aqui é de compreensão da proposta (C2), não de gramática."]]},
{k:"r3",lv:2,s:"Leia o início de um parágrafo de desenvolvimento sobre o desperdício de alimentos: “Segundo o sociólogo Zygmunt Bauman, vivemos em uma modernidade líquida. Além disso, o desperdício de alimentos ocorre por falta de planejamento nas compras domésticas.” Qual é o problema no uso do repertório?",c:4,o:[["Bauman não é uma fonte legitimada, pois sociólogos não são aceitos como repertório no ENEM.","Bauman é repertório legitimado (autor reconhecido das Ciências Sociais). O problema não é a fonte, mas a forma como ela foi usada."],["Citar autores estrangeiros é vedado; o repertório deve ser exclusivamente brasileiro.","Não existe essa restrição. Repertórios de qualquer origem são aceitos, desde que legitimados, pertinentes e produtivos."],["O problema é de Competência 1, pois o nome do autor deveria vir entre aspas.","Nomes próprios não vão entre aspas, e a questão não envolve norma-padrão. A falha está na articulação do repertório ao argumento."],["O repertório só seria válido se tivesse sido retirado dos textos motivadores da proposta, que são as fontes autorizadas pela banca para tratar do tema.","É o contrário: espera-se que o repertório vá além dos textos motivadores. Trechos copiados deles, inclusive, são desconsiderados na correção."],["O conceito é legitimado, mas fica solto, sem relação explicada com o desperdício; o uso não é produtivo.","Isso. É o “repertório de bolso”: uma citação encaixada sem articulação. Para valer na C2, o repertório deve ser pertinente ao tema e produtivo, isto é, explicado e ligado ao argumento (por exemplo, relacionar a lógica do descarte rápido ao consumo excessivo)."]]},
{k:"r3",lv:2,s:"Ao corrigir uma redação, a professora anotou: “faltam articuladores entre os parágrafos; uso repetido de ‘isso’ e ‘e’ para encadear ideias; pronome com referente ambíguo no 3º parágrafo”. Esses problemas afetam principalmente qual competência do ENEM?",c:3,o:[["Competência 1 – domínio da modalidade escrita formal (norma-padrão).","A C1 trata de desvios gramaticais, ortográficos e de registro. Os problemas apontados dizem respeito ao encadeamento das partes do texto."],["Competência 2 – compreensão da proposta e aplicação de conceitos de várias áreas.","A C2 avalia tema, tipo textual e repertório. Nada na anotação se refere a esses aspectos."],["Competência 3 – seleção, organização e interpretação de informações.","A C3 avalia o projeto de texto e a qualidade da argumentação, não os recursos linguísticos que ligam frases e parágrafos."],["Competência 4 – mecanismos linguísticos de coesão.","Isso. Conectivos entre parágrafos, variedade de articuladores e referenciação (pronomes com referente claro) são exatamente os mecanismos de coesão avaliados na C4."],["Competência 5 – proposta de intervenção.","A C5 avalia a proposta de solução e seus elementos. A anotação trata da ligação entre ideias ao longo do texto."]]},
{k:"r3",lv:2,s:"Segundo as regras da redação do ENEM, qual das situações abaixo leva à nota zero na redação inteira?",c:0,o:[["Inserir, no meio do 2º parágrafo, uma receita de bolo sem qualquer relação com o tema.","Isso. Uma parte deliberadamente desconectada do tema é considerada forma proposital de anulação e leva à nota zero, assim como impropérios, desenhos ou texto com até 7 linhas."],["Apresentar muitos desvios de concordância, regência e crase ao longo do texto.","Desvios gramaticais rebaixam a nota da C1, mas não anulam a redação."],["Elaborar proposta de intervenção com agente, ação e finalidade, mas sem detalhamento.","Uma proposta incompleta perde pontos na C5 (cada elemento ausente reduz a nota), mas não zera a redação."],["Abordar o tema de forma tangencial, tratando apenas do assunto geral sem desenvolver o recorte específico pedido na proposta.","Tangenciamento é muito penalizado (sobretudo na C2), mas não zera a redação; zero é o caso de fuga total ao tema."],["Não usar nenhum repertório externo aos textos motivadores.","A falta de repertório legitimado reduz a nota da C2, mas não é motivo de anulação."]]},
{k:"r3",lv:2,s:"Tema (fictício): “Desafios para reduzir o desperdício de alimentos no Brasil”. Qual introdução apresenta contextualização e tese explícita, já anunciando o projeto de texto?",c:2,o:[["“O desperdício de alimentos é um tema discutido em vários países do mundo, por organismos internacionais e por especialistas de diferentes áreas, que publicam relatórios anuais com números sobre o problema, sobre os alimentos descartados em residências, supermercados e restaurantes.”","Há contextualização extensa, mas nenhum posicionamento: o parágrafo não diz por que o problema persiste nem o que será defendido."],["“Será que o desperdício de alimentos no Brasil tem solução? Essa é uma pergunta que muitos fazem.”","Uma pergunta retórica não substitui a tese. Não há ponto de vista assumido nem os argumentos que serão desenvolvidos."],["“Embora o Brasil seja um grande produtor agrícola, toneladas de comida vão para o lixo. Esse cenário persiste pela falta de educação alimentar e pela ineficiência na distribuição.”","Isso. A primeira frase contextualiza, e a segunda apresenta a tese com dois argumentos (falta de educação alimentar e ineficiência na distribuição), que podem estruturar os dois desenvolvimentos. É o projeto de texto avaliado na C3."],["“O desperdício de alimentos é um problema muito grave, que tem várias causas e consequências negativas para toda a sociedade brasileira.”","A tese é genérica: “várias causas e consequências” não define quais serão discutidas, então não há projeto de texto claro."],["“Neste texto, irei falar sobre o desperdício de alimentos e mostrar minha opinião sobre esse assunto tão importante.”","É um anúncio metalinguístico em 1ª pessoa, sem tese: diz que haverá opinião, mas não qual é nem quais argumentos a sustentam."]]},
{k:"r3",lv:2,s:"Segundo a cartilha do participante, a redação com até 7 linhas escritas recebe nota zero. Assim, um texto com 9 linhas próprias não é zerado por extensão insuficiente, embora tenda a receber notas baixas nas competências.",v:true,e:"Verdadeiro. A anulação por extensão insuficiente vale para textos de até 7 linhas. Com 9 linhas próprias, o texto é corrigido nas cinco competências (cada uma de 0 a 200, total de 1000), mas dificilmente desenvolve introdução, argumentos e proposta completos. Linhas copiadas dos textos motivadores são desconsideradas na contagem."},
{k:"r3",lv:2,s:"Na Competência 4, basta haver um conectivo no início de cada parágrafo para garantir a nota máxima, mesmo que seja sempre o mesmo, como “Além disso”.",v:false,e:"Falso. A C4 avalia a presença e a diversidade de recursos coesivos e a adequação deles. Para a nota máxima, espera-se articulação entre parágrafos e dentro deles, com repertório variado de conectivos e referenciação adequada, sem repetições excessivas. Usar sempre o mesmo articulador, ou um conectivo com sentido inadequado, rebaixa a nota."},
/* ===== p1 ===== */
{k:"p1",lv:2,s:"Em Camões, “Amor é fogo que arde sem se ver; / É ferida que dói, <i>e não se sente</i>”, a conjunção “e” que introduz a oração destacada tem valor:",c:0,o:[["adversativo, equivalendo a “mas”.","Isso. A oração “e não se sente” contraria o que se espera de “dói”: troque por “mas” (“dói, mas não se sente”) e o sentido se mantém. É coordenada sindética com “e” de valor adversativo, base do paradoxo do soneto."],["aditivo, pois apenas soma uma característica à ferida.","Não há simples soma: doer e não se sentir são ideias opostas. O “e” marca contraste (= mas), não adição."],["conclusivo, pois “não se sente” é consequência de “dói”.","Não sentir a dor não decorre logicamente de doer; ao contrário, contradiz. Conclusivo seria “logo, portanto”."],["explicativo, pois justifica por que a ferida dói.","“Não se sente” não explica a dor; opõe-se a ela. Explicativas são introduzidas por “pois, porque, que” justificando o que se disse."],["alternativo, pois apresenta duas possibilidades excludentes.","Não há alternância (“ou… ou”): as duas ações são afirmadas ao mesmo tempo, em oposição. O valor é adversativo."]]},
{k:"p1",lv:2,s:"No capítulo final de <i>Memórias póstumas de Brás Cubas</i>, de Machado de Assis, lê-se: “Não tive filhos, não transmiti a nenhuma criatura o legado da nossa miséria.” Sobre esse período, é correto afirmar que é formado por:",c:1,o:[["uma oração principal e uma subordinada adverbial causal.","Não há conectivo nem dependência sintática: nenhuma das orações exerce função na outra. A relação causal é só inferida, e não transforma a oração em subordinada."],["duas orações coordenadas assindéticas.","Isso. São dois verbos (“tive”, “transmiti”) → duas orações, sintaticamente independentes e ligadas apenas por vírgula, sem conjunção: coordenadas assindéticas."],["uma única oração, pois há um só sujeito (“eu”).","O número de orações é dado pelo número de verbos (ou locuções verbais), não de sujeitos. Há dois verbos, logo período composto."],["duas orações coordenadas sindéticas aditivas, com o “e” subentendido.","Sindética é a oração que tem conjunção expressa. Sem conectivo, a coordenada é assindética, mesmo que se possa “imaginar” um “e”."],["uma oração principal e uma subordinada substantiva apositiva.","A segunda oração não exerce função de aposto de nenhum termo da primeira; é independente. Apositiva viria, em geral, após dois-pontos explicando um nome."]]},
{k:"p1",lv:2,s:"Em Gonçalves Dias, “Não chores, meu filho; / Não chores, <i>que a vida / É luta renhida</i>”, a oração destacada classifica-se como:",c:2,o:[["subordinada substantiva objetiva direta, introduzida por conjunção integrante.","“Chorar”, aqui, não pede complemento oracional: não se pode dizer “não chores isso”. O “que” não é integrante."],["subordinada adjetiva, introduzida por pronome relativo.","O “que” não retoma antecedente nenhum (não equivale a “o qual”); “a vida” é sujeito da própria oração. Não há adjetiva."],["coordenada sindética explicativa.","Isso. Após verbo no imperativo (“não chores”), o “que” equivale a “pois/porque” e introduz a justificativa da ordem: troque por “pois” (“não chores, pois a vida é luta renhida”). É coordenada explicativa."],["subordinada adverbial consecutiva.","A consecutiva exige, em geral, termo intensivo na principal (“tão, tanto, tal”) e exprime efeito; aqui o “que” apresenta a razão do pedido."],["subordinada adverbial comparativa.","Não há comparação entre termos (nem “mais/menos… que”, nem “como”). A oração justifica o conselho."]]},
{k:"p1",lv:2,s:"Leia as afirmações.<br>I. Em “Não saia agora, <i>pois está chovendo</i>”, “pois” introduz oração coordenada explicativa.<br>II. Em “O réu confessou; deve, <i>pois</i>, ser condenado”, “pois”, posposto ao verbo e entre vírgulas, tem valor conclusivo.<br>III. Nas duas frases, “pois” pode ser trocado por “portanto” sem alteração de sentido.<br>Está correto o que se afirma em:",c:3,o:[["I, apenas.","A II também está correta: “pois” deslocado para depois do verbo, entre vírgulas, equivale a “portanto” (conclusivo)."],["II, apenas.","A I também está correta: “pois” anteposto ao verbo, após imperativo, justifica a ordem → explicativo."],["III, apenas.","A III é falsa: em I, “portanto” inverteria a lógica (“não saia, portanto está chovendo” é absurdo); só em II a troca funciona."],["I e II, apenas.","Isso. Critério de posição: “pois” no início da oração, antes do verbo → explicativo (= porque); “pois” posposto ao verbo, entre vírgulas → conclusivo (= portanto). A III falha em I."],["I, II e III.","A III é falsa: em I, “pois” é explicativo e não pode ser trocado por “portanto”, conjunção conclusiva."]]},
{k:"p1",lv:2,s:"Considere o período: “<i>E corria, e gritava, e chorava, e ninguém o ouvia.</i>” A repetição da conjunção constitui:",c:4,o:[["assíndeto, que acelera o ritmo pela ausência de conectivos.","Assíndeto é justamente a supressão das conjunções; aqui elas aparecem repetidas."],["anacoluto, pois há ruptura na construção sintática entre a série de ações e a oração final.","Não há quebra da estrutura: todas as orações são regulares e coordenadas entre si."],["elipse, pois o sujeito das três primeiras orações está oculto.","O sujeito oculto é um fato da frase, mas não é o recurso evidenciado pela repetição do “e”."],["hipérbato, pois a ordem direta dos termos foi invertida.","As orações estão em ordem direta (verbo + complemento ou sujeito + verbo); não há inversão."],["polissíndeto, que enfatiza o acúmulo das ações.","Isso. Polissíndeto é a repetição enfática da conjunção coordenativa (“e… e… e”). Cada ação ganha peso próprio, e o último “e”, com sujeito diferente (“ninguém”), fecha a série com contraste."]]},
{k:"p1",lv:2,s:"Em Camões, “Mudam-se os tempos, mudam-se as vontades, / Muda-se o ser, muda-se a confiança”, a organização sintática dos versos apresenta:",c:0,o:[["quatro orações coordenadas assindéticas, em paralelismo.","Isso. Quatro verbos (“mudam-se” ×2, “muda-se” ×2) → quatro orações, independentes e justapostas apenas por vírgulas: coordenadas assindéticas. O paralelismo sem conectivos imita o fluxo incessante das transformações."],["uma oração principal seguida de três subordinadas adjetivas.","Nenhuma oração é introduzida por pronome relativo nem caracteriza termo de outra; todas têm a mesma estrutura independente."],["um período simples com sujeito composto (“tempos, vontades, ser, confiança”).","Cada substantivo tem seu próprio verbo; são quatro núcleos verbais, logo período composto, não sujeito composto de uma só oração."],["polissíndeto, pela repetição insistente do verbo “mudar” no início de cada segmento do verso.","Polissíndeto é repetição de conjunção, não de verbo. A repetição do verbo no início é anáfora; e não há conjunção alguma."],["quatro orações coordenadas sindéticas aditivas.","Sindéticas exigem conjunção expressa (“e”, “nem”); aqui só há vírgulas, portanto assindéticas."]]},
{k:"p1",lv:2,s:"Em qual período a vírgula antes de “e” se justifica por separar orações coordenadas com <b>sujeitos diferentes</b>?",c:1,o:[["“Ele estudou muito, e passou.”","As duas orações têm o mesmo sujeito (“ele”); não é o caso de sujeitos diferentes, e a vírgula aí não se justifica por esse critério."],["“O pai saiu cedo, e a casa mergulhou em silêncio.”","Isso. A primeira oração tem sujeito “o pai”; a segunda, “a casa”. Com sujeitos distintos, a norma recomenda vírgula antes do “e” para evitar que “a casa” seja lida como continuação da primeira oração."],["“Comprou pão, leite, frutas frescas da feira, e manteiga.”","Aqui o “e” liga termos de uma enumeração (objetos diretos), não orações; a vírgula antes do “e” final da série é, inclusive, desaconselhada."],["“E chorava, e gritava, e ria.”","Há um só sujeito (oculto); a vírgula se explica pelo polissíndeto, não por mudança de sujeito."],["“Ela é inteligente, e esforçada.”","O “e” une dois predicativos de uma mesma oração; não há duas orações, logo não há troca de sujeito."]]},
{k:"p1",lv:2,s:"Em qual alternativa a conjunção coordenativa destacada está corretamente classificada?",c:2,o:[["“<i>Ora</i> ri, <i>ora</i> chora.” — aditiva.","“Ora… ora” indica alternância de fatos: é alternativa, não aditiva."],["“Choveu muito; o rio, <i>portanto</i>, transbordou.” — explicativa.","“Portanto” introduz consequência lógica do que foi dito: é conclusiva."],["“Não estudou <i>nem</i> trabalhou.” — aditiva.","Isso. “Nem” equivale a “e não” e soma uma segunda negação à primeira: coordenada sindética aditiva."],["“Esforçou-se, <i>mas</i> não venceu.” — conclusiva.","“Mas” opõe o resultado ao esforço: é adversativa."],["“Deve ter chovido, <i>porque</i> o chão está molhado.” — conclusiva.","“Porque” apresenta a justificativa (indício) da afirmação anterior: coordenada explicativa, não conclusiva."]]},
{k:"p1",lv:2,s:"Em Alphonsus de Guimaraens, “Quando Ismália enlouqueceu, / Pôs-se na torre a sonhar... / Viu uma lua no céu, / Viu outra lua no mar”, as orações “Viu uma lua no céu” e “Viu outra lua no mar” são coordenadas assindéticas.",v:true,e:"Verdadeiro. São orações sintaticamente independentes, com o mesmo verbo “viu”, justapostas sem conjunção (só pausa/vírgula): coordenadas assindéticas. O paralelismo reforça o desdobramento da lua (céu × mar)."},
{k:"p1",lv:2,s:"Em “Ela não estudou, e foi aprovada”, a conjunção “e” tem valor aditivo, já que “e” é sempre conjunção coordenativa aditiva.",v:false,e:"Falso. O valor da conjunção depende do contexto: ser aprovada contraria a expectativa criada por “não estudou”, e o “e” equivale a “mas” (valor adversativo). A vírgula antes do “e” também sinaliza esse contraste."},
/* ===== p2 ===== */
{k:"p2",lv:2,s:"No início do conto “A cartomante”, Machado de Assis escreve: “Hamlet observa a Horácio <i>que há mais cousas no céu e na terra</i> do que sonha a nossa filosofia.” A oração destacada classifica-se como subordinada substantiva:",c:3,o:[["subjetiva.","O sujeito de “observa” é “Hamlet”; a oração não é sujeito."],["objetiva indireta.","O objeto indireto de “observa” é “a Horácio” (observar algo <b>a alguém</b>). A oração completa o verbo sem preposição."],["completiva nominal.","Completiva nominal completa nome (substantivo, adjetivo, advérbio); aqui a oração completa o verbo “observa”."],["objetiva direta.","Isso. “Observar” = “dizer, fazer notar”: Hamlet observa <b>isso</b> a Horácio. Substituída por “isso”, sem preposição, a oração é objeto direto: subordinada substantiva objetiva direta."],["apositiva.","Apositiva explica um termo anterior, normalmente após dois-pontos ou vírgula; não há nome a que a oração se refira como aposto."]]},
{k:"p2",lv:2,s:"Em qual alternativa a oração destacada está corretamente classificada?",c:4,o:[["“É necessário <i>que todos compareçam</i>.” — objetiva direta.","“Ser necessário” é verbo de ligação + predicativo, que não admite objeto. “Isso é necessário” → a oração é sujeito: subjetiva."],["“Tenho medo <i>de que ele não volte</i>.” — objetiva indireta.","A preposição é pedida pelo substantivo “medo” (medo de algo), não por um verbo: completiva nominal."],["“Lembrei-me <i>de que era feriado</i>.” — completiva nominal.","Quem rege a preposição é o verbo pronominal “lembrar-se de”: objetiva indireta."],["“Só desejo uma coisa nesta vida: <i>que sejas muito feliz</i>.” — predicativa.","A oração explica o termo “uma coisa”, após dois-pontos: é apositiva. Predicativa viria após verbo de ligação."],["“A verdade é <i>que ninguém sabia o caminho</i>.” — predicativa.","Isso. A oração vem após o verbo de ligação “é” e atribui característica ao sujeito “a verdade” (“A verdade é isso”): subordinada substantiva predicativa."]]},
{k:"p2",lv:2,s:"Compare:<br>I. Os alunos <i>que estudaram</i> foram aprovados.<br>II. Os alunos<i>, que estudaram,</i> foram aprovados.<br>A diferença de sentido entre I e II é corretamente descrita em:",c:0,o:[["Em I, só parte dos alunos estudou; em II, todos estudaram.","Isso. Sem vírgulas, a adjetiva é restritiva: delimita um subconjunto (“apenas os que estudaram”). Entre vírgulas, é explicativa: atribui a característica a todo o conjunto já identificado (“os alunos — todos — estudaram”)."],["Em I, todos os alunos estudaram; em II, apenas parte deles.","A relação está invertida: a restritiva (sem vírgula, I) é que seleciona uma parte; a explicativa (II) generaliza."],["Não há diferença de sentido, já que as vírgulas são facultativas em orações adjetivas e servem apenas para marcar pausa.","A vírgula na adjetiva não é facultativa: ela distingue restritiva de explicativa e altera o sentido."],["Em I, a oração é adjetiva; em II, é coordenada explicativa.","Nas duas frases o “que” é pronome relativo (= os quais), retomando “alunos”; ambas são adjetivas, apenas de tipos diferentes."],["Em II, a oração entre vírgulas é substantiva apositiva.","A oração é introduzida por pronome relativo e qualifica “alunos”: é adjetiva explicativa, não apositiva (que seria introduzida por conjunção integrante)."]]},
{k:"p2",lv:2,s:"Em Casimiro de Abreu, “Oh! que saudades que tenho / Da aurora da minha vida, / Da minha infância querida / <i>Que os anos não trazem mais!</i>”, o pronome relativo “que” do último verso exerce a função sintática de:",c:1,o:[["sujeito.","O sujeito de “trazem” é “os anos” (concorda com o verbo no plural). O relativo não é sujeito."],["objeto direto.","Isso. Substitua o relativo pelo antecedente: “os anos não trazem mais <b>a infância</b>”. “Trazer” é transitivo direto e “a infância” é seu complemento sem preposição → o “que” é objeto direto."],["conjunção integrante.","Conjunção integrante não tem função sintática nem antecedente; aqui o “que” retoma “infância” (= a qual): é pronome relativo."],["adjunto adverbial de tempo.","O tempo está em “mais” (advérbio); o “que” representa “a infância”, complemento do verbo."],["predicativo do sujeito.","Não há verbo de ligação; “trazer” é verbo transitivo direto."]]},
{k:"p2",lv:2,s:"Assinale a frase em que o pronome relativo está empregado de acordo com a norma-padrão.",c:2,o:[["“O autor cujo o livro li morreu ontem.”","Não se usa artigo depois de “cujo”: o correto é “cujo livro”."],["“Esta é a antiga cidade que eu moro desde a infância.”","“Morar” pede preposição “em”: “a cidade em que (onde) eu moro”."],["“Este é o poeta de cuja obra todos falam.”","Isso. “Falar de” exige a preposição antes do relativo, e “cuja” concorda com o possuído (“obra”), sem artigo: “todos falam da obra do poeta” → “de cuja obra”."],["“A pessoa que eu gosto viajou.”","“Gostar” rege “de”: “a pessoa de que (de quem) eu gosto”."],["“O livro onde eu falei já saiu.”","“Onde” só retoma lugar físico; e “falar” pede “de”: “o livro de que eu falei”."]]},
{k:"p2",lv:2,s:"Em qual alternativa o “que” é <b>conjunção integrante</b>?",c:3,o:[["“A carta <i>que</i> recebi era antiga.”","O “que” retoma “carta” (= a qual) e é objeto direto de “recebi”: pronome relativo."],["“Alma minha gentil, <i>que</i> te partiste / Tão cedo desta vida descontente” (Camões).","O “que” retoma “alma” (= a qual) e é sujeito de “partiste”: pronome relativo."],["“o tombadilho / <i>Que</i> das luzernas avermelha o brilho” (Castro Alves).","O “que” retoma “tombadilho” (= o qual) e é sujeito de “avermelha”: pronome relativo."],["“Não permita Deus <i>que</i> eu morra” (Gonçalves Dias).","Isso. O “que” não tem antecedente nem função; apenas introduz a oração que completa “permita”: “Não permita Deus <b>isso</b>” → conjunção integrante, oração substantiva objetiva direta."],["“As aves, <i>que</i> aqui gorjeiam” (Gonçalves Dias).","O “que” retoma “aves” (= as quais) e é sujeito de “gorjeiam”: pronome relativo."]]},
{k:"p2",lv:2,s:"Em José de Alencar, “Além, muito além daquela serra, <i>que ainda azula no horizonte</i>, nasceu Iracema”, a oração destacada é:",c:4,o:[["adjetiva restritiva, pois distingue aquela serra das demais.","A serra já está identificada pelo demonstrativo “daquela”; a oração, entre vírgulas, não restringe — acrescenta informação."],["substantiva apositiva, pois está entre vírgulas.","Vírgulas não definem apositiva. O “que” é pronome relativo (= a qual), não conjunção integrante."],["coordenada explicativa, pois justifica o nascimento de Iracema.","A oração não explica nada sobre o nascimento; caracteriza a serra, e o “que” é relativo."],["adverbial causal, introduzida por “que” equivalente a “porque”.","Não há relação de causa; o “que” retoma “serra” e é sujeito de “azula”."],["adjetiva explicativa, com o “que” como sujeito.","Isso. O “que” retoma “serra” (= a qual) e é sujeito de “azula” → oração adjetiva. Entre vírgulas e referida a um ser já determinado (“daquela serra”), apenas acrescenta um traço descritivo: explicativa."]]},
