{"k":"q1","lv":2,"s":"Analise a classificação dos pares de isômeros:<br>I. pentan-2-ona e pentan-3-ona: isomeria de posição.<br>II. dietilamina e metilpropilamina: isomeria de cadeia.<br>III. ciclobutano e but-1-eno: isomeria de cadeia.<br>Está(ão) correta(s)","c":0,"o":[["I e III apenas.","Isso. I: mesma função, a carbonila muda de lugar (posição). III: C<sub>4</sub>H<sub>8</sub>, cadeia fechada × aberta (cadeia, segundo o livro). II: o N muda de posição entre as cadeias: metameria."],["I apenas.","A III também está correta: o livro classifica cadeia aberta × fechada como isomeria de cadeia."],["II e III apenas.","A II está errada: as duas são aminas secundárias e o heteroátomo (N) muda de posição: compensação (metameria)."],["I, II e III.","A II está errada: é metameria, não cadeia."],["II apenas.","A II é justamente a errada (metameria); I e III estão corretas."]]},
{"k":"q1","lv":2,"s":"O ácido butanoico e o propanoato de metila são isômeros de função, enquanto o propanoato de metila e o etanoato de etila são metâmeros.","v":true,"e":"Os três são C<sub>4</sub>H<sub>8</sub>O<sub>2</sub>. Ácido × éster: funções diferentes (função). Dois ésteres em que o grupo –COO– muda de posição na cadeia: compensação ou metameria."}
];

 [/terciário|primário|secundário|mesmo carbono|três outros/i,"Classificação dos álcoois","Conte os carbonos ligados ao carbono da OH: 1 primário, 2 secundário, 3 terciário. Duas OH no mesmo carbono: instável.","Cap. 11 · Álcoois: classificação"],
 [/ebulição|solúvel/i,"Propriedades","Álcool faz ligação de H (PE alto); cadeia maior, menos solúvel em água. PE: álcool > cetona > aldeído; éter tem PE baixo.","Cap. 11 · Álcoois: propriedades"],
 [/fenóis|fenol/i,"Fenóis","OH no anel benzênico; metilfenóis = cresóis (o, m, p).","Cap. 11 · Fenóis"],
 [/O–CH|éter|metoxi/i,"Éteres","IUPAC: menor + oxi + maior (1-metoxipropano). Usual: éter + grupos em ordem alfabética + ico.","Cap. 11 · Éteres"],
 [/cetona|propanona/i,"Cetonas","prefixo + infixo + ona; usual: grupos + cetona (dimetilcetona = acetona).","Cap. 11 · Cetonas"],
 [/./,"Nomenclatura de álcoois","Cadeia mais longa com o carbono da OH; numere pela ponta mais perto da OH; se empatar, a dupla desempata.","Cap. 11 · Álcoois: nomenclatura"]],
 q12:[
 [/formol|formila|aldoxila|CHO também/i,"Aldeídos","–CHO (formila); sufixo -al; formol = metanal 37%; usual: aldeído + nome do ácido (formaldeído).","Cap. 12 · Aldeídos"],
 [/esterificação|álcool forma|aroma|COO–CH|metanoato/i,"Ésteres","Ácido + álcool ⇌ éster + água. Nome: …ato de …ila (lado do C=O + lado do O).","Cap. 12 · Ésteres"],
 [/Sais|neutralização/i,"Sais orgânicos","Ácido + base → sal + água. Nome: …ato de (metal). Iônicos, sólidos, PF alto; sabões.","Cap. 12 · Sais orgânicos"],
 [/./,"Ácidos carboxílicos","ácido + prefixo + infixo + oico; fazem o dobro de ligações de H do álcool (PE maior); cadeia longa = ácido graxo.","Cap. 12 · Ácidos carboxílicos"]],
 q14:[
 [/Grignard|Mg/i,"Compostos de Grignard","R–MgX; nome: halogênio (eto) + de + radical + magnésio; ficam em éter anidro.","Cap. 14 · Compostos de Grignard"],
 [/–CN|nitrilo|carbilamina/i,"Nitrilas e isonitrilas","Nitrila –C≡N: hidrocarboneto (contando o C do CN) + nitrilo; usual cianeto de …ila. Isonitrila –NC: grupo + carbilamina.","Cap. 14 · Nitrilas e isonitrilas"],
 [/clorobut|haleto/i,"Haletos orgânicos","Halogênio + hidrocarboneto; a insaturação manda na numeração; usual …eto de …ila.","Cap. 14 · Haletos orgânicos"],
 [/TNT|nitro/i,"Nitrocompostos","–NO<sub>2</sub>; prefixo nitro; TNT = 2,4,6-trinitrotolueno.","Cap. 14 · Nitrocompostos"],
 [/CO–N\(|amida/i,"Amidas","Grupo acila no N; prefixo + infixo + amida; N- e N,N- para grupos no nitrogênio.","Cap. 14 · Amidas"],
 [/./,"Aminas","H da amônia trocados por grupos de carbono: primária (N com 1 C), secundária (2), terciária (3). N ligado a C=O já é amida.","Cap. 14 · Aminas"]],
 qu:[
 [/./,"Nomes usuais","Ligue: nome usual → nome oficial → função → uso. Acetona = propanona; formol = metanal 37%; vinagre = ácido etanoico; ureia = amida; acetileno = etino.","Nomes usuais e utilidade prática"]],
 q1:[
 [/UFRGS/,"Roteiro da isomeria plana","Mesma fórmula? → mesma função? → mesmo tipo de cadeia? → heteroátomo mudou? → senão, posição.","Cap. 1 · Roteiro"],
 [/tautomeria|⇌/,"Tautomeria","Isomeria de função em equilíbrio dinâmico: enol ⇌ aldeído ou cetona.","Cap. 1 · Tautomeria"],
 [/propanoato de metila|metameria/i,"Metameria","Mesma função; o heteroátomo muda de posição entre as cadeias.","Cap. 1 · Metameria"],
 [/metoximetano|carbilamina|PUC-MG|\(UECE\)/i,"Isomeria de função","Funções diferentes com a mesma fórmula: álcool × éter, aldeído × cetona, ácido × éster, nitrilo × isonitrilo, fenol × álcool × éter aromáticos.","Cap. 1 · Função"],
 [/propan-1-ol e propan-2-ol/i,"Isomeria de posição","Mesma função e mesma cadeia; muda a posição do grupo, da dupla ou da ramificação.","Cap. 1 · Posição"],
 [/ciclopropano e propeno|núcleo|FAMECA|metilpropano|cadeia/i,"Isomeria de cadeia","Mesma função; muda o tipo de cadeia: normal × ramificada, heterogênea × homogênea, saturada × insaturada, aberta × fechada (em anel: núcleo).","Cap. 1 · Cadeia"],
 [/./,"O que é isomeria","Isômeros: mesma fórmula molecular, estruturas diferentes. Fórmula diferente = não são isômeros.","Cap. 1 · Conceito"]],
q2:[
 [/isômero em que|maior prioridade no C2/i,"Sistema (E)-(Z)","Em cada carbono da dupla, ache o ligante de maior prioridade (número atômico; empatou, olhe os vizinhos). Mesmo lado = Z; lados opostos = E. Cuidado: não compare H com H nem metila com metila.","Sistema (E)-(Z) para nomear estereoisômeros geométricos"],
 [/maleico/i,"Estabilidade e polaridade de cis e trans","O trans costuma ser mais estável (menos energia). O cis é o mais polar e ferve a uma temperatura maior. Cis e trans são diastereoisômeros geométricos.","Isômeros geométricos com ligação dupla"],
 [/retina/i,"Por que a dupla trava","A ligação π impede a rotação. Converter cis em trans exige energia (luz, calor ou enzima) para romper a π por um instante.","Isomeria configuracional geométrica (abertura)"],
 [/polar|ebuli|isômeros do 1,2-dicloroeteno/i,"Polaridade de cis e trans","Cis: os dipolos se somam, a molécula é polar e ferve a uma temperatura maior. Trans: os dipolos se anulam e a molécula é apolar.","Isômeros geométricos com ligação dupla"],
 [/cíclic|ciclo/i,"Isomeria em ciclos (bayeriana)","No anel, os substituintes precisam estar em dois carbonos DIFERENTES. Dois no mesmo carbono não contam.","Isômeros geométricos em compostos cíclicos (isomeria bayeriana)"],
 [/\(E\)|cis é \(Z\)/,"Sistema (E)-(Z)","Z = zusammen = juntos: os campeões de prioridade ficam do mesmo lado. E = entgegen = opostos. Cis não é sinônimo de Z: sempre faça o ranking.","Sistema (E)-(Z) para nomear estereoisômeros geométricos"],
 [/Regra|prioridade|deutério|vinila|Cahn/i,"Prioridades de Cahn-Ingold-Prelog","Compare o primeiro átomo pelo número atômico. Empatou? Olhe os vizinhos. Dupla conta em dobro. Isótopo mais pesado vence. Par de elétrons livre é sempre o último.","Prioridades dos substituintes: Regras 1 a 5"],
 [/rotação|sigma/i,"Por que a dupla trava","Ligação simples (σ) gira. Ligação dupla tem a π, que trava a rotação.","Isômeros geométricos com ligação dupla"],
 [/Estereoisômeros são/i,"O que é estereoisomeria","Mesmos átomos, ligados na mesma ordem. Só muda a arrumação no espaço.","Estereoisomeria"],
 [/./,"Condição para isomeria geométrica","Teste rápido: em CADA carbono da dupla, os dois ligantes são diferentes? Se um carbono tiver dois iguais (dois H, dois CH₃), não há isomeria.","Isômeros geométricos com ligação dupla"]],
q3:[
 [/tartárico|2,3-dibromobutano/i,"Composto meso","Dois C* IGUAIS: uma combinação é meso (inativa). Sobram 2 ativos e 1 racemato. A fórmula 2ⁿ não vale com meso.","Composto meso"],
 [/Enantiômeros têm o mesmo ponto|talidomida/i,"Enantiômeros e diastereoisômeros","Enantiômeros: mesmas propriedades físicas, desvios opostos, mas efeitos diferentes no organismo. Diastereoisômeros: propriedades diferentes.","Alguns termos importantes: isômeros ópticos, enantiômeros e quiralidade"],
 [/gliceraldeído/i,"Prioridades no C*","Compare o átomo ligado direto (O vence C). Entre grupos com C, replique as duplas: CHO (O, O, H) vence CH₂OH (O, H, H).","Nomenclatura (R)-(S) em perspectiva e em projeções de Fischer"],
 [/opticamente ativos|glicose/i,"Fórmulas de van't Hoff","2ⁿ isômeros ativos e 2ⁿ ÷ 2 pares racêmicos (n = número de C* DIFERENTES). Conte os C* com cuidado e veja se há meso.","Fórmulas de van't Hoff"],
 [/van't Hoff|isômeros ópticos ativos|carbonos assimétricos diferentes/i,"Fórmulas de van't Hoff","2ⁿ isômeros ativos e 2ⁿ ÷ 2 pares racêmicos (n = número de C* diferentes). Não vale para composto meso.","Fórmulas de van't Hoff"],
 [/meso/i,"Composto meso","Meso é a borboleta: duas metades iguais e espelhadas que se anulam por dentro (compensação interna).","Composto meso"],
 [/racêmica/i,"Mistura racêmica","Racêmica é o cabo de guerra empatado: 50% (+) e 50% (–) se anulam (compensação externa).","Alguns termos importantes: diastereoisômeros, mistura racêmica e centro estereogênico"],
 [/\(R\)/,"Sistema (R)-(S)","Ordene 1 → 2 → 3 com o 4 para trás. Horário = R; anti-horário = S. R/S não diz nada sobre (+) ou (–).","Nomenclatura (R)-(S) em perspectiva e em projeções de Fischer"],
 [/permuta|Fischer/i,"Projeção de Fischer","Horizontal vem para a frente; vertical vai para trás. Troca ímpar inverte (enantiômero); troca par mantém.","Fórmulas estruturais (perspectiva e Fischer)"],
 [/Diastereo|Enantiômeros/i,"Enantiômeros e diastereoisômeros","Enantiômeros são imagem no espelho, como as mãos. Diastereoisômeros são estereoisômeros que NÃO são imagem um do outro.","Alguns termos importantes: isômeros ópticos, enantiômeros e quiralidade"],
 [/polarímetro|dextrogira|desvi/i,"Luz polarizada e polarímetro","Dextrogira: direita (+). Levogira: esquerda (–). Quem mede o desvio é o polarímetro.","Polarímetro e substâncias opticamente ativas e inativas"],
 [/./,"Carbono assimétrico (C*)","C* = carbono com quatro ligantes diferentes. Com dupla, nunca. Dois ligantes iguais (dois CH₃, dois H) já eliminam.","Estereoisomeria configuracional óptica (abertura)"]],
q5:[
 [/água em meio ácido/i,"Hidratação de alcenos","Alceno + água (H₂SO₄) forma álcool seguindo Markovnikov: H no carbono mais hidrogenado, OH no outro. Alcino + água forma enol, que vira aldeído ou cetona.","Exercícios do livro (UNESP e MACKENZIE)"],
 [/consomem 1 mol/i,"Hidrogenação catalítica","Cada dupla consome 1 mol de H₂; tripla ou dieno, 2 mol. O esqueleto de carbono não muda: cadeia normal vira alcano normal; ramificada, alcano ramificado.","Hidrogenação catalítica"],
 [/dieno/i,"Adição em alcadienos","Em alcadienos predomina a adição 1,4 (80%).","Adição em alcadienos"],
 [/sem peróxido/i,"Regra de Markovnikov","O H vai para o carbono da dupla que já tem mais H (\"quem tem mais, ganha mais\"). O Br fica no outro.","Adição de haletos de hidrogênio"],
 [/peróxido/i,"Regra de Kharasch","Só HBr com peróxido inverte a regra: mecanismo de radicais, e o Br vai para o carbono da ponta (C1).","Adição de haletos de hidrogênio"],
 [/HCN/,"HCN","Alcenos não adicionam HCN. Só os alcinos.","Adição em alcinos"],
 [/HBr/,"Regra de Markovnikov","O H vai para o carbono da dupla que já tem mais H (\"quem tem mais, ganha mais\"). O Br fica no outro.","Adição de haletos de hidrogênio"],
 [/hidratação/i,"Hidratação de alcinos","Forma um enol, que vira carbonila por tautomeria. Etino dá aldeído (etanal); os outros alcinos dão cetona.","Adição em alcinos"],
 [/etanal|Nox/i,"Adição em aldeídos e cetonas","Aldeído + H₂ dá álcool. É uma redução: o Nox do carbono diminui.","Adição em aldeídos e cetonas"],
 [/hidrogenação/i,"Hidrogenação catalítica","H₂ com Ni, Pd ou Pt. Os dois H entram do mesmo lado (adição cis). Menor |ΔH| = isômero mais estável.","Hidrogenação catalítica"],
 [/Br₂|bromônio/,"Adição de halogênios","Um halogênio em cada carbono da dupla, em adição trans pelo íon bromônio.","Adição de halogênios"],
 [/./,"O que é reação de adição","Só acontece em compostos com dupla ou tripla: a ligação π se abre e o reagente entra.","Reações de adição (abertura)"]],
b5:[
 [/coifa|absorção|região/i,"Zonas da raiz","Da ponta para cima: coifa (protege) → zona lisa (alonga) → zona pilífera (absorve) → zona suberosa (ramifica).","Cap. 5 · Zonas, da ponta para cima"],
 [/endoderme|periciclo|camada/i,"Camadas internas da raiz","De fora para dentro: epiderme → córtex → endoderme (filtro) → periciclo (raízes laterais) → vasos.","Cap. 5 · Por dentro, de fora para o centro"],
 [/meristema|câmbio|felogênio/i,"Meristemas","Apical alonga (crescimento primário). Lateral (câmbio vascular e felogênio) engrossa (secundário).","Cap. 5 · Meristemas"],
 [/./,"Mono × eudicotiledônea","Eudicotiledônea: raiz pivotante e xilema em cruz. Monocotiledônea: raiz fasciculada (cabeleira) e vasos em círculo com medula.","Cap. 5 · Por dentro, de fora para o centro"]],
b6:[
 [/identifica|gemas|batata|cebola|videira/i,"Como reconhecer um caule","Caule tem gemas e nós. A batata-inglesa é caule (os \"olhos\" são gemas); a batata-doce é raiz.","Cap. 6 · Morfologia externa e tipos de caule"],
 [/colênquima|cortiça|súber|tecido/i,"Tecidos de sustentação e revestimento","Colênquima: vivo, celulose, flexível. Esclerênquima: morto, lignina, rígido. Súber: morto, impermeável e isolante.","Cap. 6 · Sistema fundamental e de revestimento"],
 [/./,"Xilema, floema e câmbio","Xilema sobe a seiva bruta; floema leva a elaborada. O câmbio faz os vasos; o felogênio faz o súber. Feixes espalhados = mono; em anel = eudicot.","Cap. 6 · Sistema vascular"]],
b7:[
 [/paliçádico|cutícula|camada/i,"Anatomia da folha","Em sanduíche: cutícula → epiderme → paliçádico (compacto, capta luz) → lacunoso (espaços, troca gases) → epiderme.","Cap. 7 · Por dentro, em sanduíche"],
 [/estômato/i,"Estômatos","Célula-guarda túrgida abre; flácida fecha.","Cap. 7 · Estômatos"],
 [/roseira/i,"Anexos da epiderme","Roseira tem acúleo (da epiderme, sai fácil). Espinho de cacto é folha modificada.","Cap. 7 · Anexos da epiderme"],
 [/./,"Partes e formas da folha","Filotaxia: 1 por nó = alternada; 2 = oposta; 3 ou mais = verticilada. Folha de mono: sem pecíolo, com bainha.","Cap. 7 · Partes e formas"]],
b8:[
 [/mamoeiro|diclina/i,"Sexo das flores e plantas","Monoclina: os dois sexos na mesma flor. Diclina: só um. Dioica: há pés machos e pés fêmeas.","Cap. 8 · Tipos de flor"],
 [/estames|pólen é|perianto/i,"Partes da flor","De fora para dentro: cálice (sépalas) → corola (pétalas) → androceu (estames ♂) → gineceu (carpelos ♀: estigma, estilete, ovário).","Cap. 8 · Quatro verticilos e peças férteis"],
 [/./,"Polinização","Polinização não é fecundação. Autopolinização reduz a variabilidade; a cruzada aumenta. Flor sem atrativos e com muito pólen = vento.","Cap. 8 · Polinização"]],
b9:[
 [/endosperma/i,"Endosperma","Endosperma é 3n: 1 núcleo espermático + 2 núcleos polares.","Cap. 9 · Semente"],
 [/germina/i,"Germinação","A radícula sai primeiro. Epígea: cotilédones sobem (feijão). Dormência = bloqueio interno; quiescência = falta algo do ambiente.","Cap. 9 · Germinação"],
 [/coco/i,"Dispersão","Vento = anemocoria; água = hidrocoria; animais = zoocoria.","Cap. 9 · Dispersão"],
 [/./,"Tipos de fruto","Fruto = ovário; semente = óvulo. Drupa tem um caroço; baga, várias sementes. Caju é pseudofruto (pedúnculo). Banana: partenocarpia.","Cap. 9 · Fruto"]],
b10:[
 [/anel/i,"Anel de Malpighi","Tirar a casca tira o floema: a raiz morre de fome, e acima do corte o tronco incha.","Cap. 10 · Anel de Malpighi"],
 [/gotinhas|gutação/i,"Pressão de raiz","A pressão de raiz é um empurrão fraco de baixo, que explica a gutação.","Cap. 10 · Pressão de raiz"],
 [/sais/i,"Absorção","Água entra por osmose. Sais entram por transporte ativo (gastam energia).","Cap. 10 · Absorção"],
 [/Münch|floema distribui/i,"Fluxo em massa (Münch)","O açúcar entra no floema na folha (fonte), a água vem atrás e a pressão empurra até o dreno.","Cap. 10 · Fluxo em massa (Münch)"],
 [/./,"Coesão-tensão","A transpiração puxa a coluna de água, como um canudinho. Coesão: água com água. Adesão: água com a parede.","Cap. 10 · Coesão-tensão (Dixon)"]],
b11:[
 [/abrir/i,"Como o estômato abre","Entra K⁺ → entra água → célula-guarda túrgida → ostíolo abre.","Cap. 11 · Como o estômato abre"],
 [/gutação/i,"Gutação × transpiração","Gutação é água líquida. Transpiração é vapor.","Cap. 11 · Mais e menos transpiração"],
 [/AUMENTA|clima seco/,"O que muda a transpiração","Calor, vento, ar seco e luz aumentam. Plantas de seca: cutícula grossa, folhas pequenas ou em espinhos.","Cap. 11 · Mais e menos transpiração"],
 [/./,"O dilema do estômato","A via estomática é a maior e controlável; a cuticular é pequena e sem controle. Fechar o estômato economiza água, mas corta o CO₂.","Cap. 11 · Duas vias e O dilema"]],
b12:[
 [/cerca viva|fototropismo|auxina|gravitropismo/i,"Auxina","A auxina da ponta inibe as gemas laterais (dominância apical): podou, ramifica. No fototropismo ela vai para a sombra, que cresce mais. A raiz é muito mais sensível que o caule.","Cap. 12 · Dominância apical, tropismos e A dose importa"],
 [/Bananas/i,"Etileno","O etileno é um gás: preso num saco, concentra e acelera o amadurecimento. Uma fruta madura apressa as vizinhas.","Cap. 12 · Etileno no dia a dia"],
 [/./,"Os cinco hormônios","Auxina: crescer e curvar (dominância apical, tropismos). Giberelina: alonga o caule e quebra a dormência. Citocinina: divide células e retarda o envelhecimento. Etileno: gás que amadurece frutos. Ácido abscísico: fecha estômatos na seca.","Cap. 12 · Hormônios vegetais"]],
 bi:[
 [/estômato|seca|abscísico|quente|vaselina/i,"O dilema que liga folha, água e açúcar","Estômato fechado → menos transpiração → menos subida de água e menos CO₂ → menos fotossíntese → menos açúcar no floema. Um ajuste na folha mexe na planta inteira.","Biologia · Caps. 7, 10, 11 e 12"],
 [/madrugada|depende da raiz|água|corante|xilema|três sistemas/i,"O caminho da água","Solo → pelo absorvente → córtex → endoderme → xilema (raiz → caule → nervura) → mesofilo → estômato → ar. O motor é a transpiração.","Biologia · Caps. 5, 6, 10 e 11"],
 [/açúcar|floema|anel|folhas de um pé|radicular|cacto|luz/i,"O caminho do açúcar","Folha (fonte) faz açúcar → floema → dreno (raiz, fruto, broto). Menos folha = menos açúcar; sem floema, a raiz passa fome.","Biologia · Caps. 6, 7 e 10"],
 [/semente|banana|reprodução|feijão/i,"O ciclo da reprodução","Flor → polinização → fecundação → ovário vira fruto e óvulo vira semente → dispersão → germinação → plântula vive da reserva até fazer fotossíntese.","Biologia · Caps. 6, 8 e 9"],
 [/./,"Estrutura e função","Cada órgão tem os três sistemas: revestimento (proteger e trocar), fundamental (fotossíntese, reserva, sustentação) e vascular (xilema sobe água, floema distribui açúcar).","Biologia · Caps. 5, 6 e 7"]],
 qn:[
 [/ordem alfabética|CH₂CH₃\)/i,"Ordem alfabética e cadeia principal","Escolha a maior cadeia; numere pela ponta mais perto das ramificações; escreva os grupos em ordem alfabética (di, tri, sec e terc não contam; iso conta).","Consulta rápida · Regras 1 a 4"],
 [/prefixo que indica|infixo|sufixo|ácido carboxílico termina/i,"Prefixo, infixo e sufixo","Nome = prefixo (nº de C) + infixo (an, en, in) + sufixo (função). Ex.: pent + en + ol = pent-en-ol.","Consulta rápida (tela inicial do quiz)"],
 [/grupo/i,"Radicais (grupos substituintes)","Isopropil e terc-butil prendem pelo carbono do meio; propil, butil e isobutil, pela ponta (CH₂). Vinil = CH=CH₂; fenil = C₆H₅; benzil = CH₂–C₆H₅.","Consulta rápida · Grupos substituintes"],
 [/funções|COO|CHO|benzeno/i,"Funções e casos especiais","Só a função de maior prioridade vira sufixo; a outra vira prefixo (hidroxi). Aldeído e ácido: carbono da função é o 1. Benzeno: orto 1,2, meta 1,3, para 1,4.","Consulta rápida · Sufixos e Regras 6 a 8"],
 [/./,"Numeração","Menor número para: 1º a função, 2º a dupla ou tripla, 3º as ramificações. No ciclo com dupla, a dupla fica entre C1 e C2.","Consulta rápida · Regra 2"]],

 cfg.lv=2;
 setTheme();
 const caps=CAPS.filter(c=>cfg.m==="t"||c.m===cfg.m);
 if(!cfg.sel||!cfg.sel.some(k=>caps.find(c=>c.k===k)))cfg.sel=caps.map(c=>c.k);
 const best=store.best||{};
 app.innerHTML=`
 <header>
  <div class="eyebrow"><a href="../" style="font-size:13px;font-weight:700;color:inherit;opacity:.75;text-decoration:none;margin-right:8px">← Início</a>Treino para a recuperação · 2ª série do ensino médio</div>
  <h1>Quiz de Química, Biologia e Literatura</h1>
  <p class="lead">Responda e veja na hora se acertou. Quando errar, a explicação mostra por que aquela alternativa está errada e qual é a certa.</p>
 </header>
 <section class="panel">
  <div class="eyebrow">1. Matéria</div>
  <div class="seg" id="mat">
   <button data-m="q" aria-pressed="${cfg.m==="q"}">Química</button>
   <button data-m="b" aria-pressed="${cfg.m==="b"}">Biologia</button>
   <button data-m="l" aria-pressed="${cfg.m==="l"}">Literatura</button>
   <button data-m="t" aria-pressed="${cfg.m==="t"}">Tudo misturado</button>
  </div>
  <p class="small" style="margin:0">Todas as questões são de <b>nível prova</b>: análise de afirmações, situações-problema, trechos para interpretar e as pegadinhas mais cobradas.</p>
  <div class="eyebrow">2. Capítulos</div>
  <div class="chips" id="caps">${caps.map(c=>{const n=Q.filter(q=>q.k===c.k&&inLv(q)).length;return `<label class="chip"><input type="checkbox" value="${c.k}" ${cfg.sel.includes(c.k)?"checked":""}><span class="tag ${c.m}">${AB[c.m]} ${c.tag||c.n}</span><span>${c.t}</span><span class="n">${n} questões</span></label>`}).join("")}</div>
  <div class="row small"><button class="chip" style="display:inline-flex;padding:6px 12px" id="all">Marcar todos</button><button class="chip" style="display:inline-flex;padding:6px 12px" id="none">Desmarcar todos</button></div>
  <div class="eyebrow">3. Quantas perguntas?</div>
  <div class="seg" id="qtd">${[10,20,0].map(n=>`<button data-n="${n}" aria-pressed="${cfg.n===n}">${n||"Todas"}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="go">Começar</button><span class="small" id="info"></span></div>
 </section>
 ${cfg.m==="q"||cfg.m==="t"?`<details class="panel ref" id="ref"><summary><b>Consulta rápida: regras e grupos de nomenclatura</b><span class="small">toque para abrir</span></summary>
<div class="refgrid">
<div><div class="eyebrow">Prefixo: nº de carbonos</div><p>1 met · 2 et · 3 prop · 4 but · 5 pent · 6 hex · 7 hept · 8 oct · 9 non · 10 dec</p></div>
<div><div class="eyebrow">Infixo: ligações</div><p>an = só simples · en = 1 dupla · in = 1 tripla · dien = 2 duplas · enin = dupla e tripla</p></div>
</div>
<div class="eyebrow">Sufixo: função (da maior para a menor prioridade)</div>
<div class="tw"><table><tr><th>Função</th><th>Nome</th><th>Exemplo</th></tr>
<tr><td>Ácido carboxílico</td><td>ácido …oico</td><td>ácido etanoico</td></tr>
<tr><td>Éster</td><td>…oato de …ila</td><td>etanoato de etila</td></tr>
<tr><td>Aldeído</td><td>-al</td><td>etanal</td></tr>
<tr><td>Cetona</td><td>-ona</td><td>propanona</td></tr>
<tr><td>Álcool</td><td>-ol</td><td>propan-2-ol</td></tr>
<tr><td>Amina</td><td>-amina</td><td>metanamina</td></tr>
<tr><td>Hidrocarboneto</td><td>-o</td><td>but-2-eno</td></tr></table></div>
<div class="eyebrow">Grupos substituintes</div>
<div class="tw"><table><tr><th>Grupo</th><th>Fórmula</th><th>Como lembrar</th></tr>
<tr><td>metil</td><td>–CH₃</td><td>1 carbono</td></tr>
<tr><td>etil</td><td>–CH₂CH₃</td><td>2 carbonos</td></tr>
<tr><td>propil</td><td>–CH₂CH₂CH₃</td><td>preso pela ponta</td></tr>
<tr><td>isopropil</td><td>–CH(CH₃)₂</td><td>preso pelo carbono do meio</td></tr>
<tr><td>butil</td><td>–CH₂CH₂CH₂CH₃</td><td>cadeia reta, pela ponta</td></tr>
<tr><td>sec-butil</td><td>–CH(CH₃)CH₂CH₃</td><td>preso por carbono secundário</td></tr>
<tr><td>isobutil</td><td>–CH₂CH(CH₃)₂</td><td>preso por um CH₂, ramificado na outra ponta</td></tr>
<tr><td>terc-butil</td><td>–C(CH₃)₃</td><td>preso por carbono terciário</td></tr>
<tr><td>vinil (etenil)</td><td>–CH=CH₂</td><td>eteno sem um H</td></tr>
<tr><td>fenil</td><td>–C₆H₅</td><td>benzeno sem um H</td></tr>
<tr><td>benzil</td><td>–CH₂–C₆H₅</td><td>CH₂ + anel</td></tr>
<tr><td>flúor, cloro, bromo, iodo</td><td>–F, –Cl, –Br, –I</td><td>sempre como prefixo</td></tr>
<tr><td>hidroxi</td><td>–OH</td><td>prefixo quando outra função é a principal</td></tr></table></div>
<div class="eyebrow">Regras, passo a passo</div>
<ol class="rules">
<li><b>Cadeia principal:</b> a maior sequência de carbonos que contém o grupo funcional e as duplas ou triplas.</li>
<li><b>Numeração:</b> menor número primeiro para o grupo funcional, depois para a dupla ou tripla, depois para as ramificações.</li>
<li><b>Ramificações em ordem alfabética,</b> cada uma com seu número. Não contam: di, tri, tetra, sec e terc. Conta: iso.</li>
<li><b>Grupos iguais:</b> di, tri, tetra, com todos os números: 2,2-dimetil.</li>
<li><b>Escrita:</b> número e letra com hífen, números entre si com vírgula. O número vem antes do infixo ou do sufixo: but-2-eno, pentan-2-ol. Com dieno entra um "a": buta-1,3-dieno.</li>
<li><b>Aldeído e ácido:</b> o carbono da função é sempre o 1, e o número não é escrito (propanal, ácido etanoico).</li>
<li><b>Ciclo com dupla:</b> a dupla fica entre C1 e C2.</li>
<li><b>Benzeno com dois grupos:</b> orto = 1,2 · meta = 1,3 · para = 1,4.</li>
</ol>
</details>
`:""}
 ${Object.keys(best).length?`<section class="panel"><div class="eyebrow">Seus melhores resultados</div>${Object.entries(best).map(([k,v])=>`<div class="row small"><b style="color:var(--ink)">${k}</b><span>${v}</span></div>`).join("")}</section>`:""}`;
 const pool=()=>Q.filter(q=>cfg.sel.includes(q.k)&&inLv(q));
 const info=()=>{const p=pool().length;const n=cfg.n?Math.min(cfg.n,p):p;document.getElementById("info").textContent=p?`${n} perguntas sorteadas de ${p}`:"Escolha pelo menos um capítulo";document.getElementById("go").disabled=!p};
 info();
 app.querySelectorAll("#mat button").forEach(b=>b.onclick=()=>{cfg.m=b.dataset.m;cfg.sel=null;store.m=cfg.m;save();setup()});
 app.querySelectorAll("#qtd button").forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;store.n=cfg.n;save();app.querySelectorAll("#qtd button").forEach(x=>x.setAttribute("aria-pressed",x===b));info()});
 app.querySelectorAll("#caps input").forEach(i=>i.onchange=()=>{cfg.sel=[...app.querySelectorAll("#caps input:checked")].map(x=>x.value);info()});
 document.getElementById("all").onclick=()=>{cfg.sel=caps.map(c=>c.k);setup()};
 document.getElementById("none").onclick=()=>{cfg.sel=[];app.querySelectorAll("#caps input").forEach(i=>i.checked=false);info()};
 document.getElementById("go").onclick=()=>{let p=shuffle(pool());if(cfg.n)p=p.slice(0,cfg.n);start(p,false)};
}

function start(list,retry){
 run={list:list.map(prep),i:0,ok:0,bad:0,miss:[],res:[],retry};
 ask();
}
function prep(q){
 if(q.o){const idx=shuffle(q.o.map((_,i)=>i));return {...q,ord:idx}}
 return {...q};
}

function ask(){
 const q=run.list[run.i],c=capOf(q.k);
 setTheme(c.m);
 const tot=run.list.length;
 app.innerHTML=`
 <div class="top"><span class="eyebrow">${label(c)} · ${esc(c.t)}</span>
  <span class="score"><span>${run.i+1}/${tot}</span><span class="o">✓ ${run.ok}</span><span class="x">✗ ${run.bad}</span></span></div>
 <div class="bar"><i style="width:${run.i/tot*100}%"></i></div>
 <section class="panel" aria-live="polite">
  ${q.lv===2?`<div><span class="lvb">Nível prova</span></div>`:""}
  ${q.o?"":`<div class="eyebrow">Verdadeiro ou falso?</div>`}
  <p class="stem">${q.s}</p>
  ${q.o?`<div class="opts">${q.ord.map((oi,p)=>`<button class="opt" data-i="${oi}"><b>${L[p]}</b><span>${q.o[oi][0]}</span></button>`).join("")}</div>`
       :`<div class="opts vf"><button class="opt" data-v="1"><b>V</b><span>Verdadeiro</span></button><button class="opt" data-v="0"><b>F</b><span>Falso</span></button></div>`}
  <div id="fb"></div>
 </section>
 <div class="row"><button class="btn ghost" id="quit">Encerrar e ver resultado</button><span class="kbd">Atalhos: teclas A–E ou V/F, e Enter para seguir.</span></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
 document.getElementById("quit").onclick=finish;
 window.scrollTo({top:0});
}

function answer(btn){
 const q=run.list[run.i];
 const all=[...app.querySelectorAll(".opt")];
 all.forEach(b=>b.disabled=true);
 let ok,html;
 if(q.o){
  const i=+btn.dataset.i;ok=i===q.c;
  const pos=q.ord.indexOf(q.c),mine=q.ord.indexOf(i);
  all.forEach(b=>{const bi=+b.dataset.i;if(bi===q.c)b.classList.add("right");else if(bi===i)b.classList.add("wrong");else b.classList.add("dim")});
  html=ok?`<div class="fb ok"><h3>✓ Acertou!</h3><p>${q.o[q.c][1]}</p></div>`
   :`<div class="fb bad"><h3>✗ Não foi dessa vez</h3>
     <div class="lbl">Por que a ${L[mine]} está errada</div><p>${q.o[i][1]}</p>
     <div class="lbl">A certa é a ${L[pos]}</div><p><b>${q.o[q.c][0]}</b> ${why(q.o[q.c][1])}</p></div>`;
  if(!ok)run.miss.push({q,mine:q.o[i][0]});
 }else{
  const v=btn.dataset.v==="1";ok=v===q.v;
  all.forEach(b=>{const bv=b.dataset.v==="1";b.classList.add(bv===q.v?"right":b===btn?"wrong":"dim")});
  const word=q.v?"verdadeira":"falsa";
  html=ok?`<div class="fb ok"><h3>✓ Acertou! A frase é ${word}.</h3><p>${q.e}</p></div>`
   :`<div class="fb bad"><h3>✗ Não foi dessa vez</h3><div class="lbl">A frase é ${word}, e não ${q.v?"falsa":"verdadeira"}</div><p>${q.e}</p></div>`;
  if(!ok)run.miss.push({q,mine:v?"Verdadeiro":"Falso"});
 }
 ok?run.ok++:run.bad++;
 run.res.push({q,ok});
 const last=run.i===run.list.length-1;
 document.getElementById("fb").innerHTML=html+`<div class="row" style="margin-top:12px"><button class="btn" id="next">${last?"Ver resultado":"Próxima pergunta"}</button></div>`;
 app.querySelector(".score").innerHTML=`<span>${run.i+1}/${run.list.length}</span><span class="o">✓ ${run.ok}</span><span class="x">✗ ${run.bad}</span>`;
 const nx=document.getElementById("next");
 nx.onclick=()=>{if(last)finish();else{run.i++;ask()}};
 nx.focus({preventScroll:true});
 document.getElementById("fb").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}

function finish(){
 const done=run.ok+run.bad;
 if(!done){setup();return}
 const pct=Math.round(run.ok/done*100);
 const msg=pct===100?"Gabaritou! Esse conteúdo está dominado.":pct>=70?"Mandou bem! Veja abaixo onde ainda dá para melhorar.":pct>=50?"Está no caminho. Siga a orientação abaixo e refaça os erros.":"Sem problema: errar aqui é treino. Comece pelos macetes abaixo e refaça as que errou.";
 if(!run.retry){
  const k=(MAT[cfg.m]||"Tudo misturado")+" · "+LVN[cfg.lv];
  store.best=store.best||{};
  const prev=store.best[k],prevPct=prev?parseInt(prev):-1;
  if(pct>=prevPct)store.best[k]=`${pct}% (${run.ok} de ${done})`;
  save();
 }
 // desempenho por capítulo
 const byCap={};
 run.res.forEach(({q,ok})=>{const b=byCap[q.k]=byCap[q.k]||{k:q.k,ok:0,n:0};b.n++;if(ok)b.ok++});
 const caps=Object.values(byCap).map(b=>({...b,p:b.ok/b.n,c:capOf(b.k)})).sort((a,b)=>a.p-b.p||b.n-a.n);
 const status=p=>p===1?["Dominado","ok"]:p>=.7?["Bom","mid"]:["Revisar","bad"];
 // temas com erro
 const byTopic={};
 run.res.filter(r=>!r.ok).forEach(({q})=>{const t=topicOf(q);if(!t)return;const key=q.k+"|"+t[1];const g=byTopic[key]=byTopic[key]||{k:q.k,t,n:0};g.n++});
 const topics=Object.values(byTopic).sort((a,b)=>b.n-a.n);
 const where=(k,r)=>{const c=capOf(k);return c.m==="q"?(/^(Cap\.|Isomeria plana|Nomes usuais)/.test(r)?`Química · ${r}`:`Química · ${c.lb||("Cap. "+c.n)} · ${r}`):c.m==="l"?r:r.startsWith("Biologia")?r:`Biologia · ${r}`};
 const worst=caps.find(c=>c.p<1);
 const next=pct===100?"Você gabaritou esta rodada. Próximo passo: faça um quiz com <b>Tudo misturado</b> ou escolha 20 perguntas para testar a memória."
  :`Próximo passo: leia os macetes acima, refaça só as que errou e, depois, treine o capítulo em que você foi pior${worst?`: <b>${label(worst.c)} · ${esc(worst.c.t)}</b>`:""}.`;
 setTheme();
 app.innerHTML=`
 <header><div class="eyebrow">Resultado</div><h1>${run.ok} de ${done} certas</h1></header>
 <section class="panel"><div class="row" style="gap:18px"><span class="big">${pct}%</span><p style="margin:0;max-width:40ch">${msg}</p></div></section>
 <section class="panel"><h2>Desempenho por capítulo</h2>
  <div class="caps">${caps.map(b=>{const [st,cl]=status(b.p);return `<div class="cap"><div class="capt"><span class="tag ${b.c.m}">${AB[b.c.m]} ${b.c.tag||b.c.n}</span><span class="capn">${esc(b.c.t)}</span><span class="st ${cl}">${st}</span></div><div class="capbar"><i class="${cl}" style="width:${Math.round(b.p*100)}%"></i></div><div class="small">${b.ok} de ${b.n} certas · ${Math.round(b.p*100)}%</div></div>`}).join("")}</div></section>
 ${topics.length?`<section class="panel"><h2>Onde focar agora</h2><p class="small" style="margin:0">Os temas em que você mais errou, com o macete para fixar e o lugar do resumo para reler.</p>
  <div class="tips">${topics.slice(0,4).map(g=>`<div class="tip"><div class="tiph"><b>${g.t[1]}</b><span class="small">${g.n} ${g.n>1?"erros":"erro"}</span></div><p><span class="lbl2">Macete</span> ${g.t[2]}</p><p class="small"><span class="lbl2">Releia no resumo</span> ${where(g.k,g.t[3])}</p></div>`).join("")}</div>
  ${topics.length>4?`<p class="small" style="margin:0">Mais ${topics.length-4} ${topics.length-4>1?"temas":"tema"} com erro aparecem na revisão abaixo.</p>`:""}</section>`:""}
 <section class="panel"><h2>Próximo passo</h2><p style="margin:0">${next}</p>
  <div class="row">${run.miss.length?`<button class="btn" id="redo">Refazer as ${run.miss.length} que errei</button>`:""}${worst?`<button class="btn ghost" id="train">Treinar: ${label(worst.c)}</button>`:""}<button class="btn ghost" id="new">Novo quiz</button></div></section>
 ${run.miss.length?`<section class="panel"><h2>Revisão dos erros</h2><div class="review">${run.miss.map(({q,mine})=>{const c=capOf(q.k);return `<div class="rv"><div class="eyebrow">${label(c)}</div><p><b>${q.s}</b></p><p class="small">Sua resposta: ${mine}</p><p>Certa: <b>${q.o?q.o[q.c][0]:(q.v?"Verdadeiro":"Falso")}</b> ${q.o?why(q.o[q.c][1]):q.e}</p></div>`}).join("")}</div></section>`:""}`;
 const r=document.getElementById("redo");
 if(r)r.onclick=()=>start(shuffle(run.miss.map(m=>Q.find(x=>x.s===m.q.s&&x.k===m.q.k))),true);
 const tr=document.getElementById("train");
 if(tr)tr.onclick=()=>start(shuffle(Q.filter(q=>q.k===worst.k&&inLv(q))),true);
 document.getElementById("new").onclick=setup;
 window.scrollTo({top:0});
}

document.addEventListener("keydown",e=>{
 if(!run||e.metaKey||e.ctrlKey||e.altKey)return;
 const nx=document.getElementById("next");
 if(e.key==="Enter"&&nx){e.preventDefault();nx.click();return}
 const k=e.key.toUpperCase();
 const opts=[...app.querySelectorAll(".opt:not(:disabled)")];
 if(!opts.length)return;
 if(opts[0].dataset.v!=null){if(k==="V")opts[0].click();if(k==="F")opts[1].click();return}
 const i=L.indexOf(k);if(i>=0&&opts[i])opts[i].click();
});

setup();
</script>
</body></html>
