{"k":"q4","lv":2,"s":"(UNIRIO) Na cocaína há um N ligado a três carbonos, um grupo –COOCH<sub>3</sub> e um grupo –O–CO–C<sub>6</sub>H<sub>5</sub>. As funções são","c":1,"o":[["amina e álcool.","Não há OH na cocaína."],["amina e éster.","Isso. N com três carbonos (amina terciária) e dois grupos –COO– (éster)."],["amida e éster.","O N não está ligado a nenhum C=O: é amina, não amida."],["cetona e fenol.","Os C=O fazem parte de –COO– (éster); não há OH no anel."],["ácido e amida.","Não há COOH livre nem N ligado a C=O."]]},
{"k":"q4","lv":2,"s":"(UFOP-MG) Na tiroxina (anéis com I, OH no anel, O entre os anéis, –CH<sub>2</sub>–CH(NH<sub>2</sub>)–COOH) as funções são","c":3,"o":[["álcool, haleto de acila, éster, amida e aldeído.","O OH está no anel (fenol), o O entre anéis é éter e há COOH, não aldeído."],["fenol, haleto de acila, éster, amina e aldeído.","O iodo está no anel (haleto orgânico); não há éster nem aldeído."],["álcool, haleto orgânico, éter, amida e ácido carboxílico.","O OH está no anel (fenol) e o N não está ligado a C=O (amina)."],["fenol, haleto orgânico, éter, amina e ácido carboxílico.","Isso. OH no anel, iodo no anel, O entre anéis, NH<sub>2</sub> e COOH."],["álcool, haleto orgânico, amida, éster e aldeído.","Não há álcool, amida, éster nem aldeído."]]},
{"k":"q4","lv":2,"s":"(UFPR 2023) 1. Aminas e amidas são hidroxiladas. 2. Éteres e ésteres são nitrogenadas. 3. Fenóis e alcoóis são oxigenadas. 4. Cetonas e aldeídos são carboniladas. Estão corretas","c":2,"o":[["2 apenas.","Éteres e ésteres são oxigenadas, não nitrogenadas."],["1 e 4 apenas.","Aminas e amidas são nitrogenadas, não hidroxiladas."],["3 e 4 apenas.","Isso. Fenóis e alcoóis têm O; cetonas e aldeídos têm C=O."],["1, 2 e 3 apenas.","1 e 2 estão erradas."],["1, 2, 3 e 4.","1 e 2 estão erradas."]]},
{"k":"q4","lv":2,"s":"Com a fórmula C<sub>3</sub>H<sub>6</sub>O, um composto de cadeia mista e heterocíclica é","c":4,"o":[["propanona.","Cadeia acíclica com carbonila."],["propanal.","Cadeia acíclica com formila."],["ciclopropanol.","Anel só de carbonos (homocíclico)."],["prop-2-en-1-ol.","Cadeia aberta."],["metiloxirano.","Isso. Anel com O (heterocíclico) e um metil pendurado (mista): é um éter."]]},
{"k":"q6","lv":2,"s":"A ordem crescente de PE de heptano (A), 3-metilexano (B) e 2,3-dimetilpentano (C) é","c":3,"o":[["A < B < C","É a ordem decrescente."],["B < A < C","O mais ramificado (C) tem o menor PE."],["A < C < B","O heptano, sem ramificação, tem o maior PE."],["C < B < A","Isso. Mesmo nº de C: mais ramificações, menor PE."],["todos iguais","São isômeros, mas as ramificações mudam o PE."]]},
{"k":"q6","lv":2,"s":"C<sub>3</sub>H<sub>4</sub> pode ser","c":2,"o":[["alcano ou alceno.","Alcano seria C<sub>3</sub>H<sub>8</sub>; alceno, C<sub>3</sub>H<sub>6</sub>."],["ciclano.","Ciclopropano é C<sub>3</sub>H<sub>6</sub>."],["alcino, alcadieno ou cicleno.","Isso. Obedece C<sub>n</sub>H<sub>2n−2</sub> com n = 3: propino, propadieno ou ciclopropeno."],["só aromático.","Aromático precisa de anel benzênico (6 C)."],["nenhuma subfunção.","Obedece à fórmula 2n − 2."]]},
{"k":"q11","lv":2,"s":"(UNIUBE) O nome oficial do isopropil-metilcarbinol é","c":2,"o":[["2-metilbutan-1-ol.","O OH não está na ponta: o carbinol tem dois grupos ligados."],["3-metilbutan-1-ol.","O OH estaria na ponta; no carbinol ele está no carbono com metil e isopropil."],["3-metilbutan-2-ol.","Isso. CH<sub>3</sub>–CH(OH)–CH(CH<sub>3</sub>)<sub>2</sub>: OH no 2, metil no 3."],["2-metilbutan-3-ol.","Numeração errada: a OH deve ter o menor número."],["3-metilbutan-3-ol.","A OH está no C2."]]},
{"k":"q11","lv":2,"s":"(UFRJ) O rincoferol, CH<sub>3</sub>–CH=CH–CH(OH)–CH<sub>2</sub>–CH(CH<sub>3</sub>)<sub>2</sub>, chama-se","c":4,"o":[["6,6-dimetilex-2-en-4-ol.","A cadeia principal tem 7 C, não 6."],["2-metilept-5-en-4-ol.","Numeração pela ponta errada: com a OH empatada, a dupla desempata."],["6-metilept-3-en-4-ol.","A dupla está entre C2 e C3."],["2,6-dimetilex-5-en-4-ol.","Cadeia e numeração erradas."],["6-metilept-2-en-4-ol.","Isso. OH no 4 pelas duas pontas; a dupla desempata (2); metil no 6."]]},
{"k":"q11","lv":2,"s":"Para compostos de massa molar próxima, a ordem de ponto de ebulição é","c":1,"o":[["aldeído > cetona > álcool.","É o contrário."],["álcool > cetona > aldeído.","Isso. Álcool faz ligação de H; cetona é mais polar que aldeído."],["cetona > álcool > aldeído.","O álcool vence a cetona por causa das ligações de H."],["éter > álcool > cetona.","O éter tem PE baixo (sem ligação de H entre si)."],["todos iguais.","Interações diferentes dão PE diferentes."]]},
{"k":"q11","lv":2,"s":"Quantos fenóis existem com a fórmula C<sub>7</sub>H<sub>8</sub>O?","c":2,"o":[["1","Há mais de uma posição para o metil."],["2","Faltou uma posição."],["3","Isso. Orto, meta e para-cresol (o álcool benzílico é álcool e o metoxibenzeno é éter)."],["4","Contou o álcool benzílico, que não é fenol."],["5","Contou álcool e éter, que não são fenóis."]]},
{"k":"q12","lv":2,"s":"(FEI) X = CH<sub>3</sub>CH(CH<sub>3</sub>)CH<sub>2</sub>COOCH<sub>3</sub>; Y = CH<sub>3</sub>CH(CH<sub>3</sub>)CH<sub>2</sub>COOH; Z = CH<sub>3</sub>CH<sub>2</sub>CH(CH<sub>3</sub>)CHO. Os nomes são","c":2,"o":[["3-metilpropanoato de metila, ácido 3-metilpropanoico, 3-metilpentanal.","A cadeia de X e Y tem 4 C (butanoato), e Z tem 4 C (butanal)."],["4-metilbutanoato de metila, ácido 2-metilbutanoico, 2-metilpentan-2-ona.","O C da função é o 1: metil no 3 em X e Y; Z é aldeído, não cetona."],["3-metilbutanoato de metila, ácido 3-metilbutanoico, 2-metilbutanal.","Isso. O C da função (COO, COOH, CHO) é sempre o 1."],["ácido 3-metilpentanoico, 3-metilbutanona, 3-metilbutanoato de etila.","Funções trocadas."],["3-metilbutanoato de etila, ácido 3-metilbutanoico, 3-metilbutanona.","X tem metila (não etila) e Z é aldeído."]]},
{"k":"q12","lv":2,"s":"O aroma de banana (C<sub>7</sub>H<sub>14</sub>O<sub>2</sub>) vem do","c":4,"o":[["butanoato de etila.","Tem 6 C (C<sub>6</sub>H<sub>12</sub>O<sub>2</sub>)."],["acetato de isobutila.","Tem 6 C."],["propanoato de isopentila.","Tem 8 C."],["acetato de butila.","Tem 6 C."],["acetato de isopentila.","Isso. Acetato (2 C) + isopentila (5 C) = 7 C."]]},
{"k":"q12","lv":2,"s":"Ácidos carboxílicos têm PE maior que álcoois de massa próxima porque","c":3,"o":[["têm mais carbonos.","A comparação é com massa próxima."],["são apolares.","São muito polares."],["não fazem ligações de hidrogênio.","Fazem, e muitas."],["fazem o dobro de ligações de hidrogênio.","Isso. Afirmação do livro."],["são compostos iônicos.","Iônicos são os sais orgânicos."]]},
{"k":"q14","lv":2,"s":"(UCDB) A xilocaína, C<sub>6</sub>H<sub>3</sub>(CH<sub>3</sub>)<sub>2</sub>–NH–CO–CH<sub>2</sub>–N(C<sub>2</sub>H<sub>5</sub>)<sub>2</sub>, apresenta","c":4,"o":[["amida e amina secundária.","O segundo N está ligado a três carbonos: terciária."],["cetona, amina secundária e amina terciária.","O C=O está ligado ao N: é amida, não cetona."],["cetona e duas aminas secundárias.","Há amida e amina terciária."],["um aminoácido.","Não há COOH."],["amida e amina terciária.","Isso. NH ligado ao C=O (amida) e N(C<sub>2</sub>H<sub>5</sub>)<sub>2</sub> (amina terciária)."]]},
{"k":"q14","lv":2,"s":"O nome de CH<sub>3</sub>–CO–N(CH<sub>3</sub>)<sub>2</sub> é","c":3,"o":[["dimetilamina.","Há C=O ligado ao N: é amida."],["N-metiletanamida.","São dois metis no N."],["2,2-dimetiletanamida.","Os metis estão no N, não no C2."],["N,N-dimetiletanamida.","Isso. Dois metis no N + etanamida."],["N,N-dimetilmetanamida.","A parte acila tem 2 C (etanamida)."]]},
{"k":"q14","lv":2,"s":"No haleto 4-clorobut-1-eno, a numeração","c":0,"o":[["favoreceu a insaturação (dupla no C1).","Isso. O livro escreve: prevalece a insaturação."],["favoreceu o cloro.","Se favorecesse o cloro, seria 1-clorobut-3-eno."],["seguiu a ordem alfabética.","A ordem alfabética só desempata."],["começou pelo carbono do meio.","Numeração começa por uma ponta."],["não importa.","Importa: a dupla tem prioridade."]]},
{"k":"qu","lv":2,"s":"Qual associação está ERRADA?","c":4,"o":[["metanol – álcool da madeira – tóxico.","Está correta."],["tolueno – metilbenzeno – solvente.","Está correta."],["clorofórmio – triclorometano – anestésico.","Está correta."],["anilina – fenilamina – corantes.","Está correta."],["formol – metanol – conservante.","Isso, está errada: formol é metanal (aldeído) em solução, não metanol."]]},
{"k":"qu","lv":2,"s":"O álcool 70% é antisséptico porque","c":1,"o":[["evapora rápido e esfria a pele.","Isso não inativa os vírus."],["dissolve o envelope viral lipoproteico.","Isso. Explicação do livro (cap. 11)."],["é um ácido forte.","Etanol não é ácido forte."],["reage com a água do vírus.","Não é o mecanismo descrito."],["é um aldeído.","Etanol é álcool."]]},
{"k":"q1","lv":2,"s":"Etanoato de etila e propanoato de metila são isômeros de","c":1,"o":[["função.","Os dois são ésteres."],["metameria (compensação).","Isso. Mesma função; a \"ponte\" COO muda de lugar entre as cadeias."],["cadeia.","Os dois têm cadeia heterogênea, aberta e normal."],["posição.","O que muda é a posição do heteroátomo: metameria."],["tautomeria.","Não estão em equilíbrio."]]},
{"k":"q1","lv":2,"s":"O equilíbrio prop-1-en-2-ol ⇌ propanona é exemplo de","c":4,"o":[["isomeria de cadeia.","A função muda (enol → cetona)."],["metameria.","Não há heteroátomo mudando entre cadeias."],["isomeria de posição.","A função muda."],["isomeria óptica.","Não envolve luz polarizada."],["tautomeria ceto-enólica.","Isso. Isomeria de função em equilíbrio dinâmico."]]},
{"k":"q1","lv":2,"s":"(UFRGS) Qual par está corretamente classificado?","c":2,"o":[["pentano × metilbutano: posição.","É cadeia (normal × ramificada)."],["but-1-eno × but-2-eno: cadeia.","É posição (da dupla)."],["propan-1-amina × etilmetilamina: cadeia.","Isso. Homogênea × heterogênea (resposta c da UFRGS no livro)."],["ácido propanoico × etanoato de metila: metameria.","É função (ácido × éster)."],["etoxietano × metoxipropano: função.","É metameria (dois éteres)."]]},
{"k":"q1","lv":2,"s":"(UECE) Para o éter comum (etoxietano), um isômero de função e um de compensação são, respectivamente,","c":2,"o":[["butanona e 1-metoxipropano.","Butanona é C<sub>4</sub>H<sub>8</sub>O: nem é isômero do éter (C<sub>4</sub>H<sub>10</sub>O)."],["butanona e butan-1-ol.","Butanona não é isômero; e butan-1-ol é de função, não de compensação."],["butan-1-ol e 1-metoxipropano.","Isso. Álcool (função diferente) e outro éter com o O em outra posição (compensação)."],["butan-2-ol e butanona.","Butanona tem fórmula diferente."],["2-metilpropanona e propanal.","Fórmulas diferentes de C<sub>4</sub>H<sub>10</sub>O."]]},
{"k":"q1","lv":2,"s":"(PUC-MG) Um isômero de função da 4-metilpentan-2-ona (C<sub>6</sub>H<sub>12</sub>O) é","c":1,"o":[["hexan-1-ol.","Álcool com 6 C é C<sub>6</sub>H<sub>14</sub>O: fórmula diferente."],["hexanal.","Isso. Aldeído C<sub>6</sub>H<sub>12</sub>O: mesma fórmula, outra função."],["4-metilbutanal.","Tem só 5 C."],["4-metilpentan-1-ol.","É C<sub>6</sub>H<sub>14</sub>O."],["3-metilpentan-3-ona.","É cetona também: mesma função."]]},
{"k":"q1","lv":2,"s":"(FAMECA) Exemplifica isomeria constitucional de cadeia o par","c":1,"o":[["propanal e propanona.","Função (aldeído × cetona)."],["propilamina e metil-etilamina.","Isso. Homogênea × heterogênea (N na ponta ou no meio)."],["butan-1-ol e butan-2-ol.","Posição (da OH)."],["1-metoxipropano e etoxietano.","Metameria (O muda de lugar)."],["ácido propanoico e metanoato de etila.","Função (ácido × éster)."]]},
{"k":"b5","lv":2,"s":"Considere as afirmações sobre a raiz de uma eudicotiledônea:<br>I. A água entra principalmente pela zona pilífera, onde os pelos absorventes aumentam a superfície de contato com o solo.<br>II. A coifa, por ser a primeira parte a tocar o solo, é a principal região de absorção.<br>III. As raízes laterais se originam do periciclo, camada que fica por dentro da endoderme.<br>Está correto o que se afirma em","c":0,"o":[["I e III, apenas.","Isso. A absorção ocorre na zona pilífera, e o periciclo, logo depois da endoderme, origina as raízes laterais. A II erra: a coifa só protege a ponta."],["I, apenas.","A III também está certa: a ordem é epiderme → córtex → endoderme → periciclo, e é o periciclo que forma as raízes laterais."],["II e III, apenas.","A II está errada: a coifa é um capacete de proteção, não absorve. Quem absorve é a zona pilífera."],["I e II, apenas.","A II está errada (coifa não absorve) e a III está certa (o periciclo origina as raízes laterais)."],["I, II e III.","A II é a pegadinha clássica: a coifa protege a ponta da raiz, mas quem absorve água é a zona pilífera."]]},
{"k":"b5","lv":2,"s":"Ao transplantar mudas, um jardineiro arrancou algumas com força, sem terra em volta; outras foram retiradas com o torrão intacto. As mudas arrancadas murcharam nos primeiros dias, mesmo com rega abundante. A explicação mais provável é que o arrancamento","c":1,"o":[["destruiu a coifa, que é a principal região de absorção de água.","A coifa só protege a ponta da raiz. A absorção acontece na zona pilífera."],["rompeu muitos pelos absorventes e reduziu a área de absorção.","Isso. Os pelos absorventes são finos e frágeis. Sem eles, a zona pilífera absorve muito menos água, e a muda murcha até formar pelos novos."],["removeu a zona suberosa, que é a porta de entrada da água na raiz.","A zona suberosa é onde saem as ramificações. A entrada principal da água é a zona pilífera."],["danificou o periciclo, que puxa a água do solo por osmose.","O periciclo fica no interior da raiz e origina raízes laterais. Ele não é a superfície de absorção."],["eliminou o meristema apical, o único tecido que absorve sais.","O meristema apical serve para alongar a raiz (crescimento primário), não para absorver água ou sais."]]},
{"k":"b5","lv":2,"s":"Em cortes transversais de duas raízes, um estudante observou:<br>Raiz X: xilema em forma de cruz no centro.<br>Raiz Y: vasos dispostos em círculo, com medula no centro.<br>A hipótese mais coerente é que","c":2,"o":[["X é de monocotiledônea, de raiz fasciculada, e Y é de eudicotiledônea, de raiz pivotante.","Está invertido. Xilema em cruz é de eudicotiledônea; vasos em círculo com medula é de monocotiledônea."],["X e Y são de eudicotiledôneas, pois as duas têm endoderme e periciclo.","Endoderme e periciclo existem nos dois grupos, então não servem para separar. O que diferencia é a disposição dos vasos."],["X pode ser de um feijoeiro, de raiz pivotante, e Y de um pé de milho, de raiz fasciculada.","Isso. Xilema em cruz combina com eudicotiledônea (feijão, raiz pivotante); vasos em círculo com medula combina com monocotiledônea (milho, raiz em cabeleira)."],["X está em crescimento primário e Y em secundário, pois a medula só surge pela ação do câmbio.","A medula não é produto do câmbio vascular. A diferença entre X e Y é de grupo (eudicotiledônea e monocotiledônea), não de idade."],["Y é uma raiz tuberosa, pois a medula central sempre guarda amido.","Ter medula indica raiz de monocotiledônea, não raiz tuberosa. Raiz tuberosa é definida por guardar reserva, como na cenoura."]]},
{"k":"b5","lv":2,"s":"Três situações: (1) num manguezal, o solo é lodoso e quase sem oxigênio; (2) numa lavoura, pés de milho altos tombam com ventos fortes; (3) numa floresta, uma figueira cresce sobre outra árvore e, anos depois, a hospedeira morre sufocada. As raízes que correspondem a cada situação são, respectivamente:","c":3,"o":[["escora, pneumatóforo e sugadora.","As duas primeiras estão trocadas: o mangue tem pneumatóforos (respiram) e o milho tem raízes-escora (sustentam)."],["pneumatóforo, tuberosa e estranguladora.","Raiz tuberosa guarda reserva (cenoura, mandioca). O que impede o milho de tombar é a raiz-escora."],["aquática, escora e grampiforme.","No mangue a raiz cresce para fora da lama para captar ar (pneumatóforo). Grampiforme é a da hera, que prende a trepadeira ao muro."],["pneumatóforo, escora e estranguladora.","Isso. O pneumatóforo sai da lama e capta ar, a escora sustenta o milho e a estranguladora da figueira abraça e sufoca a hospedeira."],["pneumatóforo, escora e sugadora (haustório).","A figueira não suga seiva: ela abraça o tronco e sufoca a hospedeira (raiz estranguladora). O haustório é das plantas parasitas."]]},
{"k":"b5","lv":2,"s":"Com os anos, uma árvore fica mais alta, e seu tronco e suas raízes engrossam. Sobre os tecidos responsáveis por esses dois tipos de crescimento, é correto afirmar que","c":4,"o":[["altura e espessura dependem do mesmo meristema, o apical.","O meristema apical só alonga. O engrossamento depende dos meristemas laterais."],["câmbio vascular e felogênio são meristemas apicais, ligados ao crescimento primário.","Câmbio vascular e felogênio são meristemas laterais, do crescimento secundário (espessura)."],["o meristema lateral alonga a planta e o apical a engrossa.","Está invertido: o apical alonga (primário) e os laterais engrossam (secundário)."],["o felogênio produz xilema e floema, e o câmbio vascular produz súber e feloderme, a casca.","Está trocado: o câmbio vascular produz xilema e floema; o felogênio forma a periderme (súber e feloderme)."],["o apical alonga (primário); câmbio e felogênio, laterais, engrossam (secundário).","Isso. Crescimento primário = comprimento, pelo meristema apical. Crescimento secundário = espessura, pelos meristemas laterais."]]},
{"k":"b5","lv":2,"s":"Numa raiz, a água que entra pelo pelo absorvente e segue até o xilema precisa atravessar a endoderme, a camada que filtra o que entra, antes de chegar aos vasos.","v":true,"e":"Verdadeiro. A ordem, de fora para o centro, é epiderme → córtex → endoderme → periciclo → xilema e floema. A endoderme funciona como um filtro antes dos vasos."},
{"k":"b5","lv":2,"s":"Como a raiz das monocotiledôneas é fasciculada, ela não tem endoderme nem periciclo; essas camadas são exclusivas da raiz pivotante das eudicotiledôneas.","v":false,"e":"Falso. Raízes dos dois grupos têm epiderme, córtex, endoderme e periciclo. O que muda é a forma do sistema (pivotante ou fasciculada) e a disposição dos vasos (em cruz ou em círculo com medula)."},
{"k":"b6","lv":2,"s":"Analise:<br>I. Colênquima e esclerênquima têm parede espessa, mas só o esclerênquima tem lignina e células mortas.<br>II. A dureza das “pedrinhas” da pera e a flexibilidade do talo do salsão se devem, respectivamente, ao colênquima e ao esclerênquima.<br>III. Súber e esclerênquima têm células mortas, mas o súber tem lipídios na parede, o que o torna impermeável.<br>Está correto o que se afirma em","c":1,"o":[["I, apenas.","A III também está certa: o súber (cortiça) é morto e tem lipídios na parede, por isso veda a água."],["I e III, apenas.","Isso. A II inverte os tecidos: as pedrinhas da pera são esclereídes (esclerênquima) e o talo do salsão é flexível por causa do colênquima."],["II e III, apenas.","A II está invertida: dureza = esclerênquima (lignina); flexibilidade = colênquima (celulose)."],["I e II, apenas.","A II está errada (os tecidos estão trocados) e a III está certa (súber morto com lipídios na parede)."],["I, II e III.","A II é a pegadinha: colênquima é o flexível (Celulose, células vivas) e esclerênquima é o duro (lignina, células mortas)."]]},
{"k":"b6","lv":2,"s":"Em uma eudicotiledônea lenhosa, a epiderme do caule se rompe à medida que o tronco engrossa e é substituída pela periderme. Sobre esse processo, é correto afirmar que","c":2,"o":[["a periderme é a própria epiderme, que engrossou e acumulou súber.","A periderme não vem da epiderme. Ela é formada por um meristema secundário, o felogênio."],["o felogênio produz súber para dentro e feloderme para fora.","Está invertido: o súber fica para fora (é a cortiça) e a feloderme para dentro."],["o felogênio, meristema secundário, forma súber para fora e feloderme para dentro.","Isso. Periderme = felogênio + feloderme (para dentro) + súber (para fora). É ela que substitui a epiderme no crescimento secundário."],["o câmbio vascular origina a periderme, ao produzir súber e feloderme.","O câmbio vascular produz xilema e floema secundários. Quem produz súber e feloderme é o felogênio."],["a periderme aparece em todas as angiospermas, inclusive na maioria das monocotiledôneas.","Segundo o livro, a periderme aparece em gimnospermas e na maioria das eudicotiledôneas, as que têm crescimento secundário."]]},
{"k":"b6","lv":2,"s":"Um estudante recebeu quatro estruturas subterrâneas: batata-inglesa, batata-doce, gengibre e cebola. Ele precisa separar as que são caule sem cortá-las. Qual raciocínio leva à classificação correta?","c":3,"o":[["Todas são caules, pois guardam reserva e ficam sob o solo.","Guardar reserva debaixo da terra não define o órgão: raízes tuberosas também fazem isso."],["Só a cebola é caule, pois é a única que tem folhas modificadas.","Batata-inglesa (tubérculo) e gengibre (rizoma) também são caules: têm gemas e nós."],["Batata-inglesa e batata-doce são tubérculos, pois as duas brotam se esquecidas.","O critério do livro é a presença de gemas e nós. A batata-doce é raiz tuberosa, não tubérculo."],["Batata-inglesa, gengibre e cebola são caules: têm gemas e nós. A batata-doce é raiz.","Isso. Gemas e nós são a marca do caule: tubérculo (batata-inglesa), rizoma (gengibre) e bulbo (cebola). A batata-doce é raiz tuberosa."],["O gengibre é raiz, pois cresce na horizontal, e a batata-inglesa é caule, pois tem amido.","Crescer na horizontal sob o solo é justamente o rizoma, um caule. E amido existe em raízes e em caules."]]},
{"k":"b6","lv":2,"s":"Num mesmo intervalo de tempo, os elementos de vaso conduzem mais água que as traqueídes. A explicação e a distribuição dessas células estão corretas em:","c":4,"o":[["traqueídes são mais largas e têm placas perfuradas; predominam nas angiospermas.","Está trocado: quem é mais largo e tem placas perfuradas é o elemento de vaso, típico das angiospermas."],["elementos de vaso são vivos e levam seiva elaborada; ocorrem nas gimnospermas.","Elementos de vaso são do xilema: células mortas que levam seiva bruta. Seiva elaborada vai pelo floema."],["traqueídes não têm lignina, por isso conduzem menos; ocorrem nas pteridófitas.","As duas células do xilema têm parede reforçada por lignina. A traqueíde conduz menos por ser estreita e menos especializada."],["as duas têm placas crivadas, mas só os elementos de vaso contam com células companheiras.","Placas crivadas e células companheiras são do floema (elementos de tubo crivado), não do xilema."],["elementos de vaso são largos, com placas perfuradas; predominam nas angiospermas.","Isso. Traqueídes são longas e estreitas, menos especializadas (pteridófitas e gimnospermas). Elementos de vaso, mais largos e com placas perfuradas, conduzem mais."]]},
{"k":"b6","lv":2,"s":"No corte transversal de um caule, os feixes vasculares aparecem espalhados pelo sistema fundamental, sem formar anel. Esse caule","c":0,"o":[["deve ser de monocotiledônea, grupo em que a periderme em geral não aparece.","Isso. Feixes espalhados indicam monocotiledônea. A periderme é típica de gimnospermas e da maioria das eudicotiledôneas, as que engrossam."],["é de eudicotiledônea, pois feixes espalhados permitem o crescimento em espessura.","Na eudicotiledônea os feixes ficam organizados em anel. Feixes espalhados indicam monocotiledônea."],["tem xilema e floema secundários, produzidos pelo procâmbio.","O procâmbio produz os vasos primários. Os secundários vêm do câmbio vascular."],["é de gimnosperma, pois feixes espalhados são típicos de plantas com traqueídes.","O livro associa feixes espalhados às monocotiledôneas. Ter traqueídes não define a disposição dos feixes."],["é de eudicotiledônea jovem, cujos feixes se espalham depois da ação do felogênio.","O felogênio forma a periderme (súber e feloderme), não reorganiza feixes. Eudicotiledônea tem feixes em anel."]]},
{"k":"b6","lv":2,"s":"Na bananeira, o “tronco” que se vê acima do solo é o caule verdadeiro, do tipo ereto; por isso o produtor planta pedaços dele para obter novas bananeiras.","v":false,"e":"Falso. O caule da bananeira é um rizoma, subterrâneo e horizontal. O “tronco” visível é formado pelas bainhas das folhas. O produtor planta pedaços do rizoma (propagação vegetativa)."},
{"k":"b6","lv":2,"s":"Os elementos de tubo crivado são células vivas, mas sem núcleo; se as células companheiras de um trecho do floema morressem, o transporte de seiva elaborada naquele trecho seria prejudicado.","v":true,"e":"Verdadeiro. Sem núcleo, o tubo crivado depende das células companheiras, que enviam proteínas e ATP por conexões citoplasmáticas."},
{"k":"b7","lv":2,"s":"Considere:<br>I. Os espinhos do cacto e os acúleos da roseira são folhas modificadas que reduzem a perda de água.<br>II. As partes coloridas da buganvília são brácteas, folhas modificadas que atraem polinizadores.<br>III. As gavinhas da ervilha são folhas modificadas, enquanto as da videira têm origem no caule.<br>Está correto o que se afirma em","c":2,"o":[["I, apenas.","A I é a errada: o acúleo da roseira é anexo da epiderme, não folha modificada. II e III estão certas."],["I e II, apenas.","A I está errada: só o espinho do cacto é folha modificada; o acúleo da roseira sai da epiderme e destaca fácil."],["II e III, apenas.","Isso. A I erra porque o acúleo da roseira é anexo da epiderme. Brácteas atraem polinizadores, e gavinha pode ser folha (ervilha) ou caule (videira)."],["I e III, apenas.","A I está errada (acúleo não é folha) e a II está certa (a parte colorida da buganvília são brácteas)."],["I, II e III.","A I é a pegadinha: espinho do cacto é folha modificada, mas acúleo da roseira é anexo da epiderme."]]},
{"k":"b7","lv":2,"s":"Duas folhas da mesma árvore foram cortadas: uma do topo, muito exposta ao sol, e outra do interior sombreado da copa. A folha de sol tinha o mesofilo paliçádico bem mais espesso. Essa diferença faz sentido porque","c":3,"o":[["o paliçádico tem muitos espaços entre as células, e a folha de sol troca mais gases.","Quem tem muitos espaços é o lacunoso. O paliçádico é compacto."],["o paliçádico armazena água, essencial para a folha mais exposta.","A função do paliçádico é captar luz para a fotossíntese, não armazenar água."],["o lacunoso é o principal tecido que capta luz, e a folha de sombra precisa mais dele.","O tecido especializado em captar luz é o paliçádico. O lacunoso facilita a troca de gases."],["o paliçádico, de células compactas, capta luz, e no topo há mais luz.","Isso. Mais luz disponível “compensa” um paliçádico mais espesso, com mais células captando luz para a fotossíntese."],["o paliçádico fica na face de baixo, protegido do excesso de luz.","O paliçádico fica logo abaixo da epiderme de cima; o lacunoso é que fica perto da face de baixo."]]},
{"k":"b7","lv":2,"s":"Um estudante passou esmalte incolor na face de cima de uma folha A e na face de baixo de uma folha B, da mesma espécie, e deixou as duas ao sol. A folha B perdeu bem menos água e, depois, mostrou fotossíntese menor que a de A. O resultado indica que","c":4,"o":[["a cutícula da face de baixo é mais grossa, por isso o esmalte não fez diferença.","O esmalte fez diferença sim: a folha B mudou muito. E a cutícula não explica a queda da fotossíntese."],["os estômatos ficam na face de cima, e o esmalte na folha B aumentou a entrada de CO₂.","Se os estômatos estivessem em cima, a folha A é que teria perdido menos água. E tapar poros não aumenta a entrada de CO₂."],["a fotossíntese caiu porque o esmalte bloqueou a luz que chega ao paliçádico.","O esmalte era incolor e, na folha B, foi passado embaixo, longe do paliçádico. O problema foi o CO₂, não a luz."],["a folha B perdeu mais água pela via cuticular, compensando os poros tapados.","A folha B perdeu menos água, não mais. Tapar a face com estômatos reduz a principal saída de vapor."],["os estômatos ficam sobretudo embaixo; tapá-los barrou a água e o CO₂.","Isso. Os estômatos ficam, em geral, na face de baixo. Fechados pelo esmalte, seguram a água, mas barram o CO₂ da fotossíntese."]]},
{"k":"b7","lv":2,"s":"Um botânico observou uma planta com folhas sem pecíolo, presas ao caule por uma bainha, e raízes em cabeleira. Em cada nó do caule há uma única folha. A classificação mais coerente é","c":0,"o":[["monocotiledônea, com filotaxia alternada.","Isso. Bainha sem pecíolo e raiz fasciculada indicam monocotiledônea. Uma folha por nó é filotaxia alternada."],["eudicotiledônea, com filotaxia oposta.","Raiz em cabeleira e bainha apontam para monocotiledônea. E filotaxia oposta teria duas folhas por nó."],["monocotiledônea, com filotaxia verticilada.","O grupo está certo, mas verticilada exige três ou mais folhas no mesmo nó."],["eudicotiledônea com filotaxia alternada, pois a bainha substitui o pecíolo.","A filotaxia está certa, mas bainha no lugar do pecíolo e raiz fasciculada são marcas de monocotiledônea."],["monocotiledônea, com folha composta, pois a bainha divide o limbo.","A bainha prende a folha ao caule; ela não divide o limbo. Folha composta é a que tem o limbo dividido em folíolos."]]},
{"k":"b7","lv":2,"s":"Ao cortar uma cebola ao meio, vê-se uma base dura no fundo e várias camadas carnosas. Sobre essas estruturas, é correto afirmar que","c":1,"o":[["as camadas são raízes tuberosas e a base é o caule.","As raízes da cebola ficam embaixo da base. As camadas são folhas modificadas."],["as camadas são catafilos com reserva, e a base é o caule do bulbo.","Isso. A cebola é um bulbo: uma porção central de caule (o “prato”) de onde saem catafilos, que guardam reserva e protegem a gema."],["as camadas são brácteas e a base é o receptáculo floral.","Brácteas são folhas coloridas que atraem polinizadores, e receptáculo é parte da flor. Nenhum dos dois forma a cebola."],["as camadas são cotilédones e a base é o embrião.","Cotilédones são folhas do embrião dentro da semente. A cebola não é semente."],["a cebola inteira é um caule do tipo tubérculo, já que tem gemas e brota quando guardada.","Ter gemas mostra que há caule, mas o tipo é bulbo. Tubérculo é a ponta dilatada de um ramo, como a batata-inglesa."]]},
{"k":"b7","lv":2,"s":"Uma folha cujo mesofilo lacunoso ficasse compactado, sem espaços entre as células, teria a troca de gases prejudicada mesmo com os estômatos abertos.","v":true,"e":"Verdadeiro. Os espaços do lacunoso levam o CO₂ que entra pelo estômato até as células e facilitam a troca de gases. Sem eles, o estômato aberto adianta pouco."},
{"k":"b7","lv":2,"s":"Os acúleos da roseira e os espinhos do cacto têm a mesma origem: os dois são folhas modificadas para reduzir a transpiração.","v":false,"e":"Falso. O espinho do cacto é folha modificada (poupa água e defende). O acúleo da roseira é anexo da epiderme, por isso sai fácil quando puxado."},
{"k":"b8","lv":2,"s":"Considere:<br>I. Toda flor monoclina é completa, pois tem androceu e gineceu.<br>II. Toda flor diclina é incompleta.<br>III. Numa espécie dioica, a autopolinização dentro de um mesmo indivíduo é impossível.<br>Está correto o que se afirma em","c":3,"o":[["I, apenas.","A I está errada: uma flor pode ter androceu e gineceu e não ter pétalas ou sépalas, sendo monoclina e incompleta."],["I e II, apenas.","A I está errada: monoclina fala só das peças férteis; completa exige também cálice e corola."],["I e III, apenas.","A I está errada e a II está certa: se falta androceu ou gineceu, falta um dos quatro verticilos."],["II e III, apenas.","Isso. Diclina tem só um dos sexos, então falta um verticilo (incompleta). Na planta dioica cada indivíduo é só macho ou só fêmea, então não há pólen e óvulo no mesmo pé."],["I, II e III.","A I é a pegadinha: monoclina (dois sexos na flor) não garante cálice e corola, que são exigidos para ser completa."]]},
{"k":"b8","lv":2,"s":"A flor 1 abre ao anoitecer, é pouco colorida, tem cheiro forte e muito néctar. A flor 2 é vermelha, em forma de tubo e muito rica em néctar. Os polinizadores mais prováveis são, respectivamente,","c":4,"o":[["abelhas e vento.","A flor do vento não tem néctar nem cor. E abelhas são atraídas por cores vivas e perfume de dia."],["vento e morcegos.","Flor com muito néctar e cheiro forte não aposta no vento, que não sente cheiro."],["beija-flores e morcegos.","Está invertido: a flor que abre à noite é de morcego; a vermelha em tubo é de beija-flor."],["borboletas e abelhas.","Insetos são atraídos por cores vivas. A flor que abre à noite, pouco colorida, combina com morcegos; a vermelha com néctar, com aves."],["morcegos e aves.","Isso. Abre à noite, pouco colorida e com muito néctar: quiropterofilia. Vermelha e com muito néctar: ornitofilia."]]},
{"k":"b8","lv":2,"s":"Flores de uma planta autoincompatível foram ensacadas antes de abrir e, depois, polinizadas à mão com o pólen da própria flor. O pólen chegou ao estigma, mas nenhuma semente se formou. A conclusão correta é que","c":0,"o":[["houve polinização, mas a autoincompatibilidade barrou a fecundação.","Isso. Polinizar é o pólen chegar ao estigma, e isso aconteceu. A fecundação (união dos gametas) é que foi barrada."],["não houve polinização, pois pólen da mesma flor não conta como polinização.","Conta, sim: é autopolinização. O pólen saiu da antera e chegou ao estigma."],["houve fecundação, mas o ovário não amadureceu por falta de luz dentro do saco.","Sem sementes, não há sinal de fecundação. O bloqueio é a autoincompatibilidade, não a luz."],["a falha se deve à dicogamia, pois pólen e estigma amadureceram juntos.","Dicogamia é amadurecer em épocas diferentes. Aqui o pólen foi colocado à mão e a barreira é a autoincompatibilidade."],["a flor era diclina, por isso não poderia receber o próprio pólen.","Se a flor tinha pólen próprio e estigma, ela era monoclina, não diclina."]]},
{"k":"b8","lv":2,"s":"Uma lavoura é formada por plantas obtidas quase sempre por autopolinização. Outra população da mesma espécie depende de polinização cruzada por abelhas. Se surgir uma nova praga, espera-se que","c":1,"o":[["a lavoura autopolinizada resista melhor, por ter mais variabilidade genética.","A autopolinização diminui a variabilidade, deixando as plantas mais parecidas entre si."],["a população de polinização cruzada tenha mais chance de ter resistentes.","Isso. A polinização cruzada aumenta a variabilidade genética, e assim fica mais provável existir alguma planta resistente."],["as duas respondam igual, pois o tipo de polinização não altera a variabilidade.","Altera, sim: a cruzada aumenta e a autopolinização diminui a variabilidade."],["a autopolinização aumente a variabilidade, por misturar pólen e óvulo.","Na autopolinização pólen e óvulo vêm da mesma planta, então a mistura de genes é menor."],["a polinização cruzada reduza a variabilidade, por depender de um só polinizador.","A espécie do polinizador não importa: a cruzada mistura genes de plantas diferentes e aumenta a variabilidade."]]},
{"k":"b8","lv":2,"s":"Um aluno retirou com pinça todas as anteras de flores monoclinas ainda em botão. Metade delas foi coberta com saco de tecido fino (grupo 1); a outra metade ficou exposta a insetos (grupo 2). Espera-se formação de frutos com sementes","c":2,"o":[["nos dois grupos, pois o ovário continua intacto.","Ovário intacto não basta: sem pólen não há fecundação, e o grupo 1 não recebe pólen."],["só no grupo 1, pois o saco aquece a flor e estimula a fecundação.","O saco impede a chegada de pólen. Sem pólen, não há fecundação nem semente."],["só no grupo 2, que pode receber pólen de outras flores.","Isso. Sem anteras a flor não produz pólen; só a que fica exposta recebe pólen de fora (polinização cruzada)."],["em nenhum grupo, pois sem estames a flor fica sem estigma.","O estigma é do carpelo, não do estame. Retirar as anteras não tira o estigma."],["só no grupo 1, pois a flor sem anteras se autopoliniza.","Sem anteras não há pólen próprio, então não pode haver autopolinização."]]},
{"k":"b8","lv":2,"s":"Uma flor sem cálice e sem corola é incompleta e, por isso, não consegue se reproduzir.","v":false,"e":"Falso. Cálice e corola formam o perianto, que são peças inférteis. Se a flor tiver estames e carpelos, pode se reproduzir normalmente, como muitas flores polinizadas pelo vento."},
{"k":"b8","lv":2,"s":"O mamoeiro é dioico; por isso, um pomar só com pés femininos, isolado de outros mamoeiros, tende a não formar frutos com sementes.","v":true,"e":"Verdadeiro. Em planta dioica, o pólen vem dos pés masculinos. Sem eles, não há polinização nem fecundação, e portanto não há sementes."},
{"k":"b9","lv":2,"s":"Considere:<br>I. Na semente, o endosperma é triploide, formado pela união de um núcleo espermático com dois núcleos polares.<br>II. Depois da fecundação, o óvulo origina o fruto e o ovário origina a semente.<br>III. Na banana cultivada, o fruto se forma sem fecundação (partenocarpia), por isso não há sementes.<br>Está correto o que se afirma em","c":4,"o":[["I, apenas.","A III também está certa: a banana cultivada é partenocárpica, o fruto se forma sem fecundação e não tem sementes."],["II, apenas.","A II está invertida: o ovário vira fruto e o óvulo vira semente."],["I e II, apenas.","A II troca os papéis: ovário → fruto; óvulo → semente."],["II e III, apenas.","A II está errada (os papéis estão invertidos) e a I está certa (endosperma 3n = 1 núcleo espermático + 2 polares)."],["I e III, apenas.","Isso. Endosperma 3n vem de n + n + n. Ovário vira fruto e óvulo vira semente (a II inverte). Banana é partenocárpica."]]},
{"k":"b9","lv":2,"s":"Em maçã, morango, caju e abacaxi, a parte que comemos não vem só do ovário. Qual associação está correta?","c":0,"o":[["Morango: receptáculo carnoso; os frutos são os aquênios.","Isso. A parte vermelha é o receptáculo que cresceu, e cada pontinho é um aquênio, fruto seco com uma semente."],["Caju: receptáculo carnoso; o fruto verdadeiro é a castanha.","A castanha é o fruto, mas a parte carnosa do caju vem do pedúnculo, não do receptáculo."],["Maçã: pedúnculo carnoso; o fruto verdadeiro é o miolo.","Na maçã a polpa vem do receptáculo. Pedúnculo carnoso é o caso do caju."],["Abacaxi: fruto agregado, formado por vários ovários de uma só flor.","O abacaxi vem de uma inflorescência inteira, então é múltiplo. Agregado vem de vários ovários de uma só flor."],["Morango: fruto múltiplo, formado pelas flores de uma inflorescência.","O morango vem de uma única flor. Múltiplo, formado por uma inflorescência, é o abacaxi."]]},
{"k":"b9","lv":2,"s":"Sementes de uma espécie foram divididas em dois lotes. Lote 1: guardadas secas por meses, germinaram em poucos dias ao receber água, O₂ e temperatura adequada. Lote 2: recém-colhidas, receberam as mesmas condições e não germinaram; só germinaram depois de tratadas com giberelina. Os lotes 1 e 2 estavam, respectivamente, em","c":1,"o":[["dormência e quiescência.","Está invertido. O lote 1 só esperava o ambiente (quiescência); o lote 2 tinha bloqueio interno (dormência)."],["quiescência e dormência.","Isso. Quiescência: falta algo do ambiente; chegou, germina. Dormência: bloqueio interno, não germina mesmo com ambiente bom. A giberelina quebra a dormência."],["quiescência nos dois casos, pois só faltava água.","O lote 2 recebeu água e não germinou. Isso indica bloqueio interno, ou seja, dormência."],["dormência nos dois casos, pois os dois ficaram um tempo sem germinar.","O lote 1 germinou assim que teve as condições: era só quiescência, não dormência."],["germinação hipógea e germinação epígea.","Epígea e hipógea dizem onde ficam os cotilédones na germinação, não por que a semente germina ou não."]]},
{"k":"b9","lv":2,"s":"Sementes de feijão e de milho foram plantadas na mesma profundidade. No feijão, duas estruturas carnosas subiram acima do solo; no milho, nada parecido apareceu. É correto afirmar que","c":2,"o":[["o feijão tem germinação hipógea, e as estruturas que subiram são catafilos.","Se os cotilédones sobem, a germinação é epígea. Catafilos são folhas de reserva de bulbos, como a cebola."],["no milho os cotilédones também sobem, mas ficam escondidos pela bainha.","No milho o cotilédone fica embaixo da terra: a germinação é hipógea."],["o feijão tem germinação epígea (cotilédones sobem) e o milho, hipógea.","Isso. Eudicotiledônea com dois cotilédones que sobem (feijão) e monocotiledônea, com um cotilédone que fica sob o solo (milho)."],["as estruturas do feijão são a radícula e o caulículo, que sempre saem primeiro.","A radícula vira raiz e cresce para baixo. As duas estruturas carnosas que sobem são os cotilédones."],["o milho tem dois cotilédones que ficam no solo, por isso é hipógeo.","A germinação do milho é hipógea, mas ele é monocotiledônea: tem um só cotilédone."]]},
{"k":"b9","lv":2,"s":"Tomate, pêssego, vagem de feijão e grão de milho foram classificados por um estudante. A classificação correta é:","c":3,"o":[["tomate: drupa; pêssego: baga; vagem: indeiscente; milho: deiscente.","Tudo invertido: tomate (várias sementes) é baga, pêssego (um caroço) é drupa, vagem abre e grão não abre."],["tomate: baga; pêssego: drupa; vagem: indeiscente; milho: deiscente.","Os carnosos estão certos, mas a vagem se abre (deiscente) e o grão não se abre (indeiscente)."],["tomate: drupa; pêssego: drupa; vagem: deiscente; milho: indeiscente.","O tomate tem várias sementes e não tem caroço: é baga, não drupa."],["tomate: baga; pêssego: drupa; vagem: deiscente; milho: indeiscente.","Isso. Baga = várias sementes; drupa = um caroço. Secos que abrem (vagem) são deiscentes; que não abrem (grão) são indeiscentes."],["tomate: baga; pêssego: baga; vagem: deiscente; milho: indeiscente.","O pêssego tem um único caroço: é drupa, como a azeitona."]]},
{"k":"b9","lv":2,"s":"Na semente de milho, monocotiledônea, a reserva fica guardada em dois cotilédones carnosos, como no feijão.","v":false,"e":"Falso. O milho, como monocotiledônea, tem um só cotilédone, e sua reserva fica principalmente no endosperma. Dois cotilédones carnosos com reserva é o caso do feijão, uma eudicotiledônea."},
{"k":"b9","lv":2,"s":"Sem fecundação, o óvulo não forma semente; mesmo assim, nos casos de partenocarpia, o ovário pode se desenvolver em fruto.","v":true,"e":"Verdadeiro. A semente vem do óvulo fecundado. Na partenocarpia o ovário vira fruto sem fecundação, por isso o fruto não tem sementes, como na banana."},
{"k":"b10","lv":2,"s":"Considere:<br>I. Pela teoria da coesão-tensão, a força que eleva a seiva bruta vem principalmente da transpiração nas folhas, e não da raiz.<br>II. A pressão de raiz é um empurrão fraco que explica a gutação, mas não basta para levar água ao topo de árvores altas.<br>III. Segundo Münch, o açúcar sai do floema na fonte e entra no dreno, onde a pressão é maior.<br>Está correto o que se afirma em","c":0,"o":[["I e II, apenas.","Isso. A III está errada: o açúcar entra no floema na fonte (folha); a água vem atrás por osmose, a pressão sobe ali e empurra a seiva até o dreno."],["I, apenas.","A II também está certa: a pressão de raiz é fraca e explica a gutação, não a subida em árvores altas."],["II e III, apenas.","A III está errada: na fonte o açúcar entra no floema, e é lá que a pressão fica maior."],["I e III, apenas.","A III inverte o modelo de Münch: a pressão é maior na fonte, onde o açúcar entra, e a seiva flui para o dreno."],["I, II e III.","A III é a pegadinha: o fluxo vai da pressão maior (fonte) para a menor (dreno)."]]},
{"k":"b10","lv":2,"s":"Raízes de uma planta foram mantidas em solução nutritiva com uma substância que bloqueia a respiração celular e reduz a produção de ATP. Logo após o tratamento, espera-se que","c":1,"o":[["a entrada de água e a de sais parem, pois as duas dependem de ATP.","A água entra por osmose, que não gasta ATP diretamente. Só a absorção de sais é ativa."],["caia a absorção de sais, que é ativa, mas não a de água, que é por osmose.","Isso. Sais entram por transporte ativo (gasta energia); a água entra por osmose, um processo passivo."],["a absorção de água pare, pois a osmose gasta energia, e a de sais continue.","Está invertido: osmose é passiva; o transporte ativo de sais é que depende de ATP."],["nada mude, pois toda a absorção feita pela raiz é passiva.","A entrada de sais é por transporte ativo, então depende de energia e cai sem ATP."],["aumente a absorção de sais, pois o bloqueio deixa a membrana mais permeável.","Sem ATP, o transporte ativo de sais diminui, não aumenta."]]},
{"k":"b10","lv":2,"s":"Numa planta de batata-inglesa, enquanto os tubérculos se formam, o açúcar das folhas desce para eles. Mais tarde, quando um tubérculo brota, o açúcar guardado nele sobe para os brotos novos. Isso mostra que","c":2,"o":[["na brotação, o xilema leva seiva elaborada para cima.","O açúcar é transportado pelo floema. O xilema leva água e sais (seiva bruta)."],["o floema só funciona para baixo, e o açúcar que chega aos brotos vem pelo xilema.","O floema não é “só para baixo”: ele vai da fonte para o dreno, em qualquer direção."],["o tubérculo foi dreno e virou fonte, e o floema segue da fonte ao dreno.","Isso. Quando guardava reserva, o tubérculo era dreno; ao brotar, passa a ser fonte, e os brotos viram dreno."],["a coesão-tensão explica o transporte de açúcar do tubérculo aos brotos.","Coesão-tensão explica a subida da seiva bruta no xilema. O açúcar segue o fluxo em massa (Münch)."],["o tubérculo é sempre dreno, por ser um órgão de reserva.","Órgão de reserva pode virar fonte quando a planta usa o que guardou, como na brotação."]]},
{"k":"b10","lv":2,"s":"Em duas árvores iguais, retirou-se um anel completo de casca do tronco. Na árvore 1, havia um ramo com folhas abaixo do anel; na árvore 2, todas as folhas estavam acima do anel. Espera-se que","c":3,"o":[["a árvore 2 sobreviva mais, pois tem mais folhas acima do anel mandando água ao tronco.","O problema do anel é o açúcar, não a água: a raiz fica sem seiva elaborada. Folhas acima do corte não alimentam a raiz."],["as duas morram ao mesmo tempo, pois o xilema foi retirado nas duas.","O anel de casca retira o floema; o xilema fica mais para dentro e continua levando água."],["a árvore 1 morra antes, pois o ramo baixo disputa o açúcar com as raízes.","O ramo com folhas abaixo do anel é fonte: ele produz açúcar e pode mandá-lo às raízes."],["a árvore 1 sobreviva mais, pois as folhas abaixo do anel ainda alimentam a raiz.","Isso. Abaixo do anel o floema está inteiro; as folhas ali são fonte e alimentam a raiz, que é dreno."],["nenhuma morra, pois o floema se refaz a partir do xilema em poucos dias.","O floema retirado não se refaz a partir do xilema. Sem açúcar, a raiz morre de fome e depois a planta toda."]]},
{"k":"b10","lv":2,"s":"Pulgões enfiam o aparelho bucal no floema e recebem um líquido açucarado que sai sob pressão. Se um vaso do xilema de uma planta transpirando fosse furado com uma agulha fina, espera-se que","c":4,"o":[["os dois líquidos saiam sob pressão, pois ambos são empurrados pela raiz.","A pressão de raiz é fraca. Numa planta transpirando, o xilema está sob tensão (puxado de cima), não sob pressão."],["o pulgão esteja, na verdade, sugando o xilema, que tem células vivas ricas em açúcar.","O xilema tem células mortas e leva água e sais. O açúcar está no floema, que é vivo."],["a seiva do xilema jorre com mais força, pois a transpiração empurra a água.","A transpiração puxa a água de cima, como um canudinho. Ela não empurra a coluna."],["o líquido do pulgão venha do xilema e o da agulha, do floema.","Está trocado: o líquido açucarado do pulgão vem do floema; a agulha furou o xilema."],["o floema esteja sob pressão (Münch), e o xilema sob tensão, sem a água jorrar.","Isso. No floema a pressão é positiva (fluxo em massa). No xilema a coluna está sendo puxada pela transpiração, então um furo não faz a água jorrar."]]},
{"k":"b10","lv":2,"s":"Se as moléculas de água não tivessem coesão, a transpiração nas folhas não conseguiria puxar uma coluna contínua de água até o topo de uma árvore alta.","v":true,"e":"Verdadeiro. A coesão mantém as moléculas unidas, e a coluna sobe inteira quando a folha perde água. Sem ela, a coluna se romperia, como um canudinho com o suco cortado."},
{"k":"b10","lv":2,"s":"A gutação vista de manhã em folhas de plantas com solo úmido é uma prova da teoria da coesão-tensão, pois mostra a água sendo puxada pela transpiração.","v":false,"e":"Falso. A gutação é explicada pela pressão de raiz, um empurrão de baixo para cima. Ela aparece justamente quando a transpiração é baixa, com ar úmido."},
{"k":"b11","lv":2,"s":"Considere:<br>I. Num dia quente, seco e com vento, a transpiração tende a aumentar.<br>II. Se o CO₂ dentro da folha cair muito por causa de uma fotossíntese intensa, os estômatos tendem a abrir.<br>III. A via cuticular é a principal via de perda de água e é controlada pela abertura do ostíolo.<br>Está correto o que se afirma em","c":1,"o":[["I, apenas.","A II também está certa: pouco CO₂ dentro da folha abre o estômato, para entrar mais."],["I e II, apenas.","Isso. Calor, ar seco e vento aumentam a transpiração, e pouco CO₂ interno abre o estômato. A III erra: a via principal e controlável é a estomática."],["II e III, apenas.","A III está errada: a via cuticular perde pouca água e não tem controle. O ostíolo é o poro do estômato."],["I e III, apenas.","A III está errada (a principal via é a estomática) e a II está certa (pouco CO₂ abre)."],["I, II e III.","A III é a pegadinha: a cuticular é pequena e sem controle; o ostíolo pertence ao estômato."]]},
{"k":"b11","lv":2,"s":"Em um experimento, células-guarda foram mantidas numa solução que impede a entrada de íons potássio (K⁺). Mesmo sob luz forte, os estômatos ficaram fechados. A explicação é que","c":2,"o":[["sem K⁺, a cutícula engrossa e trava a abertura.","A cutícula não controla o estômato. A abertura depende da água que entra nas células-guarda."],["o K⁺ é a fonte de energia da fotossíntese das células-guarda.","O K⁺ não é fonte de energia. Ele faz a água entrar por osmose."],["sem K⁺, as células-guarda não puxam água e não ficam túrgidas.","Isso. A entrada de K⁺ puxa água por osmose; túrgidas, as células-guarda abrem o ostíolo. Sem K⁺, continuam flácidas."],["a falta de K⁺ deixa as células-guarda túrgidas, e isso fecha o ostíolo.","Túrgidas, as células-guarda abrem o estômato. E sem K⁺ elas ficam flácidas, não túrgidas."],["o K⁺ é necessário para a planta produzir ácido abscísico.","O ácido abscísico fecha o estômato na seca. O papel do K⁺ é atrair água para abrir."]]},
{"k":"b11","lv":2,"s":"Uma planta da Caatinga tem cutícula grossa, folhas reduzidas a espinhos, estômatos em cavidades e caule verde com parênquima aquífero. Sobre essas características, é INCORRETO afirmar que","c":3,"o":[["a cutícula grossa reduz a perda de água pela via cuticular.","Esta afirmação está correta: a cera da cutícula impermeabiliza. A pergunta pede a incorreta."],["os estômatos em cavidades ficam protegidos do vento, que aumentaria a transpiração.","Esta afirmação está correta: o vento aumenta a transpiração, e a cavidade protege o poro."],["com as folhas em espinhos, o caule verde assume a fotossíntese.","Esta afirmação está correta: é o cladódio, caule clorofilado típico de cactos e palma."],["os espinhos aumentam a superfície de transpiração e ajudam a resfriar a planta.","Isso. Esta é a incorreta: os espinhos reduzem a superfície e a perda de água; numa planta de clima seco, poupar água é prioridade."],["o parênquima aquífero funciona como reserva de água para a seca.","Esta afirmação está correta: é a “caixa-d'água” do cacto."]]},
{"k":"b11","lv":2,"s":"Um gráfico mostra a transpiração de uma planta bem irrigada ao longo de 24 horas: quase nula de madrugada, sobe de manhã, chega ao máximo perto do meio-dia e cai ao anoitecer. A interpretação correta é:","c":4,"o":[["de madrugada não há nenhuma perda de água, nem pela cutícula.","Quase nula não é zero: a via cuticular perde um pouco de água mesmo com os estômatos fechados."],["o máximo ao meio-dia ocorre porque os estômatos se fecham com o calor.","Estômato fechado reduz a transpiração. Planta bem irrigada mantém o estômato aberto ao meio-dia."],["a transpiração segue a umidade do ar: quanto mais úmido, mais vapor sai.","É o contrário: ar úmido diminui a transpiração; ar seco aumenta."],["ao anoitecer a gutação substitui a transpiração e explica a queda.","Gutação é saída de água líquida pelos hidatódios. Ela não explica a curva; a queda vem do escuro, que fecha o estômato."],["a luz abre o estômato, e o ar mais quente e seco aumenta a evaporação.","Isso. Luz abre o estômato e escuro fecha; calor e ar seco aumentam a transpiração. Com água no solo, não há motivo para fechar ao meio-dia."]]},
{"k":"b11","lv":2,"s":"Duas plantas iguais e bem regadas ficaram sob a mesma luz e temperatura: a planta A em ar saturado de umidade e sem vento; a planta B em ar seco e com ventilador. Depois de algumas horas, mediu-se a água absorvida pelas raízes. Espera-se que","c":0,"o":[["B absorva mais, pois transpira mais e a tensão puxa mais água pelo xilema.","Isso. Ar seco e vento aumentam a transpiração; pela coesão-tensão, mais água sai em cima e mais água é puxada pela raiz."],["A absorva mais, pois o ar úmido entra pelas folhas e se soma à água da raiz.","Ar úmido diminui a transpiração, e com ela o puxão que faz a raiz absorver."],["as duas absorvam igual, pois a absorção depende apenas da raiz.","A absorção de água acompanha a transpiração: a perda nas folhas é o motor da subida."],["B absorva menos, pois o vento resfria a folha e diminui a evaporação.","O vento retira o vapor perto da folha e aumenta a transpiração, como o livro indica."],["A absorva mais, pois a umidade aumenta a gutação, que puxa água da raiz.","A gutação é causada por um empurrão da raiz (pressão de raiz), não por um puxão. E ela é pouca água."]]},
{"k":"b11","lv":2,"s":"Gutação e transpiração são o mesmo processo; a única diferença é o horário, já que a gutação é a transpiração da madrugada.","v":false,"e":"Falso. Transpiração é perda de água em forma de vapor, sobretudo pelos estômatos. Gutação é saída de água líquida pelos hidatódios, causada pela pressão de raiz."},
{"k":"b11","lv":2,"s":"Uma planta com os estômatos sempre fechados economizaria água, mas teria a fotossíntese reduzida e perderia parte do resfriamento que a evaporação proporciona.","v":true,"e":"Verdadeiro. É o dilema do estômato: fechado segura a água, mas barra o CO₂ da fotossíntese, e a planta deixa de se resfriar pela transpiração."},
{"k":"b12","lv":2,"s":"Considere:<br>I. Uma concentração de auxina que estimula o crescimento do caule pode inibir o crescimento da raiz.<br>II. Auxina e citocinina têm o mesmo efeito sobre as gemas laterais: as duas as mantêm dormentes.<br>III. O ácido abscísico é o principal responsável pela queda de folhas e frutos, como o nome sugere.<br>Está correto o que se afirma em","c":2,"o":[["I e II, apenas.","A II está errada: a citocinina faz as gemas laterais brotarem, o contrário da auxina."],["II e III, apenas.","As duas estão erradas: citocinina faz as gemas brotarem, e quem derruba folhas e frutos é principalmente o etileno."],["I, apenas.","Isso. A raiz é muito mais sensível à auxina. A II erra porque a citocinina estimula as gemas laterais, e a III porque a abscisão é principalmente obra do etileno."],["I e III, apenas.","A III é a pegadinha do nome: abscísico lembra abscisão, mas quem derruba folha e fruto é principalmente o etileno."],["III, apenas.","A III está errada (é o etileno) e a I está certa (a dose que estimula o caule inibe a raiz)."]]},
{"k":"b12","lv":2,"s":"Plântulas iluminadas só de um lado foram tratadas assim: (1) intactas; (2) com a ponta do caule cortada; (3) com a ponta coberta por um capuz opaco. Espera-se curvatura em direção à luz","c":3,"o":[["em 1, 2 e 3.","Em 2 não há a ponta, que produz a auxina; em 3 a ponta não percebe de que lado vem a luz."],["apenas em 2 e 3.","Justamente 2 e 3 não curvam: uma não tem a ponta que produz auxina, e a outra tem a ponta no escuro."],["apenas em 1 e 2.","Sem a ponta (2), não há fonte de auxina para fazer um lado crescer mais que o outro."],["apenas em 1.","Isso. A auxina é produzida na ponta e vai para o lado da sombra, que cresce mais. Sem a ponta, ou com ela no escuro, não há distribuição desigual."],["apenas em 3.","Com a ponta coberta, ela não percebe a luz lateral; a auxina não se acumula de um lado e o caule cresce reto."]]},
{"k":"b12","lv":2,"s":"Um produtor quer: (1) enraizar estacas de roseira; (2) acelerar o amadurecimento de bananas colhidas verdes; (3) fazer sementes germinarem mais rápido; (4) atrasar o amarelecimento de folhas de alface na prateleira. Os hormônios indicados são, respectivamente:","c":4,"o":[["giberelina, etileno, auxina e citocinina.","Os itens 1 e 3 estão trocados: auxina enraíza estacas e giberelina estimula a germinação."],["auxina, ácido abscísico, giberelina e citocinina.","Ácido abscísico é o freio; quem amadurece frutos é o etileno."],["auxina, etileno, citocinina e giberelina.","Estão trocadas as duas últimas: giberelina quebra a dormência e a citocinina retarda o envelhecimento das folhas."],["citocinina, etileno, giberelina e auxina.","Quem enraíza estacas é a auxina; quem mantém a folha verde é a citocinina."],["auxina, etileno, giberelina e citocinina.","Isso. Auxina enraíza estacas, etileno amadurece frutos, giberelina estimula a germinação e citocinina retarda o envelhecimento."]]},
{"k":"b12","lv":2,"s":"Na planta 1, a gema apical foi cortada e, no lugar dela, aplicou-se uma pasta com auxina. Na planta 2, a gema apical foi mantida, e aplicou-se citocinina diretamente nas gemas laterais. Espera-se que","c":0,"o":[["na planta 1 as gemas laterais sigam inibidas; na planta 2 elas tendam a brotar.","Isso. A pasta repõe a auxina da ponta e mantém a dominância apical. A citocinina faz as gemas laterais brotarem."],["na planta 1 as gemas laterais brotem, pois a gema apical foi retirada.","Quem inibe as gemas é a auxina, não a gema em si. A pasta repôs a auxina, então a inibição continua."],["nas duas as gemas laterais sigam inibidas, pois a auxina sempre prevalece.","A citocinina aplicada nas gemas laterais tem efeito contrário ao da auxina: estimula a brotação."],["na planta 2 a citocinina reforce a dominância apical.","A citocinina faz as gemas laterais brotarem, ou seja, enfraquece a dominância apical."],["na planta 1 a auxina faça as gemas laterais brotarem, já que estimula o crescimento.","A auxina alonga células, mas nas gemas laterais o efeito é de inibição: é a dominância apical."]]},
{"k":"b12","lv":2,"s":"Uma plântula foi deitada na horizontal, no escuro. Em poucas horas, o caule curvou para cima e a raiz, para baixo. Admitindo que a auxina se acumule no lado de baixo dos dois órgãos, a explicação correta é:","c":1,"o":[["no caule e na raiz, a auxina inibe o lado de baixo, e os dois órgãos curvam para baixo.","O caule curvou para cima. No caule a auxina estimula o lado em que se acumula."],["no caule, a auxina estimula o lado de baixo; na raiz, mais sensível, inibe.","Isso. Lado de baixo do caule cresce mais e ele sobe (gravitropismo negativo). Na raiz o lado de baixo cresce menos e ela desce (positivo)."],["o estímulo é a luz, pois a auxina sempre vai para o lado iluminado.","A plântula estava no escuro: o estímulo é a gravidade. E no fototropismo a auxina vai para a sombra."],["o etileno acumulado embaixo faz o caule subir e a raiz descer.","O hormônio dos tropismos é a auxina. O etileno amadurece frutos e provoca a abscisão."],["na raiz, a auxina estimula o lado de baixo; no caule, a mesma dose inibe esse lado.","Está invertido: a raiz é a mais sensível e é inibida; o caule é estimulado."]]},
{"k":"b12","lv":2,"s":"Sementes com muito ácido abscísico tendem a continuar dormentes mesmo com água e temperatura adequadas, e a giberelina pode ajudar a quebrar essa dormência.","v":true,"e":"Verdadeiro. O ácido abscísico é o freio que mantém sementes e gemas dormentes. A giberelina faz o papel oposto: quebra a dormência e estimula a germinação."},
{"k":"b12","lv":2,"s":"Embrulhar bananas verdes em jornal atrasa o amadurecimento, porque o papel impede a entrada do oxigênio de que o etileno precisa para agir.","v":false,"e":"Falso. O jornal acelera o amadurecimento: o etileno é um gás liberado pelo próprio fruto e fica preso no embrulho, mais concentrado."},
{"k":"q4","lv":2,"s":"O paracetamol, analgésico e antitérmico, tem a estrutura HO–C<sub>6</sub>H<sub>4</sub>–NH–CO–CH<sub>3</sub> (OH e NH em posição para no anel benzênico). As funções orgânicas presentes são","c":3,"o":[["álcool e amina.","A OH está ligada direto ao anel benzênico (fenol), e o N está ligado ao C=O (amida)."],["fenol e amina.","O N está ligado a um C=O (–NH–CO–): isso é amida, não amina."],["álcool e amida.","A OH está no carbono insaturado do anel benzênico: é fenol, não álcool."],["fenol e amida.","Isso. OH ligada direto ao anel benzênico = fenol; –NH–CO– (N ligado à carbonila) = amida."],["fenol, cetona e amina.","O C=O está ligado ao N, então não é cetona (que exige C=O entre dois carbonos): o conjunto –NH–CO– é amida."]]},
{"k":"q4","lv":2,"s":"A capsaicina, responsável pela ardência da pimenta, tem um anel benzênico com –OH e –O–CH<sub>3</sub> vizinhos e, no outro lado do anel, a cadeia –CH<sub>2</sub>–NH–CO–(CH<sub>2</sub>)<sub>4</sub>–CH=CH–CH(CH<sub>3</sub>)<sub>2</sub>. As funções orgânicas da capsaicina são","c":0,"o":[["fenol, éter e amida.","Isso. OH no anel = fenol; O entre o anel e o CH<sub>3</sub> = éter; N ligado ao C=O = amida. A dupla C=C só torna a cadeia insaturada."],["álcool, éster e amina.","A OH está no anel benzênico (fenol); o –O–CH<sub>3</sub> não tem C=O (é éter, não éster); e o N ligado ao C=O é amida."],["fenol, éster e amina.","O –O–CH<sub>3</sub> não tem C=O ao lado: é éter. E –NH–CO– é amida, não amina."],["álcool, éter e amida.","A OH está ligada a carbono do anel benzênico: é fenol, não álcool."],["fenol, éter, cetona e amina.","O C=O está ligado ao N: o grupo –NH–CO– é uma amida só, não cetona + amina."]]},
{"k":"q4","lv":2,"s":"O ácido acetilsalicílico (aspirina) tem um anel benzênico com dois grupos vizinhos: –COOH e –O–CO–CH<sub>3</sub>. Analise:<br>I. Apresenta as funções ácido carboxílico e éster.<br>II. Apresenta a função fenol, pois há oxigênio ligado diretamente ao anel.<br>III. Sua fórmula molecular é C<sub>9</sub>H<sub>8</sub>O<sub>4</sub>.<br>Está(ão) correta(s)","c":4,"o":[["I apenas.","A III também está correta: C<sub>6</sub>H<sub>4</sub> + COOH + OCOCH<sub>3</sub> = C<sub>9</sub>H<sub>8</sub>O<sub>4</sub>."],["II apenas.","A II é a errada: o O ligado ao anel também está ligado a C=O (éster), e não há OH no anel."],["I e II apenas.","A II está errada: para ser fenol precisa de OH ligada ao anel; ali o O faz parte do éster."],["II e III apenas.","A II está errada (é éster, não fenol) e a I está correta."],["I e III apenas.","Isso. –COOH = ácido carboxílico; –O–CO–CH<sub>3</sub> = éster. Contagem: C 6+1+2 = 9; H 4+1+3 = 8; O 2+2 = 4. Não há fenol: a única OH é da carboxila."]]},
{"k":"q4","lv":2,"s":"A vanilina (aroma de baunilha), cujo nome é 4-hidróxi-3-metoxibenzaldeído, apresenta as funções álcool, éter e cetona.","v":false,"e":"A OH está ligada ao anel benzênico (fenol, não álcool) e o grupo –CHO é aldeído (o nome termina em “aldeído”), não cetona. As funções são fenol, éter e aldeído."},
{"k":"q6","lv":2,"s":"O nome IUPAC do hidrocarboneto CH<sub>3</sub>–CH<sub>2</sub>–CH(CH<sub>3</sub>)–CH(CH<sub>2</sub>–CH<sub>3</sub>)–CH<sub>2</sub>–CH<sub>2</sub>–CH<sub>3</sub> é","c":2,"o":[["3-metil-4-etileptano.","Numeração certa, mas os radicais devem ser citados em ordem alfabética: etil antes de metil."],["4-etil-5-metileptano.","Numerou pela ponta errada: pela esquerda os radicais ficam em 3 e 4 (soma 7); pela direita, em 4 e 5 (soma 9)."],["4-etil-3-metileptano.","Isso. Cadeia mais longa: 7 C (heptano). Numerando pela esquerda: metil no C3 e etil no C4 (menores números); citação em ordem alfabética: etil, metil."],["3-etil-4-metileptano.","Trocou as posições: no C3 está o metil e no C4 está o etil. Esse nome é de outro composto."],["3-metil-4-propilexano.","Escolheu uma cadeia de 6 C. A cadeia principal é a mais longa: seguindo pelo lado do propil ela tem 7 C (heptano)."]]},
{"k":"q6","lv":2,"s":"Seguindo as regras do livro (a cadeia principal deve conter a insaturação, mesmo que não seja a mais longa), o nome de CH<sub>2</sub>=C(CH<sub>2</sub>–CH<sub>3</sub>)–CH(CH<sub>3</sub>)–CH<sub>2</sub>–CH<sub>2</sub>–CH<sub>3</sub> é","c":1,"o":[["3-metil-2-etilex-1-eno.","Numeração e cadeia certas, mas a citação dos radicais deve seguir a ordem alfabética: etil antes de metil."],["2-etil-3-metilex-1-eno.","Isso. A cadeia com a dupla vai do CH<sub>2</sub>= até o fim do propil: 6 C (hexeno). Numerando pela dupla: dupla no C1, etil no C2, metil no C3."],["5-etil-4-metilex-5-eno.","Numerou pela ponta errada: a insaturação tem prioridade e deve receber o menor número (C1)."],["4-metil-3-metilenoeptano.","Escolheu a cadeia de 7 C que passa pelo etil, mas ela não contém a ligação dupla. Pelo livro, a cadeia principal precisa conter a insaturação."],["2-etil-3-metilept-1-eno.","A cadeia que contém a dupla tem 6 C, não 7: contou um carbono a mais."]]},
{"k":"q6","lv":2,"s":"Sobre o isopreno, CH<sub>2</sub>=C(CH<sub>3</sub>)–CH=CH<sub>2</sub>, unidade da borracha natural:<br>I. Sua fórmula molecular é C<sub>5</sub>H<sub>8</sub>.<br>II. É um alceno, pois obedece à fórmula geral C<sub>n</sub>H<sub>2n</sub>.<br>III. Tem cadeia aberta, ramificada, insaturada e homogênea.<br>IV. Tem a mesma fórmula molecular do ciclopenteno.<br>Estão corretas","c":3,"o":[["I e II apenas.","A II está errada (é alcadieno, C<sub>n</sub>H<sub>2n−2</sub>) e faltaram a III e a IV, que estão certas."],["II e IV apenas.","A II está errada: com duas duplas é alcadieno, C<sub>n</sub>H<sub>2n−2</sub> (5 C → 8 H). Alceno C<sub>5</sub> teria 10 H."],["I, II e III apenas.","A II está errada (alcadieno, não alceno) e a IV está certa (ciclopenteno também é C<sub>5</sub>H<sub>8</sub>)."],["I, III e IV apenas.","Isso. C<sub>5</sub>H<sub>8</sub> = C<sub>n</sub>H<sub>2n−2</sub> (alcadieno, não alceno); cadeia aberta, com metil (ramificada), duplas (insaturada), só C (homogênea); ciclopenteno (cicleno) também é C<sub>5</sub>H<sub>8</sub>."],["I, II, III e IV.","A II está errada: duas ligações duplas = alcadieno (C<sub>n</sub>H<sub>2n−2</sub>), não alceno."]]},
{"k":"q6","lv":2,"s":"Um benzeno com um grupo etil e um grupo metil em posição para chama-se 1-metil-4-etilbenzeno.","v":false,"e":"Com um substituinte em cada carbono, a numeração começa pelo que vem primeiro na ordem alfabética, e a citação também segue essa ordem: 1-etil-4-metilbenzeno (ou p-etilmetilbenzeno)."},
{"k":"q6","lv":2,"s":"O 3,3-dimetilpent-1-ino tem fórmula molecular C<sub>7</sub>H<sub>12</sub>, a mesma de um alcadieno de 7 carbonos, como o hepta-1,3-dieno.","v":true,"e":"HC≡C–C(CH<sub>3</sub>)<sub>2</sub>–CH<sub>2</sub>–CH<sub>3</sub>: 7 C e 1+6+2+3 = 12 H. Alcinos e alcadienos obedecem à mesma fórmula geral C<sub>n</sub>H<sub>2n−2</sub> (n = 7 → 12 H)."},
{"k":"q11","lv":2,"s":"O nome IUPAC de CH<sub>2</sub>=CH–CH<sub>2</sub>–CH(OH)–CH(CH<sub>3</sub>)–CH<sub>3</sub> é","c":4,"o":[["5-metilex-1-en-4-ol.","Priorizou a dupla. A ordem de prioridade na numeração é grupo funcional > insaturação > ramificação: a OH deve ficar com o menor número (3, não 4)."],["2-metilex-4-en-3-ol.","Numeração certa, mas a dupla está entre o C5 e o C6, então o localizador é 5."],["4-hidróxi-5-metilex-1-eno.","Em álcool a OH é indicada pelo sufixo “ol” e manda na numeração; “hidróxi” não é usado aqui."],["2-metilept-5-en-3-ol.","A cadeia principal tem 6 C, não 7: contou um carbono a mais."],["2-metilex-5-en-3-ol.","Isso. Cadeia de 6 C com a OH e a dupla. Numerando pela ponta mais próxima da OH (a da direita): metil no C2, OH no C3, dupla no C5."]]},
{"k":"q11","lv":2,"s":"Analise:<br>I. Butan-1-ol e etoxietano têm a mesma fórmula (C<sub>4</sub>H<sub>10</sub>O), mas o butan-1-ol tem ponto de ebulição bem maior, por fazer ligações de hidrogênio entre suas moléculas.<br>II. A butanona tem ponto de ebulição maior que o do etoxietano, de massa molar próxima, por ser mais polar.<br>III. O 2-metilpropan-2-ol é um álcool secundário.<br>Está(ão) correta(s)","c":0,"o":[["I e II apenas.","Isso. Álcool faz ligação de H (maior PE); éter tem PE próximo ao de alcanos; a cetona é mais polar que o éter. Na III, a OH está em carbono ligado a 3 C: álcool terciário."],["I apenas.","A II também está correta: o éter tem PE próximo ao de alcanos, menor que o da cetona (polar)."],["II e III apenas.","A III está errada: no 2-metilpropan-2-ol, (CH<sub>3</sub>)<sub>3</sub>C–OH, o carbono da OH está ligado a 3 C (terciário)."],["III apenas.","A III é justamente a errada (álcool terciário); I e II estão corretas."],["I, II e III.","A III está errada: (CH<sub>3</sub>)<sub>3</sub>C–OH é álcool terciário."]]},
{"k":"q11","lv":2,"s":"O mentol (aroma de hortelã) tem um anel de seis carbonos SEM ligações duplas, com –OH, um metil e um isopropil. O timol (óleo de tomilho) tem os mesmos três grupos, mas ligados a um anel benzênico. Assim,","c":2,"o":[["ambos são fenóis, pois têm OH ligada a um anel.","No mentol o anel é saturado (cicloexano): OH em carbono saturado é álcool. Fenol exige anel benzênico."],["o mentol é fenol e o timol é álcool.","Está invertido: a OH no anel benzênico (timol) é fenol; no anel saturado (mentol) é álcool."],["o mentol é álcool secundário e o timol é fenol.","Isso. No mentol a OH está em carbono saturado ligado a dois outros carbonos do anel (secundário); no timol, em carbono do anel benzênico (fenol)."],["o mentol é álcool terciário e o timol é fenol.","O carbono da OH no mentol está ligado a apenas 2 carbonos (e a 1 H): álcool secundário."],["ambos são álcoois, pois o grupo funcional é a hidroxila.","No timol a OH está ligada a carbono insaturado do anel benzênico: isso é fenol."]]},
{"k":"q11","lv":2,"s":"O composto CH<sub>3</sub>–CO–CH(CH<sub>3</sub>)–CH<sub>2</sub>–CH<sub>3</sub> chama-se 3-metilpentan-2-ona e é isômero de função do hexanal.","v":true,"e":"Cadeia de 5 C com a carbonila no C2 e o metil no C3: 3-metilpentan-2-ona, C<sub>6</sub>H<sub>12</sub>O. O hexanal também é C<sub>6</sub>H<sub>12</sub>O: mesma fórmula, funções diferentes (cetona × aldeído)."},
{"k":"q12","lv":2,"s":"O éster CH<sub>3</sub>–CH<sub>2</sub>–COO–CH(CH<sub>3</sub>)–CH<sub>3</sub> tem nome IUPAC e é obtido pela esterificação de","c":1,"o":[["propanoato de propila; ácido propanoico + propan-1-ol.","O grupo ligado ao O é ramificado (–CH(CH<sub>3</sub>)<sub>2</sub> = isopropila) e vem do propan-2-ol, não do propan-1-ol."],["propanoato de isopropila; ácido propanoico + propan-2-ol.","Isso. Lado do C=O: 3 C (propanoato, do ácido propanoico); lado do O: isopropila (do propan-2-ol). Ácido + álcool ⇌ éster + água."],["2-metilpropanoato de etila; ácido 2-metilpropanoico + etanol.","Leu a fórmula ao contrário: o lado do C=O é CH<sub>3</sub>–CH<sub>2</sub>–CO– (3 C, cadeia normal); a ramificação está no lado do O."],["propanoato de isopropila; ácido propanoico + propanona.","O nome está certo, mas a esterificação é entre ácido carboxílico e ÁLCOOL; propanona é cetona."],["etanoato de isobutila; ácido etanoico + 2-metilpropan-1-ol.","É um isômero (também C<sub>6</sub>H<sub>12</sub>O<sub>2</sub>), mas a parte do ácido aqui tem 3 C (propanoato), não 2."]]},
{"k":"q12","lv":2,"s":"O nome IUPAC de CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH(CH<sub>3</sub>)–CH<sub>2</sub>–CHO é","c":3,"o":[["2,3-dimetilpentanal.","Numerou pela ponta errada: no aldeído o carbono do –CHO é sempre o C1, então os metis ficam em 3 e 4."],["3-isopropilbutanal.","A cadeia principal deve ser a mais longa com o –CHO: são 5 C, não 4."],["3,4-dimetilpentan-2-ona.","O C=O está na ponta, ligado a H (–CHO): é aldeído, não cetona."],["3,4-dimetilpentanal.","Isso. Cadeia de 5 C; o C do –CHO é o C1; metis nos C3 e C4; sufixo “al”."],["ácido 3,4-dimetilpentanoico.","O grupo é –CHO (aldeído), não –COOH (ácido)."]]},
{"k":"q12","lv":2,"s":"Analise:<br>I. O benzoato de sódio, conservante de alimentos, pode ser obtido pela neutralização do ácido benzoico com NaOH.<br>II. O metanoato de metila é isômero do ácido acético e tem ponto de ebulição maior que o dele.<br>III. O etanoato de sódio é um composto iônico, sólido, com ponto de fusão muito elevado.<br>Estão corretas","c":0,"o":[["I e III apenas.","Isso. Ácido carboxílico + base inorgânica → sal orgânico + água; sais orgânicos são iônicos e sólidos. Na II, os dois são C<sub>2</sub>H<sub>4</sub>O<sub>2</sub>, mas o éster tem PE MENOR (não faz ligações de H entre si)."],["I e II apenas.","A II está errada: ésteres têm PE menor que ácidos de massa próxima."],["II e III apenas.","A II está errada (o ácido acético, com ligações de H, ferve a temperatura maior) e a I está certa."],["III apenas.","A I também está correta: é a neutralização que forma o sal orgânico."],["I, II e III.","A II está errada: são isômeros (C<sub>2</sub>H<sub>4</sub>O<sub>2</sub>), mas o éster tem PE menor que o ácido."]]},
{"k":"q12","lv":2,"s":"O propenal (CH<sub>2</sub>=CH–CHO) e a propanona têm a mesma fórmula molecular, sendo isômeros de função.","v":false,"e":"O propenal tem uma dupla C=C a mais: é C<sub>3</sub>H<sub>4</sub>O, enquanto a propanona é C<sub>3</sub>H<sub>6</sub>O. Fórmulas diferentes, então não são isômeros. O isômero de função da propanona é o propanal."},
{"k":"q14","lv":2,"s":"O composto (CH<sub>3</sub>)<sub>2</sub>CH–NH–CH<sub>2</sub>–CH<sub>3</sub> tem nome e classificação","c":4,"o":[["isopropiletilamina, amina secundária.","Classificação certa, mas os grupos vão em ordem alfabética: etil (e) antes de isopropil (i). O “iso” conta na ordem."],["etilpropilamina, amina secundária.","O grupo ligado ao N pelo carbono do meio é isopropil, não propil."],["etilisopropilamina, amina terciária.","O N está ligado a 2 carbonos e 1 H: amina secundária."],["N-etilpropanamida, amida.","Amida exige N ligado a C=O; aqui não há carbonila."],["etilisopropilamina, amina secundária.","Isso. N ligado a dois grupos (etil e isopropil) e a um H: amina secundária; grupos citados em ordem alfabética + “amina”."]]},
{"k":"q14","lv":2,"s":"A procaína (novocaína), anestésico local, tem a estrutura H<sub>2</sub>N–C<sub>6</sub>H<sub>4</sub>–COO–CH<sub>2</sub>–CH<sub>2</sub>–N(CH<sub>2</sub>CH<sub>3</sub>)<sub>2</sub>. As funções presentes são","c":2,"o":[["amida, éster e amina terciária.","O NH<sub>2</sub> está ligado ao anel, não a um C=O: é amina primária, não amida."],["amina primária, cetona, éter e amina terciária.","O –COO– é um grupo só (éster), e não uma cetona mais um éter."],["amina primária, éster e amina terciária.","Isso. –NH<sub>2</sub> no anel = amina primária; –COO– entre carbonos = éster; N ligado a três carbonos = amina terciária."],["amina secundária, éster e amina primária.","O H<sub>2</sub>N– está ligado a 1 C (primária) e o N(CH<sub>2</sub>CH<sub>3</sub>)<sub>2</sub> a 3 C (terciária)."],["nitrocomposto, éster e amida.","Não há –NO<sub>2</sub>, e nenhum N está ligado a C=O."]]},
{"k":"q14","lv":2,"s":"O nome IUPAC do haleto CH<sub>3</sub>–CHBr–CH<sub>2</sub>–CH(CH<sub>3</sub>)–CH<sub>3</sub> é","c":1,"o":[["4-bromo-2-metilpentano.","As duas pontas dão os localizadores {2,4}. No empate, o menor número vai para o substituinte que vem primeiro na ordem alfabética: bromo (b) antes de metil (m)."],["2-bromo-4-metilpentano.","Isso. Cadeia de 5 C; de qualquer ponta os substituintes ficam em 2 e 4; desempata a ordem alfabética: o bromo recebe o 2."],["2-metil-4-bromopentano.","Citação fora da ordem alfabética (bromo vem antes de metil) e o bromo deveria ter o menor número."],["1-bromo-1,3-dimetilbutano.","A cadeia principal deve ser a mais longa: são 5 C (pentano), e o CH<sub>3</sub> ligado ao C do Br faz parte dela."],["2-bromoexano.","A cadeia mais longa tem 5 C; o CH<sub>3</sub> do C4 é ramificação. 2-bromoexano é outro composto (isômero)."]]},
{"k":"q14","lv":2,"s":"O composto CH<sub>3</sub>–CH<sub>2</sub>–MgBr chama-se brometo de etilmagnésio e não pode ser guardado em solução aquosa.","v":true,"e":"É um composto de Grignard (R–MgX): nome = halogênio com “eto” + de + radical + magnésio. Reage intensamente com a água (e com o O<sub>2</sub> do ar), por isso é mantido em éter etílico anidro."},
{"k":"qu","lv":2,"s":"Qual par nome usual – nome oficial está CORRETO?","c":1,"o":[["álcool isopropílico – propan-1-ol.","No grupo isopropil a OH fica no carbono do meio: o álcool isopropílico é o propan-2-ol."],["glicerina – propano-1,2,3-triol.","Isso. A glicerina tem 3 C e uma OH em cada carbono: poliálcool, usado em cosméticos e sabonetes."],["ácido butírico – ácido propanoico.","Butírico (de manteiga) tem 4 C: é o ácido butanoico."],["cresol – metoxibenzeno.","Cresóis são metilfenóis (OH no anel); o metoxibenzeno é um éter."],["acetaldeído – metanal.","Acetaldeído é o etanal (2 C); o metanal é o formaldeído."]]},
{"k":"qu","lv":2,"s":"O TNT, explosivo obtido a partir do tolueno, tem nome, fórmula molecular e função","c":4,"o":[["2,4,6-trinitrobenzeno; C<sub>6</sub>H<sub>3</sub>N<sub>3</sub>O<sub>6</sub>; nitrocomposto.","Esqueceu o metil: o TNT vem do tolueno (metilbenzeno), então é trinitroTOLUENO, com 7 C."],["2,4,6-triaminotolueno; C<sub>7</sub>H<sub>11</sub>N<sub>3</sub>; amina.","O “N” de TNT é de nitro (–NO<sub>2</sub>), não de amino (–NH<sub>2</sub>)."],["2,4,6-trinitrotolueno; C<sub>7</sub>H<sub>8</sub>N<sub>3</sub>O<sub>6</sub>; nitrocomposto.","Contou H demais: cada NO<sub>2</sub> substitui um H do anel. Sobram 2 H no anel + 3 do CH<sub>3</sub> = 5 H."],["2,4,6-trinitrotolueno; C<sub>7</sub>H<sub>5</sub>N<sub>3</sub>O<sub>6</sub>; nitrila.","Nitrila tem o grupo –C≡N; o TNT tem grupos –NO<sub>2</sub> (nitrocomposto)."],["2,4,6-trinitrotolueno; C<sub>7</sub>H<sub>5</sub>N<sub>3</sub>O<sub>6</sub>; nitrocomposto.","Isso. Tolueno (C<sub>6</sub>H<sub>5</sub>–CH<sub>3</sub>) com três NO<sub>2</sub> no anel: C 7; H 2 + 3 = 5; N 3; O 6."]]},
{"k":"qu","lv":2,"s":"Analise:<br>I. O formol é a solução aquosa a 37% do metanal, usada para conservar peças anatômicas.<br>II. A acetona, removedor de esmalte, é a propanona, a cetona mais simples.<br>III. O éter comum, usado antigamente como anestésico, é o metoxietano.<br>Está(ão) correta(s)","c":3,"o":[["I apenas.","A II também está correta: acetona = propanona (dimetilcetona)."],["III apenas.","A III é a errada: o éter comum (éter etílico) é o etoxietano, com dois etilas."],["I e III apenas.","A III está errada (o éter comum é o etoxietano) e a II está certa."],["I e II apenas.","Isso. Formol = metanal a 37% em água; acetona = propanona. O éter comum é o etoxietano (éter dietílico), não o metoxietano."],["I, II e III.","A III está errada: metoxietano tem um metil e um etil; o éter comum tem dois etilas (etoxietano)."]]},
{"k":"qu","lv":2,"s":"O vinagre é uma solução aquosa diluída de ácido etanoico; já o ácido acético concentrado é um líquido tóxico, de cheiro penetrante.","v":true,"e":"Ácido acético = ácido etanoico (latim acetum, vinagre). O livro descreve o ácido concentrado como incolor, muito tóxico, de cheiro penetrante e sabor azedo."},
{"k":"qu","lv":2,"s":"O acetato de etila, usado em removedores de esmalte, é obtido pela esterificação do ácido etanoico com metanol.","v":false,"e":"O nome mostra as duas partes: acetato (do ácido acético/etanoico) e etila (do etanol). Com metanol se obteria o acetato de metila."},
{"k":"q1","lv":2,"s":"Considerando apenas álcoois e éteres, quantos isômeros constitucionais (planos) têm a fórmula C<sub>4</sub>H<sub>10</sub>O?","c":2,"o":[["3","Contou só os éteres (etoxietano, 1-metoxipropano e 2-metoxipropano); faltaram os 4 álcoois."],["4","Contou só os álcoois; faltaram os 3 éteres."],["7","Isso. Álcoois: butan-1-ol, butan-2-ol, 2-metilpropan-1-ol, 2-metilpropan-2-ol (4). Éteres: etoxietano, 1-metoxipropano, 2-metoxipropano (3). Total 7."],["6","Esqueceu um: costuma faltar o 2-metilpropan-2-ol ou o 2-metoxipropano."],["8","Contou uma estrutura repetida (ex.: butan-3-ol é o mesmo butan-2-ol numerado pela ponta errada)."]]},
