<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resumo de Química</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#fff;--ink:#18212b;--muted:#5b6876;--line:#d8dee5;--acc:#2457c5;--acc-soft:#e6edfb;--warn:#a34a00;--warn-soft:#fff1e3;--ok:#23784a;--ok-soft:#e3f2e9;
 --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.top a{color:var(--acc);font-weight:700;text-decoration:none}
.bar{height:6px;background:var(--acc-soft);border-radius:4px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(25px,6vw,36px);line-height:1.12;margin:6px 0 16px;text-wrap:balance}
.box{border-radius:12px;padding:12px 14px;margin:14px 0}
.box b.lb{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ideia{background:var(--acc-soft)}.ideia b.lb{color:var(--acc)}
.trap{background:var(--warn-soft)}.trap b.lb{color:var(--warn)}
.mac{background:var(--ok-soft)}.mac b.lb{color:var(--ok)}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f4f6f9;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
ul.l{margin:12px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:700;white-space:nowrap;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.4;cursor:default}
#cnt{font-size:13px;color:var(--muted);white-space:nowrap}
#idx{display:none}
#idx.on{display:block}
#idx h2{font-family:var(--display);font-size:18px;margin:18px 0 6px}
#idx ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
#idx li button{width:100%;text-align:left;font-weight:400;padding:8px 10px;display:flex;gap:10px}
#idx li button span{color:var(--muted);min-width:2ch;font-weight:700}
#idx li button.cur{border-color:var(--acc);background:var(--acc-soft)}
.fim{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.fim a{color:var(--acc);font-weight:700}
</style>
</head>

const TELAS=[
/* ===== FUNÇÕES ORGÂNICAS ===== */
{g:"Funções orgânicas",k:"Cap. 4",t:"Como reconhecer a função orgânica",
 ideia:"Função orgânica = grupo de compostos com propriedades parecidas porque têm o mesmo <b>grupo funcional</b>. Olhe primeiro os átomos diferentes de C e H (O, N, halogênio) e como estão ligados.",
 tab:{head:["Função","Grupo","Exemplo"],rows:[["Hidrocarboneto","só C e H","CH<sub>3</sub>–CH<sub>3</sub>"],["Álcool","OH em C saturado","CH<sub>3</sub>CH<sub>2</sub>OH"],["Fenol","OH no anel benzênico","C<sub>6</sub>H<sub>5</sub>OH"],["Enol","OH em C de dupla fora do anel","CH<sub>2</sub>=CH–OH"],["Éter","–O– entre carbonos","CH<sub>3</sub>–O–CH<sub>3</sub>"],["Aldeído","–CHO (na ponta)","CH<sub>3</sub>CHO"],["Cetona","–CO– entre carbonos","CH<sub>3</sub>COCH<sub>3</sub>"],["Ácido carboxílico","–COOH","CH<sub>3</sub>COOH"],["Éster","–COO– entre carbonos","CH<sub>3</sub>COOCH<sub>3</sub>"],["Sal orgânico","–COO<sup>–</sup>M<sup>+</sup>","CH<sub>3</sub>COO<sup>–</sup>Na<sup>+</sup>"]]},
 trap:"Álcool benzílico (C<sub>6</sub>H<sub>5</sub>–CH<sub>2</sub>OH) tem anel, mas o OH está no CH<sub>2</sub>: é álcool, não fenol.",
 mac:"OH: em C saturado = álcool; no anel = fenol; em C de dupla fora do anel = enol."},
{g:"Funções orgânicas",k:"Cap. 4",t:"Funções nitrogenadas, halogenadas e outras",
 ideia:"Com nitrogênio, o que decide é a vizinhança do N. Com halogênio, enxofre ou magnésio, basta ver o átomo ligado ao carbono.",
 tab:{head:["Função","Grupo","Exemplo"],rows:[["Amina","N ligado a C (1, 2 ou 3 C)","CH<sub>3</sub>–NH<sub>2</sub>"],["Amida","–CONH<sub>2</sub> (N no C=O)","CH<sub>3</sub>CONH<sub>2</sub>"],["Nitrocomposto","–NO<sub>2</sub>","CH<sub>3</sub>–NO<sub>2</sub>"],["Nitrila","–C≡N","CH<sub>3</sub>–CN"],["Isonitrila","–N≡C","CH<sub>3</sub>–NC"],["Haleto orgânico","–X (F, Cl, Br, I)","CH<sub>3</sub>–Cl"],["Cloreto de ácido","–COCl","CH<sub>3</sub>COCl"],["Anidrido","–COOCO–","(CH<sub>3</sub>CO)<sub>2</sub>O"],["Ácido sulfônico","–SO<sub>3</sub>H","CH<sub>3</sub>SO<sub>3</sub>H"],["Grignard","–MgX","CH<sub>3</sub>MgCl"]]},
 trap:"Amida tem o N colado no C=O. Se o C=O estiver longe do N, são duas funções: amina + cetona.",
 mac:"N só com carbonos = amina; N + C=O = amida; N + 2 O = nitro; C≡N = nitrila."},
{g:"Funções orgânicas",k:"Cap. 4",t:"Funções mistas: identificar numa molécula",
 ideia:"Muitas moléculas da prova têm várias funções. Percorra a molécula grupo por grupo e escreva o nome de cada função.",
 tab:{head:["Molécula","Funções"],rows:[["Aminoácidos (alanina)","ácido carboxílico + amina"],["Adrenalina","fenol + álcool + amina"],["Cocaína","amina + éster"],["Tiroxina","fenol + haleto + éter + amina + ácido"],["Vanilina","aldeído + éter + fenol"],["Aspartame","amina + ácido + amida + éster"],["Paracetamol","fenol + amida"]]},
 trap:"O O do éster (–COO–) não conta como éter separado.",
 mac:"Roteiro: OH? C=O (onde)? COO? O entre carbonos? N (com C=O ou sem)? Halogênio?"},
/* ===== NOMENCLATURA ===== */
{g:"Nomenclatura",k:"Cap. 5 e 6",t:"Prefixo, infixo, sufixo e fórmulas gerais",
 ideia:"Nome = <b>prefixo</b> (nº de C) + <b>infixo</b> (ligações) + <b>sufixo</b> (função). Ex.: prop + en + o = propeno.",
 tab:{head:["Peça","Valores"],rows:[["Prefixo","1 met · 2 et · 3 prop · 4 but · 5 pent · 6 hex · 7 hept · 8 oct · 9 non · 10 dec"],["Infixo","an (simples) · en (dupla) · in (tripla) · dien (2 duplas)"],["Sufixo","o (hidrocarboneto) · ol · al · ona · oico"],["Alcano","C<sub>n</sub>H<sub>2n+2</sub>"],["Alceno e ciclano","C<sub>n</sub>H<sub>2n</sub>"],["Alcino, alcadieno, cicleno","C<sub>n</sub>H<sub>2n−2</sub>"]]},
 trap:"Alcino e alcadieno têm a mesma fórmula geral. Anel precisa de pelo menos 3 C.",
 mac:"Cada dupla ou anel tira 2 H do alcano; cada tripla tira 4."},
{g:"Nomenclatura",k:"Cap. 5",t:"Radicais",
 ideia:"Radical = o que sobra quando um H sai por <b>cisão homolítica</b>. O nome termina em <b>il</b> (ou ila) e indica por qual carbono ele está preso.",
 tab:{head:["Radical","Fórmula"],rows:[["metil / etil","CH<sub>3</sub>– / CH<sub>3</sub>CH<sub>2</sub>–"],["propil / isopropil","CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>– / (CH<sub>3</sub>)<sub>2</sub>CH–"],["butil / sec-butil","CH<sub>3</sub>(CH<sub>2</sub>)<sub>3</sub>– / CH<sub>3</sub>CH<sub>2</sub>CH(CH<sub>3</sub>)–"],["isobutil / terc-butil","(CH<sub>3</sub>)<sub>2</sub>CHCH<sub>2</sub>– / (CH<sub>3</sub>)<sub>3</sub>C–"],["etenil (vinil)","CH<sub>2</sub>=CH–"],["fenil / benzil","C<sub>6</sub>H<sub>5</sub>– / C<sub>6</sub>H<sub>5</sub>CH<sub>2</sub>–"]]},
 trap:"Fenil ≠ benzil: o benzil tem um CH<sub>2</sub> antes do anel.",
 mac:"Isopropil e terc-butil seguram pelo meio; propil, butil e isobutil, pela ponta."},
{g:"Nomenclatura",k:"Cap. 5",t:"Cadeia principal e numeração",
 ideia:"Cadeia principal: a <b>maior</b>, mas sempre <b>contendo a função e as insaturações</b>. Numeração: menor número para <b>grupo funcional > insaturação > ramificação</b>.",
 list:["Empate no tamanho: a cadeia com <b>mais ramificações</b>.","Regra dos <b>menores números</b>: a menor soma de localizadores.","Localizadores empatados: o primeiro em ordem alfabética fica com o menor número (5-etil-6-metildecano).","Ex.: CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH=CH–CH<sub>3</sub> = <b>4-metilpent-2-eno</b> (a dupla manda)."],
 trap:"A cadeia principal nem sempre está desenhada em linha reta: siga também os galhos.",
 mac:"Fila de prioridade: função, depois dupla/tripla, depois ramificação."},
{g:"Nomenclatura",k:"Cap. 5",t:"Escrita do nome, cíclicos e aromáticos",
 ideia:"Ramificações em <b>ordem alfabética</b> antes do nome da cadeia; vírgula entre números; hífen entre número e palavra.",
 list:["Di, tri, tetra <b>não contam</b> na ordem alfabética; <b>iso e neo contam</b>.","Exemplos do livro: 2,2,4-trimetilpentano (isoctano); 4-etil-5-isopropil-3,3-dimetilnonano.","Grafia do livro: sem o \"h\" no meio (dimetilexano, metilcicloexano).","Cíclicos: um substituinte não leva número (metilcicloexano); no cicloalceno a dupla é C1=C2 (3-metilciclopenteno).","Benzeno: <b>orto 1,2 · meta 1,3 · para 1,4</b> (o-xileno = 1,2-dimetilbenzeno)."],
 trap:"\"Dimetil\" é ordenado pela letra m, não pela d.",
 mac:"Escreva: números-ramificações em ordem alfabética + cadeia + posição da insaturação + sufixo."},
{g:"Nomenclatura",k:"Cap. 6",t:"Hidrocarbonetos: propriedades",
 ideia:"Hidrocarbonetos são <b>apolares</b>: insolúveis em água e menos densos que ela. O PE <b>aumenta com a cadeia</b> e <b>diminui com as ramificações</b>.",
 list:["Alcanos = <b>parafinas</b>; alcinos são mais reativos que alcenos e alcanos.","Ex.: PE do heptano > 3-metilexano > 2,3-dimetilpentano (mesmo nº de C).","Um alcano com 64 H: 2n + 2 = 64 → n = 31.","Aromáticos: benzeno; tolueno = metilbenzeno; xilenos = dimetilbenzenos; naftalina = naftaleno."],
 trap:"Para comparar PE por ramificações, os compostos precisam ter o mesmo número de C.",
 mac:"Molécula comprida encosta mais (PE maior); ramificada parece bolinha (PE menor)."},
{g:"Nomenclatura",k:"Cap. 11",t:"Álcoois: classificação e nomes",
 ideia:"IUPAC: prefixo + infixo + <b>ol</b>, numerando pela ponta mais perto da OH. Usual: <b>álcool …ico</b>. Kolbe: grupos ligados ao C da OH + <b>carbinol</b>.",
 tab:{head:["Fórmula","IUPAC","Usual / Kolbe"],rows:[["CH<sub>3</sub>OH","metanol","álcool metílico / carbinol"],["CH<sub>3</sub>CH<sub>2</sub>OH","etanol","álcool etílico / metilcarbinol"],["CH<sub>3</sub>CH(OH)CH<sub>3</sub>","propan-2-ol","álcool isopropílico / dimetilcarbinol"],["CH<sub>3</sub>CH(OH)CH(CH<sub>3</sub>)<sub>2</sub>","3-metilbutan-2-ol","isopropil-metilcarbinol"]]},
 list:["Pelo nº de OH: monoálcool, diálcool, poliálcool. Pelo carbono da OH: primário, secundário, terciário.","Não existe álcool estável com duas OH no mesmo carbono.","PE alto (ligações de H); quanto maior a cadeia, menos solúvel em água."],
 trap:"No Kolbe, o carbono da OH é o \"carbinol\": não entra na contagem dos grupos.",
 mac:"Álcool 70% é antisséptico: dissolve o envelope dos vírus."},
{g:"Nomenclatura",k:"Cap. 11",t:"Fenóis, éteres e cetonas",
 ideia:"<b>Fenol</b>: OH no anel. <b>Éter</b>: menor + <b>oxi</b> + maior. <b>Cetona</b>: prefixo + infixo + <b>ona</b>.",
 tab:{head:["Composto","IUPAC","Usual"],rows:[["C<sub>6</sub>H<sub>5</sub>OH","fenol / hidroxibenzeno","fenol comum"],["CH<sub>3</sub>–C<sub>6</sub>H<sub>4</sub>–OH","2-, 3- ou 4-metilfenol","orto-, meta-, para-cresol"],["CH<sub>3</sub>OCH<sub>2</sub>CH<sub>3</sub>","metoxietano","éter etílico e metílico"],["CH<sub>3</sub>CH<sub>2</sub>OCH<sub>2</sub>CH<sub>3</sub>","etoxietano","éter dietílico"],["CH<sub>3</sub>COCH<sub>3</sub>","propanona","dimetilcetona (acetona)"],["CH<sub>3</sub>COCH<sub>2</sub>CH<sub>3</sub>","butanona","etil-metilcetona"]]},
 trap:"No fenol ramificado, o carbono da OH é o 1.",
 mac:"PE (massa parecida): ácido > álcool > cetona > aldeído; éter é baixo (sem ligação de H)."},
{g:"Nomenclatura",k:"Cap. 12",t:"Aldeídos e ácidos carboxílicos",
 ideia:"<b>Aldeído</b>: –CHO, sufixo <b>al</b>. <b>Ácido</b>: –COOH, <b>ácido …oico</b>. O carbono da função é sempre o 1.",
 tab:{head:["Fórmula","IUPAC","Usual"],rows:[["HCHO","metanal","formaldeído (formol = solução a 37%)"],["CH<sub>3</sub>CHO","etanal","acetaldeído"],["HCOOH","ácido metanoico","ácido fórmico (formigas)"],["CH<sub>3</sub>COOH","ácido etanoico","ácido acético (vinagre)"],["CH<sub>3</sub>(CH<sub>2</sub>)<sub>2</sub>COOH","ácido butanoico","ácido butírico (manteiga)"]]},
 list:["Ácidos fazem o dobro de ligações de H de um álcool: PE maior.","Ácido de cadeia longa = <b>ácido graxo</b>."],
 trap:"Formol ≠ formaldeído: formol é a solução aquosa do metanal.",
 mac:"Nome usual do ácido vira sobrenome da família: acético → acetaldeído, acetato."},
{g:"Nomenclatura",k:"Cap. 12",t:"Ésteres e sais orgânicos",
 ideia:"<b>Ácido + álcool ⇌ éster + água</b> (esterificação). <b>Ácido + base → sal + água</b> (neutralização). Nome: <b>…ato de …ila</b> (éster) e <b>…ato de (metal)</b> (sal).",
 tab:{head:["Fórmula","IUPAC","Usual"],rows:[["CH<sub>3</sub>COOCH<sub>3</sub>","etanoato de metila","acetato de metila"],["HCOOCH<sub>2</sub>CH<sub>3</sub>","metanoato de etila","formiato de etila"],["CH<sub>3</sub>COO(CH<sub>2</sub>)<sub>2</sub>CH(CH<sub>3</sub>)<sub>2</sub>","etanoato de isopentila","acetato de isopentila (banana)"],["CH<sub>3</sub>COO<sup>–</sup>Na<sup>+</sup>","etanoato de sódio","acetato de sódio"]]},
 list:["Na esterificação sai o OH do ácido e o H do álcool.","Ésteres: aromas (flavorizantes) e poliéster. Sais: iônicos, sólidos, PF alto; sabões."],
 trap:"Leia o éster em duas partes: lado do C=O = \"…ato\"; lado preso só ao O = \"de …ila\".",
 mac:"Sabão: ponta polar (água) + cadeia apolar (gordura)."},
{g:"Nomenclatura",k:"Cap. 14",t:"Aminas e amidas",
 ideia:"<b>Amina</b>: H da amônia trocados por grupos de carbono. <b>Amida</b>: H trocados por grupos acila (R–CO–).",
 tab:{head:["Fórmula","Nome","Tipo"],rows:[["CH<sub>3</sub>NH<sub>2</sub>","metilamina / metanamina","amina primária"],["CH<sub>3</sub>NHCH<sub>2</sub>CH<sub>3</sub>","etilmetilamina","amina secundária"],["(CH<sub>3</sub>)<sub>2</sub>NCH<sub>2</sub>CH<sub>3</sub>","etildimetilamina","amina terciária"],["C<sub>6</sub>H<sub>5</sub>NH<sub>2</sub>","fenilamina (anilina)","amina primária"],["CH<sub>3</sub>CONH<sub>2</sub>","etanamida (acetamida)","amida"],["HCONHCH<sub>3</sub>","N-metilmetanamida","amida monossubstituída"]]},
 list:["Aminas: bases orgânicas, cheiro de peixe; até 5 C solúveis em água.","Amidas: muito polares; só a metanamida é líquida. Ureia: fertilizante, cremes, náilon."],
 trap:"A classificação da amina olha quantos carbonos estão no N (não o carbono, como no álcool).",

{g:"Nomenclatura",k:"Cap. 14",t:"Nitro, nitrilas, haletos e Grignard",
 ideia:"<b>Nitro</b>: prefixo nitro. <b>Nitrila</b>: hidrocarboneto (contando o C do CN) + nitrilo. <b>Haleto</b>: halogênio + hidrocarboneto. <b>Grignard</b>: …eto de …magnésio.",
 tab:{head:["Fórmula","IUPAC","Usual"],rows:[["CH<sub>3</sub>NO<sub>2</sub>","nitrometano","—"],["CH<sub>3</sub>CN","etanonitrilo","cianeto de metila"],["CH<sub>3</sub>NC","metilcarbilamina","—"],["CH<sub>3</sub>CH<sub>2</sub>I","iodoetano","iodeto de etila"],["CH<sub>3</sub>CHClCH<sub>3</sub>","2-cloropropano","cloreto de isopropila"],["CH<sub>3</sub>MgBr","brometo de metilmagnésio","—"]]},
 list:["TNT = 2,4,6-trinitrotolueno (explosivo). Nitrilos: tóxicos; acrilonitrila → borracha.","Clorofórmio (anestésico), fréons (destroem o ozônio), DDT (inseticida).","Grignard reage com água: fica em éter etílico anidro."],
 trap:"Em 4-clorobut-1-eno, quem manda na numeração é a dupla.",

{g:"Nomes usuais",k:"Caderno SAS",t:"Nomes usuais: hidrocarbonetos e oxigenados",
 ideia:"Ligue sempre: <b>nome usual → nome oficial → função → uso</b>.",
 tab:{head:["Usual","Oficial","Função · uso"],rows:[["gás natural","metano","alcano · combustível"],["GLP","propano + butano","alcanos · gás de cozinha"],["acetileno","etino","alcino · maçarico"],["etileno","eteno","alceno · amadurecer frutas, polietileno"],["isoctano","2,2,4-trimetilpentano","alcano · octanagem"],["tolueno / naftalina","metilbenzeno / naftaleno","aromáticos · solvente / traças"],["álcool da madeira","metanol","álcool · tóxico"],["glicerina","propano-1,2,3-triol","álcool · cosméticos"],["formol","metanal 37%","aldeído · conservante"],["acetona","propanona","cetona · removedor de esmalte"],["vinagre","ácido etanoico","ácido · tempero"],["éter comum","etoxietano","éter · anestésico antigo"]]},
 trap:"Tolueno é metilbenzeno (não etilbenzeno).",

{g:"Nomes usuais",k:"Caderno SAS",t:"Nomes usuais: nitrogenados e halogenados",

/* ===== ISOMERIA PLANA ===== */
{g:"Isomeria plana",k:"Cap. 1",t:"Isômeros e isomeria constitucional",
 ideia:"<b>Isômeros</b>: mesma fórmula molecular, estruturas e propriedades diferentes. Na <b>constitucional</b>, muda a <b>conectividade</b> (sequência e/ou natureza das ligações).",
 list:["Wöhler (1828): cianato de amônio → ureia. Início da queda da Teoria da Força Vital.","Butano (PE −0,5 °C) × isobutano (PE −11,7 °C): mesma fórmula C<sub>4</sub>H<sub>10</sub>, substâncias diferentes.","Constitucional: função, cadeia, posição, compensação (metameria), dinâmica (tautomeria).","Estereoisomeria (configuracional): geométrica e óptica."],
 trap:"Fórmulas moleculares diferentes = não são isômeros.",
 mac:"Iso = mesmo; meros = partes."},
{g:"Isomeria plana",k:"Cap. 1",t:"Função, cadeia e posição",
 ideia:"<b>Função</b>: funções diferentes. <b>Cadeia</b>: mesma função, tipo de cadeia diferente. <b>Posição</b>: mesma função e cadeia, muda a posição.",
 tab:{head:["Tipo","Exemplos do livro"],rows:[["Função","álcool × éter; aldeído × cetona; ácido × éster; nitrilo × isonitrilo; fenol × álcool × éter aromáticos"],["Cadeia","normal × ramificada; heterogênea × homogênea; saturada × insaturada (ciclopropano × propeno); aberta × fechada"],["Núcleo","cadeia em anel: ciclopentano × metilciclobutano"],["Posição","da insaturação; do substituinte; do grupo funcional (o-cresol × p-cresol)"]]},
 trap:"Pelo livro, ciclopropano × propeno é isomeria de CADEIA.",
 mac:"Se a função mudou, é de função, mesmo que a cadeia também tenha mudado."},
{g:"Isomeria plana",k:"Cap. 1",t:"Metameria, tautomeria e roteiro",
 ideia:"<b>Metameria</b>: mesma função, heteroátomo muda de lugar. <b>Tautomeria</b>: funções diferentes em equilíbrio dinâmico (solução alelotrópica).",
 list:["Metameria: etoxietano × 1-metoxipropano; dietilamina × metilpropilamina.","Tautomeria aldoenólica: etanal ⇌ etenol. Cetoenólica: propanona ⇌ prop-1-en-2-ol.","<b>Roteiro</b>: mesma fórmula? → mesma função? (não: função/tautomeria) → mesmo tipo de cadeia? (não: cadeia) → heteroátomo mudou? (sim: metameria) → senão, posição."],
 trap:"Dois álcoois nunca são tautômeros: tautomeria exige funções diferentes em equilíbrio.",
 mac:"Na hidratação de alcinos (cap. 5), o enol vira aldeído ou cetona: é tautomeria."},
/* ===== ISOMERIA GEOMÉTRICA ===== */
{g:"Isomeria geométrica",k:"Cap. 2",t:"Cis-trans: quando existe",
 ideia:"A <b>ligação π</b> impede a rotação. Há isomeria geométrica quando <b>cada carbono da dupla</b> tem <b>dois ligantes diferentes</b>. Em ciclos, quando há substituintes em <b>dois carbonos diferentes</b>.",
 list:["Cis: ligantes iguais do mesmo lado; trans: lados opostos.","But-2-eno: tem. But-1-eno e 2-metilpropeno: não têm (um C da dupla com ligantes iguais).","1,2-dimetilciclopropano: tem (isomeria bayeriana). 1,1-dimetil: não tem.","1,2-dicloroeteno: cis é polar e tem PE maior; trans é apolar.","Na visão, o 11-cis-retinal vira 11-trans-retinal com a luz."],
 trap:"Basta UM carbono da dupla com ligantes iguais para não haver isomeria.",
 mac:"Simples gira (σ); dupla trava (π)."},
{g:"Isomeria geométrica",k:"Cap. 2",t:"Prioridades e sistema (E)-(Z)",
 ideia:"Em cada carbono da dupla, ache o ligante de <b>maior prioridade</b> (Cahn-Ingold-Prelog). <b>Mesmo lado = Z</b> (zusammen); <b>lados opostos = E</b> (entgegen).",
 tab:{head:["Regra","O que diz"],rows:[["1","maior número atômico vence (Br > Cl > O > C > H)"],["2","empatou: compare os átomos seguintes"],["3","dupla e tripla contam os átomos replicados (CHO = O, O, H)"],["4","isótopo de maior massa vence (²H > ¹H)"],["5","par de elétrons livre é o último"]]},
 list:["Ex.: –CH<sub>2</sub>Br vence –CCl<sub>3</sub> (Br 35 > Cl 17 no primeiro confronto).","–COOH > –CHO > –CH<sub>2</sub>OH > –CH<sub>2</sub>CH<sub>3</sub>."],
 trap:"Cis não é sinônimo de Z. Sempre faça o ranking.",
 mac:"Z = zusammen = juntos."},
/* ===== ISOMERIA ÓPTICA ===== */
{g:"Isomeria óptica",k:"Cap. 3",t:"Luz polarizada, carbono assimétrico e enantiômeros",
 ideia:"<b>C*</b> = carbono ligado a <b>quatro ligantes diferentes</b>. Moléculas quirais formam pares de <b>enantiômeros</b> (imagem no espelho), que desviam a luz polarizada em sentidos opostos.",
 list:["Prisma de Nicol polariza a luz; o <b>polarímetro</b> mede o desvio.","Dextrogira (+): direita; levogira (–): esquerda.","Enantiômeros: mesmas propriedades físicas, exceto o sentido do desvio; podem agir diferente no corpo (talidomida).","C* em anel: os dois \"caminhos\" do anel têm de ser diferentes (2-metilcicloexanol tem; 4-metilcicloexanol não)."],
 trap:"Carbono com dupla nunca é assimétrico.",
 mac:"Como as mãos: imagem no espelho, mas não se superpõem."},
{g:"Isomeria óptica",k:"Cap. 3",t:"Diastereoisômeros, racêmica e meso",
 ideia:"<b>Diastereoisômeros</b>: estereoisômeros que NÃO são imagem. <b>Mistura racêmica</b>: 50% (+) e 50% (–), inativa por compensação <b>externa</b>. <b>Meso</b>: C* iguais com plano de simetria, inativo por compensação <b>interna</b>.",
 list:["2,3-dibromobutano: (R,R), (S,S) e meso. Meso × (R,R) = diastereoisômeros.","Mistura equimolecular de diastereoisômeros é opticamente ativa (não é racêmica).","Ácido tartárico: 2 ativos + 1 meso."],
 trap:"Racêmica é mistura de duas substâncias; meso é uma substância só.",
 mac:"Racêmica = cabo de guerra empatado; meso = borboleta."},
{g:"Isomeria óptica",k:"Cap. 3",t:"Sistema (R)-(S) e projeção de Fischer",
 ideia:"Com a prioridade 4 afastada do leitor, siga 1 → 2 → 3: <b>horário = R</b>, <b>anti-horário = S</b>. R/S não diz nada sobre (+)/(–).",
 list:["Fischer: horizontal vem para a frente; vertical vai para trás.","Prioridade 4 na vertical: leia direto. Na horizontal: o sentido observado se inverte (ou faça duas permutas para levá-la para baixo).","Uma permuta (troca de um par) inverte o C*: enantiômero. Duas permutas mantêm.","D-L é sistema relativo (gliceraldeído), não tem relação com R/S."],
 trap:"(R) não é dextrogiro; (S) não é levogiro.",
 mac:"Rectus = direita (horário); sinister = esquerda."},
{g:"Isomeria óptica",k:"Cap. 3",t:"Fórmulas de van't Hoff",
 ideia:"Com <b>n</b> carbonos assimétricos <b>diferentes</b>: <b>2ⁿ</b> isômeros ativos e <b>2ⁿ ÷ 2</b> pares racêmicos.",
 tab:{head:["Composto","C*","Ativos · racêmicas"],rows:[["ácido láctico","1","2 · 1"],["3-clorobutan-2-ol","2 diferentes","4 · 2"],["2,3-dibromopentano","2 diferentes","4 · 2"],["glicose (aberta)","4 diferentes","16 · 8"],["ácido tartárico","2 iguais","2 ativos + 1 meso"]]},
 trap:"As fórmulas NÃO valem quando há composto meso (C* iguais).",
 mac:"Conte os C*, veja se são iguais, depois aplique 2ⁿ."},
/* ===== REAÇÕES DE ADIÇÃO ===== */
{g:"Reações de adição",k:"Cap. 5",t:"Hidrogenação e halogênios",
 ideia:"Na adição, a ligação π se abre e o reagente entra. <b>H<sub>2</sub></b> (Ni, Pd, Pt) entra do mesmo lado: <b>cis</b>. <b>X<sub>2</sub></b> (Cl<sub>2</sub>, Br<sub>2</sub>) entra em lados opostos: <b>trans</b> (íon bromônio).",
 list:["but-2-ino + H<sub>2</sub> (Ni) → cis-but-2-eno.","Eteno + Br<sub>2</sub> → 1,2-dibromoetano (di-haleto vicinal); adição eletrofílica.","Hidrogenação é exotérmica: menor |ΔH| = isômero mais estável (trans –115,6 kJ; cis –119,7 kJ)."],
 trap:"Só sofre adição quem tem insaturação (dupla ou tripla).",
 mac:"Catalisador é a mesa: os H entram pelo lado que está encostado nela (cis)."},
{g:"Reações de adição",k:"Cap. 5",t:"HX: Markovnikov e Kharasch",
 ideia:"<b>Markovnikov</b>: o H vai para o carbono da dupla <b>mais hidrogenado</b>. <b>Kharasch</b>: só com <b>HBr + peróxido</b>, o Br vai para o carbono mais hidrogenado (radicais livres).",
 list:["Propeno + HBr → 2-bromopropano. Com peróxido → 1-bromopropano.","2-metilpropeno + HCl com peróxido → 2-cloro-2-metilpropano (peróxido não vale para HCl).","Alceno + H<sub>2</sub>O (H<sub>2</sub>SO<sub>4</sub>): também Markovnikov (2-metilbut-2-eno → 2-metilbutan-2-ol).","Pent-2-eno + HBr: mistura de 2- e 3-bromopentano (Markovnikov não desempata)."],
 trap:"Kharasch só vale para HBr.",
 mac:"\"Quem tem mais H, ganha mais H.\""},
{g:"Reações de adição",k:"Cap. 5",t:"Alcinos, alcadienos, aldeídos e cetonas",
 ideia:"<b>Alcinos</b> fazem duas adições. <b>Hidratação</b>: enol → aldeído (só o etino) ou cetona. <b>Alcadienos</b>: predomina a adição <b>1,4</b>. <b>Aldeído/cetona + H<sub>2</sub></b>: álcool (redução).",
 list:["Propino + 2 HBr → 2,2-dibromopropano.","Etino + H<sub>2</sub>O → etanal; propino + H<sub>2</sub>O → propanona; but-1-ino → butanona.","Etino + HCN → CH<sub>2</sub>=CH–CN (alcenos não adicionam HCN).","Buta-1,3-dieno + Br<sub>2</sub> → 1,4-dibromobut-2-eno (80%); + HBr → 1-bromobut-2-eno.","Etanal + H<sub>2</sub> → etanol (Nox do C: +1 → –1)."],
 trap:"O enol é intermediário: o produto final é o aldeído ou a cetona.",
 mac:"Na adição 1,4, os grupos vão para as pontas e a dupla vai para o meio."},
/* ===== PROVA ===== */
{g:"Prova discursiva",k:"Treino",t:"Como responder questão discursiva",
 ideia:"Resposta completa = <b>resposta direta</b> + <b>justificativa com o conceito</b> + <b>estrutura ou nome</b> quando couber.",
 list:["\"Dê o nome\": nome completo com números + função.","\"Classifique\": o tipo + o motivo (\"isomeria de função, pois um é álcool e o outro é éter\").","\"Justifique\": cite a regra (Markovnikov, menores números, carbono assimétrico).","\"Equacione\": reagentes → produto principal + a regra usada.","Erros comuns: nome sem números, numeração pela ponta errada, confundir éter/éster, amina/amida, álcool/fenol."],
 trap:"Não deixe em branco: o conceito certo já vale parte da nota.",
 mac:"Escreva o raciocínio passo a passo."},
{g:"Prova discursiva",k:"Treino",t:"Modelos de resposta",
 ideia:"Treine escrevendo e compare com estes modelos.",
 list:["<b>Isômeros?</b> \"Etanol e metoximetano são isômeros de função: mesma fórmula C<sub>2</sub>H<sub>6</sub>O, mas um é álcool e o outro é éter.\"","<b>Nome</b>: \"CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH=CH–CH<sub>3</sub> é 4-metilpent-2-eno: a cadeia de 5 C contém a dupla, que recebe o menor número.\"","<b>Óptica</b>: \"O ácido láctico tem 1 C* (H, OH, CH<sub>3</sub>, COOH): 2¹ = 2 isômeros ativos e 1 mistura racêmica.\"","<b>Adição</b>: \"Propeno + HBr → 2-bromopropano (Markovnikov); com peróxido → 1-bromopropano (Kharasch).\"","<b>Usuais</b>: \"Acetona = propanona, cetona, removedor de esmalte.\""],
 trap:"Mais questões com resposta modelo: veja o Treino discursivo na versão completa.",
 mac:"Depois do resumo, faça o quiz no Nível prova."}
];
const N=TELAS.length,$=id=>document.getElementById(id);
let i=0;try{i=Math.min(N-1,Math.max(0,+localStorage.getItem("q30")||0))}catch(e){}
function show(n){i=n;try{localStorage.setItem("q30",i)}catch(e){}
 const t=TELAS[i];let h=`<div class="eyebrow">${t.g} · ${t.k}</div><h1>${t.t}</h1><div class="box ideia"><b class="lb">Ideia central</b>${t.ideia}</div>`;
 if(t.tab)h+=`<div class="tw"><table><thead><tr>${t.tab.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.tab.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 if(t.list)h+=`<ul class="l">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(t.trap)h+=`<div class="box trap"><b class="lb">Pegadinha</b>${t.trap}</div>`;
 if(t.mac)h+=`<div class="box mac"><b class="lb">Macete</b>${t.mac}</div>`;
 if(i==N-1)h+=`<p class="fim">Fim das 30 telas. Agora faça o <a href="../quiz/">quiz</a>. Para rever um assunto em detalhe, abra a <a href="completo/">versão completa</a>.</p>`;
 $("tela").innerHTML=h;$("idx").classList.remove("on");$("tela").style.display="";
 $("cnt").textContent=`Tela ${i+1} de ${N}`;$("pb").style.width=((i+1)/N*100)+"%";
 $("prev").disabled=i==0;$("next").disabled=i==N-1;$("menu").textContent="Índice";scrollTo(0,0)}
function index(){if($("idx").classList.contains("on"))return show(i);
 let h="",g="";TELAS.forEach((t,n)=>{if(t.g!=g){h+=(g?"</ol>":"")+`<h2>${t.g}</h2><ol>`;g=t.g}
  h+=`<li><button data-n="${n}" class="${n==i?"cur":""}"><span>${n+1}</span>${t.t}</button></li>`});
 $("idx").innerHTML=h+"</ol>";$("idx").classList.add("on");$("tela").style.display="none";$("menu").textContent="Fechar";scrollTo(0,0)}
$("idx").onclick=e=>{const b=e.target.closest("button[data-n]");if(b)show(+b.dataset.n)};
$("prev").onclick=()=>i>0&&show(i-1);$("next").onclick=()=>i<N-1&&show(i+1);$("menu").onclick=index;
document.addEventListener("keydown",e=>{if(e.key=="ArrowRight")$("next").click();if(e.key=="ArrowLeft")$("prev").click()});
show(i);
</script>
</body>
</html>
