<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Resumos de Química</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: trilha das seções do capítulo à esquerda (como no SAS), uma seção por vez à direita; no celular a trilha vira faixa rolável no topo. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#E5EAF3; --line:#CBD4E3;
  --ink:#141C2B; --muted:#55607A;
  --leaf:#1F4F9A; --leaf-soft:#DCE6F7; --pollen:#C0452F; --pollen-soft:#FBE3DD;
  --ok:#1E7A45; --ok-soft:#D8F0E1; --bad:#B23A2E; --bad-soft:#F8DEDA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0E121B; --surface:#151B27; --sunk:#1B2232; --line:#2B3548;
  --ink:#E3E8F2; --muted:#9AA6BE;
  --leaf:#7FA8F0; --leaf-soft:#1C2B48; --pollen:#F08A74; --pollen-soft:#3D221D;
  --ok:#6BD69A; --ok-soft:#173826; --bad:#F08C7E; --bad-soft:#3D1F1B; color-scheme:dark}}
:root[data-theme="__off__"]{
  --bg:#0E121B; --surface:#151B27; --sunk:#1B2232; --line:#2B3548;
  --ink:#E3E8F2; --muted:#9AA6BE;
  --leaf:#7FA8F0; --leaf-soft:#1C2B48; --pollen:#F08A74; --pollen-soft:#3D221D;
  --ok:#6BD69A; --ok-soft:#173826; --bad:#F08C7E; --bad-soft:#3D1F1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pollen);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.01em}
header.top h1 span{color:var(--leaf)}
.meter{min-width:0;flex:0 1 300px}
.meter .bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter .fill{height:100%;background:var(--leaf);width:0;transition:width .4s}
.meter small{color:var(--muted);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;padding-top:24px;align-items:start}
nav.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:4px}
nav.trail .grp{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 12px 4px}
.tbtn{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.3;font-weight:700}
.tbtn:hover{background:var(--sunk)}
.tbtn[aria-current="true"]{background:var(--leaf-soft)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.tbtn[aria-current="true"] .dot{border-color:var(--leaf)}
.tbtn.done .dot{background:var(--leaf);border-color:var(--leaf)}

main{min-width:0}
.panel{display:flex;flex-direction:column;gap:20px}
.chap-head .num{font-family:var(--display);color:var(--leaf);font-weight:800;font-size:1rem}
.chap-head h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:700;margin-top:2px}
.chap-head p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.big-idea{background:var(--leaf);color:var(--bg);border-radius:var(--r);padding:20px 22px}
.big-idea .eyebrow{color:inherit;opacity:.8}
.big-idea p{margin:6px 0 0;font-size:1.15rem;font-weight:700;line-height:1.45}
.analogy{font-style:italic;color:var(--muted);margin:0;max-width:62ch}
.flag{background:var(--pollen-soft);border:1px solid var(--pollen);border-radius:10px;padding:10px 14px;font-size:.92rem}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.block h3{font-size:1.08rem;margin-bottom:8px}
.block ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.block b{color:var(--leaf)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
.explain{background:var(--sunk);border-radius:var(--r);padding:14px 18px;margin-top:-8px}
.explain h4{font-family:var(--display);font-size:.95rem;margin:0 0 8px;color:var(--leaf)}
.explain dl{margin:0;display:flex;flex-direction:column;gap:8px}
.explain dt{font-weight:700;display:inline}
.explain dd{margin:0;display:inline}
.trap{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--pollen);border-radius:var(--r);padding:14px 18px}
.trap .tag{flex:none;font-family:var(--display);font-weight:800;color:var(--pollen);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.trap p{margin:0}
.quick h3{font-size:1.1rem;margin-bottom:10px}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.flip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:110px}
.flip .q{font-weight:700}
.flip .a{color:var(--leaf);font-weight:700}
.flip .hint{font-size:.82rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:0;border-radius:99px;padding:10px 20px;font-weight:700;background:var(--leaf);color:var(--bg)}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.08)}

.factory{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.station{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.station:hover{border-color:var(--leaf)}
.station .role{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--leaf)}
.station .org{font-weight:700}
.station .what{color:var(--muted);font-size:.92rem}
.links{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.links ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;counter-reset:s}
.howto div{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.howto div b{display:block;font-family:var(--display);color:var(--leaf)}

/* exercícios */
.score{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip b{color:var(--leaf)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ex > h3{font-size:1.2rem}
.ex > p.lead{margin:-6px 0 0;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.stem{font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;font-size:.95rem}
.fb.right{background:var(--ok-soft)} .fb.wrong{background:var(--bad-soft)}
.fb b{display:block}
.vf{display:flex;gap:8px}
.vf .opt{min-width:56px;text-align:center;font-weight:700}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select.right,input.right{border-color:var(--ok);background:var(--ok-soft)}
select.wrong,input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank span{background:var(--pollen-soft);border-radius:6px;padding:3px 10px;font-weight:700;font-size:.92rem}
.gap input{width:11em}
textarea{width:100%;min-height:110px;resize:vertical}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;accent-color:var(--leaf)}
.legend{font-size:.85rem;color:var(--muted)}
footer.note{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.trail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;margin-inline:-16px;padding-inline:16px}
  nav.trail .grp{display:none}
  .tbtn{flex:none;max-width:220px;border:1px solid var(--line);background:var(--surface)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.eq{font-variant-numeric:tabular-nums}
.hook{display:flex;gap:14px;align-items:flex-start;background:var(--leaf-soft);border-radius:var(--r);padding:14px 18px}
.hook .tag{flex:none;font-family:var(--display);font-weight:800;color:var(--leaf);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;max-width:7.5em}
.hook p{margin:0;font-size:1.05rem}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fig figcaption{font-size:.9rem;color:var(--muted);text-align:center}
.mol{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.mol .mb{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.mol .mplane{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 5}
.mol .mt,.mol .mc{fill:var(--ink);font-family:var(--body);font-size:20px;font-weight:700}
.mol .mhi{fill:var(--pollen);font-family:var(--body);font-size:22px;font-weight:700}
.trainfig{background:var(--bg);border-radius:var(--r);padding:8px}
.flag ol{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.mol .marc{stroke:var(--pollen);stroke-width:3;stroke-dasharray:6 4}
.mol .marrow{fill:var(--pollen)}
.ligs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border-radius:var(--r);padding:14px}
.ligs .cc{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--leaf);padding:0 6px}
.ligs .lg{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700}
.steps{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.vhgrid{display:grid;grid-template-columns:minmax(0,1fr) 6em;gap:10px 14px;align-items:center}
</style>

<script>
const CAP2=(()=>{
const S = [
 {id:"s1",label:"Isomeria configuracional geométrica (abertura)",kicker:"Capítulo 2 · pág. 10",title:"Isomeria configuracional geométrica",
  hook:"Agora mesmo, enquanto você lê esta frase, milhões de moléculas dentro do seu olho estão trocando de forma: de <i>cis</i> para <i>trans</i> e de volta para <i>cis</i>. Sem essa troca, você não enxergaria nada. É disso que trata o capítulo.",

   {h:"E depois?",items:["Uma enzima, a <b>retinal isomerase</b>, converte a forma <i>trans</i> de volta na forma <i>cis</i>.","Assim o olho fica pronto para novos impulsos: é um <b>processo cíclico</b> e bem dinâmico.","Se o 11-<i>trans</i>-retinal não voltasse a ser <i>cis</i>, não haveria novos impulsos e a visão pararia."]},
   {h:"Expectativas de aprendizagem (livro)",items:["Identificar quando compostos de <b>cadeia aberta ou fechada</b> são isômeros configuracionais geométricos.","Aplicar as <b>regras de prioridade de Cahn-Ingold-Prelog</b> na nomenclatura dos isômeros configuracionais geométricos."]}

 {id:"s2",label:"Estereoisomeria",kicker:"Capítulo 2 · pág. 11",title:"Estereoisomeria",
  hook:"Por que uma molécula com ligação simples pode girar à vontade e uma com ligação dupla fica \"travada\"? A resposta está no formato das ligações, e é ela que cria os isômeros geométricos.",
  sobre:"O que são estereoisômeros, onde fica a isomeria geométrica na \"árvore\" da isomeria e por que a ligação pi impede a rotação.",
  ideia:"Estereoisômeros têm os mesmos átomos ligados na mesma ordem; só muda a arrumação no espaço. A ligação dupla trava a molécula, e é por isso que aparecem dois compostos diferentes.",

   {h:"Sigma × pi",items:["Ligação <b>sigma (σ)</b>: interação <b>frontal</b> de orbitais. <b>Permite</b> rotação.","Ligação <b>pi (π)</b>: interação <b>lateral</b> de orbitais. <b>Não permite</b> rotação."]},
   {h:"O teste do 1,2-dicloroetano",items:["No 1,2-dicloroetano (só ligações simples), a ligação sigma gira de 60° em 60° e os átomos mudam de posição.","Mas é <b>sempre o mesmo composto</b>: girar não cria isômero.","Essa rotação <b>não ocorre</b> em compostos <b>insaturados</b> ou <b>cíclicos</b>."]},
   {h:"O teste do C<sub>2</sub>H<sub>2</sub>Cl<sub>2</sub>",items:["Com ligação dupla, a ligação π impede a rotação.","A rotação só seria possível se a ligação π fosse rompida.","As duas estruturas não se convertem uma na outra sozinhas: existem, de verdade, <b>dois compostos</b> de fórmula C<sub>2</sub>H<sub>2</sub>Cl<sub>2</sub>."]}

 {id:"s3",label:"Isômeros geométricos com ligação dupla",kicker:"Capítulo 2 · págs. 12 e 18",title:"Isômeros geométricos com ligação dupla",

   {h:"Cis e trans",items:["<b>Cis</b> (figura 1 do livro): os dois átomos ligantes iguais ficam do <b>mesmo lado</b> do plano que divide a molécula ao meio.","<b>Trans</b> (figura 2): ficam em <b>lados opostos</b>.","A diferença parece pequena, mas os compostos têm <b>propriedades físicas e químicas bem distintas</b>."]},
   {h:"A condição",items:["Na estrutura R<sub>1</sub>R<sub>3</sub>C=CR<sub>2</sub>R<sub>4</sub>, é preciso <b>R<sub>1</sub> ≠ R<sub>3</sub></b> e <b>R<sub>2</sub> ≠ R<sub>4</sub></b>.","Ou seja: <b>cada carbono da dupla</b> precisa ter <b>dois ligantes diferentes entre si</b>.","Isso não impede que haja três ou até quatro substituintes diferentes."]},
   {h:"Quadro do livro",items:["A isomeria <i>cis-trans</i> <b>não se limita</b> a alcenos dissubstituídos.","Ela pode ocorrer sempre que <b>ambos</b> os carbonos da dupla tiverem dois substituintes diferentes.","Basta <b>um</b> carbono da dupla ter dois substituintes <b>idênticos</b> para <b>não haver</b> isomeria geométrica (as duas estruturas são o mesmo composto)."]},
   {h:"Saiba mais: momento dipolar (pág. 18)",items:["Quando os ligantes são muito eletronegativos (como o Cl), a polarização muda entre <i>cis</i> e <i>trans</i>.","<b><i>cis</i>-1,2-dicloroeteno</b>: a soma vetorial dos momentos dipolo <b>não é nula</b> → molécula <b>polar</b>.","<b><i>trans</i>-1,2-dicloroeteno</b>: a soma vetorial <b>é nula</b> → molécula <b>apolar</b>.","Por ser polar, o <i>cis</i> tem <b>ponto de ebulição maior</b> (é o que cobra a Atividade 2)."]}
  ],

 {id:"s4",label:"Isômeros geométricos em compostos cíclicos (isomeria bayeriana)",kicker:"Capítulo 2 · pág. 12",title:"Isômeros geométricos em compostos cíclicos (isomeria bayeriana)",
  hook:"Não é só a ligação dupla que trava uma molécula: um anel também trava. Por isso, um simples triângulo de carbonos pode ter versão cis e versão trans.",
  sobre:"Por que compostos cíclicos também podem ter isomeria geométrica e qual a condição para isso.",
  ideia:"No anel, as ligações simples não giram. Se dois carbonos do ciclo tiverem, cada um, substituintes diferentes, aparece o cis (do mesmo lado do anel) e o trans (um em cima, outro embaixo).",
  analogia:"Pense no anel como uma mesa: os substituintes podem ficar os dois em cima da mesa (cis) ou um em cima e outro embaixo (trans).",
  blocks:[
   {h:"Por que acontece",items:["As ligações simples entre os carbonos de um composto <b>cíclico</b> também <b>não sofrem rotação</b>.","Então a posição de cada substituinte (acima ou abaixo do plano do anel) fica fixa."]},
   {h:"A condição",items:["O composto cíclico deve ter <b>substituintes diferentes em pelo menos dois carbonos do ciclo</b>.","Exemplo do livro: <b>1,2-diclorociclopropano</b>.","Figura 3: os dois Cl do mesmo lado → <b><i>cis</i></b>.","Figura 4: um Cl de cada lado → <b><i>trans</i></b>."]}
  ],
  tables:[{head:["Composto cíclico","Tem isomeria geométrica?","Por quê"],rows:[
   ["1,2-diclorociclopropano","sim","dois carbonos do ciclo com H e Cl"],
   ["1,2-dimetilciclopropano","sim","dois carbonos do ciclo com H e CH<sub>3</sub>"],
   ["1,1-diclorociclopropano","não","os dois Cl estão no mesmo carbono"],
   ["Ciclobutano","não","nenhum carbono tem substituinte diferente"]]}],
  trap:["Os dois substituintes precisam estar em carbonos DIFERENTES do ciclo. No mesmo carbono não dá cis/trans."],
  check:[{q:"Por que um ciclo pode ter isomeria geométrica?",a:"Porque as ligações do anel não giram."},{q:"Ciclobutano tem isomeria geométrica?",a:"Não, não tem substituintes diferentes."},{q:"Qual é o outro nome da isomeria geométrica em ciclos?",a:"Isomeria bayeriana."}]},

 {id:"s5",label:"Prioridades dos substituintes: Regras 1 e 2",kicker:"Capítulo 2 · págs. 12 a 14",title:"Prioridades dos substituintes (Regras de Cahn-Ingold-Prelog): Regras 1 e 2",
  hook:"Para dar nome a isômeros complicados, os químicos criaram um \"ranking\" de átomos, como um campeonato. Quem tem o maior número atômico ganha. Empatou? Tem desempate, igual no futebol.",
  sobre:"Quem criou o sistema, como se indicam as prioridades, a Regra 1 (número atômico) e a Regra 2 (desempate).",
  ideia:"Cada átomo ligado ao carbono de referência ganha uma posição no ranking pelo número atômico (Z). Quanto maior o Z, maior a prioridade. Se empatar, compare os átomos seguintes.",
  analogia:"É a classificação de um campeonato: primeiro critério, número atômico (os pontos). Empatou nos pontos? Olha o saldo de gols, que aqui são os átomos da camada seguinte.",
  blocks:[
   {h:"Quem criou",items:["Em <b>1956</b>, os químicos britânicos <b>Robert Sidney Cahn</b> (1899-1981) e <b>Christopher Kelk Ingold</b> (1893-1970), com o croata <b>Vladimir Prelog</b> (1906-1998), propuseram regras para ordenar a prioridade dos substituintes.","Com elas se dá nome à estrutura dos isômeros configuracionais de forma simples e confiável.","Nomenclaturas do sistema: <b>(E)-(Z)</b> para isômeros geométricos e <b>(R)-(S)</b> para isômeros ópticos."]},
   {h:"Como se indica",items:["O fundamento: <b>quanto maior o número atômico, maior a prioridade</b>. As regras preveem os empates.","As prioridades são indicadas por <b>1, 2, 3 e 4</b> (ou <b>a, b, c, d</b>), sempre <b>entre parênteses</b>."]},
   {h:"Regra 1",items:["Quanto maior o <b>número atômico</b> do átomo <b>diretamente ligado</b> ao átomo de referência, maior a prioridade.","Exemplos do livro: Z: H = 1; C = 6; F = 9; Cl = 17; Br = 35.","C ligado a Br, Cl, F e H: Br (1), Cl (2), F (3), H (4)."]},
   {h:"Regra 2 (desempate)",items:["Se dois ou mais átomos ligados ao átomo de referência tiverem a <b>mesma prioridade</b>, compare os átomos ligados a eles.","No exemplo do livro, todos os átomos ligados ao carbono * são carbonos (Z = 6): empate.","Desempate: o carbono ligado a <b>O</b> (Z = 8) vence; o carbono ligado só a H perde; entre os empatados, vence o lado que tem um carbono a mais na sequência."]}
  ],
  tables:[
   {head:["Numeral","Ordem","Classificação","Letra"],rows:[
    ["(1)","1º lugar","maior prioridade","(a)"],
    ["(2)","2º lugar","prioridade intermediária","(b)"],
    ["(3)","3º lugar","prioridade intermediária","(c)"],
    ["(4)","4º lugar","menor prioridade","(d)"]]},
   {head:["Átomo","Número atômico (Z)"],rows:[["H","1"],["C","6"],["N","7"],["O","8"],["F","9"],["Cl","17"],["Br","35"],["I","53"]]},
   {head:["Substituinte","Prioridade"],rows:[["HOCH<sub>2</sub>–","(1)"],["CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>–","(2)"],["CH<sub>3</sub>CH<sub>2</sub>–","(3)"],["CH<sub>3</sub>–","(4)"]]}
  ],
  trap:["Compare o átomo, não o grupo inteiro. –CH<sub>2</sub>OH vence –CH(CH<sub>3</sub>)<sub>2</sub>, porque no primeiro passo os dois são C, mas no desempate o O (8) bate qualquer C (6).","O que conta é o número atômico, não o tamanho do grupo nem a massa total."],
  check:[{q:"Quem tem mais prioridade: Cl ou F?",a:"Cl (Z = 17) vence F (Z = 9)."},{q:"Quando se usa a Regra 2?",a:"Quando há empate na Regra 1: compara-se os átomos seguintes."},{q:"Ordene: –CH<sub>3</sub>, –CH<sub>2</sub>OH, –CH<sub>2</sub>CH<sub>3</sub>.",a:"–CH<sub>2</sub>OH (1), –CH<sub>2</sub>CH<sub>3</sub> (2), –CH<sub>3</sub> (3)."}]},

 {id:"s6",label:"Prioridades dos substituintes: Regras 3, 4 e 5",kicker:"Capítulo 2 · págs. 14 a 16",title:"Prioridades dos substituintes: Regras 3, 4 e 5",
  hook:"Três regras curtas para os casos especiais: ligação dupla no substituinte, isótopos e par de elétrons sobrando. Com elas, você resolve qualquer ranking da prova.",
  sobre:"Como tratar ligações duplas e triplas (Regra 3), isótopos (Regra 4) e pares de elétrons livres (Regra 5), mais o exercício resolvido do livro.",
  ideia:"Regra 3: dupla conta como se o átomo estivesse ligado duas vezes. Regra 4: isótopo mais pesado vence. Regra 5: par de elétrons livre fica em último.",
  analogia:"Na Regra 3, a dupla vale \"voto em dobro\": o átomo do outro lado é contado duas vezes, como se fossem dois vizinhos.",
  blocks:[
   {h:"Regra 3: ligações múltiplas",items:["Ligações duplas ou triplas são, <b>hipoteticamente</b>, replicadas para cada átomo envolvido.","No modelo hipotético <b>só há ligações simples</b>. É apenas um truque para medir prioridade.","Exemplo da vinila (–CH=CH<sub>2</sub>): o carbono ligado ao C* passa a contar como ligado a <b>dois carbonos</b> e um H.","Não pense que existem carbonos monovalentes: é só um artifício, muito útil na estereoisomeria.","Exemplo do livro: C* ligado a Cl, vinila, etila e H → <b>Cl (1), vinila (2), etila (3), H (4)</b>."]},
   {h:"Exercício resolvido (pág. 15)",items:["Ordem crescente de (A) –CHO, (B) –COOCH<sub>3</sub>, (C) –CH<sub>2</sub>–O–CH<sub>3</sub>.","Modelo hipotético: A = C ligado a 1 H e 2 O; B = C ligado a 3 O; C = C ligado a 2 H e 1 O.","Ordem crescente: <b>C &lt; A &lt; B</b>."]},
   {h:"Regra 4: isótopos",items:["Quando há <b>isótopos</b> como substituintes, quanto maior o <b>número de massa</b>, maior a prioridade.","Exemplo: C ligado a F (1), <sup>3</sup>H trítio (2), <sup>2</sup>H deutério (3), <sup>1</sup>H (4)."]},
   {h:"Regra 5: par de elétrons",items:["Se o átomo de referência tem um <b>par de elétrons disponível</b>, esse par tem a <b>menor prioridade</b>.","Exemplo com nitrogênio: –CH<sub>2</sub>CH<sub>3</sub> (1), –CH<sub>3</sub> (2), H (3), par de elétrons (4)."]}
  ],
  tables:[
   {head:["Regra","O que diz","Exemplo do livro"],rows:[
    ["Regra 3","dupla/tripla vira ligações simples replicadas (modelo hipotético)","vinila conta como C ligado a C, C, H"],
    ["Regra 4","entre isótopos, vence o maior número de massa","<sup>3</sup>H &gt; <sup>2</sup>H &gt; <sup>1</sup>H"],
    ["Regra 5","par de elétrons livre tem a menor prioridade","no N: o par fica em (4)"]]},
   {head:["Grupo","Modelo hipotético: C ligado a","Posição (crescente)"],rows:[
    ["(C) –CH<sub>2</sub>–O–CH<sub>3</sub>","H, H, O","1º (menor)"],
    ["(A) –CHO","H, O, O","2º"],
    ["(B) –COOCH<sub>3</sub>","O, O, O","3º (maior)"]]}
  ],
  trap:["\"Ordem crescente\" começa pelo de MENOR prioridade. Leia o enunciado com atenção.","Na Regra 4 conta a massa (isótopo); nas outras regras conta o número atômico."],
  check:[{q:"Na Regra 3, a vinila (–CH=CH<sub>2</sub>) conta como C ligado a quê?",a:"A dois carbonos e um hidrogênio."},{q:"Deutério ou hidrogênio comum: quem tem prioridade?",a:"O deutério (<sup>2</sup>H), maior número de massa."},{q:"Onde fica o par de elétrons livre no ranking?",a:"Em último lugar (menor prioridade)."}]},

 {id:"s7",label:"Sistema (E)-(Z) para nomear estereoisômeros geométricos",kicker:"Capítulo 2 · págs. 16 e 17",title:"Sistema (E)-(Z) para nomear estereoisômeros geométricos",
  hook:"Quando os quatro ligantes da dupla são diferentes, \"cis\" e \"trans\" deixam de funcionar. A solução usa duas palavras em alemão e o ranking que você acabou de aprender. Depois, teste no Treinador E/Z.",
  sobre:"Por que cis/trans fica ambíguo, como funciona o sistema (E)-(Z), os exemplos e os exercícios resolvidos do livro.",
  ideia:"Em cada carbono da dupla, ache o ligante de maior prioridade. Os dois \"campeões\" do mesmo lado: (Z). Em lados opostos: (E).",
  analogia:"Z de \"Zuntos\" (juntos, do alemão zusammen) e E de \"Em oposição\" (do alemão entgegen). Os dois campeões juntos ou de costas um para o outro.",
  blocks:[
   {h:"Por que um sistema novo",items:["Os termos <i>cis</i> e <i>trans</i> são recomendados só para estereoisômeros de alcenos <b>dissubstituídos</b>.","Em alcenos <b>tri</b> e <b>tetrassubstituídos</b>, eles ficam ambíguos: não dá para saber quem é cis e quem é trans.","Cahn, Ingold e Prelog propuseram o <b>sistema (E)-(Z)</b>, baseado nas prioridades dos substituintes."]},
   {h:"Receita em 3 passos",items:["<b>1.</b> No carbono da esquerda da dupla, ache o ligante de <b>maior prioridade</b>.","<b>2.</b> Faça o mesmo no carbono da direita.","<b>3.</b> Os dois do mesmo lado → <b>(Z)</b> (<i>zusammen</i>, \"junto\"). Em lados opostos → <b>(E)</b> (<i>entgegen</i>, \"oposto\")."]},
   {h:"Exemplos do livro",items:["Z: Cl 17, H 1, C 6, Br 35, I 53. No C1: Br &gt; Cl; no C2: I &gt; C → <b>(E)</b>- e <b>(Z)</b>-1-bromo-1-cloro-2-iodobut-1-eno.","Z: C 6, H 1, F 9. No C2: CH<sub>3</sub> &gt; H; no C3: F &gt; CH<sub>2</sub>CH<sub>3</sub> → <b>(Z)</b>- e <b>(E)</b>-3-fluorpent-2-eno."]},
   {h:"Cuidado: cis não é Z",items:["<b>Não há relação</b> entre <i>cis</i> e (Z) nem entre <i>trans</i> e (E).","Mesmo assim, na literatura é comum ver (Z) no lugar de <i>cis</i> e (E) no lugar de <i>trans</i>.","A nomenclatura E-Z vale também para <b>compostos cíclicos</b>."]},
   {h:"Exercícios resolvidos (pág. 17)",items:["a) CH<sub>3</sub>CH<sub>2</sub>CBr=C(C<sub>2</sub>H<sub>5</sub>)CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub>: 3-bromo-4-etilept-3-eno; o livro mostra as formas <i>trans</i> e <i>cis</i>.","b) CH<sub>3</sub>CCl=CFCH<sub>2</sub>CH<sub>3</sub>: no C2, Cl &gt; CH<sub>3</sub>; no C3, F &gt; CH<sub>2</sub>CH<sub>3</sub> → <b>(Z)</b>- e <b>(E)</b>-2-cloro-3-fluorpent-2-eno.","c) 1-bromo-2-cloro-1-metilciclobutano: no C1, Br &gt; CH<sub>3</sub>; no C2, Cl &gt; H → <b>(Z)</b> e <b>(E)</b>."]}
  ],
  figs:[{l:["Cl","CH₃"],r:["F","CH₂CH₃"],cap:"(Z)-2-cloro-3-fluorpent-2-eno: Cl e F juntos"},{l:["Cl","CH₃"],r:["CH₂CH₃","F"],cap:"(E)-2-cloro-3-fluorpent-2-eno: Cl e F opostos"}],
  tables:[
   {head:["Letra","Palavra alemã","Significado","Quando usar"],rows:[
    ["(Z)","<i>zusammen</i>","junto","ligantes de maior prioridade do mesmo lado"],
    ["(E)","<i>entgegen</i>","oposto","ligantes de maior prioridade em lados opostos"]]},
   {head:["Composto (livro)","Maior prioridade no 1º carbono","Maior prioridade no 2º carbono","Configuração"],rows:[
    ["1-bromo-1-cloro-2-iodobut-1-eno","Br (35) &gt; Cl (17)","I (53) &gt; C (6)","(E) ou (Z), conforme o lado"],
    ["3-fluorpent-2-eno","CH<sub>3</sub> &gt; H","F (9) &gt; CH<sub>2</sub>CH<sub>3</sub>","(E) ou (Z), conforme o lado"],
    ["2-cloro-3-fluorpent-2-eno","Cl &gt; CH<sub>3</sub>","F &gt; CH<sub>2</sub>CH<sub>3</sub>","Cl e F juntos: (Z); opostos: (E)"]]}
  ],
  notes:["No exercício resolvido a) da pág. 17, o livro usa cis/trans num alceno tetrassubstituído, justamente o caso em que a pág. 16 diz que cis/trans fica ambíguo. Pelas prioridades (Br no C3; propil no C4), a estrutura que o livro chama de trans é a (E) e a que chama de cis é a (Z). Pela cadeia principal, os nomes seriam o contrário. Vale perguntar ao professor qual nome ele quer."],
  trap:["Não decore \"cis = Z\". Faça sempre o ranking: em alguns compostos o cis é E.","Compare dentro de cada carbono, nunca entre os dois carbonos."],
  check:[{q:"O que significa Z?",a:"Zusammen, junto: os ligantes de maior prioridade do mesmo lado."},{q:"Quando cis/trans fica ambíguo?",a:"Em alcenos tri e tetrassubstituídos."},{q:"No 2-cloro-3-fluorpent-2-eno com Cl e F do mesmo lado, é E ou Z?",a:"Z."}]}
];

   {h:"Definições do livro",items:["<b>Luz natural, branca ou policromática</b>: várias cores, vários comprimentos de onda (Sol, lâmpadas comuns).","<b>Luz monocromática</b>: uma só cor, um só comprimento de onda (ex.: luz amarela da lâmpada de vapor de sódio).","<b>Luz não polarizada</b>: propaga-se em todas as direções.","<b>Luz polarizada</b>: propaga-se em uma única direção.","<b>Plano de polarização</b>: plano imaginário no qual a luz polarizada se propaga (plano de vibração)."]},
   {h:"O caminho da luz",items:["O Sol emite luz natural; um <b>prisma comum</b> a decompõe nas sete cores.","Um anteparo isola uma cor: luz <b>monocromática</b>, ainda <b>não polarizada</b>.","Ela atravessa o <b>prisma de Nicol</b> (polarizador) e passa a vibrar numa única direção: luz <b>monocromática planopolarizada</b>.","É essa luz que se usa para identificar e classificar isômeros ópticos."]},
   {h:"Tome nota: prisma de Nicol",items:["Formado por duas cunhas de <b>espato da Islândia</b> (variedade de CaCO<sub>3</sub>) coladas com <b>bálsamo do Canadá</b> transparente.","O nome homenageia o físico escocês <b>William Nicol</b> (1768-1851), que o inventou em <b>1828</b>."]}
  ],
  tables:[{head:["Etapa","Tipo de luz"],rows:[["Saída do Sol","natural, policromática, não polarizada"],["Depois do prisma comum e do anteparo","monocromática, não polarizada"],["Depois do prisma de Nicol","monocromática planopolarizada"]]}],
  trap:["Monocromática (uma cor) não é o mesmo que polarizada (uma direção). A luz da etapa 2 já tem uma cor, mas ainda vibra em todas as direções."],
  check:[{q:"O que faz o prisma de Nicol?",a:"Polariza a luz: faz ela vibrar numa única direção."},{q:"Dê um exemplo de luz monocromática.",a:"A luz amarela da lâmpada de vapor de sódio."}]},

 {id:"s3",label:"Polarímetro e substâncias opticamente ativas e inativas",kicker:"Capítulo 3 · págs. 24 e 25",title:"Polarímetro · Substâncias opticamente ativas e substâncias opticamente inativas",
  hook:"Coloque a substância num tubo, passe a luz polarizada e olhe: se o plano da luz \"girar\", a substância é opticamente ativa. Para a direita ou para a esquerda? Isso dá nome a ela.",
  sobre:"O que é o polarímetro e como ele classifica as substâncias em opticamente ativas (dextrogiras ou levogiras) e inativas.",
  ideia:"Substância opticamente ativa é a que gira o plano da luz polarizada. Girou para a direita: dextrogira (+). Para a esquerda: levogira (–). Não girou: opticamente inativa.",
  analogia:"Destro escreve com a direita: dextrogira gira para a direita. \"Levo\" lembra \"lado esquerdo\".",
  blocks:[
   {h:"Polarímetro",items:["Equipamento que determina o comportamento de substâncias <b>opticamente ativas</b>, isto é, que desviam a luz plano-polarizada.","Partes do esquema: <b>fonte de luz</b> → <b>polarizador</b> → <b>tubo</b> com a amostra → <b>analisador acoplado à escala</b> (0° a 180°) → <b>observador</b>."]},
   {h:"Ativas e inativas",items:["A substância translúcida vai no tubo do polarímetro.","Sem rotação do plano de polarização: <b>opticamente inativa</b>.","Desvio para a <b>direita</b> (em relação ao observador): <b>dextrogira</b> ou dextrorrotatória (latim <i>dexter</i>, direita).","Desvio para a <b>esquerda</b>: <b>sinistrogira</b> (<i>sinister</i>, esquerda), <b>levogira</b> ou levorrotatória (<i>laevus</i>, esquerda).","Substância <b>opaca</b>: dissolver num solvente adequado e analisar a solução."]},
   {h:"Importante (livro)",items:["As letras <b>d</b> e <b>ℓ</b> são <b>minúsculas</b>.","As letras <b>D</b> e <b>L</b> maiúsculas têm <b>outro significado</b> na estereoisomeria óptica.","Hoje é preferível usar os sinais <b>(+)</b> e <b>(–)</b>."]}
  ],
  tables:[{head:["Desvio do plano de polarização","Classificação da substância","Notação"],rows:[["Para a direita","dextrogira ou dextrorrotatória","(d) ou (+)"],["Para a esquerda","sinistrogira, levogira ou levorrotatória","(ℓ) ou (–)"]]}],
  trap:["d minúsculo (dextrogira) e D maiúsculo (sistema D-L) são coisas diferentes. Na dúvida, use (+) e (–)."],
  check:[{q:"Desviou a luz para a esquerda. Como se chama?",a:"Levogira (ou sinistrogira, levorrotatória), sinal (–)."},{q:"Como analisar uma substância opaca?",a:"Dissolvendo num solvente adequado e analisando a solução."}]},

 {id:"s4",label:"Alguns termos importantes: isômeros ópticos, enantiômeros e quiralidade",kicker:"Capítulo 3 · págs. 25 e 26",title:"Alguns termos importantes para a estereoisomeria óptica: isômeros ópticos, enantiômeros e quiralidade",
  hook:"É aqui que entra a ferramenta mais útil do capítulo: o carbono assimétrico (C*). Achou um carbono com quatro vizinhos diferentes? Em geral, a molécula tem isomeria óptica.",
  sobre:"Isômeros ópticos, enantiômeros, quiralidade, carbono assimétrico e o Tome nota sobre C* iguais, diferentes e em ciclos.",
  ideia:"Enantiômeros são o par objeto-imagem no espelho que não se superpõe, como as mãos. Na maioria dos casos, isso acontece porque há um carbono ligado a quatro grupos diferentes: o carbono assimétrico (C*).",
  analogia:"Tente colocar a mão direita exatamente em cima da esquerda, com as palmas para baixo: os polegares ficam em lados opostos. É isso que \"não superponível\" quer dizer.",
  blocks:[
   {h:"Isômeros ópticos",items:["São estereoisômeros configuracionais <b>opticamente ativos</b>.","São compostos diferentes; por isso suas moléculas <b>não são superponíveis</b>.","No exemplo do livro, aproximando as moléculas, X e Z se encaixam, mas W e Y não."]},
   {h:"Enantiômeros",items:["Também chamados de <b>antípodas ópticos</b>: estereoisômeros ópticos que formam <b>par objeto-imagem em espelho plano</b>.","O espelho é imaginário: as duas substâncias existem de forma independente.","Propriedades físicas e químicas <b>semelhantes</b>, <b>exceto</b> a rotação do plano de polarização: um desvia para a direita, o outro para a esquerda.","Como as mãos: a superposição é impossível. <b>Moléculas diferentes não são superponíveis.</b>"]},
   {h:"Quiralidade e carbono assimétrico",items:["Substâncias como A e B são <b>quirais</b> (do grego <i>kheíron</i>, mão). A propriedade é a <b>quiralidade</b>.","Para ser quiral, é indispensável que a substância seja <b>assimétrica</b>.","Na maioria dos casos, ela tem <b>carbono assimétrico</b>: carbono ligado a <b>quatro substituintes diferentes</b>, indicado por <b>asterisco (*)</b>. Também se chama <b>centro quiral</b>."]},
   {h:"Tome nota: C* iguais e diferentes",items:["Se os substituintes ligados aos carbonos assimétricos são <b>iguais</b>, os C* são <b>iguais</b>.","Se há substituintes <b>diferentes</b>, os C* são <b>diferentes</b>."]},
   {h:"Tome nota: C* em cadeias cíclicas",items:["<b>Não existe carbono assimétrico insaturado</b> (com dupla ou tripla).","Quando o C* faz parte de um ciclo, as duas ligações de fora do ciclo devem ir para substituintes diferentes.","As duas ligações do ciclo devem formar <b>\"caminhos\" diferentes</b>.","Exemplo: no <b>limoneno</b>, seguindo os dois caminhos do anel aparecem as sequências CH<sub>2</sub>, CH<sub>2</sub> e CH<sub>2</sub>, CH: caminhos diferentes, então o carbono é assimétrico."]}
  ],
  tables:[{head:["Carbono","Ligantes","É C*?"],rows:[["C de CHBrClF","Cl, Br, H, F","sim: quatro diferentes"],["C2 do butan-2-ol","OH, H, CH<sub>3</sub>, CH<sub>2</sub>CH<sub>3</sub>","sim"],["C2 do propan-2-ol","OH, H, CH<sub>3</sub>, CH<sub>3</sub>","não: dois CH<sub>3</sub>"],["C da dupla do propeno","H, CH<sub>3</sub>, =CH<sub>2</sub>","não: carbono insaturado"]]}],
  trap:["Conte os quatro ligantes inteiros, não só o primeiro átomo: CH<sub>3</sub> e CH<sub>2</sub>CH<sub>3</sub> são diferentes, mesmo começando os dois com C.","Carbono de dupla ou tripla nunca é assimétrico."],
  check:[{q:"O que é carbono assimétrico?",a:"Carbono ligado a quatro substituintes diferentes (C*)."},{q:"Enantiômeros diferem em quê?",a:"No sentido do desvio da luz polarizada (um para a direita, outro para a esquerda)."},{q:"De onde vem a palavra quiral?",a:"Do grego kheíron, mão."}]},

 {id:"s5",label:"Alguns termos importantes: diastereoisômeros, mistura racêmica e centro estereogênico",kicker:"Capítulo 3 · págs. 26 e 27",title:"Alguns termos importantes: diastereoisômeros, mistura racêmica ou racemato e centro estereogênico",
  hook:"Misture meio a meio a \"mão direita\" e a \"mão esquerda\" de uma molécula e a luz não gira mais. Por quê? Uma desfaz o efeito da outra.",
  sobre:"Diastereoisômeros, mistura racêmica (racemato) e centro estereogênico, mais o primeiro bloco de \"Agora é com você\".",
  ideia:"Diastereoisômeros são estereoisômeros que não são imagem no espelho um do outro. Mistura racêmica é meio a meio de dois enantiômeros: os desvios se anulam e a mistura fica inativa (compensação externa).",
  analogia:"Racemato é um cabo de guerra empatado: um enantiômero puxa a luz para a direita, o outro puxa com a mesma força para a esquerda. A corda não sai do lugar.",
  blocks:[
   {h:"Diastereoisômeros",items:["São estereoisômeros (<b>geométricos ou ópticos</b>) que <b>não constituem par objeto-imagem</b> em espelho plano.","Exemplo óptico do livro: X e Y (2,3-dibromopentano com configurações diferentes).","Exemplo geométrico: W (ácido maleico, <i>cis</i>) e F (ácido fumárico, <i>trans</i>)."]},
   {h:"Mistura racêmica ou racemato",items:["Mistura <b>equimolecular</b> de enantiômeros: quantidades iguais de levogira e dextrogira.","Como os enantiômeros desviam a luz em sentidos exatamente opostos, a mistura <b>não tem atividade óptica</b>: é <b>opticamente inativa</b>.","É tratada como se fosse um isômero inativo.","O racemato é inativo por <b>compensação externa</b>."]},
   {h:"Centro estereogênico",items:["A condição para atividade óptica é a molécula ser <b>assimétrica</b>.","Por isso, a maioria das substâncias com carbono assimétrico é opticamente ativa.","Há substâncias <b>sem</b> carbono assimétrico que são ativas simplesmente por serem assimétricas.","O <b>nitrogênio</b> ou o <b>fósforo</b> também podem ser centros estereogênicos."]}
  ],
  tables:[{head:["Termo","É par objeto-imagem?","Atividade óptica"],rows:[["Enantiômeros","sim","cada um ativo, em sentidos opostos"],["Diastereoisômeros","não","podem ser ativos; propriedades físicas e químicas diferentes"],["Mistura racêmica","mistura de um par","inativa (compensação externa)"]]}],
  trap:["Mistura racêmica não é uma substância nova: é uma mistura 50% + 50% de dois enantiômeros.","Diastereoisômero pode ser geométrico também (maleico × fumárico)."],
  check:[{q:"O que é uma mistura racêmica?",a:"Mistura equimolecular de enantiômeros, opticamente inativa."},{q:"Ácido maleico e fumárico são o quê?",a:"Diastereoisômeros geométricos."},{q:"Que átomos, além do carbono, podem ser centros estereogênicos?",a:"Nitrogênio ou fósforo."}]},

 {id:"s6",label:"Fórmulas estruturais (perspectiva e Fischer)",kicker:"Capítulo 3 · pág. 28",title:"Fórmulas estruturais: fórmulas em perspectiva e projeções de Fischer",
  hook:"Molécula é 3D, papel é 2D. Para desenhar \"mão direita\" e \"mão esquerda\" no caderno, os químicos usam dois códigos de desenho. Aprenda a ler os dois.",
  sobre:"Como se lê uma fórmula em perspectiva (linha, cunha cheia, cunha tracejada) e uma projeção de Fischer (cruz).",
  ideia:"Na perspectiva, a cunha cheia vem na sua direção e a tracejada vai para trás. Na projeção de Fischer, os braços horizontais da cruz vêm na sua direção e os verticais vão para trás.",
  analogia:"Fischer é como alguém abrindo os braços para te abraçar: os braços (horizontal) vêm para a frente, a cabeça e os pés (vertical) ficam para trás.",
  blocks:[
   {h:"Fórmulas em perspectiva",items:["<b>Linha</b> (—): ligações no plano do papel.","<b>Cunha cheia</b>: ligação que sai do plano e se <b>aproxima do leitor</b>.","<b>Cunha tracejada</b>: ligação atrás do plano, que se <b>afasta do leitor</b>."]},
   {h:"Projeções de Fischer",items:["Não são fórmulas: são <b>projeções</b>.","O carbono assimétrico fica na <b>interseção de duas linhas</b> em ângulo reto.","<b>Linha horizontal</b>: valências à frente do papel (aproximam-se do leitor).","<b>Linha vertical</b>: valências atrás do papel (afastam-se do leitor).","Por convenção, o carbono 1 fica no topo da linha vertical (não é obrigatório).","Exemplo do livro: projeções de enantiômeros do 3-clorobutan-2-ol."]}
  ],
  fischer:[{t:"b",l:"a",r:"c",b:"d",cap:"Projeção de Fischer: a e c vêm para a frente; b e d vão para trás"}],
  tables:[{head:["Desenho","Significado"],rows:[["Linha","no plano do papel"],["Cunha cheia","aproxima-se do leitor"],["Cunha tracejada","afasta-se do leitor"],["Fischer: horizontal","aproxima-se do leitor"],["Fischer: vertical","afasta-se do leitor"]]}],
  trap:["Na projeção de Fischer, a cruz não é \"plana\": horizontal vem para a frente e vertical vai para trás. Não gire a projeção no papel como se fosse um desenho comum."],
  check:[{q:"Na projeção de Fischer, a linha horizontal representa o quê?",a:"Ligações que se aproximam do leitor."},{q:"E a cunha tracejada na perspectiva?",a:"Ligação que se afasta do leitor."}]},

 {id:"s7",label:"Classificação de isômeros ópticos (projeções de Fischer e perspectiva)",kicker:"Capítulo 3 · págs. 28 a 30",title:"Classificação de isômeros ópticos a partir das projeções de Fischer e das fórmulas em perspectiva",
  hook:"Existe um jeito de comparar duas moléculas sem montar maquete: contar quantas trocas de lugar transformam uma na outra. Ímpar ou par? A resposta diz se são enantiômeros.",
  sobre:"A regra das permutas: os cinco casos do livro com um e com dois carbonos assimétricos, e como usá-la em fórmulas em perspectiva.",
  ideia:"Trocar dois ligantes de lugar num C* inverte esse carbono. Número ímpar de trocas: virou o \"espelho\" (enantiômero). Número par: voltou a ser o mesmo.",
  analogia:"É como um interruptor: cada troca liga ou desliga. Uma troca, mudou. Duas trocas, voltou ao começo. Três trocas, mudou de novo.",
  blocks:[
   {h:"A regra (projeções de Fischer)",items:["Número <b>ímpar</b> de permutas num C*: forma-se o outro C*, e os dois são <b>enantiômeros</b>.","Número <b>par</b> de permutas: <b>não</b> são enantiômeros (é o mesmo composto).","Lembre: na projeção de Fischer a horizontal vem para o leitor e a vertical vai para trás."]},
   {h:"Um carbono assimétrico (casos do livro)",items:["<b>1 permuta</b> (w ↔ y): enantiômeros. Mesma magnitude, sentidos opostos; a mistura equimolecular é racêmica e inativa; não são superponíveis.","<b>2 permutas</b> (w ↔ y e x ↔ z): não são enantiômeros; é o <b>mesmo composto</b>, superponível.","<b>3 permutas</b>: ímpar de novo, então enantiômeros."]},
   {h:"Dois carbonos assimétricos",items:["Analise <b>cada C* separadamente</b>.","Uma permuta <b>em cada</b> C*: os dois carbonos se invertem e as moléculas são <b>enantiômeros</b> (mistura equimolecular racêmica, inativa).","Uma permuta <b>em só um</b> C*: o outro não muda, então não se neutralizam totalmente. São <b>diastereoisômeros</b> (diastereômeros).","A mistura equimolecular de diastereoisômeros <b>não é racêmica</b>: é opticamente ativa. Eles têm propriedades físicas e químicas diferentes."]},
   {h:"Fórmulas em perspectiva",items:["A regra das permutas vale, com uma restrição: as duas moléculas precisam ter o <b>mesmo desenho de valências</b>.","Exemplo do livro, 3-bromobutan-2-ol: <b>I e II</b> são enantiômeros (uma permuta em cada C*); <b>I e III</b> são diastereoisômeros (só o C3, ligado ao Br, mudou); <b>I e IV</b> são idênticos (duas mudanças em cada C*)."]}
  ],
  tables:[{head:["Situação","Permutas","Resultado"],rows:[["1 C*","ímpar (1 ou 3)","enantiômeros"],["1 C*","par (2)","mesmo composto"],["2 C*","ímpar em cada C*","enantiômeros"],["2 C*","ímpar em só um C*","diastereoisômeros"],["2 C*","par em cada C*","mesmo composto"]]}],
  trap:["Com dois C*, não some as trocas das duas moléculas inteiras: conte separado em cada carbono.","A regra das permutas não vale para comparar duas moléculas de composto meso (o livro avisa na pág. 30)."],
  check:[{q:"Uma permuta num C* gera o quê?",a:"O enantiômero (o outro C*)."},{q:"Duas permutas no mesmo C*?",a:"O mesmo composto."},{q:"Dois C*, permuta em só um deles?",a:"Diastereoisômeros."}]},

 {id:"s8",label:"Composto meso",kicker:"Capítulo 3 · pág. 30",title:"Composto meso",
  hook:"Uma molécula pode ter dois carbonos assimétricos e mesmo assim não girar a luz. O segredo é um \"espelho\" escondido dentro dela.",
  sobre:"O que é composto meso, por que ele é inativo por compensação interna e o exercício resolvido do 2,3-dibromobutano.",
  ideia:"Composto meso tem dois (ou um número par de) carbonos assimétricos iguais arrumados como imagem um do outro. Um plano de simetria corta a molécula ao meio, e as atividades das duas metades se anulam lá dentro: compensação interna.",
  analogia:"É uma borboleta: as duas asas são imagem uma da outra, mas a borboleta inteira é simétrica. Por isso, a imagem do meso no espelho é ele mesmo.",
  blocks:[
   {h:"A ideia",items:["A condição indispensável para atividade óptica é a molécula ser <b>assimétrica</b>.","Às vezes há moléculas <b>simétricas</b> com carbonos assimétricos.","Isso só é possível com número <b>par</b> de carbonos assimétricos <b>iguais</b>."]},
   {h:"Plano de simetria",items:["Os dois C* têm os mesmos substituintes (x, y, z e o grupo Cxyz).","Como formam par objeto-imagem dentro da própria molécula, as atividades ópticas se <b>anulam</b>.","O plano de polarização não é afetado: composto <b>opticamente inativo</b>.","Nome: <b>meso</b>, do grego <i>mésos</i>, meio. Inativo por <b>compensação interna</b>."]},
   {h:"Exercício resolvido (2,3-dibromobutano)",items:["<b>I e II</b>: mesmo composto. I é meso, e II também (gire II em 180° e ele se sobrepõe a I). Em compostos meso, a regra das permutas não vale.","<b>II e III</b>: diastereoisômeros (comparando meso com não meso, só houve uma permuta no C3).","<b>III e IV</b>: enantiômeros (permuta no C2 e no C3).","Mistura equimolecular de III e IV: racêmica, inativa por <b>compensação externa</b>."]}
  ],
  tables:[{head:["","Composto meso","Mistura racêmica"],rows:[["O que é","uma substância só","mistura 50% + 50% de dois enantiômeros"],["Por que é inativo","as metades da molécula se anulam","as moléculas diferentes se anulam"],["Tipo de compensação","interna","externa"]]}],
  trap:["Meso: compensação INTERNA (dentro da molécula). Racêmica: compensação EXTERNA (entre moléculas diferentes)."],
  check:[{q:"Por que o composto meso é inativo?",a:"Tem plano de simetria: as duas metades se anulam (compensação interna)."},{q:"Qual é a imagem no espelho de um composto meso?",a:"Ele mesmo."}]},

 {id:"s9",label:"Nomenclatura de isômeros ópticos e sistema (R)-(S)",kicker:"Capítulo 3 · pág. 31",title:"Nomenclatura de isômeros ópticos · Sistema de nomenclatura absoluta (R)-(S)",
  hook:"Dois sistemas de nome e um sinal de luz. A maior pegadinha do capítulo: nenhum deles tem relação com o outro. Saber isso já vale pontos na prova.",
  sobre:"Os sistemas (R)-(S) e D-L, os sinais (+) e (–), os exemplos do gliceraldeído e como se decide R ou S.",
  ideia:"(R)/(S) descreve a forma da molécula; (+)/(–) descreve para onde ela gira a luz (só o polarímetro diz). Um não prevê o outro.",
  analogia:"Pense num volante: com a prioridade 4 escondida atrás, siga 1 → 2 → 3. Virou para a direita (horário)? R, de rectus. Para a esquerda (anti-horário)? S, de sinister.",
  blocks:[
   {h:"Dois sistemas",items:["Sistema <b>(R)-(S)</b> e sistema <b>D-L</b> (obsoleto).","Eles <b>não se relacionam</b>: ser (R) não implica ser D ou L.","Também <b>não há relação</b> entre o nome e o desvio da luz: existem isômeros (R) dextrorrotatórios e (S) levorrotatórios, e vice-versa.","Caráter óptico: <b>(+)</b> dextrorrotatório, <b>(–)</b> levorrotatório. Em textos antigos: <b>d</b> e <b>ℓ</b> minúsculos."]},
   {h:"Exemplos do livro",items:["I: D-(+)-gliceraldeído. II: D-(–)-gliceraldeído. Os dois são D, mas I é dextrogiro e II levogiro.","I e II também podem ser chamados de D-(d)-gliceraldeído e D-(ℓ)-gliceraldeído.","III (D/S) e IV (D/R): um composto D pode ser (S) ou (R)."]},
   {h:"Sistema (R)-(S)",items:["É <b>absoluto</b>: o nome depende só da configuração espacial da própria molécula, sem comparar com outra.","Usa as <b>prioridades de Cahn-Ingold-Prelog</b>.","<b>R</b> vem do latim <i>rectus</i> (reto, correto, direito); <b>S</b> de <i>sinister</i> (sinistro, canhoto, esquerdo).","Associar (R) a dextrogiro e (S) a levogiro é um <b>equívoco</b>: o caráter óptico só se descobre com o polarímetro."]},
   {h:"Como decidir",items:["<b>(R)</b>: a sequência 1 → 2 → 3 gira no sentido <b>horário</b> (para a direita, em relação ao leitor).","<b>(S)</b>: sentido <b>anti-horário</b> (para a esquerda).","A prioridade <b>4 é descartada</b>."]}
  ],

 {id:"s10",label:"Nomenclatura (R)-(S) em perspectiva e em projeções de Fischer",kicker:"Capítulo 3 · págs. 32 a 35",title:"Nomenclatura (R)-(S) em fórmulas tridimensionais (em perspectiva) e em projeções de Fischer",
  hook:"A receita é sempre a mesma: esconder o grupo de menor prioridade e olhar para onde giram os outros três. Depois, pratique na Roda R ou S.",
  sobre:"O passo a passo do livro para dar R ou S em fórmulas 3D e em projeções de Fischer, com os exercícios resolvidos.",
  ideia:"Em 3D: olhe a molécula com a prioridade 4 apontando para longe de você. Em Fischer: leve a prioridade 4 para baixo da linha vertical (com duas trocas, para não mudar a configuração) e leia 1 → 2 → 3.",
  analogia:"Em Fischer, a regra das duas trocas é como trocar dois pares de meias de gaveta: no fim, a cômoda continua com as mesmas meias, só que arrumadas do jeito que você precisa para ler.",
  blocks:[
   {h:"Em fórmulas tridimensionais (perspectiva)",items:["Posicione-se mentalmente de modo que o substituinte de <b>prioridade 4</b> fique o <b>mais afastado</b> de você.","O carbono assimétrico deve <b>tapar</b> o substituinte 4.","Trace o arco <b>1 → 2 → 3</b>: horário = <b>(R)</b>; anti-horário = <b>(S)</b>.","Exercício resolvido: A é (R) e B é (S). A e B são <b>enantiômeros</b>: com um C*, se um for (R), o outro será (S)."]},
   {h:"Em projeções de Fischer",items:["Horizontal: aproxima-se do leitor. Vertical: afasta-se.","A prioridade 4 deve ficar na <b>extremidade inferior da linha vertical</b>.","<b>Se já estiver lá</b>: faça o arco 1 → 2 → 3. Horário = (R); anti-horário = (S).","<b>Se não estiver</b>: 1ª permuta para pôr o 4 embaixo; 2ª permuta para não alterar a configuração (número par de permutas não muda o C*). De preferência, a prioridade 1 vai para o topo.","A imagem de um composto meso é o próprio meso."]},
   {h:"Exercícios resolvidos (págs. 34 e 35)",items:["Projeções X e Y: as duas são <b>(R)</b>, então são o mesmo composto.","(+)-ácido láctico (+3,3°) é <b>(S)</b>; resposta <b>c</b>. O (–)-ácido láctico (–3,3°) é (R).","2,3-dibromobutano: I (S,R) e II (R,S) são o mesmo composto meso; III (S,S) e IV (R,R) são enantiômeros; II e III são diastereoisômeros. Resposta <b>c</b>."]}
  ],
  fischer:[{t:"(1)",l:"(3)",r:"(2)",b:"(4)",cap:"4 embaixo e 1 → 2 → 3 no sentido horário: (R)"},{t:"(1)",l:"(2)",r:"(3)",b:"(4)",cap:"4 embaixo e 1 → 2 → 3 no sentido anti-horário: (S)"}],
  tables:[{head:["Projeção (livro)","Passos","Configuração"],rows:[["X","4 ↔ 2 (4 desce); depois 1 ↔ 3 (1 sobe)","(R)"],["Y","4 ↔ 1; depois 2 ↔ 3","(R)"],["(+)-ácido láctico","H ↔ OH; depois HOOC ↔ CH<sub>3</sub>","(S)"],["(–)-ácido láctico","H ↔ OH; depois OH ↔ CH<sub>3</sub>","(R)"]]}],

 {id:"s11",label:"Saiba mais: Sistema de nomenclatura relativa D-L",kicker:"Capítulo 3 · pág. 36",title:"Saiba mais: Sistema de nomenclatura relativa D-L",
  hook:"Em 1906, cientistas precisaram adivinhar qual forma de uma molécula girava a luz para a direita. Chutaram. Só em 1951 alguém conseguiu conferir: eles tinham acertado, por pura sorte.",
  sobre:"Como nasceu o sistema D-L, o \"chute\" de 1906, a confirmação de 1951 e as coincidências que geram confusão até hoje.",
  ideia:"D-L é um sistema relativo: tudo é comparado com o gliceraldeído. D = OH à direita do C* na projeção de Fischer; L = OH à esquerda. Ser D não diz se o composto é dextrogiro.",
  analogia:"É como chamar alguém de \"parecido com o primo\": diz quem é a referência, não diz o que a pessoa faz. Ser D só diz \"parecido com o D-gliceraldeído\".",
  blocks:[
   {h:"O sistema",items:["Ainda aparece em livros de Bioquímica, mas é <b>obsoleto</b>.","É <b>relativo</b>: a configuração é definida comparando com moléculas-padrão escolhidas arbitrariamente.","Em <b>1906</b>, escolheram as moléculas quirais do <b>gliceraldeído</b> como referência.","<b>D</b>: hidroxila à <b>direita</b> do C* na projeção de Fischer. <b>L</b>: hidroxila à <b>esquerda</b>."]},
   {h:"O \"chute\" de 1906",items:["Os cientistas não sabiam qual das duas era dextrogira e qual era levogira.","Escolheram arbitrariamente: D seria a dextrogira (d) e L a levogira (ℓ). Chance de erro: <b>50%</b>.","Em <b>1951</b>, <b>Bijvoet</b>, usando <b>difração de raios X</b>, mostrou que eles <b>acertaram por acaso</b>.","Hoje: D-gliceraldeído é dextrogiro <b>(+)</b> e L-gliceraldeído é levogiro <b>(–)</b>."]},
   {h:"Mais uma coincidência",items:["O D-gliceraldeído também tem configuração absoluta <b>(R)</b>; o L é <b>(S)</b>.","Nomes completos: <b>(R)-(D)-(+)-gliceraldeído</b> e <b>(S)-(L)-(–)-gliceraldeído</b>.","Essas coincidências explicam tantos equívocos ao nomear isômeros ópticos."]},
   {h:"Configuração relativa (exemplo)",items:["O ácido glicérico tem configuração relativa ao gliceraldeído.","Do (D)-(+)-gliceraldeído vem o <b>(D)-(–)-ácido glicérico</b>.","Ou seja: um composto D pode ser dextrogiro ou levogiro. O caráter óptico só pode ser determinado experimentalmente."]}
  ],
  tables:[{head:["Composto","D ou L","(R) ou (S)","Desvio da luz"],rows:[["Gliceraldeído (OH à direita)","D","(R)","(+)"],["Gliceraldeído (OH à esquerda)","L","(S)","(–)"],["Ácido glicérico (vindo do D-gliceraldeído)","D","—","(–)"]]}],
  trap:["Gliceraldeído: D, R e (+) coincidem. Isso é coincidência, não regra: o D-ácido glicérico é levogiro."],
  check:[{q:"Qual molécula é a referência do sistema D-L?",a:"O gliceraldeído."},{q:"Quem confirmou o chute, e como?",a:"Bijvoet, em 1951, com difração de raios X."},{q:"Todo composto D é dextrogiro?",a:"Não; o D-ácido glicérico é levogiro."}]},

 {id:"s12",label:"Fórmulas de van't Hoff",kicker:"Capítulo 3 · pág. 37",title:"Fórmulas de van't Hoff",
  hook:"Quantos isômeros ópticos uma molécula pode ter? Não precisa desenhar todos: basta contar os carbonos assimétricos e fazer uma potência de 2. Teste na Calculadora de van't Hoff.",
  sobre:"As duas fórmulas de van't Hoff, o exercício resolvido do 3-clorobutan-2-ol e o resumo \"Este capítulo abordou\".",
  ideia:"Com n carbonos assimétricos diferentes: 2<sup>n</sup> isômeros ópticos ativos e 2<sup>n</sup>/2 pares racêmicos (metade). As fórmulas não valem para compostos meso.",
  analogia:"Cada C* é um interruptor com duas posições (R ou S). Com 2 interruptores, há 2 × 2 = 4 combinações; com 3, 2 × 2 × 2 = 8. Cada combinação forma par com a sua \"oposta\", por isso os pares são a metade.",
  blocks:[
   {h:"As fórmulas",items:["Proposta pelo holandês <b>Jacobus Henricus van't Hoff</b> (1852-1911).","Na natureza, nem sempre o par levogiro de um dextrogiro existe; as fórmulas dão os isômeros <b>possíveis</b>.","<b>Isômeros ópticos ativos possíveis = 2<sup>n</sup></b>, em que n = número de C* <b>diferentes</b>.","<b>Pares racêmicos possíveis = 2<sup>n</sup>/2</b> (metade dos isômeros ativos).","<b>Não se aplicam a compostos meso.</b>"]},
   {h:"Exercício resolvido",items:["3-clorobutan-2-ol: CH<sub>3</sub>–C*H(Cl)–C*H(OH)–CH<sub>3</sub>, com <b>2 C* diferentes</b>.","Isômeros ativos: 2<sup>2</sup> = <b>4</b> (o livro escreve R-R, S-S, R'R' e S'S').","Pares racêmicos: 4/2 = <b>2</b>: [R-R + S-S] e [R'R' + S'S']."]},
   {h:"Este capítulo abordou",items:["Isômeros ópticos: estereoisômeros configuracionais opticamente ativos; compostos diferentes, não superponíveis.","Luz monocromática planopolarizada: ferramenta de identificação e classificação.","Polarímetro: equipamento que determina o comportamento óptico.","Dextrogira (direita, <i>dexter</i>) e sinistrogira/levogira (esquerda, <i>sinister</i>).","Diastereoisômeros: estereoisômeros que não são par objeto-imagem.","Mistura racêmica: mistura equimolecular de antípodas ópticos, sem atividade óptica.","Condição para atividade óptica: moléculas assimétricas.","(R)-(S): nomenclatura absoluta, depende só da configuração espacial."]}
  ],
  tables:[{head:["C* diferentes (n)","Isômeros ativos (2ⁿ)","Pares racêmicos (2ⁿ/2)"],rows:[["1","2","1"],["2","4","2"],["3","8","4"],["4","16","8"]]}],
  trap:["Só conta C* DIFERENTES. Se os C* forem iguais (caso do 2,3-dibromobutano), a fórmula não vale: há o meso.","Pares racêmicos são a metade dos isômeros ativos, não o dobro."],
  check:[{q:"Uma molécula tem 3 C* diferentes. Quantos isômeros ativos?",a:"2³ = 8."},{q:"E quantos pares racêmicos?",a:"8/2 = 4."},{q:"A fórmula vale para compostos meso?",a:"Não."}]}
];

   {h:"Regra de Markovnikov",items:["O <b>hidrogênio</b> do haleto entra preferencialmente no <b>carbono mais hidrogenado</b> da dupla.","Exemplo: propeno + HCl → <b>2-cloropropano</b>.","O halogênio fica no carbono do meio."]},
   {h:"Regra de Kharasch",items:["Vale para <b>HBr em presença de peróxido</b> (R–O–O–R).","O <b>hidrogênio</b> entra no <b>carbono menos hidrogenado</b>.","Exemplo: propeno + HBr (peróxido) → <b>1-bromopropano</b>.","O efeito do peróxido <b>não</b> acontece com os demais haletos de hidrogênio (HCl, HI)."]},
   {h:"Saiba mais: mecanismo do HBr ao propeno (sem peróxido)",items:["O alceno age como <b>base de Lewis</b> e provoca a <b>cisão heterolítica</b> da ligação H–Br.","Forma-se um <b>carbocátion</b>. O mais estável é formado preferencialmente.","Estabilidade: <b>terciário > secundário > primário</b>.","No propeno forma-se o carbocátion secundário, o Br<sup>–</sup> entra nele e sai o <b>2-bromopropano</b>."]},
   {h:"Saiba mais: mecanismo com peróxidos (radicais)",items:["Peróxidos R–O–O–R se quebram fácil: R–O–O–R → 2 R–O•.","R–O• + H–Br → R–OH + <b>Br•</b>.","O <b>Br•</b> ataca o propeno e forma o <b>radical secundário</b> (mais estável que o primário), com o Br no carbono 1.","Esse radical reage com HBr, forma o <b>1-bromopropano</b> e libera outro Br•, que ataca outra molécula: <b>reação em cadeia</b> por <b>radicais livres</b>.","Por isso o mecanismo de Kharasch é <b>radicalar</b>."]}

    dfb.className="fb "+(ok===N?"right":"wrong");dfb.innerHTML=ok===N?"<b>Perfeito!</b>":`<b>${ok} de ${N}.</b>Gabarito: ${c.MATCH.rows.map(([t,k])=>`${t} → ${c.MATCH.cols[k-1]}`).join("; ")}.`};
  const da=el("div","actions");da.appendChild(db);D.appendChild(da);D.appendChild(dfb);
  const E=sec("E. Complete as lacunas","Digite a palavra. Acento não conta.");E.appendChild(el("div","bank",c.BANK.map(w=>`<span>${w}</span>`).join("")));
  c.GAPS.forEach(([a,w,b],i)=>{const it=el("div","item gap");it.innerHTML=`<label for="${c.id}gp${i}">${i+1}. ${a} <input type="text" id="${c.id}gp${i}" autocomplete="off"> ${b}</label>`;E.appendChild(it)});
  const efb=el("div");const eb=el("button","btn","Corrigir");
  eb.onclick=()=>{let ok=0;c.GAPS.forEach(([a,w],i)=>{const x=$("#"+c.id+"gp"+i);const r=norm(x.value)===norm(w);x.className=r?"right":"wrong";if(r)ok++});sc.gp=ok;bar();
    efb.className="fb "+(ok===c.GAPS.length?"right":"wrong");efb.innerHTML=ok===c.GAPS.length?"<b>Todas certas!</b>":`<b>${ok} de ${c.GAPS.length}.</b>Gabarito: ${c.GAPS.map((g,i)=>`${i+1} ${g[1]}`).join(", ")}.`};
  const ea=el("div","actions");ea.appendChild(eb);E.appendChild(ea);E.appendChild(efb);
  const F=sec("F. Discursivas","Escreva com suas palavras. Depois abra a lista do que a resposta precisa ter e marque o que você incluiu.");
  c.DISC.forEach((q,i)=>{const it=el("div","item");it.appendChild(el("label","stem",`${i+1}. ${q.s}`)).setAttribute("for",c.id+"ds"+i);const t=el("textarea");t.id=c.id+"ds"+i;t.placeholder="Sua resposta…";it.appendChild(t);
    const b=el("button","btn ghost","Ver o que a resposta precisa ter");const ck=el("div","check");ck.hidden=true;q.k.forEach((k,j)=>ck.appendChild(el("label",null,`<input type="checkbox" id="${c.id}ds${i}k${j}"> <span>${k}</span>`)));
    ck.appendChild(el("span","legend","Marcou tudo? Resposta completa. Faltou algum item? Reescreva incluindo ele."));b.onclick=()=>{ck.hidden=false;b.remove()};it.appendChild(b);it.appendChild(ck);F.appendChild(it)});
  const G=sec("G. Gabarito das atividades do livro",c.livroLead);
  c.LIVRO.forEach(([t,a])=>{const it=el("div","item");it.appendChild(el("div","stem",t));const b=el("button","btn ghost","Ver resposta");b.onclick=()=>b.replaceWith(el("div","fb right",a));it.appendChild(b);G.appendChild(it)});
  m.appendChild(p);bar()}

/* ===== treinos do capítulo 3 ===== */
function fischerSvg(f,hiArc){const lab=(x,y,t,a)=>`<text x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="middle" class="mt">${esc(t)}</text>`;
  let arc="";if(hiArc){const ang={t:-90,r:0,b:90,l:180};const cw=hiArc[3];const R=50,cx=150,cy=85;let pts=[];
    let a=ang[hiArc[0]];const go2=t=>{let target=ang[t];if(cw){while(target<=a)target+=360}else{while(target>=a)target-=360}for(let x=a;cw?x<=target:x>=target;x+=cw?6:-6)pts.push(x);a=target};
    go2(hiArc[1]);go2(hiArc[2]);pts.push(a);const P=pts.map(d=>[cx+R*Math.cos(d*Math.PI/180),cy+R*Math.sin(d*Math.PI/180)]);
    const [ex,ey]=P[P.length-1],[px,py]=P[P.length-3];const ux=ex-px,uy=ey-py,L=Math.hypot(ux,uy)||1;const nx=ux/L,ny=uy/L;
    arc=`<polyline points="${P.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" ")}" class="marc" fill="none"/><polygon points="${ex+nx*8},${ey+ny*8} ${ex-ny*6},${ey+nx*6} ${ex+ny*6},${ey-nx*6}" class="marrow"/>`}
  return `<svg viewBox="-60 0 420 170" class="mol" role="img" aria-label="Projeção de Fischer: em cima ${f.t}, embaixo ${f.b}, à esquerda ${f.l}, à direita ${f.r}">
  <line x1="150" y1="40" x2="150" y2="130" class="mb"/><line x1="70" y1="85" x2="230" y2="85" class="mb"/>${arc}
  ${lab(150,24,f.t,"middle")}${lab(150,150,f.b,"middle")}${lab(62,85,f.l,"end")}${lab(238,85,f.r,"start")}</svg>`}
function solveFischer(p0){const p={...p0};const steps=[];const pos=k=>Object.keys(p).find(x=>p[x]===k);const sw=(a,b)=>{const t=p[a];p[a]=p[b];p[b]=t};
  const nm={t:"de cima",b:"de baixo",l:"da esquerda",r:"da direita"};
  if(p.b!==4){const a=pos(4);steps.push(`1ª troca: a prioridade 4 (${nm[a]}) troca com a de baixo (${p.b}). Agora o 4 está embaixo.`);sw(a,"b");
    if(p.t!==1){const a1=pos(1);steps.push(`2ª troca (para não mudar a configuração): a prioridade 1 (${nm[a1]}) troca com a de cima (${p.t}).`);sw(a1,"t")}
    else{steps.push(`2ª troca (para não mudar a configuração): troca a esquerda (${p.l}) com a direita (${p.r}).`);sw("l","r")}}
  else steps.push("A prioridade 4 já está embaixo: não precisa trocar nada.");
  const cyc=["t","r","l"];const i1=cyc.indexOf(pos(1));const cw=cyc[(i1+1)%3]===pos(2);
  steps.push(`Leitura: 1 (${nm[pos(1)]}) → 2 (${nm[pos(2)]}) → 3 (${nm[pos(3)]}): sentido ${cw?"horário":"anti-horário"}.`);
  return {ans:cw?"R":"S",steps,final:{...p},arc:[pos(1),pos(2),pos(3),cw]}}
function tHead(p,c,tr,lead){p.appendChild(el("div","chap-head",`<div class="num">Capítulo ${c.num} · prática guiada</div><h2>${tr.label}</h2><p>${lead}</p>`))}
function tLoop(m,c,tr,lead,draw){const p=el("div","panel");tHead(p,c,tr,lead);const box=el("div","ex");p.appendChild(box);m.appendChild(p);let i=0,ok=0;
  const next=()=>{box.innerHTML="";if(i>=tr.items.length){box.appendChild(el("h3",null,`Fim do treino: ${ok} de ${tr.items.length} certas de primeira`));const b=el("button","btn","Treinar de novo");b.onclick=()=>{i=0;ok=0;next()};box.appendChild(b);return}
    box.appendChild(el("p","legend",`${i+1} de ${tr.items.length} · ${tr.items[i].nome}`));
    draw(box,tr.items[i],(first)=>{if(first)ok++;const nb=el("button","btn",i+1<tr.items.length?"Próximo →":"Ver resultado");nb.onclick=()=>{i++;next()};const a=el("div","actions");a.appendChild(nb);box.appendChild(a)})};next()}
function tCstar(m,c,tr){tLoop(m,c,tr,"Olhe os quatro ligantes do carbono marcado. Se forem todos diferentes, ele é assimétrico (C*). Se repetir algum, ou se for carbono de dupla, não é.",(box,it,done)=>{
  const lg=it.lig.filter(Boolean);
  box.appendChild(el("div","ligs",`<span class="cc">C</span>${lg.map(x=>`<span class="lg">${esc(x)}</span>`).join("")}`));
  const q=el("div","item");q.appendChild(el("div","stem","Este carbono é assimétrico (C*)?"));const o=el("div","vf");
  [["Sim, é C*",true],["Não é",false]].forEach(([l,v])=>{const b=el("button","opt",l);b.onclick=()=>{o.querySelectorAll("button").forEach(x=>x.disabled=true);const r=v===it.ans;b.classList.add(r?"right":"wrong");
    q.appendChild(el("div","fb "+(r?"right":"wrong"),`<b>${r?"Isso!":"Ainda não."} ${it.ans?"É C*.":"Não é C*."}</b>${it.why}`));done(r)};o.appendChild(b)});q.appendChild(o);box.appendChild(q)})}
function tRS(m,c,tr){tLoop(m,c,tr,"Os números entre parênteses (ou os grupos) estão na projeção de Fischer. Decida R ou S. A explicação mostra as duas trocas do livro para levar a prioridade 4 para baixo.",(box,it,done)=>{
  const sol=solveFischer(it.p);const fig=el("div","trainfig",fischerSvg(it));box.appendChild(fig);
  const pr=`Prioridades: em cima ${it.p.t}, à esquerda ${it.p.l}, à direita ${it.p.r}, embaixo ${it.p.b}.`;box.appendChild(el("p","legend",pr));
  const q=el("div","item");q.appendChild(el("div","stem","Configuração (R) ou (S)?"));const o=el("div","vf");
  ["R","S"].forEach(x=>{const b=el("button","opt",`(${x}) ${x==="R"?"horário":"anti-horário"}`);b.onclick=()=>{o.querySelectorAll("button").forEach(y=>y.disabled=true);const r=x===sol.ans;b.classList.add(r?"right":"wrong");
    const f=sol.final;fig.innerHTML=fischerSvg({t:`(${f.t})`,b:`(${f.b})`,l:`(${f.l})`,r:`(${f.r})`},sol.arc);
    q.appendChild(el("div","fb "+(r?"right":"wrong"),`<b>${r?"Isso!":"Ainda não."} É (${sol.ans}).</b><ol class="steps">${sol.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`));done(r)};o.appendChild(b)});q.appendChild(o);box.appendChild(q)})}
function tVH(m,c,tr){tLoop(m,c,tr,"Conte os carbonos assimétricos diferentes (n) e use van't Hoff: 2ⁿ isômeros ativos e 2ⁿ/2 pares racêmicos. Atenção ao caso com C* iguais.",(box,it,done)=>{
  const q=el("div","item");const id=Math.random().toString(36).slice(2,7);
  q.innerHTML=`<div class="vhgrid"><label for="n${id}">Carbonos assimétricos</label><input type="text" inputmode="numeric" id="n${id}"><label for="a${id}">Isômeros ópticos ativos</label><input type="text" inputmode="numeric" id="a${id}"><label for="p${id}">Pares racêmicos</label><input type="text" inputmode="numeric" id="p${id}"></div>`;
  const b=el("button","btn","Conferir");const a=el("div","actions");a.appendChild(b);q.appendChild(a);box.appendChild(q);let tries=0;
  b.onclick=()=>{tries++;const N=$("#n"+id),A=$("#a"+id),P=$("#p"+id);const okN=+N.value===it.n,okA=+A.value===it.at,okP=+P.value===it.pr;
    N.className=okN?"right":"wrong";A.className=okA?"right":"wrong";P.className=okP?"right":"wrong";const all=okN&&okA&&okP;
    const old=q.querySelector(".fb");if(old)old.remove();q.appendChild(el("div","fb "+(all?"right":"wrong"),`<b>${all?"Isso!":"Confira de novo."} ${it.n} C*, ${it.at} isômeros ativos, ${it.pr} ${it.pr===1?"par racêmico":"pares racêmicos"}.</b>${it.why}`));
    if(all||tries>=2){b.disabled=true;done(all&&tries===1)}}})}

meter();trail();render();
