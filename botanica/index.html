<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Resumos de Botânica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: plataforma de estudo — trilha de capítulos à esquerda (como no SAS), uma estação por vez à direita; no celular a trilha vira faixa rolável no topo. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#E7EDE6; --line:#CFDACD;
  --ink:#16241C; --muted:#56685C;
  --leaf:#1E6A48; --leaf-soft:#D7EBDF; --pollen:#B98510; --pollen-soft:#F7EBCB;
  --ok:#1E7A45; --ok-soft:#D8F0E1; --bad:#B23A2E; --bad-soft:#F8DEDA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#15201A; --sunk:#1B2922; --line:#2C3D33;
  --ink:#E3ECE6; --muted:#9DB0A4;
  --leaf:#5FC795; --leaf-soft:#1C3A2B; --pollen:#E8B949; --pollen-soft:#3A3018;
  --ok:#6BD69A; --ok-soft:#173826; --bad:#F08C7E; --bad-soft:#3D1F1B; color-scheme:dark}}
:root[data-theme="__off__"]{
  --bg:#0E1612; --surface:#15201A; --sunk:#1B2922; --line:#2C3D33;
  --ink:#E3ECE6; --muted:#9DB0A4;
  --leaf:#5FC795; --leaf-soft:#1C3A2B; --pollen:#E8B949; --pollen-soft:#3A3018;
  --ok:#6BD69A; --ok-soft:#173826; --bad:#F08C7E; --bad-soft:#3D1F1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pollen);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.01em}
header.top h1 span{color:var(--leaf)}
.meter{min-width:0;flex:0 1 300px}
.meter .bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter .fill{height:100%;background:var(--leaf);width:0;transition:width .4s}
.meter small{color:var(--muted);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;padding-top:24px;align-items:start}
nav.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:4px}
nav.trail .grp{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 12px 4px}
.tbtn{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.3;font-weight:700}
.tbtn:hover{background:var(--sunk)}
.tbtn[aria-current="true"]{background:var(--leaf-soft)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.tbtn[aria-current="true"] .dot{border-color:var(--leaf)}
.tbtn.done .dot{background:var(--leaf);border-color:var(--leaf)}

main{min-width:0}
.panel{display:flex;flex-direction:column;gap:20px}
.chap-head .num{font-family:var(--display);color:var(--leaf);font-weight:800;font-size:1rem}
.chap-head h2{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:700;margin-top:2px}
.chap-head p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.big-idea{background:var(--leaf);color:var(--bg);border-radius:var(--r);padding:20px 22px}
.big-idea .eyebrow{color:inherit;opacity:.8}
.big-idea p{margin:6px 0 0;font-size:1.15rem;font-weight:700;line-height:1.45}
.analogy{font-style:italic;color:var(--muted);margin:0;max-width:62ch}
.flag{background:var(--pollen-soft);border:1px solid var(--pollen);border-radius:10px;padding:10px 14px;font-size:.92rem}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.block h3{font-size:1.08rem;margin-bottom:8px}
.block ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.block b{color:var(--leaf)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
.explain{background:var(--sunk);border-radius:var(--r);padding:14px 18px;margin-top:-8px}
.explain h4{font-family:var(--display);font-size:.95rem;margin:0 0 8px;color:var(--leaf)}
.explain dl{margin:0;display:flex;flex-direction:column;gap:8px}
.explain dt{font-weight:700;display:inline}
.explain dd{margin:0;display:inline}
.trap{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--pollen);border-radius:var(--r);padding:14px 18px}
.trap .tag{flex:none;font-family:var(--display);font-weight:800;color:var(--pollen);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.trap p{margin:0}
.quick h3{font-size:1.1rem;margin-bottom:10px}
.qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.flip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:110px}
.flip .q{font-weight:700}
.flip .a{color:var(--leaf);font-weight:700}
.flip .hint{font-size:.82rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:0;border-radius:99px;padding:10px 20px;font-weight:700;background:var(--leaf);color:var(--bg)}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.08)}

.factory{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.station{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.station:hover{border-color:var(--leaf)}
.station .role{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--leaf)}
.station .org{font-weight:700}
.station .what{color:var(--muted);font-size:.92rem}
.links{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.links ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;counter-reset:s}
.howto div{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.howto div b{display:block;font-family:var(--display);color:var(--leaf)}

/* exercícios */
.score{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip b{color:var(--leaf)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ex > h3{font-size:1.2rem}
.ex > p.lead{margin:-6px 0 0;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.stem{font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 14px;font-size:.95rem}
.fb.right{background:var(--ok-soft)} .fb.wrong{background:var(--bad-soft)}
.fb b{display:block}
.vf{display:flex;gap:8px}
.vf .opt{min-width:56px;text-align:center;font-weight:700}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
select.right,input.right{border-color:var(--ok);background:var(--ok-soft)}
select.wrong,input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank span{background:var(--pollen-soft);border-radius:6px;padding:3px 10px;font-weight:700;font-size:.92rem}
.gap input{width:11em}
textarea{width:100%;min-height:110px;resize:vertical}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;accent-color:var(--leaf)}
.legend{font-size:.85rem;color:var(--muted)}
footer.note{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.trail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;margin-inline:-16px;padding-inline:16px}
  nav.trail .grp{display:none}
  .tbtn{flex:none;max-width:220px;border:1px solid var(--line);background:var(--surface)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CH = [
 {n:5,title:"Morfologia e anatomia da raiz",station:"Captação",

  blocks:[
   {h:"Meristemas (os tecidos que crescem)",items:["Células que vivem se dividindo.","<b>Apical</b>: alonga a planta (crescimento primário).","<b>Lateral</b>: engrossa (crescimento secundário). São o <b>câmbio vascular</b> e o <b>felogênio</b>."]},
   {h:"Três sistemas de tecidos",items:["<b>Revestimento</b>: epiderme.","<b>Vascular</b>: xilema e floema.","<b>Fundamental</b>: parênquima e tecidos de sustentação."]},

 {n:6,title:"Morfologia e anatomia do caule",station:"Coluna e estrada",
  sobre:"As funções do caule, suas partes por fora, os três sistemas de tecidos que o formam e os tipos de caule conforme o ambiente. Conferido com o livro do SAS (págs. 64 a 77).",
  ideia:"O caule sustenta a planta e liga raiz e folhas pelos vasos condutores. E tem uma marca registrada: gemas.",
  analogia:"O livro abre com a banana: a cultivada não tem semente. O produtor corta um pedaço do caule subterrâneo (o rizoma) e planta em outro lugar. Nasce uma bananeira geneticamente igual. Isso é propagação vegetativa, um tipo de reprodução assexuada.",
  blocks:[
   {h:"Funções do caule",items:["<b>Sustenta</b> ramos, folhas, flores, frutos e sementes.","<b>Conduz</b>: liga raiz e folhas pelos vasos condutores.","Caule novo é verde e faz <b>fotossíntese</b>, mas essa não é a função principal: ao envelhecer ele fica pardo.","<b>Propagação vegetativa</b>: gemas em contato com o solo enraízam e formam nova planta (morangueiro).","<b>Armazena</b> substâncias no parênquima (cana-de-açúcar).","Caule + folhas = <b>sistema caulinar</b>."]},
   {h:"Morfologia externa",items:["O que identifica um caule são as <b>gemas</b>, que fazem a planta crescer.","<b>Gema apical</b> (terminal): meristema primário, faz o caule crescer em comprimento. Dela saem os <b>primórdios foliares</b>, que viram folhas.","<b>Gemas laterais</b> (axilares): ficam na axila das folhas, no nó, e originam os ramos laterais.","<b>Nó</b>: onde a folha se prende ao caule. <b>Entrenó</b> (internó): trecho entre dois nós."]},
   {h:"Sistema de revestimento",items:["<b>Epiderme</b>: reveste a planta jovem.","<b>Periderme</b>: substitui a epiderme quando há crescimento secundário (gimnospermas e maioria das eudicotiledôneas).","Periderme = <b>felogênio</b> (meristema secundário) + <b>feloderme</b> (para dentro) + <b>súber</b> (para fora).","<b>Súber</b> = cortiça: células mortas com lipídios na parede, impermeável e isolante térmico por causa do ar.","A periderme velha descama, como no tronco da goiabeira."]},
   {h:"Sistema fundamental",items:["<b>Parênquima</b>, o principal, em três tipos:","de <b>preenchimento</b>: ocupa espaços e regenera lesões;","<b>fotossintético</b> (clorofiliano): cheio de cloroplastos;","de <b>armazenamento</b>: guarda amido, água ou ar.","<b>Colênquima</b> e <b>esclerênquima</b> dão sustentação. A diferença está na tabela abaixo."]},
   {h:"Sistema vascular: xilema",items:["Vasos primários vêm do <b>procâmbio</b>; secundários vêm do <b>câmbio vascular</b>.","Monocotiledônea: feixes espalhados. Eudicotiledônea: feixes em anel.","<b>Xilema</b> (lenho): leva a seiva bruta (mineral) da raiz às folhas; também sustenta e armazena.","<b>Traqueídes</b>: longas e estreitas, menos especializadas (pteridófitas e gimnospermas).","<b>Elementos de vaso</b>: mais largos, com placas perfuradas; principais condutores das angiospermas.","As duas têm parede reforçada por <b>lignina</b>."]},
   {h:"Sistema vascular: floema",items:["<b>Floema</b> (líber): leva a seiva elaborada (orgânica), produzida nas folhas.","<b>Elementos de tubo crivado</b>: células vivas, sem núcleo, ligadas por placas com crivos.","Sem núcleo, eles dependem das <b>células companheiras</b> (com núcleo), que mandam proteínas e ATP."]}
  ],
  tables:[
   {head:["","Colênquima","Esclerênquima"],rows:[

    ["Onde fica","estruturas jovens, periferia do caule e folhas; raro em raízes","todos os órgãos, partes velhas, vasos, frutos secos e sementes"],["Formato","células alongadas em feixes","fibras (longas) e esclereídes"]]},
   {head:["Grupo","Tipo","Como é","Exemplos"],rows:[

    ["Aéreo","Rastejante","cresce paralelo ao solo; gemas enraízam e formam novas plantas","morangueiro, grama de jardim"],

    ["Subterrâneo","Rizoma","cresce na horizontal sob o solo e emite folhas e ramos","bananeira, samambaia, íris, espada-de-são-jorge"],

    ["Clima seco","Cladódio","verde (faz fotossíntese), com parênquima aquífero que guarda água","cactos, palma"]]}
  ],
  trap:["Batata-inglesa é caule (tubérculo) porque tem gemas, os \"olhinhos\". Batata-doce é raiz. Para diferenciar sem cortar: procure gemas e nós. Raiz não tem.","Colênquima: C de Celulose e de Células vivas. Esclerênquima: \"esclero\" = duro, com lignina e células mortas.","A periderme NÃO vem da epiderme. Ela vem do felogênio, um meristema secundário."],
  check:[{q:"Onde ficam as gemas laterais?",a:"Nas axilas das folhas, na região do nó."},{q:"Qual tecido tem células vivas, parede de celulose e é flexível?",a:"O colênquima."},{q:"Quem mantém vivo o elemento de tubo crivado, que não tem núcleo?",a:"As células companheiras."},{q:"Em que tecido o cacto guarda água?",a:"No parênquima aquífero do cladódio."}]},

 {n:7,title:"Morfologia e anatomia da folha",station:"Cozinha",
  sobre:"A organização interna da folha, os estômatos, as funções da folha, os tipos de folha e as folhas modificadas.",
  ideia:"A folha é a cozinha da planta: faz fotossíntese, troca gases e perde água por transpiração.",

  blocks:[

 {n:8,title:"Morfologia e anatomia da flor",station:"Reprodução",
  sobre:"As peças da flor, os tipos de flor, as inflorescências e a polinização.",
  ideia:"A flor é o órgão de reprodução das angiospermas. É um ramo com folhas modificadas.",
  analogia:"A flor é a vitrine com propaganda: cor, cheiro e néctar existem para chamar o \"entregador\" de pólen.",
  blocks:[
   {h:"Quatro verticilos, de fora para dentro",items:["<b>Sépalas</b> (cálice): protegem.","<b>Pétalas</b> (corola): atraem.","<b>Estames</b> (androceu): parte masculina.","<b>Carpelos</b> (gineceu): parte feminina.","Cálice + corola = <b>perianto</b> (peças inférteis)."]},
   {h:"As peças férteis",items:["<b>Estame</b> = filete + antera (produz o pólen).","<b>Carpelo</b> = estigma (recebe o pólen) + estilete (tubo) + ovário (guarda os óvulos).","Suporte: <b>pedúnculo</b> (cabo) e <b>receptáculo</b> (base)."]},
   {h:"Tipos de flor",items:["<b>Completa</b>: tem as quatro peças. <b>Incompleta</b>: falta alguma.","<b>Monoclina</b>: masculino e feminino na mesma flor (roseira).","<b>Diclina</b>: só um dos dois (abobrinha).","Planta <b>dioica</b>: indivíduos só machos ou só fêmeas (mamoeiro).","Simetria <b>radial</b> (rosa) ou <b>bilateral</b> (orquídea).","<b>Inflorescência</b>: várias flores num pedúnculo (cacho, espiga, umbela)."]},
   {h:"Polinização",items:["Transporte do pólen da antera ao estigma.","<b>Autopolinização</b>: diminui a variabilidade genética.","<b>Cruzada</b>: aumenta a variabilidade.","<b>Dicogamia</b> (amadurecem em épocas diferentes) e <b>autoincompatibilidade</b> evitam a autofecundação."]}
  ],
  table:{head:["Polinizador","Nome","Como é a flor"],rows:[
   ["Insetos","entomofilia","pétalas chamativas, cores vivas"],["Aves","ornitofilia","muito néctar, vermelha ou amarela"],
   ["Morcegos","quiropterofilia","muito néctar, pouco colorida, abre à noite"],["Vento","anemofilia","pequena, sem cor, sem néctar nem aroma"]]},
  trap:"Polinização não é fecundação. Polinizar é entregar o pólen. Fecundar é o encontro dos gametas, que vem depois.",
  check:[{q:"Qual parte do carpelo recebe o pólen?",a:"O estigma."},{q:"Flor vermelha, com muito néctar: qual polinizador?",a:"Aves (ornitofilia)."},{q:"Mamoeiro é monoico ou dioico?",a:"Dioico: há pés machos e pés fêmeas."}]},

 {n:9,title:"Morfologia e anatomia do fruto e da semente",station:"Embalagem e envio",
  sobre:"As partes da semente, a germinação, a formação e a classificação dos frutos, os pseudofrutos e a dispersão de sementes.",
  ideia:"Depois da fecundação, o óvulo vira semente e o ovário vira fruto.",
  analogia:"A semente é o bebê com a marmita. O fruto é a embalagem que ajuda a espalhar o bebê por aí.",
  blocks:[
   {h:"Semente",items:["Três partes: <b>tegumento</b> (casca), <b>reserva</b> (endosperma ou cotilédones) e <b>embrião</b>.","<b>Endosperma</b> é triploide (3n): 1 núcleo espermático + 2 núcleos polares.","Embrião: <b>radícula</b> (vira raiz, sai primeiro), caulículo (hipocótilo e epicótilo) e cotilédones.","Mono tem 1 cotilédone; eudicotiledônea tem 2."]},
   {h:"Germinação",items:["Precisa de água, temperatura adequada, O₂ e, em algumas espécies, luz.","<b>Epígea</b>: cotilédones sobem (feijão).","<b>Hipógea</b>: cotilédones ficam embaixo (milho, ervilha).","<b>Dormência</b>: bloqueio interno, não germina mesmo com ambiente bom.","<b>Quiescência</b>: falta algo do ambiente; chegou, germina."]},
   {h:"Fruto",items:["Fruto = ovário maduro.","<b>Pericarpo</b> = epicarpo (casca) + mesocarpo (polpa) + endocarpo (junto da semente).","<b>Partenocarpia</b>: fruto sem fecundação, sem semente (banana).","Carnosos: <b>baga</b> (várias sementes: tomate, uva) e <b>drupa</b> (um caroço: pêssego, azeitona).","Secos: <b>deiscentes</b> abrem (vagem, cápsula); <b>indeiscentes</b> não abrem (grão, aquênio).","Origem: <b>simples</b> (1 ovário), <b>agregado</b> (vários ovários de 1 flor), <b>múltiplo</b> (uma inflorescência)."]},
   {h:"Dispersão",items:["<b>Anemocoria</b>: vento (sementes com asas).","<b>Hidrocoria</b>: água (coco).","<b>Zoocoria</b>: animais (carrapicho ou fruto comido)."]}
  ],
  table:{head:["Pseudofruto","A parte carnosa vem de","Onde está o fruto verdadeiro"],rows:[
   ["Caju","pedúnculo","a castanha"],["Maçã","receptáculo","o miolo com as sementes"],["Morango","receptáculo","os pontinhos (aquênios)"],["Abacaxi","inflorescência inteira","cada \"gomo\" da casca"]]},
  trap:"Fruta é termo de cozinha, fruto é termo de Botânica. Tomate é fruto. A parte gostosa do caju não é.",
  check:[{q:"O ovário vira o quê? E o óvulo?",a:"Ovário vira fruto; óvulo vira semente."},{q:"Endosperma é n, 2n ou 3n?",a:"3n (triploide)."},{q:"Banana sem semente: como se chama isso?",a:"Partenocarpia."}]},

 {n:10,title:"Fisiologia da absorção: condução de seiva",station:"Elevador e delivery",flag:true,
  sobre:"Como a planta absorve água e sais e como a seiva circula pelo xilema e pelo floema.",
  ideia:"A planta tem duas tubulações. O xilema sobe água; o floema distribui açúcar.",

   {h:"Coesão-tensão (Dixon)",items:["A folha perde água por transpiração e isso puxa a coluna de água de baixo para cima.","Moléculas de água grudam umas nas outras (<b>coesão</b>) e nas paredes do vaso (<b>adesão</b>).","É como suco de canudinho: quem puxa é a ponta de cima."]},

   {h:"Fluxo em massa (Münch)",items:["O açúcar entra no floema na folha (<b>fonte</b>).","A água vem atrás por osmose, a pressão sobe e empurra a seiva até o <b>dreno</b>."]},
   {h:"Anel de Malpighi",items:["Tira-se um anel de casca do tronco, e o floema vai junto.","O açúcar não chega à raiz, que morre de fome; depois a planta toda morre.","Acima do corte, o tronco incha (açúcar acumulado)."]}

  table:{head:["","Xilema","Floema"],rows:[

 {n:11,title:"Fisiologia da absorção: transpiração vegetal",station:"Motor do elevador",flag:true,

  table:{head:["Fator","Estômato"],rows:[

function meter(){

function trail(){
  const t=$("#trail");t.innerHTML="";
  const add=(id,label,done)=>{const b=el("button","tbtn"+(done?" done":""));b.innerHTML=`<span class="dot"></span><span>${label}</span>`;
    b.setAttribute("aria-current",st.view===id?"true":"false");b.onclick=()=>go(id);t.appendChild(b)};
  t.appendChild(el("div","grp","Comece aqui"));
  add("mapa","Mapa da fábrica");

  CH.forEach(c=>add("c"+c.n,`Capítulo ${c.n} – ${c.title}`,st.done[c.n]));

  add("ex","Exercícios de fixação");
}
