<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resumo de História</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<meta name="color-scheme" content="light">
<style>
:root{--bg:#fff;--ink:#18212b;--muted:#5b6876;--line:#d8dee5;--acc:#7a4b12;--acc-soft:#f6ecdf;--warn:#a34a00;--warn-soft:#fff1e3;--ok:#23784a;--ok-soft:#e3f2e9;
 --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.top a{color:var(--acc);font-weight:700;text-decoration:none}
.bar{height:6px;background:var(--acc-soft);border-radius:4px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(25px,6vw,36px);line-height:1.12;margin:6px 0 16px;text-wrap:balance}
.box{border-radius:12px;padding:12px 14px;margin:14px 0}
.box b.lb{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ideia{background:var(--acc-soft)}.ideia b.lb{color:var(--acc)}
.trap{background:var(--warn-soft)}.trap b.lb{color:var(--warn)}
.mac{background:var(--ok-soft)}.mac b.lb{color:var(--ok)}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f4f6f9;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.ex .q{font-weight:700;margin:0 0 6px}
.ex ol{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.ex .r{background:var(--ok-soft);border-radius:8px;padding:6px 10px;font-weight:700}
ul.l{margin:12px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
button{font:inherit;font-weight:700;white-space:nowrap;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.4;cursor:default}
#cnt{font-size:13px;color:var(--muted);white-space:nowrap}
#idx{display:none}
#idx.on{display:block}
#idx h2{font-family:var(--display);font-size:18px;margin:18px 0 6px}
#idx ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
#idx li button{width:100%;text-align:left;font-weight:400;padding:8px 10px;display:flex;gap:10px}
#idx li button span{color:var(--muted);min-width:2ch;font-weight:700}
#idx li button.cur{border-color:var(--acc);background:var(--acc-soft)}
.fim{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.aviso{font-size:14px;color:var(--muted);background:#f6f7f9;border-radius:10px;padding:10px 12px;margin:14px 0 0}
.fim a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
 <div class="top"><a href="../">← Início</a><span><a href="../quiz/">Quiz</a></span></div>
 <p class="aviso">Conteúdo montado a partir da lista de objetivos da prova (não veio das páginas do livro). Confira datas e termos com o caderno ou com o professor.</p>
 <div class="bar"><i id="pb"></i></div>
 <section id="tela" aria-live="polite"></section>
 <section id="idx"></section>
</main>
<nav class="nav" aria-label="Telas"><div>
 <button id="prev" aria-label="Tela anterior">←</button>
 <button id="menu">Índice</button>
 <span id="cnt"></span>
 <button id="next" class="pri">Próxima →</button>
</div></nav>
<script>
const TELAS=[
{g:"Crise de 1929 e New Deal",k:"EUA e mundo",t:"Crise de 1929",
 ideia:"Os EUA <b>produziam mais do que conseguiam vender</b> e muita gente comprava ações <b>a crédito</b>. Em <b>outubro de 1929</b> a Bolsa de Nova York quebrou e começou a <b>Grande Depressão</b>.",
 tab:{head:["Causas","Consequências"],rows:[
  ["Superprodução e subconsumo (renda concentrada)","Falência de bancos e empresas; desemprego de cerca de 25% nos EUA (1933)"],
  ["Recuperação da Europa, que comprou menos","Bancos dos EUA cobram empréstimos da <b>Alemanha</b> → crise alemã"],
  ["Especulação com dinheiro emprestado","Protecionismo e queda do comércio mundial"],
  ["Liberalismo: Estado sem regular bancos e Bolsa","Café desaba → crise das oligarquias no <b>Brasil</b>"]]},
 trap:"A quebra da Bolsa foi o <b>estopim</b>, não a causa. A causa foi o desequilíbrio entre produção e consumo, somado à especulação.",
 mac:"1929 liga tudo: <b>Depressão → nazismo na Alemanha → Revolução de 1930 no Brasil</b>."},
{g:"Crise de 1929 e New Deal",k:"EUA",t:"New Deal",
 ideia:"<b>Roosevelt</b> (1933) abandona o <i>laissez-faire</i> de Hoover: o <b>Estado intervém</b> para gerar empregos, regular o mercado e proteger os pobres.",
 list:["<b>Obras públicas</b> (estradas, represas do vale do Tennessee) e programas de emprego.",
  "<b>Regulação</b> de bancos e da Bolsa; garantia dos depósitos.",
  "<b>Agricultura:</b> pagamento para reduzir a produção e elevar os preços.",
  "<b>Trabalho:</b> sindicatos reconhecidos, salário mínimo; <b>previdência social</b> (1935).",
  "Associado às ideias de <b>Keynes</b> (gasto público estimula a demanda) e base do <b>Estado de bem-estar social</b>."],
 trap:"New Deal <b>não</b> é socialismo: reforma o capitalismo, sem acabar com a propriedade privada.",
 mac:"New Deal = <b>Estado investe, regula e protege</b>."},
{g:"Nazifascismo",k:"Itália e Alemanha",t:"Ascensão do nazifascismo",
 ideia:"Terreno comum: <b>crise econômica</b> + <b>frustração com a 1ª Guerra</b> + <b>medo do comunismo</b> + <b>democracias fracas</b>. Os dois líderes foram <b>nomeados</b> com apoio das elites e depois destruíram as instituições.",
 tab:{head:["","Itália (fascismo)","Alemanha (nazismo)"],rows:[
  ["Contexto","“Vitória mutilada”; greves de 1919–1920","Tratado de Versalhes; hiperinflação (1923); crise de 1929"],
  ["Líder","Mussolini, o <i>Duce</i>","Hitler, o <i>Führer</i>"],
  ["Chegada","Marcha sobre Roma (1922); ditadura em 1925–1926","Chanceler em jan. 1933; Lei de Plenos Poderes; Führer em 1934"],
  ["Marca","Estado corporativo; camisas negras","Racismo e antissemitismo; SS, Gestapo, Goebbels"]]},
 trap:"Hitler <b>não</b> chegou por golpe armado: o Putsch de 1923 fracassou; em 1933 ele foi <b>nomeado</b> chanceler.",
 mac:"<b>Crise + humilhação + medo do comunismo</b> = nazifascismo."},
{g:"Nazifascismo",k:"Características",t:"Características e caminho da guerra",
 ideia:"Regimes <b>totalitários</b>: partido único, culto ao líder, nacionalismo extremado, militarismo, anticomunismo e antiliberalismo, propaganda e repressão. No nazismo, o <b>racismo biológico</b> está no centro.",
 tab:{head:["Ano","Rumo à 2ª Guerra"],rows:[
  ["1936","Renânia remilitarizada; Eixo Roma-Berlim; Guerra Civil Espanhola"],
  ["1938","Anexação da Áustria; <b>Acordo de Munique</b> (apaziguamento: Sudetos)"],
  ["Ago. 1939","Pacto Germano-Soviético"],
  ["1º set. 1939","Invasão da Polônia: começa a 2ª Guerra"]]},
 trap:"O apaziguamento <b>não evitou</b> a guerra: encorajou Hitler.",
 mac:"<b>Renânia → Áustria → Sudetos → Polônia</b>."},
{g:"Nazifascismo",k:"Memória",t:"O Holocausto",
 ideia:"Genocídio de cerca de <b>6 milhões de judeus</b>, planejado pelo Estado nazista. Também foram mortos ciganos, pessoas com deficiência, homossexuais, opositores e prisioneiros soviéticos. Lembrar é a forma de combatê-lo.",
 list:["<b>Processo gradual:</b> boicote (1933) → Leis de Nuremberg (1935) → Noite dos Cristais (1938) → guetos → “Solução Final” (Wannsee, 1942) → campos de extermínio (Auschwitz-Birkenau).",
  "<b>Depois:</b> Tribunal de Nuremberg; Convenção contra o Genocídio e Declaração Universal dos Direitos Humanos (1948).",
  "<b>Combater:</b> memória (27 de janeiro; Anne Frank, Primo Levi), denúncia do negacionismo e do racismo (crime no Brasil, Lei 7.716/1989)."],
 trap:"Não foi “efeito da guerra”: foi <b>política de Estado</b>, burocrática e industrial.",
 mac:"<b>Exclusão → perseguição → extermínio</b>."},
{g:"Guerra Civil Espanhola",k:"1936–1939",t:"Guerra Civil Espanhola",
 ideia:"A República (1931) fez reformas, e a sociedade se polarizou. Em 1936 a <b>Frente Popular</b> venceu as eleições e <b>Franco</b> deu um golpe militar.",
 tab:{head:["","Republicanos","Nacionalistas (Franco)"],rows:[
  ["Quem","Esquerdas (socialistas, comunistas, anarquistas), bascos e catalães","Militares, Falange, Igreja, monarquistas, latifundiários"],
  ["Apoio","URSS e Brigadas Internacionais","<b>Alemanha</b> (Legião Condor, bombardeio de <b>Guernica</b>) e Itália"]]},
 list:["Reino Unido e França: “não intervenção”, que prejudicou a República.",
  "Vitória de Franco (1939); ditadura até 1975. Foi o <b>ensaio geral da 2ª Guerra</b>."],
 trap:"“Nacionalistas” = <b>franquistas</b>. Bascos e catalães lutaram pela <b>República</b>.",
 mac:"Espanha = <b>fascismo × antifascismo</b>, com Hitler testando armas."},
{g:"Era Vargas",k:"Brasil",t:"1930 e 1932",
 ideia:"<b>1930:</b> movimento armado leva <b>Vargas</b> ao poder e encerra a República Oligárquica. <b>1932:</b> São Paulo se levanta contra o Governo Provisório.",
 tab:{head:["Revolução de 1930","Revolução Constitucionalista de 1932"],rows:[
  ["<b>Externo:</b> crise de 1929 derruba o café","Perda de autonomia de SP; interventores “de fora”"],
  ["<b>Interno:</b> ruptura do café com leite (Júlio Prestes)","Exigência de uma Constituição"],
  ["Aliança Liberal (MG, RS, PB); tenentismo","MG e RS não apoiam; SP se rende em outubro"],
  ["Assassinato de João Pessoa; deposição de Washington Luís","<b>Resultado:</b> Constituinte (1933) → Constituição de 1934"]]},
 trap:"O voto feminino veio no <b>Código Eleitoral de fevereiro de 1932</b>, antes do levante, e não foi pauta dele.",
 mac:"1932: <b>SP perde na guerra, ganha a Constituinte</b>."},
{g:"Era Vargas",k:"Brasil",t:"Constituição de 1934, trabalhadores e mulheres",
 ideia:"A <b>Constituição de 1934</b> (inspirada na de Weimar) somou direitos sociais à estrutura liberal.",
 list:["<b>Voto secreto e feminino</b>; Justiça Eleitoral.",
  "<b>Direitos trabalhistas:</b> salário mínimo, jornada de 8 h, férias, proteção à gestante; previsão da Justiça do Trabalho.",
  "<b>Deputados classistas</b> (eleitos por sindicatos); <b>nacionalismo</b> sobre o subsolo e as quedas-d’água; ensino primário obrigatório.",
  "<b>Trabalhadores:</b> carteira de trabalho (1932), CLT (1943), mas com <b>sindicato único atrelado ao Estado</b>: conquista e controle; a propaganda do “pai dos pobres”.",
  "<b>Mulheres:</b> luta de <b>Bertha Lutz</b>; voto feminino (1932); <b>Carlota Pereira de Queirós</b>, primeira deputada federal (1933); proibição de salário diferente por sexo (1934)."],
 trap:"Durou pouco: em <b>1937</b> veio o <b>Estado Novo</b>.",
 mac:"Trabalhadores: <b>direitos + controle</b>."},
{g:"Era Vargas",k:"Brasil",t:"AIB × ANL e linha do tempo",
 ideia:"Nos anos 1930 o Brasil reproduziu a disputa mundial <b>fascismo × antifascismo</b>.",
 tab:{head:["AIB (1932)","ANL (1935)"],rows:[
  ["Plínio Salgado; inspiração fascista","Luís Carlos Prestes; frente antifascista"],
  ["“Deus, Pátria e Família”; camisas verdes; Σ","“Pão, Terra e Liberdade”"],
  ["Anticomunista, antiliberal, corporativista","Reforma agrária, anti-imperialismo, suspensão da dívida"]]},
 list:["<b>1935:</b> Lei de Segurança Nacional → ANL fechada → Intentona Comunista (derrotada).",
  "<b>1937:</b> <b>Plano Cohen</b> (falso) → golpe do <b>Estado Novo</b>. <b>1938:</b> Levante Integralista reprimido.",
  "<b>Linha do tempo:</b> 1929 crise → 1930 Vargas → 1932 SP → 1933 Hitler e New Deal → 1934 Constituição → 1935 ANL → 1936 Espanha → 1937 Estado Novo → 1939 2ª Guerra.",
  "<b>Na resposta:</b> contexto + causa e consequência + exemplo (nome, data) + ligação Brasil–mundo."],
 trap:"Nenhum dos extremos chegou ao poder: Vargas usou o medo do comunismo e depois descartou os integralistas.",
 mac:"<b>Verde = integralista (direita). ANL = Prestes (esquerda).</b>"}
];
const N=TELAS.length,$=id=>document.getElementById(id);
let i=0;try{i=Math.min(N-1,Math.max(0,+localStorage.getItem("his2")||0))}catch(e){}
function show(n){i=n;try{localStorage.setItem("his2",i)}catch(e){}
 const t=TELAS[i];let h=`<div class="eyebrow">${t.g} · ${t.k}</div><h1>${t.t}</h1><div class="box ideia"><b class="lb">Ideia central</b>${t.ideia}</div>`;
 if(t.tab)h+=`<div class="tw"><table><thead><tr>${t.tab.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.tab.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 if(t.ex)h+=t.ex.map(e=>`<div class="ex"><p class="q">${e.q}</p><ol>${e.p.map(s=>`<li>${s}</li>`).join("")}</ol><div class="r">Resposta: ${e.r}</div></div>`).join("");
 if(t.list)h+=`<ul class="l">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(t.trap)h+=`<div class="box trap"><b class="lb">Pegadinha</b>${t.trap}</div>`;
 if(t.mac)h+=`<div class="box mac"><b class="lb">Macete</b>${t.mac}</div>`;
 if(i==N-1)h+=`<p class="fim">Fim do resumo. Agora faça o <a href="../quiz/">quiz de História</a>.</p>`;
 $("tela").innerHTML=h;$("idx").classList.remove("on");$("tela").style.display="";
 $("cnt").textContent=`Tela ${i+1} de ${N}`;$("pb").style.width=((i+1)/N*100)+"%";
 $("prev").disabled=i==0;$("next").disabled=i==N-1;$("menu").textContent="Índice";scrollTo(0,0)}
function index(){if($("idx").classList.contains("on"))return show(i);
 let h="",g="";TELAS.forEach((t,n)=>{if(t.g!=g){h+=(g?"</ol>":"")+`<h2>${t.g}</h2><ol>`;g=t.g}
  h+=`<li><button data-n="${n}" class="${n==i?"cur":""}"><span>${n+1}</span>${t.t}</button></li>`});
 $("idx").innerHTML=h+"</ol>";$("idx").classList.add("on");$("tela").style.display="none";$("menu").textContent="Fechar";scrollTo(0,0)}
$("idx").onclick=e=>{const b=e.target.closest("button[data-n]");if(b)show(+b.dataset.n)};
$("prev").onclick=()=>i>0&&show(i-1);$("next").onclick=()=>i<N-1&&show(i+1);$("menu").onclick=index;
document.addEventListener("keydown",e=>{if(e.key=="ArrowRight")$("next").click();if(e.key=="ArrowLeft")$("prev").click()});
show(i);
</script>
</body>
</html>
