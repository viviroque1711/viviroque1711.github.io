{g:"Crise de 1929 e New Deal",k:"EUA e mundo",t:"A quebra e as consequências",
 ideia:"Em <b>outubro de 1929</b> a Bolsa de Nova York despencou (a “quinta-feira negra”, dia 24, e a “terça-feira negra”, dia 29). Começou a <b>Grande Depressão</b>, que atravessou os anos 1930.",

  "<b>No Brasil:</b> o preço do <b>café</b>, principal exportação, desabou, o que abalou as oligarquias e ajudou a derrubar a República Oligárquica (Revolução de 1930).",

{g:"Crise de 1929 e New Deal",k:"EUA",t:"O New Deal de Roosevelt",
 ideia:"<b>Franklin D. Roosevelt</b> (democrata) tomou posse em <b>1933</b> e lançou o <b>New Deal</b> (“novo acordo”): o Estado passa a <b>intervir na economia</b> para gerar empregos, regular o mercado e proteger os mais pobres.",
 tab:{head:["Área","Medidas"],rows:[
  ["Bancos e finanças","Fechamento e saneamento de bancos; garantia de depósitos; criação de um órgão para fiscalizar a Bolsa (SEC)."],
  ["Emprego","Grandes <b>obras públicas</b> (estradas, pontes, represas como as do vale do Tennessee, a TVA) e programas de trabalho para jovens."],
  ["Agricultura","Pagamento para os agricultores <b>reduzirem a produção</b> e os preços subirem (AAA)."],
  ["Trabalho","Reconhecimento dos <b>sindicatos</b> e da negociação coletiva; salário mínimo e limite de jornada."],
  ["Proteção social","<b>Previdência social</b> (1935): aposentadoria e seguro-desemprego."]]},
 list:["A ideia de que o <b>gasto do Estado</b> estimula a demanda e tira a economia da crise foi sistematizada por <b>John Maynard Keynes</b> (<i>Teoria geral</i>, 1936). Por isso o New Deal é associado ao <b>keynesianismo</b>.",
  "Base do <b>Estado de bem-estar social</b> (<i>Welfare State</i>) do pós-guerra.",

 trap:"O New Deal <b>não</b> foi socialismo: manteve a propriedade privada e o capitalismo. Ele <b>reformou</b> o capitalismo com intervenção estatal.",
 mac:"New Deal = <b>Estado investe, regula e protege</b>. Liberalismo = Estado não interfere."},

{g:"Nazifascismo",k:"Itália",t:"O fascismo italiano",

  ["1936","Alemanha remilitariza a Renânia; <b>Eixo Roma-Berlim</b>; pacto anticomunista com o Japão; Guerra Civil Espanhola."],

{g:"Nazifascismo",k:"Memória",t:"O Holocausto",

const N=TELAS.length,$=id=>document.getElementById(id);

 const t=TELAS[i];let h=`<div class="eyebrow">${t.g} · ${t.k}</div><h1>${t.t}</h1><div class="box ideia"><b class="lb">Ideia central</b>${t.ideia}</div>`;
 if(t.tab)h+=`<div class="tw"><table><thead><tr>${t.tab.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.tab.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 if(t.ex)h+=t.ex.map(e=>`<div class="ex"><p class="q">${e.q}</p><ol>${e.p.map(s=>`<li>${s}</li>`).join("")}</ol><div class="r">Resposta: ${e.r}</div></div>`).join("");
 if(t.list)h+=`<ul class="l">${t.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
 if(t.trap)h+=`<div class="box trap"><b class="lb">Pegadinha</b>${t.trap}</div>`;
 if(t.mac)h+=`<div class="box mac"><b class="lb">Macete</b>${t.mac}</div>`;
 if(i==N-1)h+=`<p class="fim">Fim do resumo. Agora faça o <a href="../quiz/">quiz de História</a>.</p>`;

 $("cnt").textContent=`Tela ${i+1} de ${N}`;$("pb").style.width=((i+1)/N*100)+"%";

function index(){if($("idx").classList.contains("on"))return show(i);
 let h="",g="";TELAS.forEach((t,n)=>{if(t.g!=g){h+=(g?"</ol>":"")+`<h2>${t.g}</h2><ol>`;g=t.g}
  h+=`<li><button data-n="${n}" class="${n==i?"cur":""}"><span>${n+1}</span>${t.t}</button></li>`});

show(i);
